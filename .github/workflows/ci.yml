# Compile gate for the example corpus (CLAUDE.md sec. 1 guardrail + sec. 5).
#
# Runs on GitHub's cloud runners (not your machine) after you PUSH to GitHub.
# This repo is public, so Actions minutes are free and unlimited. The job just
# checks out this repo and runs driver/build.py against its own content/.
#
# ubuntu-latest ships g++, clang++ and python3 preinstalled, so there is nothing
# to install -- both compilers here are "normal" (no MSYS/cygwin path quirks).

name: build-examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # adds a manual "Run workflow" button in the Actions tab

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the corpus
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          python3 --version
          g++ --version | head -1
          clang++ --version | head -1

      # ubuntu-latest ships clang 18, which pairs with the newest installed
      # libstdc++ (v14) and there fails to enable C++23 std::expected -- the
      # <expected> declaration is guarded out (clang <=18 + libstdc++14 gap),
      # breaking the whole `expected` chapter while g++ (on libstdc++13) is fine.
      # Install a newer clang (matches local dev, keeps libstdc++ so cross-compiler
      # output stays identical) and make it the default clang++.
      - name: Install clang 20 (Ubuntu's clang 18 lacks C++23 std::expected on libstdc++14)
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 100
          clang++ --version | head -1

      - name: Compile every example with g++ AND clang++
        # --strict: a missing requested compiler is an error (both are required
        # on CI, unlike local dev where one may be skipped).
        run: python3 driver/build.py --strict
