# Compile gate for the example corpus (CLAUDE.md sec. 1 guardrail + sec. 5).
#
# Runs on GitHub's cloud runners (not your machine) after you PUSH to GitHub.
# This repo is public, so Actions minutes are free and unlimited. The job just
# checks out this repo and runs driver/build.py against its own content/.
#
# ubuntu-latest ships g++, clang++ and python3 preinstalled (both compilers here
# are "normal" -- no MSYS/cygwin path quirks). The one addition is a newer clang
# (20) because the preinstalled clang 18 cannot compile C++23 std::expected on
# ubuntu's libstdc++14; see the install step below.

name: build-examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # adds a manual "Run workflow" button in the Actions tab

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the corpus
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          python3 --version
          g++ --version | head -1
          clang++ --version | head -1

      # ubuntu-latest ships clang 18, and clang <=18 paired with libstdc++14
      # guards out C++23 std::expected (the <expected> declaration disappears),
      # which breaks the whole `expected` chapter; g++ compiles it fine. Install
      # clang 20 from apt.llvm.org. IMPORTANT: it is invoked DIRECTLY as
      # clang++-20 in the compile step below -- the previous update-alternatives
      # approach silently did nothing, because /usr/bin/clang++ is a plain symlink
      # (clang 18), not an alternatives-managed link, so `clang++` stayed on 18
      # and the fix never took effect.
      - name: Install clang 20 (Ubuntu's clang 18 lacks C++23 std::expected on libstdc++14)
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          clang++-20 --version | head -1

      - name: Compile every example with g++ AND clang++-20
        # --strict: a missing requested compiler is an error (both are required
        # on CI, unlike local dev where one may be skipped). clang++-20 is named
        # explicitly so the newer clang is definitely the one used, with no
        # dependence on update-alternatives having taken over `clang++`.
        run: python3 driver/build.py --strict --compilers g++,clang++-20
