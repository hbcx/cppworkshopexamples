# Compile gate for the example corpus (CLAUDE.md sec. 1 guardrail + sec. 5).
#
# Runs on GitHub's cloud runners (not your machine) after you PUSH to GitHub.
# This repo is public, so Actions minutes are free and unlimited. The job just
# checks out this repo and runs driver/build.py against its own content/.
#
# ubuntu-latest ships g++, clang++ and python3 preinstalled (both compilers here
# are "normal" -- no MSYS/cygwin path quirks). Two versions are pinned newer than
# the defaults, because the corpus teaches C++23 features the stock compilers lack:
#   * g++-16 -- the default g++ (13) has no std::ranges::to, no views::join_with,
#     and no deducing-this in lambdas (this auto self); all three arrived in
#     GCC 14 / libstdc++14. libstdc++14's std::ranges::to PIPE adaptor
#     (r | std::ranges::to<C>()) then has a defect that clang cannot compile -- an
#     internal forward_like<> with a deduced return type "used before it is
#     defined" -- fixed in libstdc++15. And libstdc++15 still has no <mdspan>
#     (std::mdspan lands in libstdc++16), so the mdspan chapter needs g++-16.
#     clang++-20 picks up the newest installed libstdc++ automatically, so it
#     gets mdspan too. g++-16 is not in ubuntu's default repos, so it comes from
#     the ubuntu-toolchain-r PPA.
#   * clang++-20 -- the preinstalled clang 18 cannot compile C++23 std::expected
#     on ubuntu's libstdc++14 (the <expected> declaration guards out).
# Both are installed below and named explicitly in the compile step.

name: build-examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # adds a manual "Run workflow" button in the Actions tab

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the corpus
        uses: actions/checkout@v4

      - name: Show default toolchain versions
        run: |
          python3 --version
          g++ --version | head -1
          clang++ --version | head -1

      # Two newer compilers, both named DIRECTLY in the compile step (no reliance
      # on update-alternatives -- /usr/bin/{g++,clang++} are plain symlinks to the
      # stock versions, so alternatives never took over and the old versions stuck).
      #
      # g++-16: the default g++ (13) lacks std::ranges::to, views::join_with, and
      #   deducing-this in lambdas. GCC 14 covers those, but libstdc++14's
      #   std::ranges::to pipe adaptor breaks clang (see the header note above),
      #   fixed in libstdc++15; and libstdc++15 still lacks <mdspan>, which arrives
      #   in libstdc++16 -- so we take g++-16. g++-16 is NOT in ubuntu's default
      #   repos, hence the ubuntu-toolchain-r/test PPA. clang++-20 then uses
      #   libstdc++16 automatically (it selects the newest installed GCC).
      # clang++-20: clang <=18 paired with libstdc++14 guards out C++23 std::expected
      #   (the <expected> declaration disappears), breaking the `expected` chapter.
      - name: Install g++-16 and clang 20 (stock compilers lack some C++23 features)
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-16
          g++-16 --version | head -1
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          clang++-20 --version | head -1

      - name: Compile every example with g++-16 AND clang++-20
        # --strict: a missing requested compiler is an error (both are required
        # on CI, unlike local dev where one may be skipped). Both are named with an
        # explicit version so the newer toolchains are definitely the ones used.
        run: python3 driver/build.py --strict --compilers g++-16,clang++-20
