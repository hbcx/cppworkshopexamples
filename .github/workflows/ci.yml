# Compile gate for the example corpus (CLAUDE.md sec. 1 guardrail + sec. 5).
#
# Runs on GitHub's cloud runners (not your machine) after you PUSH to GitHub.
# This repo is public, so Actions minutes are free and unlimited. The job just
# checks out this repo and runs driver/build.py against its own content/.
#
# ubuntu-latest ships g++, clang++ and python3 preinstalled (both compilers here
# are "normal" -- no MSYS/cygwin path quirks). The one addition is libc++: clang
# on ubuntu's libstdc++ cannot see C++23 std::expected, so the driver builds
# clang's C++23/26 examples against libc++ instead (see the install step below).

name: build-examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # adds a manual "Run workflow" button in the Actions tab

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the corpus
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          python3 --version
          g++ --version | head -1
          clang++ --version | head -1

      # Ubuntu's clang paired with the preinstalled libstdc++ (v14) guards out
      # C++23 std::expected -- the <expected> declaration disappears for clang,
      # breaking the `expected` chapter, while g++ compiles it fine. Upgrading
      # clang does NOT help (clang 18 and 20 both fail on libstdc++14); the fix is
      # to give clang libc++, which has std::expected, and let the driver use
      # -stdlib=libc++ for clang on C++23/26 examples only (--clang-cxx23-libcxx).
      # Every other example, and both compilers elsewhere, keep the default libstdc++.
      - name: Install libc++ (for clang's C++23 std::expected examples)
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev

      - name: Compile every example with g++ AND clang++
        # --strict: a missing requested compiler is an error (both required on CI).
        # --clang-cxx23-libcxx: clang builds C++23/26 against libc++ (see above).
        run: python3 driver/build.py --strict --clang-cxx23-libcxx
