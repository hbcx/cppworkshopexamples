title: "Anti-pattern: mutable data in a shared state object"
standard: "C++11"
difficulty: 3
summary: "Sharing one state instance across contexts is the whole point of stateless states -- but give that shared state a mutable per-context field and the contexts entangle: they hold the same object, so one context's calls change what the others see, a bug that only appears when the instance happens to be shared."
notes: "The previous example shared states as singletons precisely because a state with no data of its own is the same object for everyone. This anti-pattern breaks that invariant by hiding per-context data inside the shared state. CountingStateBad keeps a running hits_ counter and mutates it in a non-const handle(); two machines are constructed over the same instance, so a.run() twice leaves the count at 2, and b.run() -- meant to be a fresh, independent machine -- reports 3, because it is reading and bumping the same counter a just used. Nothing crashes and no compiler complains; the numbers are simply entangled, which is the hard kind of bug to trace because it manifests only when two contexts share the same state object, and vanishes the moment they do not. This is the State-pattern instance of the same rule the Strategy and Flyweight chapters state: an object that is shared must be immutable, and any data that legitimately changes per user belongs to the user, not the shared thing. The fix is to keep states stateless -- CountingStateGood computes from its argument and never writes a member, so it is const and safe to share -- and move the count that must persist into the context that owns the sequence of calls, MachineGood::hits_. Now any number of machines share one state object and each keeps its own correct count. Two design points fall out of this. First, marking the state's methods const is not cosmetic: it is the compiler-checked promise that the shared object is never mutated, and it is why the shared pointer here is a const State*. Second, if a state genuinely needs its own mutable per-context data -- which is rare, because that data almost always belongs to the context -- then it is not shareable and each context must own its own instance, a deliberate choice with an allocation cost, not something to back into by adding a field to a singleton. The sign: a state class with a non-const method that writes a data member, held by more than one context at the same time."
