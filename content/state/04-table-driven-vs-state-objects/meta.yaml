title: "Table-driven state machine vs state objects"
standard: "C++11"
difficulty: 3
summary: "When a machine is mostly about which state comes next and the states do little else, a transition table -- a map from (state, event) to next state -- can beat a class per state: every edge is one row and the whole machine reads at a glance; state objects earn their keep once each state carries real behaviour."
notes: "State objects are not the only way to build a state machine, and reaching for them reflexively can be heavier than the problem needs. This example models the same turnstile as a transition table: a map from (state, event) to the next state, with a missing entry meaning stay put. The advantages are real and worth naming. The entire machine is data in one place, so you can read every transition without hunting through classes, and adding or changing an edge is editing one row rather than a method in one class and possibly its neighbours; the table can even be loaded from a config file or generated, which a class hierarchy cannot; and there are no state objects to allocate or share. For pure routing logic -- protocol framers, lexers, simple lifecycles where the interesting part is the graph of transitions -- the table is often the clearer design. The limits are equally real and decide when to switch back to objects. A plain table maps to the NEXT STATE and nothing more; the moment states need behaviour -- an entry or exit action, a per-state response to the event beyond moving, data to touch on the context -- you end up bolting on parallel maps of function pointers keyed the same way, and that scattering of a state's logic across several tables is exactly the cohesion that state objects give you for free by keeping a state's behaviour and transitions together in one class. Tables also push errors to runtime (a typo'd or missing edge is a lookup miss, not a compile error) where a set of state classes with pure-virtual handlers forces you to implement every event. The honest rule: use a table when the machine is transition-heavy and behaviour-light, and state objects when each state does substantial work; a large machine sometimes wants both -- a table for the shape, objects or handlers for the actions. Implementation notes for the table form: std::map needs its key ordered, and std::pair of two scoped enums already is (it compares lexicographically and enums compare by value), so no custom comparator is required; std::unordered_map would be faster but needs a hash for the pair, which is more code in C++11."
