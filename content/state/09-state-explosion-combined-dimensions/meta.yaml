title: "Anti-pattern: a state explosion from combined dimensions"
standard: "C++11"
difficulty: 3
summary: "Encoding two independent concerns -- a link status and an auth status -- as one enum produces their cross product, and every action must be written once per value of the other axis; a third value on one axis multiplies the other. Keep the dimensions as separate state variables and the count is 2 + 2, not 2 * 2."
notes: "State machines explode when independent concerns are fused into one state variable. A session here has two genuinely orthogonal dimensions: the link is Down or Up, and the user is Anonymous or Authenticated, and the two do not constrain each other -- you can log in before or after the link comes up. Encode them as one Combined enum and you are forced to enumerate the cross product, DownAnon/DownAuth/UpAnon/UpAuth, and worse, every transition has to be spelled out once per value of the dimension it does not touch: connect() must handle DownAnon->UpAnon and DownAuth->UpAuth (two rows for one idea, bring the link up), and login() must handle DownAnon->DownAuth and UpAnon->UpAuth (two rows for one idea, authenticate). The multiplication is the real cost: add a third link state such as Connecting and you do not add one state, you add ConnectingAnon and ConnectingAuth and re-touch every action, because each new value on one axis multiplies the whole other axis. This is combinatorial, and it is why a single flat state model that keeps growing is a design smell rather than just a long enum. The fix is to stop fusing: represent each independent concern as its own state variable, so Session holds a Link and an Auth separately, connect() writes only the link, login() writes only the auth, and each transition is defined exactly once. The two axes are now additive -- 2 + 2 states, and a third link value adds one state and its edges without touching auth at all -- which is the orthogonal-regions idea from statecharts: concurrent, independent sub-states instead of their product. The judgment call is whether the dimensions are truly independent. If a combination is genuinely illegal (say authentication is impossible while the link is down), that is a real constraint the split must still enforce -- with a guard on login() or a small invariant check -- not a reason to collapse back to the product; you keep the axes separate and forbid the one illegal pairing explicitly, rather than encoding all legal pairings by hand. The tell: a single state enum whose names are compounds of two adjectives, and transition code that repeats the same action across several of those compound values."
run: true
