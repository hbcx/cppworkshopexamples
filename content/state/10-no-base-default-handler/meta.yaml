title: "Anti-pattern: no base default, so every state repeats the rejection"
standard: "C++11"
difficulty: 3
summary: "Most states act on a few events and reject the rest, so a pure-virtual base -- which forces every state to implement every event -- makes each one copy the same not-allowed-here handler, and adding an event edits every state. A base that supplies the default lets each state override only what it actually does."
notes: "In a realistic machine most states respond to a handful of events and refuse the others, and how you model the refusal decides how the code scales. With a pure-virtual base, every event is a contract every state must fulfil, so ClosedBad and OpenBad each spell out all three handlers even though each genuinely acts on only one or two -- the rest are copies of the same reject message. That duplication is not just ugly; it is a maintenance multiplier. Adding an event (a flush()) means adding a pure virtual, which breaks compilation until every existing state implements it, and almost all of them will implement it identically as another rejection. The states that should not care about the new event are exactly the ones forced to change. The fix is to give the base a sensible default as a NON-pure virtual -- here open/close/send default to reject -- and let each concrete state override only the events it actually handles. ClosedGood overrides open and inherits the rest; OpenGood overrides close and send. Now the common behaviour lives in one place, a state reads as just its differences from the default, and adding flush() is one default in the base plus an override in only the states that flush; the indifferent states are untouched and keep compiling. This is the ordinary object-oriented move of pushing shared behaviour up to a base and overriding the exceptions, applied to a State hierarchy, and it composes with everything else in the chapter -- the default can be reject (as here), a no-op, or a base transition, whichever is the right common case. Two caveats keep it honest. A default of silently doing nothing can hide bugs (an event that should have been handled somewhere is swallowed everywhere), so a default that logs or rejects is usually safer than a default that is an empty body -- make the common case explicit, not invisible. And if there is genuinely no sensible default because every state must make a deliberate choice, then a pure virtual is correct precisely because it forces that choice; the anti-pattern is the pure virtual whose implementations are overwhelmingly the same copied line. The sign: a state interface where most overrides across most states are identical boilerplate, and adding a method means touching every state to paste that boilerplate again."
