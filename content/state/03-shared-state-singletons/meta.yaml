title: "Sharing stateless states as singletons (a Flyweight)"
standard: "C++11"
difficulty: 2
summary: "A state that holds no per-context data is identical for every context, so allocating a fresh one on each transition is pure waste: keep one shared instance of each state and a transition is just a pointer reassignment -- the Flyweight optimisation applied to the State pattern, with zero allocation and zero per-object state."
notes: "The basics example allocates a new state object on every transition, which is correct but wasteful once you notice that a state carrying no per-context data is the same object no matter who points at it. This example shares them: each state is a single instance returned from a function-local static, the transition handlers return a pointer to the shared next state, and the context holds a non-owning const State* it simply reassigns. Two turnstiles run through many transitions between them, yet the construction counter shows only two state objects were ever built -- one Locked, one Unlocked -- because every context and every transition reuses the same two. This is the Flyweight pattern meeting State: the states are intrinsic, immutable, shareable objects, so interning them and handing out pointers is safe. Three things make the sharing correct, and each is a rule worth keeping. The states must be genuinely stateless -- any mutable per-context data (a position, a retry count) must live in the context, not the state, or two contexts sharing one instance would corrupt each other, which is this chapter's mutable-shared-state anti-pattern. The handlers are const, advertising that a state never mutates itself. And the context's pointer is non-owning: it must never delete the shared state, because the singletons outlive every context and are cleaned up at program exit, so ownership stays out of the transition path entirely. That last point also disarms the self-deletion trap -- with shared states there is nothing to delete on a transition, so reassigning the pointer from anywhere is safe. The trade-off against the owning form is negligible here and usually worth it: you give up per-state instance data (which stateless states do not have) in exchange for no allocation and a transition that is a single pointer write. Reach for owned states only when a state genuinely needs its own data, which is rare precisely because that data usually belongs to the context."
