title: "Anti-pattern: an enum and a switch instead of state"
standard: "C++11"
difficulty: 3
summary: "Tracking a lifecycle with a status enum and switching on it in every method is the exact design State replaces: the state-dependent behaviour is spread across the methods instead of gathered per state, so adding a status edits every switch together and a forgotten case falls silently through a default."
notes: "This is State seen from the wrong side, and the most common shape it exists to fix. DocumentBad keeps a Status enum and switches on it in submit(), approve() and label() -- the same enum decoded three times. For three states it reads fine, which is why the design spreads before its costs show. Those costs arrive with growth. The behaviour for a single state is not in one place; it is one arm scattered across every method, so understanding what a Moderation document does means reading all three switches, and changing it means editing all three consistently. Adding a status is worse: every switch must gain a case, and the one you forget does not fail loudly -- it falls through to a default or an unhandled arm and returns a wrong answer quietly (here label() needs a trailing return just to satisfy the compiler, which is the smell of a switch that does not truly cover its cases). That is the open/closed principle violated: the class most likely to carry a bug is the one everyone must reopen for every new state. The fix is the pattern: make each state a class implementing the same interface, so a state's behaviour and its transitions live together in one place, adding a state is a new class the context never sees, and the switches vanish. DocumentGood does exactly this and produces the same output, which is the point -- the pattern changes the structure, not the result. The honest caveat matches Strategy's: for a tiny, genuinely fixed set of states that will never grow, an enum and a switch are simpler and fine; State earns its indirection when the set of states is open or the per-state behaviour is substantial. The sign: a status or mode enum with two or more switches on it across different methods that must all be edited together whenever a state is added."
run: true
sanitizers: []
