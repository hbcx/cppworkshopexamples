title: "Anti-pattern: leaking the state to the client"
standard: "C++11"
difficulty: 3
summary: "State depends on the object owning its transitions -- the client asks for something meaningful and the object decides if it is legal. Expose the raw state as a public field or a setState the client calls directly, and that guarantee is gone: callers force illegal states and branch on the concrete state, dragging the state logic back into every caller."
notes: "The value of State is an invariant: the object is always in a legal state because it owns every transition and refuses the illegal ones. That holds only if the client cannot reach in and set the state itself. PlayerBad breaks it two ways at once. Its state is a public field with a setState, so a caller writes Playing directly while the power is still Off -- a combination the object would never reach through its own operations -- and now the object is in a state its own logic considers impossible, with no method having authorised it. And because the state is visible, callers start reading it and branching on it (if state == Playing ...), which scatters the state-dependent logic back out into every caller: the exact spread the pattern was adopted to remove, now on the outside instead of the inside. Both are the same root problem -- the state is not encapsulated -- and both defeat the point of modelling state at all. The fix is to make the transitions the only way the state changes: PlayerGood keeps its state private and exposes intent-level operations (powerOn, play) that guard themselves, so play() while off is refused by the object rather than reachable by the client, and callers ask about behaviour (isPlaying()) instead of reading raw state. The client expresses what it wants; the object decides what that means and whether it is allowed. This is ordinary encapsulation applied to state, and the same discipline the leaking-internals anti-patterns in other chapters describe, sharpened by the fact that an illegal state is not just exposed data but a broken invariant. A legitimate nuance: exposing a read-only query of the current state (a label, an isPlaying) is fine and useful -- what must not leak is the ABILITY TO SET it, and clients should not branch on the concrete state to make decisions the object should make. The sign: a public setState or a writable state field, or client code that switches on the object's current state instead of calling a method and letting the object route on its own state."
