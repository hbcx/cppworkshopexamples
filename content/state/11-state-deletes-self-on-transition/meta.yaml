title: "Anti-pattern: a state that deletes itself on transition"
standard: "C++11"
difficulty: 3
summary: "The textbook transition -- the current state calls context.setState(next) from inside its own handler -- is a use-after-free if setState destroys the old state right away: the destroyed object is the one whose method is still running, so every line after the call, including the implicit this, touches freed memory."
notes: "This is the C++ lifetime trap the return-the-next-state shape in the mechanics examples was quietly avoiding, shown head-on. The common textbook State has a state reassign the context from inside its handler: state->handle(ctx) calls ctx.setState(new Next()). The danger is what setState does with the old state. If it deletes it immediately -- delete s_; s_ = n; -- then the object being destroyed is the very one whose handle() is still on the call stack, and control is about to return into it. Any access after the setState call is a use-after-free: reading a member (the label_ in the commented bad version), calling another method, or merely the implicit this the compiler may use. It is undefined behaviour, which is why the bad version here is described in a comment and NOT executed -- run under the two-compiler gate it could crash on one and appear fine on the other, and appearing fine is exactly the failure mode that lets this ship. It frequently seems to work, because the freed memory is often not yet reused, and then corrupts under load or after an unrelated change. The fix used by every mechanics example in this chapter is to not transition from inside the state at all: the handler does all its work and RETURNS the next state, and the context swaps after the handler has fully returned, so the old state is destroyed only once its method is off the stack. Context::step() here shows it -- auto next = s_->handle(); then s_ = std::move(next); -- the destruction happens in the context, after the call, never inside the running state. There is a second fix worth knowing, and the shared-singleton example already uses it: if states are shared and never owned by the context, a transition deletes nothing (it just reassigns a non-owning pointer), so triggering it from inside a state is harmless because there is no object to free. Both fixes share one rule: never destroy the current state while its method is executing. If you must keep the state-calls-setState style -- some codebases prefer it -- then setState must defer the delete (stash the old state and free it after the handler unwinds, or hand ownership to the caller) rather than delete in place. The tell: a setState (or equivalent) that deletes or resets the owning pointer to the current state, called from within that state's own method."
run: true
