title: "Anti-pattern: transitions decided by the context, not the states"
standard: "C++11"
difficulty: 3
summary: "Having proper state objects for behaviour but leaving the transition graph in the context -- a chain of type checks that decides what comes next -- keeps the very coupling State removes: the states cannot say where they go, so every transitioning method repeats the chain and adding a state edits the context."
notes: "This is the halfway mistake that feels like State and is not. There are real state objects (Stage), each with its own run() behaviour, so it looks like the pattern is in place -- but the context still owns the transition logic: PipelineBad::step() runs the current state and then decides the successor by inspecting the state's dynamic type and hardcoding the next one. Two things are wrong with that. The obvious one is the dynamic_cast ladder, an if-else chain testing concrete types, which is the object-oriented smell the pattern is supposed to delete; it re-derives at runtime what the type system already knows. The deeper one is where the transition knowledge lives: in the context, not the states. A state cannot tell you what follows it, so any second method that also transitions must repeat the same chain, and adding a stage means editing the context rather than adding a class -- which is precisely the open/closed cost State is meant to remove, still present because only half the pattern was applied. The point of putting a state in its own class is that a state's behaviour AND its transitions belong together there; splitting them, behaviour in the state and transitions in the context, gets the boilerplate of the pattern without its benefit. The fix is to let each state own its successor: Step::next() returns the next state, so the context only asks and swaps, the dynamic_cast ladder disappears, and adding a stage is a new class that names what follows it. There is a legitimate cousin to distinguish: a table-driven machine deliberately centralises transitions as data in one table, which is a coherent design (see the table-driven example). That is different from this -- there the transitions are data in one declared place by intent; here they are imperative type-testing code spread into a method that also does other work. The sign: a context method that runs a polymorphic state and then decides the next state with dynamic_cast, typeid, or a downcast switch, so the states themselves never express their transitions."
run: true
