# Related chapters -- cross-links shown at the bottom of the section page.
- slug: "transform"
  note: "The map that reads an input where generate does not: transform produces one output per input element, while generate calls a nullary function that sees nothing -- go there for mapping existing values, in place or to a new container."
- slug: "copy-copy-if"
  note: "The same output-iterator rules and the back_inserter idiom: copy writes existing elements where fill and generate write new values, and both need a sized destination or an inserter -- go there for copying ranges out and the empty-output trap."
- slug: "vectors"
  note: "Where the fill constructor and resize live: std::vector(n, value) and resize(n, value) set elements as the container is built or grown, the one-pass alternative to construct-then-fill -- go there for size, capacity, and growth."
- slug: "ranges"
  note: "The lazy sequence counterpart: std::views::iota generates an increasing range on demand inside a pipeline, where iota writes numbers into a container eagerly -- go there for views, the pipe operator, and lazy generators."
- slug: "next-permutation"
  note: "A common consumer of iota: fill 0..n-1 with iota, then permute it to enumerate index arrangements -- go there for stepping through and enumerating all orderings of a range."
- slug: "partial-sum"
  note: "The cumulative counterpart to iota's straight count: partial_sum builds a running sum and adjacent_difference recovers the steps, the inverse pair behind delta encoding -- go there for prefix sums and difference encoding."
- slug: "sample-shuffle"
  note: "Filling a range with random values pairs with reordering and selecting them: generate with a captured mt19937 writes random numbers, then shuffle randomizes an order and sample picks a random subset -- go there for the random engine, seeding, and unbiased selection."
- slug: "replace"
  note: "The conditional counterpart to writing a whole range: fill and generate overwrite every element, where replace and replace_if overwrite only the ones matching a value or predicate -- go there for substituting sentinels and cleaning selected values."
- slug: "random"
  note: "The generator to capture when filling with random values: the <random> library builds a seeded engine and a distribution, the callable you hand to generate -- go there for seeding, distributions, and why rand() is the wrong source."
