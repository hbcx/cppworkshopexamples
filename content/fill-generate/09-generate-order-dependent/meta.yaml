title: "Anti-pattern: an order-dependent generator"
standard: "C++11"
difficulty: 3
summary: "A generator that builds each value from the previous ones in captured state works with the plain sequential generate, but it hides an assumption -- that calls happen once, in order. That assumption breaks under the parallel std::generate overload, where calls may run concurrently and in any order, racing the shared state. Keep generators independent, or state a recurrence in an explicit loop."
notes: "generate calls the generator once per element, and the plain (sequential) overload does so in order, so a generator that carries state -- a running counter, a Fibonacci pair, a small state machine -- produces the right sequence. The problem is that this correctness is INVISIBLE and CONDITIONAL. The code does not say 'these calls must be sequential'; it just captures some variables and mutates them, and it happens to work because the sequential generate cooperates. Change to the parallel overload for speed -- std::generate(std::execution::par, first, last, gen) -- and the contract changes underneath it: the calls may now run on several threads, in any order, at the same time. The captured a and b are then read and written without synchronization by concurrent calls: a data race, undefined behavior, and a garbage or crashing result -- from what looked like a safe refactor. Even staying sequential, an order-dependent generator is fragile: it couples the output to an implementation detail and is easy to misread. The guidance: prefer generators whose calls are INDEPENDENT of each other (a fresh random draw, a value computed only from captured constants), which are safe to reorder or parallelize. When the values are a genuine recurrence (each from the last), write an explicit loop or use partial_sum / adjacent transforms, which make the dependency part of the code rather than a hidden assumption. The sign to watch for: a generate lambda that reads and updates captured state carried from the previous call, especially if the code might ever move to a parallel policy."
