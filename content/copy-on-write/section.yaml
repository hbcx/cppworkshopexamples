title: "Copy-on-write"
description: "Share one refcounted buffer between copies and only make a private copy when someone writes, so copying is O(1) until a modification actually happens. This is Qt's implicit sharing (QString, QByteArray) and the idea behind operating-system fork pages. Covers the share-until-you-write mechanic, the detach step that copies only when the buffer is shared, the const-reads-do-not-detach versus non-const-writes-do split, a clean version built on std::shared_ptr, why std::string was required to STOP being copy-on-write in C++11 (atomic counts and reference invalidation), and a measurement showing copies are free until the first write -- alongside the traps: a non-const accessor that skips detach and lets a write bleed across copies, a reference into a value that outlives a detach, and copy-on-write applied where writes dominate so it is pure overhead. The win is cheap copies of rarely-modified values; the cost is a refcount, a detach on write, and sharp lifetime rules."
sort_order: 182
category: "Techniques"
