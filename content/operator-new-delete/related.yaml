# Related chapters -- cross-links shown at the bottom of the section page.
- slug: "raii"
  note: "Where the raw-new/delete anti-pattern's fix lives: wrap the allocation in an object whose destructor releases it, so cleanup happens on every exit path. Go there for the idiom these allocation functions are almost always hidden behind."
- slug: "unique-ptr"
  note: "The everyday owner built on new/delete: it calls delete for you and takes a custom deleter when the allocation is custom. Go there for the RAII pointer you reach for instead of a manual delete."
- slug: "object-pool"
  note: "The applied form of a class operator new: a free-list that recycles fixed-size blocks instead of hitting the global allocator each time. Go there for the full pooling pattern this section's per-class allocator sketches."
- slug: "rule-of-0-3-5"
  note: "Once a type owns raw memory it needs the right destructor, copy, and move. Go there for which special members a resource-owning type must declare, and how a unique_ptr member removes the need."
- slug: "uninitialized-memory"
  note: "The range-at-a-time layer on top of placement new: construct or move a whole range into raw storage with a rollback on a throw, and tear it down with destroy. Go there once one object at a time is not enough and you are filling a buffer."
- slug: "alignment"
  note: "What the aligned operator new overload is really for: an over-aligned type needs storage on a stricter boundary than max_align_t, and std::align_val_t is how new asks for it. Go there for alignof/alignas, over-aligned new, and why plain storage is not always aligned enough."
- slug: "allocators"
  note: "How these allocation functions get packaged for containers: an Allocator wraps allocate/deallocate (usually forwarding to operator new/delete) behind the interface a std::vector or std::list expects. Go there for the Allocator concept, allocator_traits, and stateful allocators."
- slug: "launder-and-lifetime"
  note: "What placement new actually does to storage: it begins an object's lifetime, and reusing the same bytes for a new object is where std::launder and the lifetime rules come in. Go there for object lifetime, storage reuse, and laundering a stale pointer."
