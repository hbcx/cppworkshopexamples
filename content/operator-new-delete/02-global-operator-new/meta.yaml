title: "Replacing the global operator new"
standard: "C++11"
difficulty: 2
summary: "Define your own global operator new/delete and every allocation in the program routes through it -- useful for counting or tracking."
notes: "Replacing the global forms affects the whole process, so measure a delta around your own allocations rather than the absolute count, which includes library internals."
