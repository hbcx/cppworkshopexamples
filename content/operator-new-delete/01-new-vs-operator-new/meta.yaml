title: "new expression vs operator new"
standard: "C++11"
difficulty: 1
summary: "A new expression is two steps -- allocate with operator new, then construct -- and delete is destroy then deallocate."
notes: "Doing the two steps by hand with ::operator new plus placement new makes the split visible. The normal new/delete forms just fuse them."
