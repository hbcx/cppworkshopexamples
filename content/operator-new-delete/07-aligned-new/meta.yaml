title: "Aligned new (align_val_t)"
standard: "C++17"
difficulty: 3
summary: "Since C++17 a new expression for an over-aligned type calls the alignment-aware operator new(size, align_val_t) automatically."
notes: "Before C++17 plain operator new only promised alignment up to max_align_t, so over-aligned types (SIMD, cache lines) needed manual work. Now the language handles it."
run: true
