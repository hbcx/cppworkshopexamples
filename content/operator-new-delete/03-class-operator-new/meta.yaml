title: "Class-scoped operator new"
standard: "C++11"
difficulty: 2
summary: "A class can define its own operator new/delete, so new/delete for that type routes to a per-type allocator while other types are unaffected."
notes: "Member operator new/delete are implicitly static. This is the hook a per-class memory pool plugs into -- allocation policy attached to one type."
