title: "Modules (C++20)"
description: "C++20 modules replace textual #include with a real compilation boundary. An interface unit declares export module name; and marks what callers may see with export; consumers write import name; and get exactly those names -- no macros leaking, no header include order, no re-parsing the same declarations in every file. Covers a named module and importing it, exporting several entities at once, keeping the rest private to the module, splitting an interface from its implementation unit, the global module fragment for using legacy headers without leaking them, and module partitions for organizing a large module -- alongside the traps that trip up newcomers: forgetting export so a name stays invisible, putting a #include in the module purview instead of the global module fragment, and expecting macros to cross an import. Because modules are a two-phase build the driver handles it per compiler; every example still compiles on g++ and clang."
