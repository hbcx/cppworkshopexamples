- problem: "A template-heavy library API is misused by callers passing a type that does not support what the template needs, and the compiler answers with pages of errors pointing deep inside the implementation instead of at the call. Support tickets are really just unreadable template diagnostics."
  why: "Constraining the public template parameters with concepts moves the failure to the call site with a message that names the unmet requirement, so the caller sees why THEIR call is wrong. An unconstrained template only fails when something inside the body does not compile, which is where the wall of errors comes from."
  signal: "A public function or class template over an unconstrained typename whose misuse produces errors originating in headers the caller never wrote."

- problem: "A generic function needs to do different things depending on what a type supports -- a fast path for contiguous ranges, a fallback for the rest -- and the codebase currently expresses that with a ladder of std::enable_if overloads or empty tag types that are hard to read and extend."
  why: "Overloads constrained on concepts express each capability directly and are ordered by subsumption, so the most refined one wins with no enable_if boilerplate and no tag arguments. The enable_if ladder is verbose, easy to get wrong, and gives worse errors than a named concept."
  signal: "Overload sets guarded by std::enable_if_t or std::void_t, or functions taking an extra empty tag struct just to select an implementation."

- problem: "You are writing an algorithm meant to work over the standard containers and iterators, and it must accept exactly the traversal categories it can handle -- forward, bidirectional, random-access -- while rejecting weaker iterators clearly."
  why: "The std::ranges and iterator concepts (input_range, forward_iterator, sortable, and so on) name these requirements, so constraining on them documents and enforces exactly what the algorithm needs and integrates with the constrained standard algorithms. Hand-checking iterator_traits or leaving it unconstrained gives worse errors and drifts from the library's own vocabulary."
  signal: "An algorithm template that inspects std::iterator_traits by hand, or one left unconstrained that misbehaves or fails cryptically on a weaker iterator."

- problem: "A generic container or wrapper should expose an operation only when its element type supports it -- hashing only for hashable elements, ordering only for comparable ones -- without splitting into separate class templates or offering methods that fail deep inside when called."
  why: "A trailing requires on the member makes it exist only when the element satisfies the concept, so calling it on an unsupported element is a clean compile error at the call, and the rest of the class still works. The alternatives are duplicate class templates per capability or a member that compiles but breaks inside its body for the wrong element."
  signal: "A class template member that static_asserts or fails inside its body for some element types, or near-duplicate wrapper templates differing only by which operations they offer."

- problem: "You want to require that a type provides a specific interface -- some methods with given signatures -- but the types come from different places and cannot all inherit a common base, and you do not want the cost of runtime virtual dispatch just to state the contract."
  why: "A concept expresses the required interface as a compile-time contract that any conforming type satisfies structurally, with no base class and no vtable, checked when the template is used. Forcing a shared abstract base is intrusive and impossible for third-party types, and it adds a virtual call the generic code does not need."
  signal: "An abstract base class introduced only to state an interface for templates, or generic code that assumes an interface with no way to say so and fails obscurely when a type does not provide it."
