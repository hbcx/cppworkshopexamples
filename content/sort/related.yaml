# Related chapters -- cross-links shown at the bottom of the section page.
- slug: "ranges"
  note: "Where the C++20 form comes from: std::ranges::sort takes the whole range and a projection, so you sort by a member with a default comparator -- go there for range algorithms, projections, and the views a sorted range feeds."
- slug: "find-find-if"
  note: "The search a sort enables: once a range is sorted, binary_search and lower_bound find in O(log n), where find over an unsorted range is a linear scan -- go there for the linear search and when to sort first for the faster one."
- slug: "lists"
  note: "The container std::sort cannot touch: a std::list has only bidirectional iterators, so it provides its own member sort that relinks nodes instead -- go there for the node-based list and why its sort is separate."
- slug: "count-count-if"
  note: "The sibling algorithm for totals rather than order: count says how many match, where sort arranges them -- go there for tallies, thresholds, and progress counts over a range."
- slug: "transform"
  note: "The step that often comes before a sort: precompute a key per element with transform, then sort by that key so the comparator does not recompute it -- go there for mapping a range and the decorate-sort pattern."
- slug: "min-max-element"
  note: "When you only want one end, not the whole order: min_element and max_element find the extreme in O(n), and partial_sort or nth_element get the top-k, so sorting just to read front() or back() is wasted work -- go there for the extremes."
- slug: "unique"
  note: "The dedup that a sort sets up: unique removes only adjacent duplicates, so sorting first makes equal values neighbours and sort+unique+erase strips them all -- go there for deduplicating a range and unique_copy."
- slug: "rotate-reverse"
  note: "Rearranging without ordering: rotate moves an element or block within a sequence and reverse flips one, and reversing unsorted data is not a descending sort -- go there for in-place moves and why to sort with greater instead."
- slug: "partition"
  note: "The split at the heart of quicksort: partition rearranges around a predicate in O(n), and nth_element uses it to find an order statistic without a full sort -- go there for two-group splits and the stable-vs-unstable choice sort also has."
- slug: "binary-search"
  note: "What a sort unlocks: once a range is sorted, binary_search and lower_bound find, count, and locate insertion points in O(log n) -- go there for the searches that need the order sort provides, using the same comparator."
- slug: "merge-set-operations"
  note: "The other thing a sort unlocks: merge and set_union/intersection/difference combine two sorted ranges in O(n+m), and inplace_merge is the merge step of merge sort -- go there for combining sorted ranges, all needing the same order sort provides."
- slug: "next-permutation"
  note: "Where enumeration begins: to walk all permutations you sort to the smallest one first, and next_permutation steps in the order your comparator defines -- go there for generating arrangements and the do-while enumeration loop."
- slug: "nth-element"
  note: "The cheaper partial sort when you do not need the whole order: nth_element finds the kth in O(n) and partial_sort orders just the top-k, so a full sort to read a median or a shortlist is wasted work -- go there for selection and top-k."
- slug: "swap-ranges"
  note: "The primitive sort moves elements with: sort, partition and nth_element reorder by swapping through iterators (iter_swap), needing no extra storage -- go there for swap, iter_swap, and swap_ranges."
- slug: "sample-shuffle"
  note: "The inverse of sorting and a standard source of test inputs: shuffle randomizes an order with a seeded engine (the randomized data you then sort in a benchmark), and sample draws an unbiased subset -- go there for random order, selection, and seeding."
- slug: "clamp-minmax"
  note: "The same comparator on just a value or two: std::min/max/clamp take the exact predicate std::sort does, so best-of-two-by-key and bounding a value share the ordering you sort by -- go there for comparing values, minmax, and clamp."
- slug: "mismatch-equal"
  note: "The element-by-element rule sort uses to order sequences: lexicographical_compare is exactly how a sort of words or tuples compares two of them, using the same comparator -- go there for comparing two ranges, dictionary order, and equality."
- slug: "heap-algorithms"
  note: "The sort hiding inside a heap: make_heap + sort_heap is heapsort, in-place with a guaranteed O(n log n) worst case, and the heap ops also give an incremental priority queue that a one-shot sort cannot -- go there for make_heap, push/pop, and when a heap beats sorting."
- slug: "execution-policies"
  note: "How to sort across cores: std::sort takes an execution policy and produces the same order however the work is split, so a large sort parallelizes with one extra argument -- go there for the parallel policies, reductions, and the parallel hazards."
