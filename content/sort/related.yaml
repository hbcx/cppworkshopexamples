# Related chapters -- cross-links shown at the bottom of the section page.
- slug: "ranges"
  note: "Where the C++20 form comes from: std::ranges::sort takes the whole range and a projection, so you sort by a member with a default comparator -- go there for range algorithms, projections, and the views a sorted range feeds."
- slug: "find-find-if"
  note: "The search a sort enables: once a range is sorted, binary_search and lower_bound find in O(log n), where find over an unsorted range is a linear scan -- go there for the linear search and when to sort first for the faster one."
- slug: "lists"
  note: "The container std::sort cannot touch: a std::list has only bidirectional iterators, so it provides its own member sort that relinks nodes instead -- go there for the node-based list and why its sort is separate."
- slug: "count-count-if"
  note: "The sibling algorithm for totals rather than order: count says how many match, where sort arranges them -- go there for tallies, thresholds, and progress counts over a range."
- slug: "transform"
  note: "The step that often comes before a sort: precompute a key per element with transform, then sort by that key so the comparator does not recompute it -- go there for mapping a range and the decorate-sort pattern."
- slug: "min-max-element"
  note: "When you only want one end, not the whole order: min_element and max_element find the extreme in O(n), and partial_sort or nth_element get the top-k, so sorting just to read front() or back() is wasted work -- go there for the extremes."
- slug: "unique"
  note: "The dedup that a sort sets up: unique removes only adjacent duplicates, so sorting first makes equal values neighbours and sort+unique+erase strips them all -- go there for deduplicating a range and unique_copy."
- slug: "rotate-reverse"
  note: "Rearranging without ordering: rotate moves an element or block within a sequence and reverse flips one, and reversing unsorted data is not a descending sort -- go there for in-place moves and why to sort with greater instead."
