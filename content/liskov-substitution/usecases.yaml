- problem: "A system loads interchangeable backends behind one interface -- storage drivers, payment gateways, cache providers -- and a new one is added by a different team. Everything compiles, but one driver's commit does not actually persist, or its get returns a stale value, and only the code paths that hit that driver break."
  why: "Liskov substitution is the discipline that makes drop-in replacement safe: every driver must honour the interface's behaviour, not just its signatures, so code written to the interface works with all of them. Without it, teams end up special-casing the one misbehaving driver, which is the coupling the interface was meant to remove."
  signal: "An interface with several implementations and a caller that checks which concrete one it got (a dynamic_cast or a type flag) before deciding whether it can trust a method."

- problem: "A unit test swaps the real dependency for a fake -- an in-memory repository, a stub gateway -- so it can run without I/O. The tests pass, but production fails because the fake accepts inputs the real one rejects, or returns success where the real one would have thrown."
  why: "A test double is a subtype standing in for the real type, so it is only valid if it is substitutable for it -- same preconditions, same postconditions. A fake that quietly behaves differently makes green tests that prove nothing, which is worse than no test because it hides the very defect it should catch."
  signal: "A fake or mock whose accepted inputs, error cases, or return guarantees differ from the real implementation it stands in for."

- problem: "A framework calls your code through a base-class pointer -- a request handler, a lifecycle hook, a comparator -- expecting the documented contract: do not throw here, return a non-null result, leave the object in a valid state. An override that quietly breaks one of those corrupts the framework from the inside."
  why: "The framework is a caller written against the base contract, so your override must be substitutable for it. When it is not, the failure surfaces deep inside the framework with a confusing stack, far from the override that caused it, because the framework trusted a promise the subtype did not keep."
  signal: "An overridden framework hook that throws where the base does not, returns null where the base guarantees a value, or leaves an invariant the base maintained broken."

- problem: "A collection library models a read-only view as a subtype of the mutable collection, so a caller holding the mutable type is handed a read-only one and its add call throws at runtime instead of failing to compile."
  why: "Read-only is not a behavioural subtype of mutable -- it removes a capability the base promises -- so making it one violates substitution and pushes the error to run time. Splitting the capability into separate interfaces (a read interface the write interface extends) lets the type system reject the misuse up front, which is where the Interface Segregation principle leads."
  signal: "An overridden method that throws an unsupported-operation error, or a read-only subtype of a mutable base whose mutators are stubbed out to throw."
