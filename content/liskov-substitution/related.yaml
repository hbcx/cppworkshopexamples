- slug: "open-closed"
  note: "The sibling that creates the subtypes LSP has to keep safe: Open-Closed says extend by adding a subclass, and Liskov is the rule that says the subclass must behave like its base or the extension is a landmine -- read them together."
- slug: "dependency-injection"
  note: "Why an injected implementation is safe to swap: DI hands an object a collaborator behind an interface, and Liskov is the contract that guarantees any implementation behaves as the interface promises -- go there for the injection mechanics this principle underwrites."
- slug: "strategy"
  note: "Where substitutability is the whole point: a Strategy is only interchangeable if every algorithm honours the same behavioural contract, which is exactly what Liskov demands -- go there for the swap this principle makes safe."
- slug: "single-responsibility"
  note: "Another SOLID principle: SRP is about where behaviour lives, Liskov about whether a subtype may stand in for its base -- go there for the reason-to-change split that keeps classes small enough to reason about."
- slug: "interface-segregation"
  note: "The cure for the refused-bequest trap here: when a subtype cannot support a base method, the fix is a smaller interface, not a throwing override -- go there for splitting fat interfaces into client-specific roles."
- slug: "dependency-inversion"
  note: "Where substitutable implementations are put to work: once policy depends on an abstraction (Dependency Inversion), Liskov is what guarantees each adapter behind it is a safe stand-in -- go there for the inversion that creates the port."
- slug: "nvi"
  note: "The C++ mechanism that enforces this contract: an NVI base wraps a private virtual, so a pre- or post-condition every subtype must honour lives in the non-virtual method where no override can weaken it -- go there for the idiom that keeps substitutability from depending on subclass discipline."
- slug: "inheritance-and-virtual"
  note: "The C++ mechanics this principle governs: public inheritance, virtual dispatch, and abstract base classes -- and the inheriting-for-reuse trap that is an LSP violation in code. Go there for how substitutable hierarchies are actually built."
