title: "std::future, promise and async"
description: "Getting a result back from another thread, and the one-shot channel that carries it. A std::future is the receiving end of a value that will be produced later; std::async runs a function and hands you its future, std::promise lets one thread set the value another is waiting on, and std::packaged_task wraps a callable together with its future. Covers launching work with async and getting the result, the async vs deferred launch policies, the promise/future handoff, packaged_task for a task queue, exceptions travelling across the thread boundary, a promise<void> used as a one-shot signal, and shared_future to broadcast one result to many waiters -- alongside the anti-patterns of getting it wrong: a discarded async future that blocks in its destructor, calling get twice, a promise destroyed without a value, and assuming the default launch policy runs on a thread. Examples run under ThreadSanitizer on Linux/CI."
sort_order: 101
category: "Concurrency"
