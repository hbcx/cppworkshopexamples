- slug: "unordered-containers"
  note: "The containers that consume a hash: unordered_map and unordered_set turn std::hash plus operator== into average O(1) lookup, and this is where the hasher/equality template arguments and load factor live -- go there for the hash tables themselves."
- slug: "standard-function-objects"
  note: "The sibling function objects: std::hash is a callable just like std::less, and the container's equality slot takes std::equal_to (or its transparent form) -- go there for the arithmetic, comparison and logical objects and transparent lookup."
- slug: "namespaces"
  note: "Why specializing std::hash is allowed at all: it is the one kind of addition to namespace std the standard permits, a template specialization for your own type. Go there for that rule, ADL, and why you must not add plain functions to std."
- slug: "maps"
  note: "The ordered alternative when you do not need hashing: std::map needs only operator< and keeps keys sorted, trading O(1) average for O(log n) and a defined order -- go there to weigh the tree against the hash table."
