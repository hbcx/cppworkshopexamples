title: "exception_ptr basics"
standard: "C++11"
difficulty: 2
summary: "std::exception_ptr turns the current exception into a value you can store and move; current_exception captures it and rethrow_exception throws it again later."
notes: "An exception normally lives only for the duration of its catch. std::exception_ptr makes it a first-class value: std::current_exception(), called inside a catch, returns a shared pointer to the exception being handled, and std::rethrow_exception() throws it again -- possibly in a different scope, function or thread. This decouples WHERE an exception is caught from WHERE it is handled, which is the foundation for the rest of this section. An exception_ptr is copyable and null when empty, so you can test it with if. The captured exception stays alive as long as any exception_ptr refers to it."
run: true
