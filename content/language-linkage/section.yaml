title: "extern C and language linkage"
description: "How C++ talks to C and to anything that speaks the C ABI. An extern C specifier gives a function C language linkage: its symbol is not name-mangled, so C code, other languages, and dynamic loaders can find it by its plain name, while the body stays ordinary C++. Covers a single extern C function, the extern C block with the __cplusplus header guard that lets one header serve both languages, a C-style callback through std::qsort, why C linkage forbids overloading (no mangling, so no two same-named symbols), catching exceptions at the boundary before they can unwind through a C frame, and passing only C-compatible types across -- alongside the traps: letting a C++ exception escape an extern C function (undefined when called from C), trying to overload an extern C function, and passing a non-trivial C++ type like std::string by value across the boundary. Everything is shown in pure C++ -- the linkage specifier, the callback shape, the boundary discipline -- without a separate C compiler."
