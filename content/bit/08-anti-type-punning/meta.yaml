title: "Anti-pattern: type punning via reinterpret_cast or union"
standard: "C++20"
difficulty: 3
summary: "Reading a float's bits through an unrelated pointer breaks strict aliasing (UB), and the union trick is UB in C++ too. bit_cast (or memcpy before C++20) is the defined way."
notes: "Reinterpreting bytes by casting a pointer to a different type and dereferencing it violates the strict-aliasing rule -- undefined behaviour, even though it usually appears to work until the optimizer assumes the two pointers cannot alias. The C union trick (write one member, read another) is also UB in C++, though it is allowed in C. The defined replacements: std::bit_cast in C++20, or std::memcpy into the target type in any version. We describe the UB forms in comments and run only the defined ones."
run: true
