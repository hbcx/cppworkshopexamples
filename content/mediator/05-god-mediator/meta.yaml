title: "Anti-pattern: the god mediator"
standard: "C++11"
difficulty: 3
summary: "Mediator centralises interaction, and its failure mode is centralising too much: the mediator grows into one class that knows every subsystem's rules, so every feature touches it, it cannot be read in one sitting, and it becomes the bottleneck the pattern was meant to remove -- split it by cohesive concern into focused mediators."
notes: "This is Mediator's signature failure, warned about in the original Gang of Four text: because the pattern's whole idea is to move interaction logic OUT of the colleagues and INTO the mediator, a mediator naturally attracts logic, and without discipline it keeps attracting it until it is a monolith that knows everything. HomeHubGod shows the shape -- one class, one method, holding the rules for lighting, security and climate all together. It works, but it has quietly become the thing the pattern exists to prevent: a single point every change must go through, coupling unrelated concerns (a lighting tweak now lives beside the alarm logic and risks it), impossible to understand or test in parts, and a merge-conflict magnet because every developer edits the same method. The colleagues, meanwhile, have been hollowed out -- all the intelligence is in the mediator -- which is the related empty-colleagues smell. The fix is not to abandon Mediator but to apply cohesion to it: split the one mediator into several, each owning one cohesive area of interaction, so lighting rules live in a Lighting mediator, security in a Security one, and climate in a Climate one. The behaviour here is deliberately identical -- the split version prints exactly what the god version does -- to make the point that this is a structural refactor, not a behavioural change: the value is that a lighting change now touches only Lighting, the three concerns can be understood and tested independently, and a fourth subsystem is a new class rather than more lines in the one method. How to split is a judgment about cohesion: group interactions that genuinely relate (they share state, they concern the same feature) and separate those that only happened to be centralised together. The deeper lesson is that 'centralise the interaction' does not mean 'centralise everything' -- a mediator should own ONE web of related interactions, and when it owns several unrelated webs it has outgrown the pattern and wants dividing. There is also a real tension to acknowledge: Mediator inherently trades a distributed problem (coupled colleagues) for a concentrated one (a complex mediator), so some concentration is the point; the anti-pattern is only when that concentration crosses into a class with multiple responsibilities that should have been separate mediators. The sign: a mediator whose methods switch or branch across clearly different subsystems, that every feature must modify, and that no one wants to open."
