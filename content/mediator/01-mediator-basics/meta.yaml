title: "Mediator basics: colleagues talk through a hub"
standard: "C++11"
difficulty: 1
summary: "A chat room is the minimal Mediator: users never reference one another, they only know the room; a user sends a message to the room and the room decides who receives it, so adding or removing a user changes no other user's code and changing delivery changes only the room."
notes: "Mediator attacks a specific problem: a set of objects that all need to interact tend to end up referencing each other directly, and that mesh of connections grows quadratically -- n objects can have up to n(n-1)/2 links -- so every object knows about many others, the wiring is scattered, and changing the interaction means editing all of them. Mediator replaces the mesh with a hub: each colleague refers only to the mediator, the mediator refers to the colleagues, and all the interaction logic lives in the one place. The chat room is the clearest minimal instance. Users hold no pointers to other users; each User knows only its ChatRoom, calls room.send(...) to communicate, and the room decides delivery -- here, to everyone except the sender. The decoupling is immediately visible in what does NOT change: add a fourth user and no existing user's code is touched, remove one and the same, change delivery to only-online-users or add moderation and only the room changes. Compare the alternative where each user held a list of every other user and looped over them to broadcast: adding a user would mean updating everyone's list, and the delivery policy would be duplicated in every user. This is the same decoupling Observer provides but arranged differently, and the two are worth telling apart because they look similar. Observer is one-directional broadcast: a subject notifies many observers of an event and does not care what they do. Mediator is multi-directional coordination: colleagues both send and receive, and the mediator contains logic about how their interactions relate -- which message goes where, which action triggers which reaction. A chat room is close to pure relay, so it sits near the Observer end; the following examples add real coordination logic (enabling a button when fields are filled, sequencing planes onto a runway) that is squarely Mediator and has no Observer equivalent. The sign that a design wants a mediator: several objects each holding references to several others to coordinate, with the coordination rules spread across all of them, where a hub could hold the wiring and the rules once."
run: true
