- slug: "observer"
  note: "The closest relative, told apart by direction: Observer broadcasts an event one-way from a subject to many listeners that react independently, where Mediator holds multi-way coordination logic about how colleagues interact -- go there for the notification mechanism a mediator's event-bus form is built on."
- slug: "facade"
  note: "The other centralising pattern, by intent: a Facade offers a simpler one-way interface INTO a subsystem for outside clients, where a Mediator coordinates the mutual interaction AMONG a set of peers -- go there when the goal is to hide a subsystem's complexity, not to wire its members together."
- slug: "command"
  note: "What colleagues often send through the hub: a Command reifies a request as an object, and a mediator (especially an event bus) is a natural place to route or dispatch such requests -- go there for the request-as-object side of what flows between colleagues."
