title: "Anti-pattern: an infinite notification loop"
standard: "C++11"
difficulty: 3
summary: "When the mediator reacts to a colleague changing by changing another colleague, whose change notifies the mediator too, the reactions can feed back forever; two synced currency fields ping-pong endlessly without a guard. The fix is to stop propagating when nothing actually changed, so the feedback dies out after one round."
notes: "This is the hazard that comes with bidirectional coordination, and it is especially common in mediators that keep colleagues in sync. The setup is innocent: USD and EUR should track each other, so the mediator reacts to a change in one by updating the other. But updating the other is itself a change, which notifies the mediator, which updates the first, and around it goes. The example makes the mechanism explicit: usd.set(10) drives eur.set(9), which drives usd.set(10) again, and because the naive field notifies on every set -- even when the value it was given equals what it already held -- the notifications never stop. Left unbounded this is an infinite loop, hanging the program or overflowing the stack if the notifications recurse; the example only avoids a real hang with a hop cap that trips and reports a runaway, which is a diagnostic, not the fix. The fix is to break the feedback at its source: propagate a change only when the value ACTUALLY changed. The guarded field returns early when set to the value it already holds, so the cycle self-terminates after one productive round -- USD becomes 10, EUR becomes 9, the mediator tries to set USD to 10 again, the guard sees no change and does not notify, and the system is at rest. This 'only fire on real change' rule is the standard cure and worth internalising because the same loop appears far beyond currency fields: two-way data binding, spreadsheet cells that reference each other, observers that write back to their subject, any mediator that both reads and writes the colleagues it coordinates. Two related techniques handle cases the equality guard alone does not. A re-entrancy flag on the mediator (ignore notifications while already processing one) stops loops even when values legitimately differ each pass, such as rounding that never quite converges. And distinguishing programmatic updates from user-initiated ones -- suppressing change events while the mediator is the one doing the setting -- is how GUI frameworks avoid exactly this when code updates a control. The deeper point: a mediator that writes to the colleagues whose changes it listens to has created a cycle by construction, and must have an explicit reason the cycle terminates -- a value that stops changing, a flag that suppresses re-entry -- rather than trusting it to settle. The tell: a mediator whose reaction to a colleague's change mutates another colleague that notifies back, with no guard on whether the value changed and no re-entrancy protection."
