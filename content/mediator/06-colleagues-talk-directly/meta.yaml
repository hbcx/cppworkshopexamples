title: "Anti-pattern: colleagues that still talk directly"
standard: "C++11"
difficulty: 3
summary: "A mediator only helps if colleagues route through it; when they keep direct references to each other for convenience you get the worst of both worlds -- the mesh of coupling the mediator was meant to remove AND the mediator. Here two fields hold pointers to each other and duplicate the enable rule; the mediator form gives each field only the hub and one copy of the rule."
notes: "The benefit of Mediator is entirely contingent on one discipline: colleagues talk to the mediator, never to each other. Break that -- let a colleague keep a direct reference to another because it is quick -- and the pattern's value evaporates, because the mesh of coupling is back. FieldBad shows it: each field holds a pointer to the other field and to the button, so it can evaluate the enable rule itself. The result is the n-to-n coupling Mediator exists to eliminate (each field knows the others), and the coordination rule is duplicated in every field that can trigger it, so a change to the rule must be made in each copy and kept in sync. Worse, this is often the STATE a codebase drifts into after a mediator is introduced but not enforced: the mediator exists, yet colleagues still poke each other directly for the cases someone found convenient, so you now pay for the mediator's indirection AND still have the tangle it was supposed to prevent. The fix is to route every interaction through the mediator: FieldGood knows only the FormMediator, tells it 'I changed', and the mediator holds the single copy of the rule. Adding a third required field or changing the condition now touches only the mediator, and no field references another. The identical output underlines that this is purely about coupling, not behaviour -- both versions enable and disable the button at the same moments, but only one keeps the colleagues independent. The rule to enforce: a colleague's only outward reference should be the mediator; if a colleague holds a pointer or reference to a sibling colleague, that is the smell, and the interaction it uses that pointer for belongs in the mediator. This is easiest to keep honest when colleagues depend on a mediator INTERFACE and are given no way to reach siblings -- they physically cannot talk directly. The judgment call: not every direct reference is wrong (a genuine ownership or containment relationship is fine), but a reference used to COORDINATE behaviour between peers is exactly what the mediator should own. The tell: colleagues that hold pointers to other colleagues and call methods on them to keep shared state consistent, especially when a mediator already exists but is bypassed for some of those interactions."
