title: "The mediator as an arbiter with state"
standard: "C++11"
difficulty: 2
summary: "A control tower is a Mediator that does more than relay: it owns a shared resource (the runway) and the policy for scheduling access to it, so planes never coordinate with each other -- they ask the tower to land and it clears them or makes them hold, then clears the next waiting plane when the runway frees."
notes: "The chat room relayed messages and the dialog evaluated a condition; this example shows the mediator at its most substantial, holding real state and an arbitration policy. A control tower coordinates access to a scarce shared resource -- the runway -- that only one plane can use at a time, and the rules for who gets it and in what order are exactly the kind of interaction logic Mediator centralises. Planes are simple: each can request to land, be cleared or told to hold, and report when it has landed, and crucially a plane never talks to another plane. The tower holds the runwayBusy_ flag and a queue of waiting planes, and its two methods encode the whole policy: a request is cleared immediately if the runway is free or queued otherwise, and a landing frees the runway and clears the next plane in first-come order. This is the version of Mediator that has no Observer analogue. Observer broadcasts an event to listeners who react independently; here the tower is making decisions based on shared state, sequencing mutually exclusive access, and holding a queue -- coordination that is inherently central and stateful. Trying to distribute this among the planes would be a disaster: each plane would need to know about the runway's state and every other plane to negotiate order, which is precisely the n-to-n mesh the pattern exists to prevent, and the arbitration would be duplicated and racy. Centralising it in the tower makes the policy a single readable unit that can be changed (priority landings, multiple runways, emergency preemption) without touching the planes. This also illustrates where Mediator shades into related ideas: an arbiter of a shared resource is close to a scheduler, and a tower coordinating access is the coordination core that real systems wrap with threading and timeouts. The example keeps it single-threaded and synchronous so the sequencing is deterministic and visible; a real tower would be concurrent, and the mediator would then also be the natural place to put the lock, because it already owns the shared state. The tell that a mediator-as-arbiter fits: several objects contending for a shared resource or a shared decision, where the contention rules want to live in one authority rather than being negotiated pairwise."
