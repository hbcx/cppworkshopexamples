title: "The canonical Mediator: a dialog coordinating widgets"
standard: "C++11"
difficulty: 2
summary: "The Gang of Four example: a form's widgets depend on each other -- submit enabled only when both fields are filled -- and without a mediator that rule would live inside the widgets, each referencing the others; instead every widget knows only an abstract Mediator and reports 'I changed', and the concrete dialog holds the coordination rule in one place."
notes: "This is the example Mediator was introduced with, and it shows the pattern's value more sharply than the chat room because the interaction here is real logic, not relay. A login form has a rule -- the submit button is enabled only when both the username and password fields are non-empty -- and that rule relates three widgets. Without a mediator, the rule has to live somewhere among the widgets: the username field would need a reference to the password field and the button to re-check on every keystroke, and so would the password field, so the widgets reference each other and the rule is duplicated and entangled. Add a third required field and every widget's copy of the rule must change. The mediator dissolves this: each widget knows only the mediator and does exactly one generic thing when its state changes -- call mediator->widgetChanged(this) -- and the LoginDialog's widgetChanged holds the entire coordination rule in a single method. The widgets are now ignorant of each other; the rule is in one readable place; adding a field or changing the condition touches only the mediator. Two design points make this the good version rather than merely a working one. First, the widgets depend on an ABSTRACT Mediator interface, not on LoginDialog, which is dependency inversion applied to the pattern: a TextField or Button can be reused in any dialog, tested with a stub mediator, and knows nothing about the specific coordination it participates in -- coupling a widget to the concrete mediator instead is this chapter's coupled-to-concrete-mediator anti-pattern. Second, the widgets are thin and generic (a field holds text, a button holds enabled-ness) while the mediator holds the application-specific interplay, which is the right division of labour -- until the mediator absorbs so much that it becomes a god object, the pattern's signature failure mode. Note the callback shape: a widget reports that it changed and lets the mediator decide what that means, rather than telling other widgets what to do; this keeps the direction of knowledge one-way (widget to mediator) and is what prevents the widgets from re-coupling. The tell that a screen or component wants this: several sub-elements whose enabled, visible, or valid state depends on each other's values, currently wired with each element poking the others."
run: true
