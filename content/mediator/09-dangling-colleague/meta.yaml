title: "Anti-pattern: a dangling colleague registration"
standard: "C++11"
difficulty: 3
summary: "The mediator holds raw pointers to its colleagues so it can reach them; if a colleague is destroyed but never removed, the mediator keeps a dangling pointer and the next interaction dereferences freed memory. The fix is RAII -- a colleague unregisters itself in its destructor -- so the mediator never holds a pointer to a dead colleague."
notes: "A mediator has to keep references to its colleagues to coordinate them, and when those references are raw pointers (the common case) the mediator's correctness depends on every colleague outliving its registration. Nothing enforces that automatically, so the bug writes itself: a colleague goes out of scope, is deleted, or is otherwise destroyed, and unless something removes it from the mediator's list, the mediator holds a pointer into freed memory. The next broadcast, notification, or coordination step dereferences it -- use-after-free, undefined behaviour. This is precisely the dangling-observer problem the Observer chapter centres on, appearing here on the mediator side because a mediator is, among other things, holding a collection of participants much like a subject holds observers. As with all use-after-free it often seems to work, because the freed storage is briefly intact, which is why the broken version is described in a comment and not run: undefined behaviour must not go through the compile gate. The fix shown is the same RAII discipline: the colleague registers itself with the mediator in its constructor and, crucially, unregisters itself in its destructor, so the two are balanced and the mediator's list can never contain a destroyed colleague. The guest here removes itself the moment its scope ends, and the subsequent broadcast is safe. RAII is the right default because it makes the cleanup automatic and exception-safe -- the destructor runs however the scope is left -- rather than relying on some external code to remember to call leave(), which is the manual approach that fails exactly when an early return or exception skips it. Where colleagues have more tangled lifetimes than a clean scope, the sturdier options are the same ones Observer uses: the mediator holds weak_ptr to colleagues and prunes the ones that have expired before using them, so a colleague can die without notifying the mediator at all; or the mediator shares ownership via shared_ptr when it genuinely should keep colleagues alive (rarer, since a mediator usually coordinates colleagues it does not own). What you must not do is leave raw registrations unbalanced and trust that colleagues outlive the mediator, which is the default failure mode here. The tell: a mediator holding raw pointers to colleagues whose lifetimes it does not control, with a register call in the colleague's constructor but no matching unregister in its destructor."
run: true
