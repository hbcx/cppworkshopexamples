title: "Anti-pattern: a mediator for two objects"
standard: "C++11"
difficulty: 3
summary: "Mediator pays off when many colleagues interact in tangled ways; for two objects with one simple interaction, the full setup -- an interface, colleague registration, a notify round-trip -- is ceremony around what a direct call or a single callback does in a line. A button updating a label needs no mediator."
notes: "Every pattern has a lower bound below which it costs more than it saves, and Mediator's is a small, fixed number of colleagues with a simple interaction. The pattern earns its indirection by untangling a MESH: many objects, many interactions, coordination logic that would otherwise be duplicated and scattered. When there are two objects and one straightforward interaction, there is no mesh to untangle -- a button tells a label to update -- and wrapping it in a Mediator interface, a colleague that holds a mediator pointer, and a notify method that switches on an event string adds three indirections and a layer of vocabulary to express a single call. DialogBad is all setup and no payoff; the direct version, where the button simply invokes a callback the label is bound to, is shorter, reads top to bottom, and is just as decoupled at this scale (the button does not know what the callback does). This is the same YAGNI judgment the Strategy chapter makes about a strategy for one algorithm: build the machinery when the variation or the tangle that justifies it actually exists, not in anticipation. The cost of premature Mediator is not only the extra code but the misdirection: a reader sees a Mediator and reasonably expects a web of coordinated colleagues, then finds two objects and one rule, and has to work out that the structure promises complexity that is not there. Indirection should be paid for by the complexity it manages. The honest boundary, since this is a judgment and not an absolute: introduce the mediator when a third and fourth colleague appear, when the two objects start interacting in more than one way, or when the coordination logic grows beyond a line -- the refactor from a direct call or callback to a mediator is small and safe once the tangle is real. A single callback (as in the good version) or a direct method call is the right tool for one-to-one notification; a mediator is for many-to-many coordination. The sign: a Mediator with two colleagues and a notify that handles a single event with a single reaction, where inlining it to a direct call or a callback would remove a class and read more clearly."
