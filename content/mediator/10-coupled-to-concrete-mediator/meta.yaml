title: "Anti-pattern: a colleague coupled to the concrete mediator"
standard: "C++11"
difficulty: 3
summary: "If a colleague holds a pointer to the concrete mediator type it is welded to that one mediator -- unreusable in another context, undrivable by a different coordination, untestable with a stub. Depending on a Mediator interface instead makes the colleague reusable with any mediator, so the same field can be driven by the real mediator in production and a test double in a test."
notes: "Mediator decouples colleagues from EACH OTHER, but a second decoupling matters just as much and is easy to miss: the colleague should be decoupled from the concrete mediator too. When a colleague holds a pointer to the concrete type -- FieldBad knowing about ConcreteHub -- it has traded peer-to-peer coupling for coupling to one specific coordinator, which limits it in exactly the ways an abstraction would prevent. It cannot be reused in a different screen or context that has a different mediator; it cannot be driven by an alternative coordination without editing the colleague; and it cannot be unit-tested in isolation, because instantiating it drags in the whole concrete mediator and whatever that depends on. Depending on an abstract Mediator interface fixes all three at once. FieldGood knows only the interface, so the same field class works with a RealHub in production and a TestHub double in a test, as the runnable code shows by driving one field type with two different mediators. This is the Dependency Inversion Principle applied to the pattern: the colleague (a lower-level, reusable part) should depend on an abstraction, and the concrete mediator (a higher-level, application-specific part) should implement that abstraction, so the dependency points toward the stable interface rather than the volatile concretion. The classic dialog example earlier already did this -- widgets depended on Mediator, not LoginDialog -- and this anti-pattern is that decision seen from the failure side. The testability point is the most practical payoff: a colleague coupled to a concrete mediator is a colleague you cannot test without the mediator, and a mediator you often cannot test without the whole app, so the coupling quietly makes the whole cluster hard to test; the interface breaks that by letting a trivial stub stand in for the mediator. The judgment is minimal here because the fix is nearly free -- an abstract base class with the notification method -- and the only reason to skip it is a truly throwaway one-off, which is also when you would not be building a mediator at all. The sign: a colleague whose member pointer or reference names a concrete mediator class rather than an interface, so the colleague cannot be constructed, reused, or tested without that exact mediator."
run: true
