title: "Anti-pattern: domain logic in the mediator"
standard: "C++11"
difficulty: 3
summary: "A mediator should coordinate interactions, not own the colleagues' own rules; lifting a colleague's business logic -- an account's overdraft rule -- into the mediator makes the colleague anemic and puts the rule where it cannot be reused or enforced independently. Keep each colleague's rules inside the colleague and let the mediator only coordinate."
notes: "This is the god-mediator smell diagnosed at the level of a single responsibility, and it is worth separating because the cause is specific: the mediator is doing work that belongs to a colleague. A mediator's proper job is the INTERACTION between colleagues -- who reacts to whom, in what order, under what shared condition. A colleague's own invariants -- an account may not go below zero, a document must be non-empty to publish -- belong to the colleague, with the data they guard. BankMediatorBad crosses that line: it enforces the overdraft rule itself, reading the balance, comparing, and writing it back, while AccountAnemic is reduced to a getter and a setter with no rules of its own. Two things go wrong. The account is now anemic -- an object that holds data but no behaviour, so it cannot protect its own invariant, and any other code path that touches the balance (a different mediator, a direct call) can violate the overdraft rule because the account will not stop it. And the rule is in the wrong place for reuse: it lives in this one mediator, so a second flow that also withdraws must either duplicate it or route through this mediator, and the rule cannot be unit-tested without the mediator. The fix restores the responsibility: Account.withdraw() enforces its own rule and reports success, so the invariant travels with the data and holds no matter who calls it, and BankMediatorGood shrinks to genuine coordination -- ask the account to withdraw, and on success tell the ledger to record. The mediator still owns the INTERACTION (the link between a withdrawal and a ledger entry, which is legitimately cross-object), but not the account's internal rule. The identical output makes the point that this is about where responsibility lives, not what the program does. The guiding question when writing a mediator method: is this coordinating multiple colleagues, or is it one colleague's own logic that I have pulled out? If a piece of logic reads and writes a single colleague's private concern and does not involve the others, it belongs in that colleague. Anemic colleagues plus a fat mediator is the recurring shape of this mistake, and it is how a mediator slides toward the god object of the earlier anti-pattern -- each rule that should have stayed in a colleague and instead landed in the mediator is a step down that road. The tell: a mediator method that enforces or computes a single colleague's invariant -- validating and mutating one object's state with no other colleague involved -- while that colleague exposes raw setters and holds no rules of its own."
run: true
