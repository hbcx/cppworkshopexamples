title: "A lightweight std::function event bus"
standard: "C++11"
difficulty: 3
summary: "When colleagues are independent modules rather than a fixed class hierarchy, the mediator can be a small event bus: subscribers register a callback for a topic and a publisher emits a topic with a payload without knowing who listens -- the loosest form of Mediator, whose cost is that the coupling moves into unchecked string topic names."
notes: "The class-based mediators so far had a fixed cast of colleagues wired at construction. When the participants are instead independent, dynamically-registered modules -- services in an application, plugins, systems in a game -- the mediator is often a std::function event bus, and it is worth seeing because it is extremely common and because it marks the edge of the pattern. Subscribers register a callback under a topic string, publishers emit a topic with a payload, and the bus fans each publication out to that topic's subscribers. The decoupling is maximal: the publisher of order.placed has no reference to the email or inventory modules, does not know how many subscribers exist (zero is fine -- publishing an unheard topic is a silent no-op), and the modules do not know about each other. Adding a new reaction to an event is subscribing another callback, touching nobody. This is Mediator dissolved almost entirely into infrastructure, and it shades into the Observer pattern and into publish-subscribe messaging; the line is blurry and not worth policing -- what matters is recognising it as the same decoupling idea. The power comes with real costs this example is honest about, and they are the reason the following anti-patterns exist. The topics are strings, so the compiler cannot check them: a publisher that emits order.placed (typo) or a subscriber listening for the wrong topic fails silently, with no error, because an unmatched publish is a legal no-op -- the type safety a method call would give you is gone. The payload here is a single string, so anything structured must be serialised and parsed, losing type checking on the data too. And the total flow of the system becomes implicit: you cannot follow it by reading call sites, because who reacts to an event is discoverable only by finding every subscribe at runtime, which makes the loose coupling a double-edged trade -- easy to extend, hard to trace. Mitigations used in practice: typed events (a topic per message type, or an enum instead of a string, or templated publish<Event>) to restore compile-time checks, and a documented registry of topics. The rule of thumb: reach for the event bus when participants are genuinely independent and dynamic and the loose coupling is worth the lost traceability; keep the explicit class-based mediator when the colleagues are a known set whose coordination you want to read in one place and check at compile time. The tell that you have drifted too far: string topics multiplying, publishes that no longer have an obvious subscriber, and bugs that are missing reactions rather than wrong ones."
run: true
