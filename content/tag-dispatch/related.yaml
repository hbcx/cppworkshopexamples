# Related chapters -- cross-links shown at the bottom of the section page.
# Each entry: the slug of another section + a one-line note on why to go there.
- slug: "type-erasure"
  note: "The run-time counterpart: type erasure picks the implementation at run time behind one value through a virtual call, where tag dispatch picks it at compile time by overload with no branch left -- go there when the type is only known at run time and must share one value type."
- slug: "crtp"
  note: "The other compile-time dispatch: CRTP resolves a call to the derived type through the template system with no vtable, a sibling static-polymorphism technique -- go there for static polymorphism, mixins, and per-type state."
- slug: "iterator"
  note: "Where the iterator categories that example 03 dispatches on come from: the pattern that defines input, forward, bidirectional and random-access traversal -- go there for the iterator concept and how containers expose it."
- slug: "visitor"
  note: "Dispatch on type done at run time: Visitor uses double dispatch through virtual calls to pick behaviour by an object's dynamic type, the run-time answer to what tag dispatch does at compile time -- go there for double dispatch and when a run-time type switch is unavoidable."
- slug: "concepts"
  note: "What replaces this in C++20: constrained overloads ordered by subsumption select an implementation by a named requirement directly, where tag dispatch needed an extra tag argument and a trait -- go there for concepts, the requires-expression, and the modern form of this dispatch."
- slug: "constexpr-consteval"
  note: "The single-function alternative to a tag: an if constexpr branch (or is_constant_evaluated) picks the path inside one function with no tag argument and no extra overloads -- go there for compile-time evaluation, constexpr, consteval, and the if constexpr that replaces this."
- slug: "type-traits"
  note: "Where the tag usually comes from: a trait produces the true_type or false_type this technique dispatches on, and reads a type's category or properties -- go there for the type-category, relationship and transformation traits that drive the dispatch."
- slug: "sfinae"
  note: "How the tag is often computed in the first place: a void_t detector yields the true_type or false_type that tag dispatch then routes on, so detecting a capability and dispatching on it are two halves of one pattern -- go there for enable_if, expression SFINAE, and the detection idiom."
