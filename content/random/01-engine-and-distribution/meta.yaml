title: "Engine plus distribution: a die roll"
standard: "C++11"
difficulty: 1
summary: "The two-part model of <random>: a seeded engine produces raw bits, and a distribution shapes them into the numbers you want -- here rolls of a six-sided die."
notes: "Always these two pieces. The engine (here std::mt19937, the Mersenne Twister) is the source of randomness and holds the state; the distribution (here uniform_int_distribution over [1,6]) is a function object you call WITH the engine to get one shaped value. Seeding the engine with a fixed number makes the whole run reproducible. This replaces the old rand() with better quality, no global state, and any shape you need."
run: true
sanitizers: []
main_tags:
