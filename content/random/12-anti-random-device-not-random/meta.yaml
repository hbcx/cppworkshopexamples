title: "Anti-pattern: assuming random_device is truly random"
standard: "C++11"
difficulty: 3
summary: "std::random_device is meant to be a real non-deterministic source, but the standard does not require it -- some implementations return a fixed sequence. entropy() is a hint, never a promise."
notes: "random_device is supposed to read the OS entropy pool, and on most modern platforms it does. But the standard permits a deterministic implementation, and classic MinGW famously shipped one that returned the same sequence every run -- so code that seeded from it got identical numbers each time. entropy() reports the claimed entropy; 0.0 means no guarantee. Use random_device only to SEED a good engine, and if reproducibility shows up where you expected randomness, check your platform. For anything that must be UNPREDICTABLE -- tokens, keys, session ids -- do not use <random> at all: use the operating system cryptographic RNG."
run: true
sanitizers: []
