title: "Integer and real ranges: closed vs half-open"
standard: "C++11"
difficulty: 1
summary: "uniform_int_distribution(a, b) covers the closed range [a, b] -- both ends included; uniform_real_distribution(a, b) covers the half-open range [a, b) -- b excluded."
notes: "This asymmetry surprises people and causes a common off-by-one bug. The integer distribution INCLUDES its upper bound, so uniform_int_distribution(1, 6) really does return 6, and (0, size) can return size -- one past the last index. The real distribution is half-open [a, b) like most C++ ranges. Keep the two rules apart: for an index into a container of n elements the integer range is (0, n - 1), not (0, n)."
run: true
