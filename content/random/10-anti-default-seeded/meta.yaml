title: "Anti-pattern: a default-seeded engine repeats every run"
standard: "C++11"
difficulty: 2
summary: "A default-constructed engine uses a fixed default seed, so it produces the exact same sequence on every program run -- not the fresh randomness people expect."
notes: "std::mt19937 gen; is default-constructed and uses the standard default seed (5489 for mt19937), so every run of the program yields the identical sequence. People assume a new process gives new numbers; it does not until you seed it. Seed from std::random_device (the OS) at startup for run-to-run variety, or from a fixed value on purpose when you want reproducibility. The bug is silent: it looks random the first time you run it, and only shows up as identical results across runs."
run: true
