title: "Filesystem operations"
description: "The disk-facing half of C++17 <filesystem>: the free (non-member) functions that query and change the real filesystem a std::filesystem::path names. Covers existence and type queries (exists, is_regular_file, is_directory, status, file_size), listing a directory with directory_iterator and its cached directory_entry, walking a tree with recursive_directory_iterator and pruning branches, creating and removing files and directories, copying and renaming, reading and writing file size and modification time, resolving paths on disk with absolute/canonical/weakly_canonical/relative, current_path and temp_directory_path, the throwing-versus-error_code overload pair, and symbolic links -- alongside the traps: the check-then-use race, re-querying the disk in a loop instead of using the entry's cache, ignoring an error_code, remove_all on an unchecked path, treating a file time as a system_clock time, canonical() throwing on a not-yet-created path, and a recursive walk following a symlink cycle."
sort_order: 117
category: "Files & I/O"
