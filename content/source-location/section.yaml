title: "std::source_location"
description: "The C++20 way to capture where code is in the source -- file, line, column, and function name -- as a first-class value instead of the __FILE__ and __LINE__ macros. Its defining trick is that a source_location default argument is evaluated at the CALL site, so a logging or checking function can report where it was called without a macro. Covers the accessors, the default-argument capture, a macro-free logging helper, a check helper that reports the failing call site, forwarding the location through a wrapper layer, and recording where an object was constructed -- alongside the traps: calling current() in the helper body (which reports the helper, not the caller), forgetting to forward the location through a wrapper, and the fact that a defaulted source_location cannot follow a variadic pack, which needs the format-string-plus-location struct that std::format_string uses. File paths are normalized to the bare file name in the examples so the output is identical across compilers."
sort_order: 176
category: "Diagnostics"
