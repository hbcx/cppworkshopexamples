- problem: "A hot path needs a lookup table -- a CRC polynomial table, a character-class map, precomputed trig, a small parser transition table -- and computing it at program start costs time and pulls in initialization-order questions."
  why: "A constexpr function that fills the table (in C++20, even with std::vector, copied into a std::array) has the compiler compute it and bakes the result into the binary, so there is no run-time build and nothing to initialize at start-up. Generating it at run time pays the cost on every launch; generating it with an external script adds a build step and a file that can drift from the code."
  signal: "A table filled in by a loop at program start or in a one-time init function, or a generated header produced by a separate script and checked in beside the code that uses it."

- problem: "A library takes literals that must be well-formed -- a color hex code, a units value, a format string, an opcode -- and a malformed one currently slips through to fail at run time, often far from where it was written."
  why: "A consteval function validates the literal at compile time, so a bad value is a build error at the definition and can never reach production. A plain constexpr function would still allow a run-time call that only fails when that code path is hit, and a run-time check moves the failure to the worst possible moment."
  signal: "A validation function called on string or numeric literals whose failure is a run-time throw or error return, where every argument at the call sites is actually a constant."

- problem: "A global object must be ready before any other start-up code runs and must also be writable later -- a configuration block, a counter, a registry, a flag -- and it currently risks the static initialization order problem across translation units."
  why: "constinit forces the global to be constant-initialized, set in the program image before any dynamic initialization, and the compiler rejects a non-constant initializer, so the order trap cannot occur -- while leaving the variable mutable, which constexpr would forbid. A plain definition leaves initialization order undefined between translation units; constexpr would wrongly freeze a variable that needs to change."
  signal: "A non-const global initialized from another global or a function call, especially one read during other globals' construction, or a comment warning about initialization order."

- problem: "A math or utility routine is needed both in constant expressions -- to size arrays, feed template arguments, or precompute constants -- and at run time on live data, and maintaining two versions invites them to drift apart."
  why: "A single constexpr function serves both: the compiler evaluates it when the context needs a constant and it runs normally otherwise, so there is exactly one implementation to test and keep correct. Two separate functions, one for compile time and one for run time, are duplicate logic that can and does diverge."
  signal: "A pair of functions with the same math, one used in constant contexts and one at run time, or a run-time helper that callers wish they could use to size an array."

- problem: "A function has a genuinely better implementation for each world -- a simple, portable version that the compiler can evaluate, and a fast one using a bit trick or an intrinsic the compiler cannot run -- and you want the right one automatically."
  why: "std::is_constant_evaluated() inside a plain if lets one constexpr function take the portable path during constant evaluation and the fast path at run time, transparently to callers. Writing only the fast version can break compile-time use (an intrinsic is not constant-evaluable); writing only the portable one leaves run-time speed on the table."
  signal: "A constexpr function that avoids a useful run-time optimization so it stays constant-evaluable, or a run-time-only helper that cannot be used in a constant expression because of one intrinsic call."
