title: "Anti-pattern: a dangling pointer to a flyweight"
standard: "C++11"
difficulty: 3
summary: "An object that references a flyweight by raw pointer is valid only while the factory keeps that flyweight alive; if the factory is destroyed or evicts the entry, every referrer dangles -- so a flyweight outlived by its users must be shared-owned, not pointed at."
notes: "Flyweight separates the many context objects from the few shared flyweights, and that split raises a lifetime question: the flyweight must outlive every object that refers to it. Refer to it by raw pointer and you have delegated that guarantee to the factory, which is exactly where it tends to fail. WidgetBad holds a const Style*; it works while the owning Style (or the factory holding it) is alive, but if that owner is destroyed first -- the factory goes out of scope, or, worse, the weak-pointer eviction from the previous anti-pattern reclaims an unused flyweight -- the widget's pointer dangles and reading through it is undefined behaviour. This example does not run that case (UB is nondeterministic); it is described, and only the safe form executes. The fix is shared ownership: WidgetGood holds a shared_ptr<const Style>, so referring to a flyweight extends its life, and it survives even after the factory that created it is gone -- shown here by the style outliving the local factory scope. This interacts with eviction in a useful way: if the factory holds weak_ptr (to avoid the unbounded pool) and clients hold shared_ptr, the flyweight lives exactly as long as some client needs it and is reclaimed the moment none do -- the two patterns compose. The alternative to shared ownership is a documented lifetime guarantee (the factory provably outlives all referrers, e.g. a static glyph table for the program's duration), which is fine when it genuinely holds -- but a raw pointer plus an unowned, evictable flyweight is the dangling combination. The tell: a context object storing a bare Flyweight* whose lifetime is controlled by a separate factory it does not co-own."
run: true
sanitizers: []
