title: "Anti-pattern: an intern pool that never releases"
standard: "C++11"
difficulty: 3
summary: "A flyweight factory that holds a strong reference to every object it ever created never frees any of them, so a long-running process interning unbounded distinct keys grows without bound -- a cache that is really a leak, fixed by holding weak references so a flyweight expires with its last user."
notes: "The factory that makes Flyweight work is a cache, and it inherits the oldest cache problem: eviction. If the factory keeps a shared_ptr to every flyweight, it is a permanent owner, so nothing is ever released and the pool only grows. That is fine when the set of distinct keys is small and bounded -- a few dozen glyphs, ten tree species -- because the pool saturates and stops. It is a leak when the keys are unbounded: request ids, session tokens, user-supplied tags, per-message identifiers. StrongCache here still holds temp-1 and temp-2 after their only users are gone, so the pool size stays at two; scale that to a service interning a fresh key per request and the pool grows forever until the process is killed. The fix is to make the factory a NON-owning observer: WeakCache stores weak_ptr, hands out a shared_ptr only while one is alive (lock() succeeds), and rebuilds when the last user has dropped it, so live entries fall back to zero once the users leave. The ownership now lives entirely with the clients, and the flyweight's lifetime tracks actual use. Two practical notes: the expired weak_ptr entries still occupy map slots, so a real implementation prunes them periodically or on insert; and if instead you WANT to keep hot entries cached even with no current user, that is a bounded cache with an eviction policy (LRU, a size cap), not an unbounded strong pool -- the point is that the policy must be deliberate. The sign: an interning factory keyed by an unbounded or user-controlled value that holds its entries with shared_ptr and has no eviction."
run: true
