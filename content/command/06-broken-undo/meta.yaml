title: "Anti-pattern: undo that does not restore the prior state"
standard: "C++11"
difficulty: 3
summary: "An undo() that resets to a hardcoded default or a guessed value instead of the state that was actually there corrupts the document the moment undo follows anything but a fresh start -- a command must capture the prior state on execute and restore exactly it, which is where Command meets Memento."
notes: "Undo is only correct if it is the exact inverse of execute, and the trap is writing an undo that guesses the prior state rather than remembering it. SetValueBad resets the register to 0 on undo, which passes the obvious test -- set 10, undo, back to nothing -- and fails silently the moment there is history: set 10, set 20, undo, and it lands on 0 instead of 10, because it never recorded that 10 was there. Append/chop-style commands are naturally symmetric and hide this, but any command that OVERWRITES needs the old value to reverse, and a default is not the old value. The fix is to snapshot the prior state during execute() and restore it during undo(): SetValueGood reads reg.value() before overwriting and puts that exact value back. This is the point where Command composes with Memento -- the command holds a memento (here just the previous int, in general a captured snapshot of whatever it will change) so undo restores precisely what execute replaced. Two further correctness notes this small example implies. First, undo must reverse what execute ACTUALLY did, so a command that made no change (a no-op set to the same value) should record that and undo to the same, not blindly restore. Second, the captured prior state must be valid at undo time, which is why a command owns its snapshot rather than re-reading the receiver, and why undo assumes the receiver was not changed underneath it by something outside the history. The tell: an undo() that sets a literal, a default, or a recomputed value instead of one captured from the receiver before execute() overwrote it."
