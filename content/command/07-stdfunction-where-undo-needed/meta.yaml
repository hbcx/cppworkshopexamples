title: "Anti-pattern: std::function where you need undo"
standard: "C++14"
difficulty: 3
summary: "The std::function form of Command is the right default for fire-and-forget actions, but a bare callable cannot reverse itself; using it where the feature needs undo (or logging, naming, serialization) forces a fragile parallel stack of inverse lambdas, where a command object with execute() and undo() carries its own reversal."
notes: "The earlier example showed a command as a std::function<void()>, and that is genuinely the right tool for simple triggered actions. This anti-pattern is reaching for it when the feature needs more than execution. A std::function<void()> can be stored, queued, and replayed, but it is opaque: it cannot undo itself, cannot say its own name for a log, and cannot be serialized or inspected. HistoryBad shows the dead end -- it can run and remember actions, but there is no undo() it could write, because a callable carries no inverse to call. The usual workaround makes it worse: keep a second stack of hand-written undo lambdas paired with each action, and now correctness depends on every call site supplying a correct inverse and the two stacks never drifting -- exactly the bookkeeping the pattern is supposed to remove. The fix is the object form: a Command interface with execute() AND undo(), so each command owns its own reversal and the history undoes generically by calling undo() on the top of the stack, with no parallel structure to maintain. The same reasoning extends to any capability a bare callable lacks: if commands must be logged with meaningful names, persisted and replayed (event sourcing), shown in a UI history, or grouped into undoable macros, they need to be objects with the relevant methods, not anonymous closures. The decision rule: use the std::function command when execution is all you need; switch to the Command object the moment a request must also be reversed, named, inspected, or stored as more than a call. The tell: a growing pair of action and undo lambda stacks, or a std::function history that a feature request now wants to make undoable."
run: true
