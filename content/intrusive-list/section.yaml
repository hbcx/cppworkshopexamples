title: "Intrusive lists"
description: "Put the linkage inside the element instead of in a node the container allocates: the element carries its own next and prev pointers (a hook), and the list just threads them, so the list allocates nothing and one element can belong to several lists at once. This is how the Linux kernel list_head and boost::intrusive work. Covers the hook-in-the-element mechanic, O(1) removal given only a pointer to the element, an element in two lists at the same time through two hooks, a reusable IntrusiveList template built on a base hook, the fact that the list does NOT own its elements, and a measurement of the allocations it removes versus std::list -- alongside the traps: destroying an element that is still linked, inserting the same element twice through one hook, and keeping intrusive elements in a container that relocates them. The cost is that the element must carry the hook and its lifetime is managed elsewhere; the win is no per-element allocation and O(1) unlink."
