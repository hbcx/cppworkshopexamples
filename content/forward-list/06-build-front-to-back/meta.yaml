title: "Building a list front to back with a trailing iterator"
standard: "C++11"
difficulty: 2
summary: "There is no push_back, so appending in order means keeping an iterator to the last node and calling insert_after on it each time -- insert_after returns the new node, which becomes the next tail, so each append stays O(1)."
notes: "The trick is that insert_after returns an iterator to the element it inserted. Seed the tail with before_begin(), and each insert_after(tail, value) both appends and hands you the new tail. The range and count overloads of insert_after do the same for many elements at once and return the last one inserted. Without this you would either prepend and reverse, or walk to the tail every time (O(n^2))."
run: true
