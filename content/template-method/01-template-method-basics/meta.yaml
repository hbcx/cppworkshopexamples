title: "Template Method basics: a fixed skeleton with overridable steps"
standard: "C++11"
difficulty: 1
summary: "Template Method puts the shape of an algorithm -- the order of its steps -- in one non-virtual base method, and defers only the steps that vary to virtual functions the subclasses override, so a subclass changes what a step does without ever touching the sequence the base guarantees."
notes: "Template Method is the inheritance answer to the same question Strategy answers by composition: how to let one part of an algorithm vary while the rest stays fixed. The base class writes the algorithm once as a single method -- here prepare(), which boils water, brews, pours, and adds extras in that order -- and marks only the varying steps (brew, addExtras) virtual for subclasses to fill in; the invariant steps (boilWater, pourInCup) stay private in the base. Tea and Coffee each override the two steps and inherit the sequence unchanged, so both always boil and pour, in the right order, with no way to get that wrong. The defining move is the direction of the calls: the subclass does not call the base to run the algorithm, the base calls down into the subclass's steps -- inversion of control, the Hollywood principle, don't call us we'll call you. That is exactly what a framework does when you override onCreate or SetUp: the framework owns the lifecycle and calls your hooks at the points it chooses. Three deliberate choices in this skeleton are worth naming because the rest of the chapter builds on them. The template method prepare() is NOT virtual: the algorithm's shape is the base's guarantee, and making it overridable would let a subclass discard the recipe, which is this chapter's first anti-pattern. The varying steps are protected, not public: they are extension points for subclasses, not operations for clients to call directly or out of order. And they are pure virtual here because every drink must define them; a step that has a sensible default becomes a non-pure virtual the subclass MAY override -- a hook, which the hooks example covers. The trade-off against Strategy, threaded through this chapter, is the trade-off between inheritance and composition: Template Method binds the varying step at compile time through the subclass and needs no extra object, but the choice is fixed when the type is, cannot change on a live instance, and does not compose when two steps vary independently -- where Strategy, injecting the step, can."
run: true
