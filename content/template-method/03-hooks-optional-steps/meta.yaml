title: "Hooks: optional steps with a default"
standard: "C++11"
difficulty: 2
summary: "A pure virtual is a step the subclass MUST supply; a non-pure virtual with a default body is a hook -- an optional step it MAY override or ignore. A hook that returns a value can steer the skeleton itself, letting a subclass switch a whole step on or off without the base knowing why."
notes: "The steps a template method defers come in two flavours, and choosing between them is most of the design. A pure virtual is a required step: the subclass cannot be instantiated without defining it, which is right when there is no sensible default -- every beverage must brew somehow. A non-pure virtual with a default implementation is a hook: an optional extension point the subclass may override to customise or leave alone to accept the base's behaviour. This example shows both kinds of hook. addExtras() is a content hook with a do-nothing default, so a subclass that says nothing gets no extras and one that overrides it adds lemon -- optional customisation. wantsExtras() is a more powerful thing: a hook that returns a value the skeleton itself branches on, defaulting to true so extras run by default, and overridden to false by BlackCoffee to opt the entire step out. That is the classic Head First hook -- a base algorithm with an optional stage gated by a boolean the subclass can flip -- and it lets subclasses influence the flow at points the base chooses, without the base enumerating the reasons. The design guidance that falls out: make a step pure virtual when every subclass genuinely must decide it, and a hook when there is a reasonable default most subclasses will keep, so the common case is zero code in the subclass and only the exceptions override. Over-using pure virtuals forces boilerplate into every subclass (the same danger the State chapter's no-base-default anti-pattern describes); over-using hooks with silent empty defaults can hide the fact that a step was meant to be filled in -- a default that does nothing should be a deliberate 'nothing is the sensible default here', not a forgotten obligation. Note the hook methods stay protected: like the required steps they are extension points for subclasses, not operations for clients, and only the base's skeleton calls them. A returning hook such as wantsExtras() is also the seam where Template Method starts to resemble Strategy -- a subclass is choosing behaviour -- but it remains inheritance: the choice is baked into the type, not injected into an instance."
run: true
