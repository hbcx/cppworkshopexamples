title: "Anti-pattern: a virtual (overridable) skeleton"
standard: "C++11"
difficulty: 3
summary: "The point of Template Method is that the base owns the algorithm's shape and subclasses fill in steps. Make the template method itself virtual and a subclass can override the whole skeleton -- dropping mandatory steps and reordering the rest -- so the invariant the base was supposed to guarantee no longer holds."
notes: "Template Method exists to make the shape of an algorithm the base class's inviolable guarantee: every report has a header and a footer, every request is validated, because the skeleton says so and a subclass cannot say otherwise. That guarantee has exactly one enforcement mechanism -- the template method is non-virtual -- and this anti-pattern removes it. ReportBad::render() is virtual, so RogueReport overrides it in full and writes a new algorithm that skips header() and footer() entirely; the base's promise that those always run is now a suggestion, and any invariant the base was enforcing (a wrapper, a cleanup, a required ordering) can be silently discarded by a subclass that reimplements the method. Worse, it fails quietly: the subclass compiles, looks like a normal override, and only the output reveals that the structure the base guaranteed is gone. This is the mirror image of the pattern's intent -- you have inheritance and virtual dispatch, but pointed at the algorithm's shape instead of its steps, which is precisely backwards. The fix is the rule the basics and NVI examples follow: the template method is non-virtual, and only the steps are virtual. ReportGood::render() cannot be overridden, so header() and footer() always run and the subclass's only reach is body(); the invariant is structural, not a convention subclasses are trusted to honour. Making the steps private or protected reinforces it, so a client cannot call them out of order either. The judgment to apply: if you find yourself wanting to override the whole method, that is a signal the base did not actually capture a shared algorithm -- either the varying part should be a step the base calls (extract it and keep the skeleton fixed), or the two cases do not share a skeleton at all and should not be in a Template Method relationship. Overriding the skeleton is not customising the algorithm; it is replacing it, which the base's non-virtual method should make impossible. The tell: a public or protected virtual whose body IS the sequence of steps -- the algorithm itself is the overridable unit, rather than the individual steps it calls."
run: true
