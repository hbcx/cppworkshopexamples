title: "Anti-pattern: a step that silently fails to override"
standard: "C++11"
difficulty: 3
summary: "A subclass step whose signature differs from the base virtual -- a missing const, a different parameter type -- does not override it; it compiles as a new function, and the skeleton, calling through the base, silently runs the base version. The override keyword turns that mistake into a compile error."
notes: "Template Method leans entirely on virtual dispatch reaching the subclass's step, and the quiet way for that to fail is an override that is not one. C++ overriding requires the derived function to match the base virtual's signature exactly -- name, parameters, const-qualification, ref-qualification, and a compatible return type. Miss any of them and you have not overridden anything; you have declared a new function that happens to share a name, and the base virtual remains un-overridden. Here CustomBad::line() drops the const that FormatterBad::line() const carries, so it is a different function; render() lives in the base and calls line() through the base interface, where only FormatterBad::line() const exists, so a CustomBad renders base line and the custom version is dead code that nothing in the skeleton ever calls. In a build without the right warnings the program is simply well-formed and the symptom is that customisation appears to have no effect -- one of the more baffling bugs to chase, because the override is right there in the source, just not connected. This specific mismatch is exactly what -Woverloaded-virtual catches (this example sets werror: false so the deliberately-warning case can still build and run and show the base version winning), but that warning is off by default and does not cover every mismatch, so it is a backstop, not the fix. The fix is the override keyword, added in C++11 for exactly this: marking CustomGood::line() as override tells the compiler to verify it really overrides a base virtual, so the missing-const version fails to compile with a clear message instead of silently not overriding. The rule that follows is to write override on every function you intend to override -- it costs nothing, documents intent, and converts a whole class of silent dispatch bugs into compile errors; enabling -Wsuggest-override (or clang's -Winconsistent-missing-override) pushes the codebase toward doing so everywhere. A related guard is final, when a step or class must not be overridden further. Note this is the counterpart to the earlier signature-driven bug in reverse: there a step should not have been virtual; here a step is virtual but the subclass fails to hook into it. Both are caught by being explicit -- override to assert you are hooking in, non-virtual (or the skeleton itself) to assert a step is fixed. The sign: a subclass method that looks like an override, is not marked override, and has no effect at runtime because a subtle signature difference means the base version is what actually runs."
run: true
sanitizers: []
werror: false
