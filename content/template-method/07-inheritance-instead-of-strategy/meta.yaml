title: "Anti-pattern: inheritance where Strategy fits better"
standard: "C++11"
difficulty: 3
summary: "Template Method binds the varying step through the subclass, so the choice is frozen when the type is: it cannot change on a live object, and when two steps vary independently you need one subclass per combination -- the cross product. Injecting the steps as strategies makes them compose (2 + 2, not 2 * 2) and swappable at runtime."
notes: "Template Method and Strategy solve the same problem -- vary one part of an algorithm, keep the rest fixed -- and the choice between them is the choice between inheritance and composition, with real consequences this example makes concrete. Because Template Method defers steps to overrides, the varying behaviour is selected by which subclass you instantiate, and that has two costs when the problem grows too big for a single axis of variation. First, the choice is static: a CsvEmail is a CsvEmail for life, and switching its delivery means constructing a different object, because you cannot reassign a subclass. Second, and worse, independent variations multiply: a report that varies by format and by delivery needs a subclass for every pairing -- CsvEmail, CsvFtp, HtmlEmail, HtmlFtp -- and adding a third format or a third delivery does not add one class, it multiplies the other axis, the same combinatorial explosion the State chapter's combined-dimensions anti-pattern shows, here driven by inheritance. That subclass blow-up is the signal that the varying steps are really independent collaborators, not points on one inheritance hierarchy. The fix is Strategy: make each varying step an injected object rather than an override. ReportGood holds a format strategy and a delivery strategy (here std::function callables, but they could be interfaces or policies), so the two axes compose additively -- two formats plus two deliveries, paired freely at construction, with a fifth of either axis adding one strategy rather than doubling classes -- and a live report can be reconfigured by swapping a strategy, which no subclass can do. This does not make Template Method wrong; it marks its boundary. Template Method is the better fit when there is ONE axis of variation, the variants share substantial fixed structure the base should own and enforce, and the choice is naturally per-type and compile-time -- a framework's lifecycle hooks, a serializer's one overridable step. Reach for Strategy the moment variation is multi-dimensional, must change at runtime, or the steps are independent enough to recombine. The sign for this anti-pattern: a class hierarchy whose subclass names are combinations of two adjectives (CsvEmail, HtmlFtp), or a base whose subclasses differ only in which small step they override with no shared skeleton to justify the inheritance."
run: true
