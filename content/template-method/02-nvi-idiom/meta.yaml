title: "The Non-Virtual Interface idiom"
standard: "C++11"
difficulty: 2
summary: "Make the public method non-virtual and the customisation point a private virtual it calls: the base wraps every invocation in fixed work -- validation, logging, timing, locking -- that no subclass can skip or reorder, while the subclass overrides only the core; the varying step being private is what guarantees it is never called without its wrapper."
notes: "The Non-Virtual Interface idiom is Template Method sharpened into a C++ guideline: prefer public functions non-virtual and virtual functions private (or protected when a subclass must call the base version). It separates the two jobs a virtual public function tries to do at once -- being the stable interface clients call, and being the customisation point subclasses override -- which are in tension, because the moment a function is both, a subclass that overrides it also replaces the interface, including any pre- and post-conditions the base wanted to enforce. NVI splits them: handle() is public and non-virtual, so it is the fixed interface and the base fully controls the sequence -- log, validate, run the core, log -- and process() is private and virtual, so it is the extension point and nothing but handle() can call it. The subclass customises what happens in the middle and is structurally unable to bypass the wrapper: there is no public virtual to call directly, and the private access means even the subclass cannot invoke process() out of context. The payoff is that cross-cutting concerns live in exactly one place. Want to time every request, add a lock around the core, or enforce a precondition on all subclasses? It goes in the non-virtual handle(), once, and every subclass gets it for free and cannot forget it -- compared to a public-virtual design where each override would have to remember to lock, log, and validate, and one that forgets is a silent bug. The private-virtual detail also improves the interface: clients see one clear entry point rather than a virtual they might call directly or override wrongly. Two practical notes. Use protected instead of private for the virtual only when a subclass legitimately needs to call the base class's own version of that step (a chained override); default to private. And NVI does not forbid a non-pure default: process() can be a non-pure private virtual with a base implementation, making it a hook (next example) rather than a required step. The tell that a class wants NVI: a public virtual whose every override begins and ends with the same boilerplate -- the same lock, the same log, the same check -- which is the wrapper begging to be hoisted into a non-virtual caller."
