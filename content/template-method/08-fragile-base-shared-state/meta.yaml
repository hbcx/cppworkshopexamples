title: "Anti-pattern: steps coupled through shared protected state"
standard: "C++11"
difficulty: 3
summary: "When steps communicate by reading and writing shared protected members and depend on the skeleton's call order, a subclass that overrides one step can silently break an invariant another step assumed -- the missed write leaks a stale or sentinel value into the next step, a defined-but-wrong result with no crash and no warning."
notes: "A template method's steps often need to pass information to each other -- prepare something, then serve it -- and how that hand-off is modelled decides how fragile the hierarchy is. The brittle way, shown here, is a shared protected member: prepare() writes prepared_ and serve() reads it, with the skeleton's ordering (prepare before serve) as the only thing making it work. This creates two hidden couplings a subclass author cannot see from the outside. The ordering is implicit -- nothing in the signatures says prepare() must run first, so a refactor of the skeleton that reorders or conditionally skips a step can break every subclass silently. And the contract is implicit -- prepare()'s real job is not just to run but to LEAVE prepared_ set, an obligation nowhere in its signature, so RushedMeal overrides prepare() to do its own work, never writes prepared_, and serve() dutifully reads the leftover sentinel -1. Nothing crashes; the meal is just served wrong, and the bug is invisible at the override site because the missing write is an absence, not a mistake you can point at. This is the fragile base class problem in miniature: the base and subclass are coupled through internal state and assumed order rather than an explicit interface, so correct-looking local changes have non-local effects. The fix is to make the data flow part of the interface: prepare() RETURNS the value, and the skeleton hands it to serve() -- serve(prepare()). Now the contract is in the type system (prepare() must produce an int; a subclass cannot override it without returning one), the ordering is explicit in the call rather than implied by a shared member, and there is no mutable state for one step to forget to set. More generally, prefer passing data between steps by return values and parameters over threading it through protected members; keep protected mutable state to genuinely shared context that every step reads the same way, not to a baton one step is trusted to pass to the next. When steps unavoidably share evolving state, document the ordering as a precondition and consider asserting the invariant the next step depends on, so a broken override fails loudly instead of returning -1. The tell: an overridable step whose real responsibility is to leave a protected member in a particular state, with a later step that silently depends on it having done so."
run: true
