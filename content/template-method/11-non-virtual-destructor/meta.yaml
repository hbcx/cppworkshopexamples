title: "Anti-pattern: a polymorphic base with a non-virtual destructor"
standard: "C++11"
difficulty: 3
summary: "A Template Method base is inherited and often deleted through a base pointer, so a non-virtual destructor is undefined behaviour on delete: only the base destructor runs, the derived destructor and its members are skipped, and whatever the derived object owns leaks -- a base with virtual functions needs a virtual (or protected) destructor."
notes: "This trap is not unique to Template Method but the pattern walks into it by design, because a Template Method base is made to be inherited and its instances are routinely held and destroyed through a base-class pointer or smart pointer. The language rule is precise: deleting an object through a pointer to a base class whose destructor is not virtual is undefined behaviour when the object is actually a derived type. In practice the destructor call is resolved statically to the base's, so only ~Base runs -- the derived destructor never fires, and neither do the destructors of the derived class's members, so any resource the derived object owns (the Resource here, a file handle, a buffer, a lock) is silently leaked or left un-released. It is one of the nastier bugs because everything appears to work: construction is fine, the virtual step dispatches correctly, and only cleanup is quietly wrong, often invisible until the process runs long enough for the leak to matter. This example keeps the broken case in a comment for two reasons -- it is undefined behaviour, which must not run under the compile gate, and modern compilers reject deleting a polymorphic type through a base pointer with a non-virtual destructor outright under -Werror (the -Wdelete-non-virtual-dtor warning), so it will not even build. The good version gives BaseGood a virtual destructor, and the output shows the correct teardown order: destroying the object through a BaseGood pointer runs ~DerivedGood, then the Resource member's destructor, then ~BaseGood, so everything the derived object owns is freed. The rule to internalise: the moment a class has a virtual function it is meant to be used polymorphically, and it needs either a public virtual destructor (if instances are deleted through base pointers, the usual case) or a protected non-virtual destructor (to make polymorphic deletion a compile error when you want to forbid it). Marking the derived destructor override, as here, is good hygiene but not the fix -- the virtual must be on the BASE, because that is the static type the delete sees. The sign: a class with virtual functions but a non-virtual, non-protected destructor, especially one held via a base pointer or a smart pointer to the base."
run: true
