title: "Anti-pattern: calling a virtual step from the constructor"
standard: "C++11"
difficulty: 3
summary: "Running the template method from the base constructor calls the BASE version of every virtual step, never the subclass override, because during base construction the derived part does not exist yet and the vtable still points at the base -- a silently wrong result, and undefined behaviour outright if the step is pure virtual."
notes: "This is a C++-specific trap that Template Method walks straight into, because the natural instinct is to run the skeleton from the constructor so the object is usable the moment it is built. C++ constructs objects base-first: while the base constructor runs, the derived subobject has not been constructed, and the language deliberately sets the dynamic type to the class currently being constructed. So a virtual call from the base constructor dispatches to the base's own version of the function, not the derived override -- even though the object will ultimately be a Derived. Here FrenchGreeterBad's construction calls step() from GreeterBad's constructor and prints base step, not bonjour; the same object printing bonjour once run() is called after construction proves the override was there all along and only the timing was wrong. That silent divergence between what a constructor-time virtual call does and what every later call does is the entire hazard, and it is easy to miss because the object works correctly everywhere except the one path that ran during construction. The pure-virtual variant is worse and is why this example keeps the step non-pure: if the base declares the step pure virtual and the constructor calls it, there is no function to dispatch to, which is undefined behaviour; in practice the runtime aborts with pure virtual method called. The example describes that case in a comment and does not execute it, since undefined behaviour is exactly what must not be run under the compile gate. The same rule applies to destructors, symmetrically: during a base destructor the derived part is already gone, so a virtual call there also resolves to the base version. The fix is to keep constructors and destructors free of calls to overridable steps and run the template method afterwards, once the object is fully constructed -- expose the skeleton as a method the client (or a factory that builds then invokes) calls, as GreeterGood does with run(). When an object truly must be initialised by a derived-defined step, use two-phase construction (construct, then an explicit init() that runs the virtuals) or a factory function that returns the object only after calling the step -- both make the step run when the dynamic type is finally correct. The tell: a base constructor or destructor that calls a virtual function, especially the template method itself, so subclasses appear to be ignored during construction."
run: true
