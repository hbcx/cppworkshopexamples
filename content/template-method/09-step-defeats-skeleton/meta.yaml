title: "Anti-pattern: a mandatory step made overridable, then skipped"
standard: "C++11"
difficulty: 3
summary: "Not everything a skeleton does should be a customisation point. Expose an invariant-enforcing step -- validation, a security check, a required cleanup -- as a virtual, and a subclass can override it to a no-op and silently disable it; keep mandatory steps in the non-virtual skeleton and make only the genuinely varying parts overridable."
notes: "Designing a template method is as much about what you do NOT make virtual as what you do. Every overridable step is a promise that subclasses may legitimately change it, and that promise is wrong for steps whose job is to hold an invariant. PipelineBad makes validate() virtual, presumably to let subclasses tune the rule, but virtual means overridable means skippable: TrustingPipeline overrides it to return true unconditionally, and now the -5 that should have been rejected flows straight into transform(). The check did not fail loudly; it was quietly defined out of existence by a subclass, and the pipeline processes invalid data as if the guard had never existed. This is the same family as the virtual-skeleton anti-pattern -- a subclass defeating a base guarantee -- but at the granularity of one step: the base thought it was enforcing something, and by exposing the enforcement as a hook it handed subclasses the power to un-enforce it. The fix is to decide, per step, whether it is a variation point or an invariant, and to give invariants no overridable surface at all. PipelineGood performs the range check inline in the non-virtual run(), so no subclass can reach it, and exposes only transform() -- the part that is actually meant to differ. The mandatory behaviour is now structural: it runs for every subclass because there is no seam through which to remove it. The broader principle: the non-virtual skeleton should contain everything that must always happen, and the virtual steps should contain only what may legitimately vary; when those get mixed -- a required step left virtual, or (the previous chapter) the whole skeleton virtual -- subclasses gain the ability to break the base's contract. If subclasses genuinely need to EXTEND validation rather than replace it, the right shape is a fixed base check that always runs plus an optional hook for extra rules (validate the invariant in the skeleton, then call an overridable additionalChecks() that can only tighten, never loosen) -- so customisation adds constraints instead of removing them. The tell: a virtual step that performs a check, a cleanup, or a security-relevant action the base relies on, such that an override returning a permissive constant or an empty body disables a guarantee the base was supposed to make."
run: true
