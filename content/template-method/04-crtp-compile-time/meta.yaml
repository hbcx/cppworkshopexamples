title: "Compile-time Template Method with CRTP"
standard: "C++11"
difficulty: 3
summary: "When the varying step is fixed per type, the skeleton needs no virtual dispatch: make the base a template over its derived class (CRTP) and call the step through a static_cast resolved at compile time. The algorithm still lives once in the base and subclasses still supply only the steps, but the calls inline, so the pattern costs nothing."
notes: "The classic Template Method pays for its flexibility with a virtual call per step, which is usually negligible but not always -- a skeleton invoked in a tight loop, or a step the compiler could have inlined into surrounding work, both lose to the indirection. When the varying step is chosen by the TYPE and never needs to change at runtime, the Curiously Recurring Template Pattern removes that cost. The base is a template parameterised on its own derived class, Beverage<Tea>, so inside the skeleton static_cast<Derived&>(*this) yields the concrete type and self().brew() binds to Tea::brew at compile time -- no vtable, no virtual call, and the compiler can inline the step into prepare() as if you had written the whole recipe by hand. The structure of the pattern is intact: prepare() still owns the sequence in one place, boilWater and pourInCup are still the fixed base steps, and Tea and Coffee still provide only brew and addExtras; what changed is the dispatch mechanism, from runtime to compile time. This is the same runtime-versus-compile-time axis the Strategy chapter draws between a std::function strategy and a policy template -- CRTP is the Template Method point on it. The trade-offs are the mirror image of the virtual form and decide when to use which. CRTP wins on speed (no indirection, full inlining) and catches a missing step as a compile error rather than a pure-virtual-call at runtime. It loses on everything dynamic: Beverage<Tea> and Beverage<Coffee> are unrelated types with no common base, so you cannot hold them in one container, pass them through one non-template interface, or choose the concrete type from a value read at startup -- the choice is frozen when the template is instantiated. It also puts the algorithm in a header (templates are), lengthens compile times and error messages, and requires the steps be public (or the base be a friend) because the cast reaches them from outside the derived class's own scope. The rule of thumb: reach for CRTP on hot paths and library code where the type is known statically and uniform storage is not needed; keep the virtual Template Method when subclasses must be handled polymorphically through a base pointer or chosen at runtime. A safety note: the static_cast assumes Derived really is the derived type, which CRTP guarantees by construction as long as each class derives from Beverage of its own type -- deriving from Beverage<SomeOtherType> would cast to the wrong type, so that mistake is the one thing to watch."
run: true
