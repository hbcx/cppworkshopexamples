title: "Dependency Inversion Principle"
description: "The fifth SOLID principle: high-level modules should not depend on low-level modules -- both depend on abstractions, and abstractions do not depend on details. The point is the DIRECTION of the dependency and who owns the interface, which is what separates it from the dependency-injection mechanism. Shown as depending on an abstraction, letting the high-level module own the port, ports and adapters, and inverting a dependency to make policy testable -- alongside policy tied to a concrete, an abstraction owned or shaped by the detail, a leaky abstraction, a hidden concrete reached through a static, and the over-inversion of a stable dependency."
sort_order: 50
category: "Design principles"
