- problem: "A library with a public API and a pile of internal helpers, where the helpers must not leak into client code or clash with the client's own names, and must not become part of what the library promises to keep stable."
  why: "Putting the public interface in a named namespace and the helpers in a detail namespace or an unnamed namespace keeps the surface small and the internals private -- clients see only what you meant to expose, and two libraries with a Buffer or a Result do not collide. The alternative, everything at global scope with static sprinkled on the helpers, leaks type names, invites clashes, and blurs what is public."
  signal: "A header that declares helper functions and structs a client never needs, or free functions marked static in a header hoping to hide them, when a namespace would express the boundary directly."

- problem: "Shipping a new, incompatible version of a component while old code keeps calling the previous one -- a data format change, a redesigned class -- without breaking existing callers or forcing a flag-day rename."
  why: "An inline namespace makes the new version the default (mylib::thing resolves to v2) while the old one stays reachable as mylib::v1::thing, and because the version is part of the mangled symbol the two link independently -- old binaries keep working. Renaming everything or gating with macros breaks source compatibility or turns into a maintenance mess."
  signal: "Version suffixes hand-written into type and function names (Widget2, process_v3), or a build macro switching which definition compiles, where callers must be edited to move between versions."

- problem: "A generic algorithm or container that must work with user-defined types it has never heard of -- sorting them, swapping them, printing them, hashing them -- without the user editing the algorithm."
  why: "ADL is the plug: the user writes swap, operator<<, or begin in their type's own namespace, and generic code that calls them unqualified (with the using std::swap fallback) finds them automatically. Without it, every algorithm would need a traits parameter or a member-only protocol, and adding support for a type would mean touching the algorithm."
  signal: "A template that hard-codes std::swap or member .begin() and so cannot accept a type whose better operation lives as a free function, or a traits class bolted on to route around missing ADL."

- problem: "An application pulling in two third-party libraries that both define a Logger, a Result, or a json type, so the same unqualified name means two different things depending on context."
  why: "Keeping each library in its own namespace and qualifying (or aliasing) at the point of use makes the choice explicit and unambiguous. The alternative -- using namespace on both -- turns every shared name into an ambiguous call or, worse, a silent bind to the wrong one, and there is no compiler help distinguishing them after that."
  signal: "Two using namespace directives for different libraries at file scope, followed by compile errors on common names, or code that works until a second library is added and then quietly resolves a call to the wrong type."
