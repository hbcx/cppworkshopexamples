- problem: "Writing move constructors and move assignment for a type that owns a resource -- a pointer, a handle, a file descriptor -- where the source must be left empty so the resource is freed exactly once."
  why: "std::exchange(other.handle, null) steals the resource and clears the source in a single expression, so the two steps cannot drift apart and the moved-from object owns nothing. Writing the two assignments by hand is where the forgotten reset creeps in, and a forgotten reset is a double free. It also expresses reset-and-return-old cleanly outside moves -- swapping in a fresh state and acting on the previous one."
  signal: "A move constructor that assigns the pointer and then, separately, nulls the source -- or one that forgot the second line -- and getter-and-clear code written as a temporary plus two assignments."

- problem: "Index and size arithmetic that mixes a signed value with an unsigned one -- a loop counter against container.size(), a computed difference against a limit, a parsed number narrowed to a fixed-width field -- where the wrong answer is a silent out-of-bounds or a bad store."
  why: "std::cmp_less and its family compare by mathematical value, and std::in_range checks representability before a narrowing cast, so a negative or oversized value is handled instead of being converted to a huge unsigned and slipping through. Explicit casts to paper over the warning are noisy and still easy to get wrong; these helpers say what you mean and are checked."
  signal: "A -Wsign-compare warning silenced with a cast, a bounds check comparing a signed index directly to size(), or a narrowing assignment into a smaller integer type with no range check first."

- problem: "Calling into an API that has both a mutating and a read-only overload -- operator[], begin/end, an accessor -- from code that only reads, where accidentally selecting the mutating path does extra work or hands out a writable view."
  why: "std::as_const gives a const view at the call site, forcing the read-only overload without adding a separate const variable or a whole parallel const method. It is the difference between quietly detaching a copy-on-write buffer (or exposing a mutable handle) and just reading. Duplicating the API with explicit const accessors everywhere is the alternative, and it is pure boilerplate."
  signal: "A read-only loop over a non-const container that nonetheless selects the mutating begin, or code adding const-qualified duplicate methods only to force the read-only path a caller could request directly."

- problem: "A value type stored in a std::vector or other reallocating container, where growth performance and exception safety both depend on how the type's move behaves under relocation."
  why: "The library relocates with std::move_if_noexcept, which moves only when the move is noexcept and copies otherwise to keep the strong guarantee -- so marking your move constructor and move assignment noexcept is what lets the container actually move on every grow instead of copying. Leaving noexcept off silently turns each reallocation into a full copy, undoing the point of move semantics."
  signal: "A move constructor or move assignment that steals pointers but is not marked noexcept, or a profiler showing copies where moves were expected as a vector of your type grows."
