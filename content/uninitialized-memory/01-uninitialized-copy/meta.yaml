title: "Copy a range into raw storage"
standard: "C++11"
difficulty: 1
summary: "uninitialized_copy copy-constructs each element into raw, uninitialized slots -- the step std::copy cannot do because the destination objects do not exist yet."
notes: "The raw bytes from operator new hold no objects, so buf[i] = src[i] would assign to a std::string that was never constructed. uninitialized_copy runs the copy constructor in place instead, and you tear the range down by hand: a destructor per element, then operator delete for the bytes."
run: true
sanitizers: []
