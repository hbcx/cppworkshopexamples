# Related chapters -- cross-links shown at the bottom of the section page.
# Each entry: the slug of another section + a one-line note on why to go there.
- slug: "lists"
  note: "One of the containers a queue can wrap (deque by default, list yes, vector never), and where a general list picks up."
- slug: "vectors"
  note: "Why a std::vector can never back a queue: it has no pop_front, which is exactly what the FIFO adaptor needs."
- slug: "adapter"
  note: "The general pattern behind std::stack and std::queue: the Adapter design pattern presents one interface over another, of which these container adapters are the standard library's built-in case."
- slug: "heap-algorithms"
  note: "What std::priority_queue is made of: make_heap, push_heap and pop_heap are the binary-heap operations the adaptor runs internally, exposed so you can keep a heap over storage you also index or iterate -- go there for building and maintaining a heap by hand, and heapsort."
