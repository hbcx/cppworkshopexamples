# Real-world use cases for this section -- see .claude/skills/cpp-chapter (SKILL.md,
# "Real-world use cases"). Values are single-line and quoted, no inner quotes.
- problem: "A server accepts requests faster than it can serve them, and the business rule is that they are answered in the order they arrived. The accepting thread must never block on the work, so incoming requests are parked and handed to workers as they free up."
  why: "FIFO is the requirement here, not an implementation detail, and std::queue puts it in the type: there is no operator[] and no iteration, so no later change can quietly start serving the newest request first. Wrapped behind a mutex and a try_pop, it is also the smallest correct work queue you can write."
  signal: "A std::deque or std::vector used as a task buffer whose only operations are push_back and erase(begin()), or a hand-rolled queue exposing empty()/front()/pop() as three separately locked methods."

- problem: "A graph has to be explored so that the answer is the shortest one in hops: the fewest dependencies between two build targets, the fewest network links between two nodes, a flood fill over a grid. Nodes discovered along the way go into a pending set and are visited later."
  why: "Here the container IS the algorithm: taking pending nodes in arrival order makes the traversal breadth-first, which is what makes the first path found the shortest one. Swap in a stack and the code still compiles, still terminates and still finds a path -- just not the shortest, which is a wrong answer rather than a slow one, and nothing points at the container."
  signal: "A pending or frontier collection in a traversal that is read from the same end it is written to, or a search that is described as shortest path in the comment while the worklist is a vector with pop_back."

- problem: "A latency-sensitive path produces records that something slow has to consume: access logs, metrics, audit trail, telemetry. The request must not wait for the disk, the network or the lock the writer is holding."
  why: "A queue between the two is what decouples them: the producer appends and returns, a writer thread drains at its own pace, and a burst is absorbed as a longer queue instead of a slower request. Writing inline is the alternative, and it binds every request latency to the slowest sink in the system -- one degraded log target and the whole service is degraded."
  signal: "A file write, a network send or a database insert on a request-handling path whose result nobody uses, or a lock held on a hot path only to append to a shared buffer."

- problem: "An event loop -- a UI, a simulation, a state machine, a protocol implementation -- processes events in the order they occurred, and handling one event routinely produces more events that must be handled after everything already pending."
  why: "The queue keeps the arrival order across the whole loop, including the events a handler adds while the loop is running, which is what makes the behaviour reproducible and replayable from a recorded event log. Handling produced events immediately, by recursing into the handler instead, reorders them relative to the ones already waiting and puts an unbounded chain of handlers on the stack."
  signal: "A handler that calls another handler directly instead of posting an event, or an event buffer iterated with a range-for while the body appends to the same container."

- problem: "Work has to come out by urgency rather than arrival: a timer wheel firing due jobs, a discrete-event simulation, a scheduler where a paid tier outranks a free one. Jobs arrive continuously and each one carries a priority or a due time."
  why: "std::priority_queue keeps only the next item ordered rather than the whole set, so pushing and popping are logarithmic no matter how the arrivals interleave with the pops. Keeping a vector sorted instead means re-sorting or insert-shifting on every arrival, and the version that sorts once per tick is quietly O(n log n) per tick for one element."
  signal: "A container re-sorted every tick, every arrival or every poll, or a min_element scan over pending jobs to find the next one to run."
