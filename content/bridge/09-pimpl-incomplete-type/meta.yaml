title: "Anti-pattern: pimpl special members at an incomplete type"
standard: "C++11"
difficulty: 3
summary: "In a pimpl (a compile-firewall Bridge), letting the destructor or moves be implicit or defaulted in the header instantiates unique_ptr<Impl>'s deleter against a forward-declared Impl, and deleting an incomplete type is a hard compile error -- the special members must be declared in the header but defined where Impl is complete."
notes: "The pimpl idiom holds the implementation behind unique_ptr<Impl>, where Impl is only forward-declared in the header. That forward declaration is what buys the compile firewall, and it is also the trap. Destroying a unique_ptr<Impl> runs its deleter, and the default deleter contains a static_assert(sizeof(Impl) > 0) -- deleting an incomplete type is undefined, so the standard library refuses it at compile time. If you let the compiler generate Gadget's destructor (by not declaring one) or default it IN THE HEADER, that generated destructor is instantiated at every point a Gadget is destroyed -- and in the header, and in every translation unit that constructs or destroys one, Impl is still incomplete, so the build fails with an error about deleting an incomplete type. The same is true of a defaulted move constructor and move assignment, which also destroy the managed object. This example does not compile the broken form (a compile error cannot be shown running); it is described, and only the correct form is built. The fix is a fixed recipe: DECLARE the destructor -- and the move constructor and move assignment if the type is movable -- in the header, and DEFINE them (typically = default) in the .cpp AFTER the Impl struct is fully defined, where the deleter can see a complete type. Because declaring a destructor suppresses the implicit moves, a movable pimpl must declare all three. The confusing part is that the error points at unique_ptr internals and often appears far from the header, at a seemingly innocent line that merely lets a Gadget go out of scope. The tell: a class with a unique_ptr to a forward-declared type whose destructor is defaulted in the header, or not declared at all."
run: true
sanitizers: []
