# Related chapters -- cross-links shown at the bottom of the section page.
# Each entry: the slug of another section + a one-line note on why to go there.
- slug: "unique-ptr"
  note: "The single-owner default: reach for unique_ptr first and widen to shared_ptr only when ownership is genuinely shared, since the atomic reference count is not free."
- slug: "move-semantics"
  note: "Why moving a shared_ptr beats copying it: a move transfers the reference and skips the atomic increment and decrement that a copy pays."
- slug: "weak-ptr"
  note: "The non-owning companion, in depth: observe a shared object without keeping it alive -- lock() versus expired(), weak caches, back-pointers, and weak_from_this."
- slug: "proxy"
  note: "The design pattern it embodies: std::shared_ptr is a smart-reference proxy -- a stand-in that controls access to an object, here managing its lifetime by reference count -- see Proxy for the pattern in general (virtual, protection, remote, smart reference)."
- slug: "flyweight"
  note: "A real interning use: a Flyweight factory hands out shared_ptr to interned objects so many logical objects share few physical ones, and the reference count frees a flyweight when its last user is gone."
- slug: "memento"
  note: "Where sharing is the wrong default: a memento that copies a shared_ptr shares the buffer instead of snapshotting it, so an edit corrupts the saved state -- go there for the shallow-copy trap and why a snapshot needs its own deep copy, not a shared handle."
- slug: "raii"
  note: "The idiom shared_ptr automates for shared ownership: tie a resource to object lifetime so it is released without a manual call -- go there for the pattern itself and how to write your own single-owner guard."
- slug: "atomic-shared-ptr"
  note: "How to share the shared_ptr HANDLE itself between threads: the reference count is atomic but the handle is not, so concurrent load/store of one shared_ptr races -- go there for std::atomic<std::shared_ptr>, the read-mostly config hot-swap, and lock-free structures built on it."
