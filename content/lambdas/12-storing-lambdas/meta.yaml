title: "Storing lambdas: auto, template, or std::function"
standard: "C++11"
difficulty: 2
summary: "Every lambda has its own unique type, so how you store it matters. auto holds one exactly and a template parameter passes it with zero overhead; std::function erases the type so different lambdas share a variable or a container, paying an allocation and an indirect call."
notes: "A lambda's type is generated by the compiler and unnamable, which shapes storage into three choices. Hold a single lambda in auto -- it names the exact type, keeps the closure small, and calls directly. Pass a lambda to a function by making that function a TEMPLATE on the callable type, template <class F> ... (F f): the real type flows through, so the call can be inlined and there is no allocation -- this is the zero-overhead default for handing a lambda to an algorithm or helper. Use std::function when you need to erase the type: to store callables of DIFFERENT types together (a std::vector<std::function<int(int)>> of assorted lambdas, some capturing), to hold a callable as a class member whose type must be fixed, or to expose one across an ABI boundary. That flexibility costs a heap allocation for anything but the smallest closures and an indirect call through a type-erased wrapper, so it is the wrong default for merely passing a lambda along. The rule: auto to hold one, a template parameter to pass one, std::function only when heterogeneous storage or a fixed callable type is actually required. The reflex to type every callable parameter as std::function is a real performance anti-pattern, covered later; reach for it deliberately, not by habit."
run: true
