title: "Coroutines: when_all and when_any"
description: "Running independent coroutine tasks together instead of one after another, and joining their results. Built on the awaitable task from the previous section plus a tiny single-threaded event loop with a virtual clock, so the interleaving is real and fully deterministic -- Sleep parks a coroutine until a simulated time, and several parked tasks make progress at once on one thread. Covers the event loop itself, two tasks genuinely in flight at the same time, when_all (start N tasks, join when the last finishes, total time is the max not the sum), when_any (the first to finish wins and the losers are cancelled), exceptions surfacing through a combinator, and combinators nesting because they are just awaitables -- alongside the traps: awaiting independent tasks serially so their latencies add up, a when_any that forgets to cancel the losers, and a spawned task that captures a loop variable by reference. All task results are int to keep the focus on the combinator rather than heterogeneous-tuple machinery."
sort_order: 169
