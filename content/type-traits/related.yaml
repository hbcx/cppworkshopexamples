# Related chapters -- cross-links shown at the bottom of the section page.
# Each entry: the slug of another section + a one-line note on why to go there.
- slug: "strong-types"
  note: "Traits at work in a small design: an opt-in strong type uses traits and enable_if to decide which operators a wrapper exposes -- go there for a practical, self-contained use of the introspection toolkit."
- slug: "concepts"
  note: "What traits grew into: a concept is a named compile-time bool built from traits, put in the template signature and used to order overloads -- go there for named requirements, requires-expressions, and how the standard concepts wrap these traits."
- slug: "decltype-declval"
  note: "The other half of the metaprogramming toolkit: decltype and declval query a type's members and results by expression, and the void_t idiom detects a member, where traits ask fixed questions -- go there for type extraction, function traits, and member detection."
- slug: "tag-dispatch"
  note: "A place traits do their work: a trait produces the true_type or false_type that tag dispatch routes on to pick an overload at compile time -- go there for the technique that turns a trait's answer into a chosen implementation."
- slug: "variadic-templates"
  note: "Where traits are folded over a pack: an && fold of a trait constrains every element of a variadic template, and make_index_sequence drives pack expansion -- go there for parameter packs, fold expressions, and constraining a pack."
- slug: "template-basics"
  note: "The specialization traits are made of: the standard traits are primary templates plus partial specializations -- go there for the class-template specialization mechanism, plus function and class templates, deduction and dependent names."
- slug: "sfinae"
  note: "Where traits become a switch: enable_if turns a trait into an on/off condition on an overload, and void_t turns a decltype probe into a has-member trait -- go there for using these traits to select and constrain templates the pre-concepts way."
