title: "Anti-pattern: deprecated traits (is_pod, result_of)"
standard: "C++17"
difficulty: 3
summary: "std::is_pod bundles two independent properties under one vague name and is deprecated in C++20; ask the precise questions instead -- is_trivial and is_standard_layout, or is_trivially_copyable for the memcpy question. std::result_of is deprecated in C++17 and removed in C++20; use std::invoke_result."
notes: "A few older traits are deprecated because they answered the wrong question or bundled several. std::is_pod -- plain old data -- was a single trait meaning trivial AND standard-layout, but those are two INDEPENDENT properties, and code usually cares about only one: is the type trivial (default-constructible and copyable by a simple bit copy, so it can be uninitialised or memcpy-ed) or is it standard-layout (a predictable member order and no surprises, so it can be shared with C or mapped over a buffer). Bundling them under one name meant is_pod often over-asked, rejecting a type that was fine for the property actually needed. C++20 deprecates is_pod for this reason, and the fix is to ask the precise question: is_trivial, is_standard_layout, or -- for the common can I memcpy this case -- is_trivially_copyable, which is the exact predicate for a valid byte copy and does not require default-constructibility. The example (compiled as C++17, where is_pod is still available) shows is_pod next to the three sharper traits. The other classic is std::result_of, which computed a call's return type but with a clumsy F(Args...) function-type syntax; it was deprecated in C++17 and REMOVED in C++20, replaced by std::invoke_result<F, Args...> with the same job and a cleaner interface -- so result_of code does not even compile under C++20 and must be migrated. The lesson generalises: prefer the trait that names exactly the property you depend on over a broad bundled one, and when a trait is deprecated, its replacement is usually a more precise question, not a like-for-like rename."
run: true
sanitizers: []
