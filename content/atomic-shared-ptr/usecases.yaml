- problem: "A service holds a configuration object -- limits, feature flags, routing rules -- that every request thread reads on almost every request, and that is reloaded occasionally from a file or a control plane. Reads must be cheap and must never see a half-applied config."
  why: "std::atomic<std::shared_ptr<const Config>> lets each request load() a consistent snapshot with just a pointer copy and a refcount bump, while a reload builds a new immutable Config and store()s it, where a std::mutex around the config would serialise the hot read path for the sake of a rare write, and a plain shared_ptr shared between the threads is a data race on the handle."
  signal: "A global config or feature-flag object read on every request and swapped on reload, currently guarded by a reader/writer mutex taken on every read, or read locklessly through a plain shared_ptr that a reload thread also assigns."

- problem: "A network service publishes a lookup table to its worker threads -- a routing/forwarding table, a service-discovery map, a DNS cache -- that workers consult constantly and that a background thread rebuilds when the topology changes."
  why: "Publishing the table as std::atomic<std::shared_ptr<const Table>> gives workers wait-free-ish reads of a stable snapshot and lets the rebuilder swap in a whole new table atomically, where locking the table on every lookup throttles throughput and mutating it in place risks a worker reading a table mid-edit."
  signal: "A routing or lookup structure read on the packet/request fast path and periodically regenerated, protected by a lock held during every lookup, or updated in place while workers traverse it."

- problem: "A large read-only data structure -- a search index, a compiled ruleset, a scene graph, a price book -- is served to many reader threads while a background thread periodically rebuilds a fresh version from new inputs."
  why: "Double-buffering with std::atomic<std::shared_ptr<const T>> lets readers keep using the current version with zero coordination while the next is built off to the side and published with one store(), and the old version is freed automatically once its last reader finishes, where a mutex would block readers during the swap and manual double-buffering needs its own safe-reclamation scheme."
  signal: "A snapshot-and-rebuild structure with a foreground read path and a background build path, currently coordinated by a lock over the whole structure or by hand-rolled buffer flipping with manual lifetime tracking."

- problem: "A producer generates a stream of results where only the LATEST matters -- the newest camera frame, the most recent sensor reading, the current market snapshot -- and consumers should always grab whatever is current, with superseded values discarded."
  why: "std::atomic<std::shared_ptr<const Frame>> is a natural latest-value slot: the producer store()s each new frame, a consumer load()s the current one, and an old frame is destroyed as soon as the last consumer holding it is done, where a queue would pile up stale frames a consumer must drain, and a plain shared_ptr slot written by the producer and read by consumers is a race."
  signal: "A single-slot 'most recent value' handed between a producer and consumers, currently a plain shared_ptr written and read from different threads, or a one-element queue whose only purpose is to overwrite the previous item."

- problem: "You need a small lock-free data structure -- a stack, a free list, a singly linked list -- shared across threads, and the classic obstacle is reclaiming nodes safely: a thread must never free a node another is still reading."
  why: "Nodes held as std::atomic<std::shared_ptr<Node>> let compare_exchange do the atomic head update while the reference count guarantees a node is destroyed only after its last reader lets go, which also sidesteps the ABA problem, where a raw-pointer lock-free structure needs hazard pointers or epoch-based reclamation to be correct."
  signal: "A hand-written lock-free stack or list using raw atomic pointers, with a comment or a bug about use-after-free during node reclamation, or an ABA guard bolted on with tagged pointers."
