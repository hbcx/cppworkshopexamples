title: "std::atomic<std::shared_ptr>"
description: "The C++20 way to share a shared_ptr itself between threads. A plain std::shared_ptr has an atomic reference count -- so copying one across threads is safe -- but the handle object (its two pointers) is not atomic, so concurrent load and store of the SAME shared_ptr instance is a data race. std::atomic<std::shared_ptr<T>> makes the whole handle update atomically: load() hands back a safe owning snapshot, store() swaps in a new pointer, and old objects are freed by the reference count when the last reader drops them. Covers concurrent load/store, the read-mostly config hot-swap (an RCU-style publish), exchange to take-and-replace, how old versions free themselves by reference count, a lock-free stack push with compare_exchange, and why the specialization is not lock-free -- alongside the anti-patterns of getting it wrong: racing a plain shared_ptr, re-reading the atomic instead of taking one snapshot, the deprecated atomic_load/atomic_store free functions, mutating the pointed-to object as if that were synchronized, and using it where a mutex is the right tool. Concurrency examples run under ThreadSanitizer on Linux/CI."
sort_order: 105
category: "Concurrency"
