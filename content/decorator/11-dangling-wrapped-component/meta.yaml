title: "Anti-pattern: a decorator that dangles on its component"
standard: "C++14"
difficulty: 3
summary: "A decorator that holds the wrapped component by reference is safe only while some outside owner keeps it alive; build the chain from a local or a temporary, or return it from a factory, and the reference outlives the component and dangles."
notes: "A decorator has to keep the component it wraps alive for at least as long as it is used, because every call forwards into it. Holding that component by reference pushes the lifetime responsibility onto some unnamed outside owner, and Decorator chains are exactly where that goes wrong: they are usually assembled in a factory or a composition root from locals and temporaries, and a reference-holding decorator returned from such a function points at a component that was destroyed when the function returned. The BorderBad here works in main only because the Button it wraps is a local that outlives it in the same scope; move that construction into a factory (the commented makeBad) and the returned decorator holds a dangling reference -- undefined behaviour, which is why that path is described rather than run. The fix mirrors the owning object adapter: the decorator OWNS its wrapped component through std::unique_ptr, so a chain is a chain of ownership and stays valid for as long as the outermost handle lives, letting makeGood build and return it safely. Reference-holding decorators are not always wrong -- when the component provably outlives the decorator (a member wrapping another member, a short-lived local wrapper) they avoid an allocation -- but they must not escape that scope. The default for anything built by a factory or stored past the current statement is to own the wrapped component, not reference it. The tell: a decorator with a T& or const T& member, constructed from a local or temporary whose lifetime is shorter than the decorator's."
run: true
