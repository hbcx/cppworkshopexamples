title: "Anti-pattern: feature flags instead of decorators"
standard: "C++14"
difficulty: 3
summary: "Bolting every optional feature onto one class as a constructor bool with a matching if in the render method is the god-object Decorator exists to replace: it breaks open/closed, lets untested flag combinations interact, and cannot be extended by a caller the author did not anticipate."
notes: "This is the design Decorator was meant to prevent, seen from the wrong side. ReportBad carries a bool per optional feature -- header, footer, border -- and render() grows an if for each. It works, and for two or three flags it even looks reasonable, which is why it spreads. The costs arrive later. It breaks the open/closed principle: every new option edits this class and its central method, so the one place most likely to have a bug is the one place everyone keeps touching. The flags form a combinatorial space no one fully tests -- header with border but no footer, all three, none -- and interactions hide there. And it is closed to extension: a caller who wants a new decoration cannot add one without modifying the class, whereas the whole point of Decorator is that new behaviour is a new class the existing code never sees. The fix is to make each option a decorator over a small Component: Header, Footer, and so on, each added only when wanted and composable in any order. The two versions here produce identical output, which is the point -- the behaviour is the same, but the decorator version adds features by adding classes, not by editing a method and threading another bool through a constructor. The sign in real code: a constructor with a row of bool or enum flags, and a method that is one long chain of if (flag) blocks."
run: true
