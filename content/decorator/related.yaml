- slug: "adapter"
  note: "The other wrapping pattern, and the sharpest contrast: Adapter changes an object's interface so incompatible code fits, where Decorator keeps the interface identical and only layers behaviour on -- read it to see the two wrappers side by side."
- slug: "dependency-injection"
  note: "How a decorated object reaches the app: build the chain at the composition root and inject it behind the Component interface, so consumers get the wrapped object -- caching, logging, retry -- without knowing it is wrapped."
- slug: "abstract-factory"
  note: "When the stack to apply is chosen from a set of options, a factory can assemble the right decorator chain, so the client asks for a configured component and receives it already wrapped in the correct order."
- slug: "facade"
  note: "The other structural wrapper, by intent: where Decorator keeps a component's interface and layers behaviour on one object, Facade presents a new, smaller interface over a whole subsystem and adds only orchestration -- go there when the goal is to hide complexity, not add responsibilities."
- slug: "proxy"
  note: "The transparent twin: Proxy shares Decorator's wrap-and-forward shape but stays transparent and controls access to the subject -- lazy loading, permissions, remote stubs, caching -- instead of adding behaviour to the result; go there when the goal is to govern access, not enrich it."
- slug: "composite"
  note: "The many-child generalisation: where a Decorator wraps exactly one component, a Composite branches into a tree of children treated uniformly -- go there for part-whole hierarchies like filesystems, scene graphs, and expression trees."
- slug: "chain-of-responsibility"
  note: "The behavioural relative with the same wrap-and-forward shape: a middleware pipeline is a chain of handlers each wrapping the next, but one can STOP the request instead of always enriching and forwarding it -- go there for routing and short-circuiting rather than layering behaviour."
