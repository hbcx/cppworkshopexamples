# Related chapters -- cross-links shown at the bottom of the section page.
- slug: "strong-types"
  note: "Where operator overloading becomes a design: a strong type wraps one value and exposes only the operators that make sense for it, often through CRTP mixins so a whole family of wrappers shares them. Go there for opt-in operators and the type-safety they buy."
- slug: "rule-of-0-3-5"
  note: "The special assignment operators this section only touches: copy and move operator= are part of the five special members, and the safest count to write is zero. Go there for when to define, default, or delete them and why copy-and-swap is the clean way."
- slug: "iterator"
  note: "Operator overloading put to work: a custom iterator is mostly *, ++, -> and == so it plugs into range-for and the algorithms. Go there for the full iterator idiom and the category tags the library expects."
- slug: "const-correctness"
  note: "Why several operators come in const and non-const pairs, and must be const to be useful: a const object needs a const operator[] and a const == to be read or compared. Go there for const member functions and the const-overload pattern."
