title: "Operator overloading"
description: "Giving your own type the built-in operator syntax -- so a value type reads like int, an iterator like a pointer, a functor like a function. Covers the canonical arithmetic pair (compound assignment as a member, the binary operator as a free function returning by value), the classic comparison operators before C++20, stream insertion as a free friend, the const and non-const subscript pair, the call operator that makes a stateful function object, prefix versus postfix increment with its dummy int, the dereference and arrow operators of a pointer-like type, explicit conversion operators, and the rule for which operators should be members and which free -- alongside the traps: overloading && || or the comma and losing their special evaluation, an operator+ that mutates or returns a reference, the wrong return category on ++, an operator= that does not return itself, a non-explicit operator bool, a non-const or member-only comparison, an operator given a surprising meaning, and operator<< written as a member. Overload for the syntax users already know; never to be clever."
sort_order: 134
category: "Language & object model"
