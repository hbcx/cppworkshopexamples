# Related chapters -- cross-links shown at the bottom of the section page.
- slug: "thread"
  note: "Where the threads that contend for these mutexes come from: how you start, join, and detach a std::thread, and the anti-patterns of doing it wrong -- go there for launching the work, then come back here for how those threads share data safely."
- slug: "atomic"
  note: "The lighter-weight alternative when the shared state is a single word: an atomic counter or flag needs no lock and never blocks, so reach for it instead of a mutex when one variable is all you are guarding -- go there for atomics, compare_exchange, and memory ordering, and use a mutex when the invariant is bigger than one word."
- slug: "execution-policies"
  note: "The higher level where these same rules apply: a parallel algorithm under std::execution::par runs its callable on many threads, so any shared state it touches still needs a mutex or an atomic -- go there for the parallel algorithms and the data-race hazards a captured accumulator creates under par."
- slug: "condition-variable"
  note: "How a thread WAITS on mutex-guarded state instead of polling it: a condition variable pairs with the mutex so a thread can sleep until the data satisfies a predicate -- go there for wait/notify, the producer/consumer queue, and graceful shutdown built on top of a mutex."
- slug: "future"
  note: "The higher-level way to move ONE result across threads without locking it yourself: std::async and std::promise hand a value (or an exception) to a waiter through a future that does the synchronization for you -- go there for async, promise, packaged_task, and shared_future, and keep a mutex for ongoing shared state rather than a single handoff."
- slug: "semaphore"
  note: "The counting cousin of a mutex, and the tool a semaphore is often wrongly used as instead: a mutex caps a region at ONE holder, while a std::counting_semaphore lets up to N in at once (a pool, a rate limit) and has no owner -- go there for capping concurrency, cross-thread signals, and why a semaphore is not a lock."
- slug: "atomic-ref"
  note: "The lock-free option when the shared state is a single object, not a multi-field invariant: a mutex serializes a whole critical section, while std::atomic_ref makes one plain int or field's updates indivisible with no blocking -- go there when you are guarding one value and can drop the lock, and keep the mutex when several variables must stay consistent together."
- slug: "atomic-shared-ptr"
  note: "The lock-free way to publish a whole object to read-mostly threads: instead of locking a shared object on every read, hand out an immutable snapshot through std::atomic<std::shared_ptr> and swap in a new one to update -- go there for the config hot-swap, and keep the mutex for write-heavy or multi-field state it cannot express."
