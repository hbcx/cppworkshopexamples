title: "Anti-pattern: Visitor when the types change often"
standard: "C++11"
difficulty: 3
summary: "Visitor makes adding operations easy and adding types hard: every new element type forces a new visit method in every visitor. So when the element types are what keep changing, Visitor fights you -- adding a shape edits every visitor. The arrangement that fits a growing type set is plain virtual methods: each operation is a virtual, and a new type is one class that implements them, touching no existing code."
notes: "This is the expression problem turned into a design decision, and getting the decision backwards is a real and costly anti-pattern. The expression problem observes that code varies along two axes -- the set of TYPES and the set of OPERATIONS -- and that mainstream languages let you make exactly one axis cheap to extend at the cost of the other. Visitor chooses to make OPERATIONS cheap: a new operation is a new visitor, no element changes (examples 01-02). The unavoidable flip side is that TYPES become expensive: the visitor interface enumerates every element type, so adding one forces a new visit method into every visitor that exists, breaking them all until updated. Plain virtual methods make the opposite choice: each operation is a virtual on the base, so adding a TYPE is one new class that implements the operations and touches nothing else -- exactly what this file shows, where Triangle is added with zero edits to Circle, Square, or any operation -- while adding an OPERATION is expensive, because it means a new virtual method added to the base and implemented in every existing type. Neither is better in the abstract; they are opposite trade-offs, and choosing correctly means predicting which axis actually churns in your problem. Use Visitor when the element types are a stable, closed set and you keep inventing operations over them -- an AST whose node kinds rarely change but whose passes multiply, a fixed set of shapes with an ever-growing list of things to compute. Use plain virtual methods (or, for value types, a variant with functions) when the operations are relatively fixed but the type set keeps growing -- a plugin system where third parties add new element kinds, a domain where new document-node types appear regularly. The anti-pattern is picking Visitor for the latter: you get the ceremony of double dispatch AND a design where the thing you do most often (add a type) is the thing the pattern made hardest, so every new type edits a pile of visitor classes and a forgotten update silently misbehaves. The sign that you chose wrong: you find yourself adding element types far more often than operations, and each new type means touching every visitor -- at which point the fix is to flip the arrangement, moving the operations back onto the elements as virtual methods so a new type is self-contained. A note on the modern form: std::variant + std::visit is still Visitor's trade-off (the variant's alternative list is closed, so adding a type edits the variant and every visit site), so it does not escape the expression problem -- it just makes the closed-set case pleasant and compile-checked."
run: true
