title: "Anti-pattern: a visitor for a single type"
standard: "C++11"
difficulty: 3
summary: "Visitor pays off when several operations range over several element types; for one element type with one operation, the whole apparatus -- a visitor base, an accept method, a concrete visitor -- is machinery around what a plain virtual method does directly. A member function computing a circle's area is shorter and clearer than wrapping it in a visitor."
notes: "Visitor is a heavyweight pattern -- a visitor interface, an accept method in every element, a concrete class per operation, and the double-dispatch indirection -- and it earns that weight only when there is a genuine two-dimensional problem: multiple OPERATIONS over multiple element TYPES, with the operations being the axis that keeps growing. Strip away either dimension and the machinery has nothing to buy. With one element type there is nothing to dispatch on -- the accept and the visit overload set collapse to a single path -- and with one operation there is no benefit in making it a separate object. The bad version here has both degeneracies at once: one shape, one operation, wrapped in the full scaffolding, so a circle's area takes a Visitor base, a Shape base, an accept, and an AreaVisitor to express what CircleGood::area() says in a line. The reader also pays a comprehension tax: seeing a Visitor, they reasonably expect a family of element types and a growing set of operations, and finding one of each, they have to work out that the structure promises an extensibility that is not present. This is the same YAGNI judgment the Strategy chapter makes about a strategy for one algorithm and the Mediator chapter about a mediator for two objects -- build the indirection when the variation that justifies it exists, not before. The honest boundary is about anticipating growth. If you have one operation today but genuinely expect several more over a stable set of types, introducing Visitor early is defensible, because the refactor from scattered methods to visitors touches every element and is nicer to do up front. But 'we might add operations someday' is not that -- it is the speculative generality YAGNI warns against, and the refactor from a virtual method to a visitor, when a real second operation appears, is small and safe. For a single operation over several types, a plain virtual method per type is the right tool (each type implements area()); for several operations over a single type, they are just methods on that one class; Visitor is specifically for the multiplication of the two. The tell: a Visitor whose interface has one visit method, or a hierarchy with a single concrete element, or a visitor family with exactly one concrete visitor and no second operation in sight -- any of which means the second dimension the pattern exists to manage is not actually there."
