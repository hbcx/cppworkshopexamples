title: "Adding operations without touching the elements"
standard: "C++11"
difficulty: 2
summary: "Visitor's payoff: the shape classes are unchanged from the basics example, and adding a second operation (perimeter) on top of the first (area) is a new visitor class, editing no shape -- each operation is an object, so adding one adds a class. The mirror cost, that adding a shape type forces every visitor to gain a method, is the expression problem."
notes: "This example exists to show the exact benefit Visitor is chosen for, and its exact cost, because the two are inseparable and picking Visitor means accepting both. The benefit: operations are open for extension. The Circle and Square here are byte-for-byte the same as in the basics example, and yet the program now computes perimeters as well as areas -- because PerimeterVisitor is a new class that the shapes know nothing about. Adding a third operation (a renderer, a serializer, a bounding-box computer) is likewise a new visitor and zero changes to the element hierarchy. If your elements are a stable, closed set of types and you keep inventing new things to DO with them, this is exactly the shape of code you want: each operation lives in one cohesive place (one visitor, all its per-type logic together) instead of being scattered as one method smeared across every element class. The cost is the same fact viewed along the other axis, and it has a name: the expression problem. The ShapeVisitor interface enumerates the element types -- one pure visit per concrete shape -- so the set of element types is hard-coded into the visitor contract. Add a Triangle, and ShapeVisitor grows a visit(const Triangle&), which makes it pure-virtual-incomplete, which breaks EVERY existing visitor until each implements the new method. Adding a type is cheap in a plain virtual-method design (a new class, and every operation comes along as an override) and expensive here; adding an operation is expensive there (edit every class) and cheap here. No single arrangement makes both cheap in a language like C++ without extra machinery, so you choose based on which axis actually changes: Visitor when operations proliferate over stable types, plain virtual methods when types proliferate under stable operations. This is the central design judgment of the pattern, and choosing Visitor when the TYPES are what keep changing is a genuine anti-pattern covered later. Two practical notes. Because each visitor gathers all its per-type logic in one class, cross-cutting operations (a pretty-printer that must format every node type consistently) read far better as a visitor than as a method-per-class. And a visitor can carry state across the elements it visits (a running total, an output buffer), accumulating a result over a whole structure -- which the expression-tree example uses. The tell that you are on Visitor's good side: you are adding operations far more often than element types, and each new operation currently means touching every element class."
run: true
