title: "Anti-pattern: a generic catch-all in std::visit"
standard: "C++17"
difficulty: 3
summary: "std::visit's best property is compile-time exhaustiveness: an overload set that misses an alternative does not compile. A generic [](const auto&) catch-all throws that away -- it matches every type, so the set is always complete, and a new alternative you meant to handle specifically is silently absorbed with default behaviour. Use an explicit lambda per alternative."
notes: "The reason to prefer std::variant + std::visit over a hand-rolled union or a type-switch is that the compiler guarantees you handled every case: std::visit requires the callable to be invocable for every alternative of the variant, so if the overload set is missing one, the program does not compile, and the missing case is caught at build time. That guarantee is worth protecting, and a generic catch-all silently destroys it. A [](const auto&) lambda is a template that matches ANY type, so an overload set containing it is invocable for every alternative by construction -- the exhaustiveness check can never fail, because the catch-all always matches. The bad version here handles Circle specifically and routes everything else through the auto lambda, so Square and Triangle -- which the author may well have intended to handle properly -- are silently given the -1.0 default. Worse is what happens on change: add a fourth alternative to the variant, and the explicit version would fail to compile until you add its lambda (the compiler pointing you at the new case), but the catch-all version compiles unchanged and silently absorbs the new type, turning a compile error into a runtime surprise. That is the same silent-default failure as the type-switch's fall-through and the visitor's do-nothing default, reappearing in the modern form. The fix is to write an explicit lambda per alternative, as the good version does, so the overload set names every type and a missing one is a compile error again -- restoring exactly the exhaustiveness that made std::visit attractive. The honest exceptions, because catch-alls are not always wrong: a generic lambda is fine when you genuinely want uniform handling of MANY alternatives (a to-string that calls the same formatting on every type, where writing them out would be pure repetition), or as a deliberate, documented default for a variant whose alternatives you truly do not all care about. The anti-pattern is the catch-all used to avoid writing the cases, or left in place as the variant grows, so that new alternatives you would want to handle specifically slip through silently. A stronger technique when you want a default AND a warning about new types is to make the catch-all a hard error for unexpected types -- a static_assert on a dependent false in a catch-all template, or `[](auto) { static_assert(sizeof(T)==0 ...); }` patterns -- so an unhandled alternative fails to compile rather than defaulting; but the simplest and clearest default is just to enumerate the alternatives. The tell: a std::visit (or overloaded set) containing a [](const auto&) or [](...) arm that exists to cover the alternatives you did not write explicitly, especially over a variant that is likely to gain alternatives later."
run: true
