title: "The modern Visitor: std::variant and std::visit"
standard: "C++17"
difficulty: 2
summary: "When the element types are a closed, known set, std::variant holds one of them and std::visit dispatches on whichever it holds -- no base class, no accept, no virtual; the visitor is an overload set of lambdas (the overloaded idiom), one per alternative, and its exhaustiveness is checked at compile time so leaving out an alternative does not compile."
notes: "The classic Visitor pays a lot of boilerplate for double dispatch -- a visitor base with a pure visit per type, an accept in every element, an inheritance hierarchy -- and modern C++ offers a lighter form that gets the same two-type dispatch from the standard library. std::variant<Circle, Square, Triangle> is a type-safe union: a value that is exactly one of the listed alternatives at a time. std::visit takes a callable and a variant and invokes the callable with the alternative currently held, which IS the double dispatch -- std::visit resolves the held type and calls the matching overload -- with no accept methods and no base class to write. The callable is usually an overload set of lambdas, one per alternative, and the overloaded idiom builds it: a small struct that inherits from a pack of lambdas and pulls in all their operator() with a using-declaration, plus a deduction guide so overloaded{...} deduces its template arguments (the guide is required in C++17 and became unnecessary in C++20's aggregate CTAD). The result reads as a visitor written inline at the call site. Beyond less code, this form has two real advantages over the classic one. It needs no inheritance, so the element types can be plain structs (or even unrelated existing types), which is why it fits closed sets of value-like alternatives -- AST nodes, protocol messages, state-machine events, parse results -- that you would not want to force into a class hierarchy. And its exhaustiveness is checked at COMPILE TIME: std::visit requires the callable to handle every alternative, so if you add a fourth shape to the variant and forget to add a lambda for it, the overload set is incomplete and the code fails to compile -- the missing case is caught by the build, not discovered at runtime. That safety is the modern form's best feature, and it is exactly what the catch-all anti-pattern throws away by adding a generic [](auto&) that silently absorbs every unhandled type. The trade-offs against the classic form follow from variant being CLOSED. A std::variant fixes its alternatives at the type level, so third parties cannot add a new element type from outside the way they can derive a new class -- which is a feature when you WANT a sealed set (exhaustiveness depends on it) and a limitation when the type set must be open to extension. Recursive structures need std::variant to hold indirection (a variant cannot contain itself by value; an expression tree stores children behind a pointer or a recursive-wrapper), which the class-based form gets naturally through base pointers. And very large variants can bloat compile times. The rule of thumb: prefer std::variant + std::visit when the element set is closed and value-like and you want compile-checked exhaustiveness; keep the class-based Visitor when elements are a polymorphic hierarchy, must be open to outside extension, or are already objects with identity. The sign that this form fits: a fixed, known set of alternatives you dispatch on, where a sealed union with compile-time exhaustiveness beats an open class hierarchy."
