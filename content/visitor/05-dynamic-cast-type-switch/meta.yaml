title: "Anti-pattern: a dynamic_cast type-switch"
standard: "C++11"
difficulty: 3
summary: "The design Visitor replaces: an operation over a class hierarchy written as a cascade of dynamic_cast tests. It works, but the type list is duplicated in every such operation, a forgotten type falls through to a silent default, and adding a type means finding every cascade -- double dispatch does the type selection once, in accept, and the compiler makes each visitor list every type."
notes: "When you need to do something different for each concrete type in a hierarchy and you have not reached for Visitor, the code you write instead is almost always a dynamic_cast cascade: try to cast to Circle, then to Square, and act on whichever succeeds. areaBad is that pattern, and it is worth understanding exactly why it degrades, because it is the most common thing Visitor is brought in to fix. The type list -- Circle, Square, and whatever else -- is hard-coded into this one function, and it will be hard-coded again into the next operation (perimeter, render, serialize), so the knowledge of what types exist is duplicated across every operation rather than stated once. A forgotten or newly-added type does not fail loudly; it falls through the cascade to the default return of 0, a wrong answer with no error, so adding a Triangle silently produces zero areas until someone notices. And the dynamic_casts themselves are a runtime type query the design should not need -- each is a small cost and, more importantly, a code smell signalling that single dispatch is being simulated by hand. Visitor fixes all of this by doing the type selection ONCE, structurally. The element's virtual accept selects the concrete type a single time, and from then on the visitor's visit overloads are chosen by the compiler, not by runtime casts -- so AreaVisitor has no dynamic_cast, no default-zero fall-through, and its per-type logic is gathered in one class. Crucially, because ShapeVisitor declares a pure visit per type, the COMPILER enforces that every visitor handles every type: forget one and the visitor is abstract and will not build, turning the silent-zero bug into a compile error. That compile-time exhaustiveness is the real upgrade over the cascade, and the std::variant form gives the same guarantee for closed sets. The honest boundary: a single dynamic_cast for one special case, or a short cascade over two types that will never grow, is fine and simpler than the whole Visitor setup -- do not build double dispatch to test one type once. The anti-pattern is the cascade that recurs across many operations, or grows with the type hierarchy, silently defaulting on the cases it forgets. The sign: dynamic_cast (or typeid, or a downcast switch) used to pick behaviour by concrete type, especially the same type list appearing in more than one operation, or a default branch that quietly handles the types you did not enumerate."
run: true
