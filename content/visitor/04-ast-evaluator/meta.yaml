title: "An expression-tree evaluator"
standard: "C++11"
difficulty: 3
summary: "The canonical Visitor use: a tree of node types (Number, Add, Mul) walked by different operations -- a Printer that renders it and an Evaluator that computes its value -- both added without changing the nodes; the visitors recurse by calling accept on children, and because visit returns void the Evaluator carries its result in a member."
notes: "This is Visitor doing the job it was practically invented for: multiple operations over the nodes of a tree, which is the shape of every compiler and interpreter. An arithmetic expression is a small AST of three node types, and two operations walk it -- Printer turns the tree back into text, Evaluator computes its numeric value -- each a visitor, each added without touching Number, Add, or Mul. Adding a type-checker, an optimizer, or a compiler-to-bytecode would be three more visitors and still no change to the nodes, which is exactly why real language tools structure their passes as visitors over a shared AST: the node types are a stable, closed set, and the operations (passes) are what keep multiplying -- Visitor's good side of the expression problem. Two mechanics that the flat-shape examples did not show appear here. First, recursion: the structure is a tree, so a visitor processes a compound node by calling accept on its children, threading itself (or a fresh instance) down the tree -- Printer passes *this to its children to keep formatting in one traversal, while Evaluator spins up sub-evaluators for the operands and combines their results. Both are valid; the choice depends on whether the operation accumulates in place or composes from child results. Second, returning a value: the visit methods return void (the classic Visitor signature, because a single visit interface cannot return a different type per operation), so an operation that computes a value stores it -- Evaluator keeps result_ in a member and reads it after the traversal. That member-state approach is the traditional workaround and it works, but it makes the visitor stateful and single-use per subtree, which is a real awkwardness of the pattern; alternatives are a visitor templated on its return type, or the std::visit form where the callable simply returns a value and std::visit yields it (no member needed), which is one reason the variant form is pleasant for evaluators. This example also sets up the next chapter: an expression tree with an evaluator is one step from Interpreter, which formalises representing a little language as a class per grammar rule and interpreting it -- Visitor is a common way to structure the interpreting pass. Ownership note: compound nodes own their children through unique_ptr, so the whole tree frees when its root does, and the visitors take const references and never own anything. The tell that Visitor fits a structure like this: a recursive or heterogeneous node structure over which you run several distinct passes, where each pass wants its per-node logic gathered in one place."
