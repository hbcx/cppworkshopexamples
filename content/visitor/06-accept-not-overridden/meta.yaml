title: "Anti-pattern: an element that does not override accept"
standard: "C++11"
difficulty: 3
summary: "Double dispatch works only because each element overrides accept, so *this there has the concrete type and the right visit overload is chosen; an element that inherits a base accept makes *this the base type and dispatch lands on the wrong handler -- even when a correct visit overload exists. Make accept pure virtual so forgetting it will not compile."
notes: "Visitor's double dispatch is a two-link chain, and this anti-pattern breaks the first link. The whole trick is that accept, being overridden in each concrete element, runs in a context where *this is statically that element's type, so v.visit(*this) resolves to the visit overload for that type. Remove the override -- let an element inherit accept from the base -- and the context changes: inside Shape::accept, *this is a Shape, so the call resolves to whatever the base was written to call, not the element's own visit. Wedge shows it: it forgets to override accept, so Shape::accept runs and routes it to visitUnknown, even though ShapeVisitor has a perfectly good visit(const Wedge&) that would have handled it correctly. Circle, which does override accept, dispatches right. The bug is quiet because everything compiles and the visitor even has the correct handler -- it is simply never reached, so the symptom is 'the visitor ignores this element type' with no error to point at. What makes this insidious is that it usually appears when a type is ADDED. Someone writes a new element, remembers the parts the compiler forces (it must be a Shape, it must implement the pure virtuals it inherits), and forgets accept -- because a base-class accept let it compile without one. The base's convenience accept, meant to save boilerplate, is exactly what hides the omission. The robust fix is to give the base NO default accept: declare it pure virtual (virtual void accept(ShapeVisitor&) const = 0;). Then an element without its own accept is abstract and cannot be instantiated, so the forgotten override becomes a compile error at the point the new type is defined -- the mistake is caught the moment it is made, not discovered later as a mis-dispatch. This is the same lesson as the missing-visit anti-pattern from the other side: prefer pure virtuals that force every required override over convenience defaults that let omissions slip through silently. A subtle point on why accept cannot simply live in the base once and for all: it is a one-line, identical-looking method in every element (v.visit(*this)), which tempts hoisting it up, but it MUST be re-declared per class precisely so that *this carries the concrete static type in each -- the apparent duplication is load-bearing, not accidental. The tell: an element type with no accept override relying on a non-pure base accept, so it dispatches to a default or base handler; or, generally, a base accept that is not pure virtual, which is the door through which the omission enters."
run: true
