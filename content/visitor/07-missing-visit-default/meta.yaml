title: "Anti-pattern: a do-nothing default visit"
standard: "C++11"
difficulty: 3
summary: "If the visitor base gives visit a non-pure default (an empty body), a concrete visitor that forgets to handle a type inherits that default and silently ignores the type; adding a Triangle and forgetting it in one visitor produces no error and no output. A pure virtual visit per type forces every visitor to handle every type, so a forgotten one is a compile error."
notes: "This is the missing-override anti-pattern's counterpart on the visitor side, and both come from the same choice: convenience defaults versus enforced completeness. Here the temptation is to give the visitor base a default implementation of each visit -- an empty body -- so that a visitor which only cares about a couple of element types can skip the rest. BArea does exactly that, handling circles and squares and inheriting the empty default for triangles, so triangles are silently ignored: no error, no output, just an operation that quietly does nothing for a whole element type. The failure mode is the same silent one the type-switch anti-pattern's default-zero produces, and it bites hardest when a type is ADDED. Add a Triangle to the hierarchy and the visitor interface, and every visitor that was written before Triangle existed now inherits the empty default for it -- so every existing operation silently skips triangles, and nothing tells you until output is wrong. The whole point of Visitor's compile-time structure is thrown away by that default. The fix is to make visit PURE virtual, one per element type, as GVisitor does. Now a visitor is abstract until it implements every visit, so GArea must handle circles, squares AND triangles or it will not compile -- and when Triangle is later added to the interface, every existing visitor stops compiling until it is updated, which is exactly what you want: the compiler hands you the list of operations that need to consider the new type, rather than letting them silently ignore it. Compile-time exhaustiveness is Visitor's best safety property, and a non-pure default is precisely how you lose it. The std::variant form gives the same guarantee differently: std::visit requires the callable to handle every alternative, so a missing case fails to compile there too -- unless you add a generic catch-all, which is that form's version of this same mistake (the next-but-one anti-pattern). The honest exception: a default is legitimate when a base visitor genuinely provides a meaningful default behaviour that most visitors should inherit -- for example a traversal base whose default visit recurses into children, so a concrete visitor overrides only the node types it cares about and correctly ignores the rest by design. The anti-pattern is a default that means 'do nothing' used to avoid writing handlers, so forgetting a type is indistinguishable from deliberately ignoring it. When 'ignore this type' is a real choice, make it explicit (an override with an empty body and a comment) rather than inheriting silence. The tell: a visitor base whose visit methods have empty (or trivial) default bodies purely so subclasses can omit cases, such that adding an element type silently changes the behaviour of every existing visitor."
run: true
