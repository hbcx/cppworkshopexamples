title: "Anti-pattern: elements exposing internals for visitors"
standard: "C++11"
difficulty: 3
summary: "A visitor works on an element from the outside, so it needs some access to the element's data; the trap is letting that need drive the element to publish its internal representation as raw public fields, so visitors read the storage directly and every visitor couples to how the element stores state -- expose a minimal, stable query instead, so the representation stays private."
notes: "Visitor has a known downside the Gang of Four themselves flag: because operations live outside the elements, the elements must expose enough of their state for the visitors to work, and this pressure tends to weaken encapsulation. This anti-pattern is the weakened end state -- elements that publish their internal representation as public fields so any visitor can reach in and read the storage. TemperatureBad exposes celsius directly, and toFahrenheitBad reads it, which works but couples the operation to the fact that the temperature is stored in Celsius. If the class later stores Kelvin or Fahrenheit internally for accuracy or interop, every visitor that read celsius breaks, because they depended on the representation rather than on a stable interface. The fix is not to hide everything -- a visitor genuinely needs some access -- but to expose the MINIMUM the operations need, and to expose it as a stable query rather than a raw field. TemperatureGood keeps celsius_ private and offers a celsius() accessor, so visitors depend on the query, the representation is free to change behind it (celsius() can convert from whatever is stored), and the encapsulation the class wants is preserved. The distinction is representation versus interface: publishing a field commits you to that field forever because callers read it directly; publishing a query commits you only to the query's meaning, and how you compute it stays yours. Getting this right is the difference between Visitor being a clean extension mechanism and Visitor being a reason your objects are empty bags of public data. Two deeper points. First, the tension is real and sometimes Visitor is the wrong tool BECAUSE of it: if an operation needs deep, wide access to an element's guts, that operation may belong as a method ON the element (where it has legitimate private access) rather than as an external visitor forcing the guts open -- the choice between a visitor and a method is partly a question of how much internal access the operation needs. Second, a middle path is a narrow abstract interface the element implements for visitors -- a handful of stable accessors -- which gives visitors what they need without exposing fields, at the cost of designing that interface. The judgment: expose stable queries sized to what the operations actually require, and if the required access keeps growing toward 'everything', reconsider whether the operation should be a visitor at all. The sign: element classes that turn into public-field structs, or grow a getter for every private member, specifically so that external visitors can compute over them -- encapsulation sacrificed to feed the pattern."
