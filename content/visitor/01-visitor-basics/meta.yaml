title: "Visitor basics: double dispatch"
standard: "C++11"
difficulty: 1
summary: "An operation on a family of element types is packaged as a visitor object; each element's accept(visitor) calls visitor.visit(*this), and because *this has the concrete element type there, the right visit overload is chosen -- so the operation is selected by two dynamic types at once, the element's and the visitor's, which is double dispatch."
notes: "Visitor solves a problem ordinary virtual functions cannot: dispatching on TWO types at once. A normal virtual call dispatches on one type -- the object you call it on -- so shape.area() picks the implementation by the shape's dynamic type. But some operations depend on two types: which OPERATION (area, perimeter, render) and which ELEMENT (circle, square). C++ has no built-in two-type dispatch, and Visitor builds it out of two single dispatches chained together, which is why the technique is called double dispatch. The chain is the accept/visit dance. You call shape.accept(visitor); accept is virtual, so the first dispatch selects the concrete element's accept -- Circle::accept. Inside Circle::accept, the statement is visitor.visit(*this), and here *this is statically known to be a Circle, so the compiler picks the visit(const Circle&) overload; visit is virtual, so the second dispatch selects the concrete visitor's implementation -- AreaPrinter::visit(const Circle&). Two dispatches, on the element type then the visitor type, land on exactly the right operation for exactly the right element. The payoff, developed in the next example, is that operations become objects: to add a new operation over all shapes you write a new visitor class, and no shape changes -- the open/closed win, but along the operation axis. The cost, the mirror image, is that the set of element types is baked into the visitor interface (one visit per element), so adding an element type forces every visitor to change; this is the expression problem, and it is the single most important thing to understand about when Visitor is the right tool, covered head-on later. A few mechanics worth noting now. accept is trivial and identical in every element (v.visit(*this)) but it CANNOT be lifted into the base class, because *this must have the concrete type for overload resolution to pick the right visit -- a base-class accept would make *this the base type and break the dispatch, which is this chapter's accept-not-overridden anti-pattern. The visit overloads are distinguished by parameter type, not name, so they must be declared for each concrete element the visitor knows about. And elements expose whatever the operations need (here radius() and side()), which is the encapsulation pressure Visitor puts on elements, another trade-off examined later. The sign that a problem wants Visitor: you keep writing operations that switch on the runtime type of elements in a fixed structure, and you would rather add operations than change the elements."
run: true
