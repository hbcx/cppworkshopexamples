- slug: "ranges"
  note: "The declarative counterpart to a generator: range views (filter, transform, take) build the same kind of lazy, one-element-in-flight pipeline by composing adaptors instead of writing a coroutine -- go there for views and the pipe operator, and reach for a coroutine when the producer logic is easier to write as plain imperative code."
- slug: "coroutines-awaitables"
  note: "The consumer half of the same machinery: this section drives the coroutine with co_yield and a promise, that one opens co_await -- the awaiter protocol, what await_suspend can return, and how a coroutine waits on something instead of producing values."
- slug: "coroutines-task"
  note: "The other way to end a coroutine: a generator co_yields many values and is pulled, a task co_returns one value and is awaited. Go there for the awaitable task that returns a result, with the same promise parts pointed the opposite direction."
- slug: "coroutines-std-generator"
  note: "The C++23 library version of everything this section builds by hand: std::generator is the ready-made type, with recursive elements_of and reference elements for free. Go there once you understand the machinery and just want to use it."
- slug: "coroutines-async-generator"
  note: "The async counterpart: where this generator produces values that are ready at once, an async stream can co_await work before each element and is pulled with co_await. Go there when producing an element itself has to wait."
- slug: "iterator"
  note: "What the generator's begin()/end() actually model: a single-pass input iterator, the weakest iterator category -- go there for the iterator protocol, categories, and why a coroutine sequence cannot be rewound or indexed."
- slug: "exceptions"
  note: "The mechanism example 06 leans on: std::current_exception captures the in-flight exception and rethrow_exception replays it later, which is how a coroutine failure crosses back to the consumer -- go there for exception_ptr, throwing, and catching."
- slug: "raii"
  note: "Why the generator owns its handle the way it does: the frame is a heap resource, so it is wrapped in a move-only type that destroy()s in its destructor -- the same rule that governs the leaked-frame anti-pattern -- go there for the ownership idiom behind it."
