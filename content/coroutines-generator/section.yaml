title: "Coroutines: writing a generator"
description: "C++20 coroutines from the ground up, built around the one use they make concrete: a lazy generator. A function that contains co_await, co_yield or co_return is a coroutine -- the compiler rewrites it into a resumable state machine and drives it through a promise_type you write, because the C++20 library ships only the raw pieces (coroutine_handle, suspend_always/never) and no ready-made generator. Covers what a coroutine is and the promise protocol, resuming and destroying a frame by hand, building generator<T> with co_yield, exposing it through a range-for iterator, lazy and infinite sequences, generic and composed generators, and getting exceptions out of a coroutine -- alongside the traps that compile cleanly and then corrupt memory: using a coroutine past done(), leaking the frame by dropping the handle, and a parameter taken by reference that dangles the moment the coroutine suspends."
