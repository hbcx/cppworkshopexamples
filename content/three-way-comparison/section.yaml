title: "Three-way comparison"
description: "The C++20 spaceship operator <=>, which replaces the block of hand-written comparison operators with one function -- and, defaulted, with one line. Covers the defaulted <=> that gives all six comparisons and == for free by comparing members in order, the three ordering categories (strong, weak, and partial), writing <=> by hand to order on chosen fields, why a user-written <=> still needs its own ==, how the compiler rewrites a < b into (a <=> b) < 0 and reverses operands, weak ordering for case-insensitive comparison, partial ordering and the unordered result that floating point and NaN produce, and how a type with <=> drops straight into std::sort and std::set -- alongside the traps: a custom <=> with no ==, a defaulted <=> that compares a pointer or a field it should not, misreading the <=> result, assuming a total order when NaN makes it partial, defaulting to strong when the meaning is weak, an auto return that mixes categories, and leaving hand-written operators next to <=> so they disagree. Write <=> once; let the compiler generate the rest."
sort_order: 135
category: "Language & object model"
