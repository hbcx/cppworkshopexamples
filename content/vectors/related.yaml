# Related chapters -- cross-links shown at the bottom of the section page.
# Each entry: the slug of another section + a one-line note on why to go there.
- slug: "span"
  note: "The non-owning view over a vector's buffer: pass or slice a vector's elements with no copy by handing out a std::span, and see why growing the vector (a reallocation) invalidates any span into it -- go there for the borrow that pairs with this owner."
- slug: "move-semantics"
  note: "Why a growing vector sometimes copies instead of moves: element moves are only used during reallocation when they cannot throw."
- slug: "lists"
  note: "The node-based alternative when stable references or O(1) splicing matter, with the honest head-to-head benchmark against vector."
- slug: "arrays"
  note: "The fixed-size sibling: the same contiguous storage but on the stack, with no allocation and the length baked into the type."
- slug: "unique-ptr"
  note: "Owning heterogeneous or non-copyable elements: a vector of unique_ptr stores polymorphic objects by base pointer, each deleted automatically when the vector goes."
- slug: "strings"
  note: "The same contiguous-growth container specialized for characters: size versus capacity, reserve, and the erase-remove idiom all reappear, plus the small-string optimization a vector has no equivalent for."
- slug: "iterator"
  note: "What a vector's iterators actually are and why growth or erase invalidates them: the Iterator pattern chapter covers the invalidation rules, the random-access category a vector provides, and how to write an iterator of your own."
- slug: "ranges"
  note: "The modern way to process a vector: lazy filter/transform/take pipelines and range algorithms that take the whole vector instead of a begin/end pair, materialising back into a vector when you need a result -- go there for views and the pipe operator."
- slug: "copy-copy-if"
  note: "Filling one vector from another: copy and copy_if write into a vector through a back_inserter, and the whole-container-copy anti-pattern is exactly the vector copy constructor and assign -- go there for copying ranges out, and when a plain b = a beats an algorithm."
- slug: "remove-erase"
  note: "Emptying a vector of matching elements: the erase-remove idiom compacts and drops the tail, and erasing in a loop is the classic O(n squared) trap -- go there for remove vs erase, remove_if, and the C++20 erase_if."
- slug: "rotate-reverse"
  note: "Moving elements within a vector without reallocating: rotate slides a block in one in-place pass where erase+insert shifts twice and can reallocate -- go there for reordering, move-to-front, and reversing a segment."
- slug: "fill-generate"
  note: "Setting a vector's contents: fill and generate write values into it, and the fill constructor v(n, value) or resize(n, value) beats construct-then-fill -- go there for initializing, building with generate_n, and iota sequences."
- slug: "swap-ranges"
  note: "The O(1) member swap and the swap-with-empty capacity trick: a vector swaps by exchanging its buffer pointer, and clear() keeps capacity where swap-with-empty releases it -- go there for swap, iter_swap, and swap_ranges."
- slug: "initialization"
  note: "Why vector<int>{n} and vector<int>(n) build different vectors: braces prefer the initializer_list constructor, so {n} is one element and (n) is a size -- go there for the forms of initialization and the brace-versus-paren rule behind this trap."
- slug: "uninitialized-memory"
  note: "How a vector works underneath: capacity larger than size means the tail of the buffer is raw, filled with uninitialized_* on a grow and torn down with destroy, with a rollback if an element move throws -- go there for the construction algorithms behind reserve and reallocation."
- slug: "allocators"
  note: "Where a vector gets its memory, and how to change it: the second template parameter is an Allocator, so you can back a vector with an arena, a pool, or a counting allocator -- go there for the allocator interface and stateful allocators."
- slug: "pmr"
  note: "Change a vector's memory strategy at run time instead of in the type: std::pmr::vector picks a memory_resource by pointer, so one type can allocate from the heap, a stack buffer, or a pool -- go there for polymorphic_allocator and the standard resources."
- slug: "deque"
  note: "The double-ended sibling: std::deque adds O(1) push_front and keeps references valid across growth, trading away the contiguous block, data() and reserve -- go there when you need front operations or stable references, not one flat array."
