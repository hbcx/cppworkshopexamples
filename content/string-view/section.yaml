title: "std::string_view"
description: "The non-owning window onto text (C++17): a pointer and a length that refers to characters someone else owns, so passing and slicing text costs no copy and no allocation. Covers what a view is and its cheap value semantics, building one from a string, a literal, a char buffer or a (pointer,length) pair, free slicing with substr and remove_prefix/remove_suffix, searching and comparing a view, crossing back to an owning std::string, designing borrowing APIs with one signature for every caller, constexpr string tables the way std::string cannot do, and heterogeneous map lookup that avoids a temporary key -- alongside the sharp edges that make it dangerous: a view that outlives its text and dangles, data() that is not null-terminated handed to a C API, a view stored past the life of its source, a window shrunk out of range, and reaching for a view when you actually needed to own the text or needed null-termination."
sort_order: 43
category: "Strings & text"
