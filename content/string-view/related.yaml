# Related chapters -- cross-links shown at the bottom of the section page.
- slug: "span"
  note: "The same borrow generalised to any element type: std::string_view is really a view of const char, and std::span is the view over any contiguous sequence -- go there for viewing arrays and vectors of any type, static extents, and writing through the view, with the same dangling traps."
- slug: "strings"
  note: "The owning counterpart: when the text must be kept, modified, or handed to a C API as a null-terminated string, you need a std::string -- go there for building, editing, and owning text."
- slug: "maps"
  note: "Where the heterogeneous-lookup example pays off: a std::map with std::less<> lets a string_view find a std::string key with no temporary, so go there for the ordered container whose lookups this speeds up."
- slug: "subsequence-search"
  note: "The algorithms behind a view's search members: find is std::search over characters and find_first_of scans for any of a set, so go there for pattern search and delimiter scanning on ranges."
- slug: "regex"
  note: "When a fixed find is not enough and the text has a shape to match, extract, or rewrite -- go there for patterns, capture groups and replace, keeping in mind regex needs a std::string, not a view."
- slug: "charconv"
  note: "Turning a borrowed field into a number: from_chars reads straight from a view's [data, data + size) with no copy, so a string_view you sliced out of a buffer becomes an int or double with no allocation -- go there for the parse step after the slicing."
