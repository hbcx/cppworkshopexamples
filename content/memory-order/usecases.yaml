- problem: "A high-throughput service keeps counters -- requests served, bytes processed, cache hits -- that are incremented on the hot path from many threads and only read occasionally for a metrics dump. The increments must not be lost, but their order relative to other work does not matter."
  why: "memory_order_relaxed on the increments gives correct totals with the least ordering cost, where the default seq_cst would impose barriers on every hot-path increment for a guarantee (a global order over the counter) that a statistic never needs."
  signal: "Atomic counters incremented in the request/packet fast path using the default order, where the value is only ever summed or reported and never used to decide that other data is ready."

- problem: "One thread prepares a block of data -- parses a message, fills a buffer, builds an immutable object -- and then signals another thread that it is ready to consume, and the consumer must see the fully-written data, not a half-built version."
  why: "A release store on the ready flag paired with an acquire load publishes all the preceding writes with a single synchronizes-with edge, cheaper than seq_cst and exactly the guarantee needed, where relaxed would signal the flag without ordering the data (the consumer could read a stale buffer)."
  signal: "A producer that writes a buffer or object and then sets a done/ready flag another thread polls, where the flag is atomic but the payload around it is plain and the ordering is what makes it safe."

- problem: "You are implementing a synchronization primitive yourself -- a spinlock, a mutex, a lock-free queue's producer/consumer indices -- and need exactly enough ordering that a critical section or a slot handoff is safe, without paying for a global order."
  why: "acquire when taking the lock (or reading the slot) and release when freeing it (or publishing the slot) bracket the protected data with the minimal happens-before it needs, where seq_cst on every lock operation over-orders and relaxed under-orders (the section's writes would leak or not publish)."
  signal: "A hand-written lock or lock-free structure whose atomic operations all use the default order, or all use relaxed, rather than acquire on acquire-side and release on release-side."

- problem: "A reference-counted object (a shared_ptr-like control block, an intrusive refcount) is decremented from several threads, and the object may only be destroyed after the LAST reference is gone and all prior users' writes are visible to the destroyer."
  why: "The classic pattern is a relaxed-or-release fetch_sub for the decrement plus an acquire fence on the thread that hits zero, so ordinary decrements stay cheap and only the final one pays for the acquire that orders every prior user's writes before destruction, where a plain relaxed decrement everywhere could destroy the object while another thread's writes are still in flight, and seq_cst on every decrement is needless cost."
  signal: "A fetch_sub on a reference count followed by an if (count-was-one) destroy, using the default order on every decrement, or relaxed with no fence before the destructor runs."

- problem: "A lock-free algorithm coordinates through several independent atomic variables and its correctness depends on all threads agreeing on one global order of those operations -- some mutual-exclusion schemes (Dekker's, Peterson's) and certain multi-flag protocols."
  why: "memory_order_seq_cst gives the single total order these algorithms are proven against, which release/acquire cannot provide across independent variables (it only orders one release with the acquire that reads it), so weaker orders here allow outcomes -- like both threads entering a critical section -- that the algorithm forbids."
  signal: "A synchronization algorithm using two or more atomic flags where each thread sets one and reads the others, currently written with relaxed or acquire/release rather than seq_cst, and relying on the both-see-each-other property."
