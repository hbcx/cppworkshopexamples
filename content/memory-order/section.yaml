title: "std::memory_order"
description: "The memory model behind every atomic: which order one thread's operations become visible to another, and how much of that ordering you actually pay for. Every atomic operation takes a std::memory_order, and the choice ranges from seq_cst (a single global order every thread agrees on, the default) down to relaxed (atomicity with no ordering at all), with release/acquire in between to publish data from one thread and consume it in another. Covers the seq_cst default, relaxed for pure counters, the release/acquire publish handoff, acquire/release on a lock, acq_rel on a read-modify-write, when only seq_cst gives the global total order you need, and standalone atomic_thread_fence -- alongside the anti-patterns that make lock-free code subtly wrong: relaxed where a release/acquire handoff is required, a lone acquire or release with no pair to synchronize with, reaching for memory_order_consume, weakening the order prematurely without proof, and expecting an order to fix a plain data race that has no happens-before edge. The atomic chapter introduces these orders; this one is the full treatment. Concurrency examples run under ThreadSanitizer on Linux/CI."
sort_order: 106
category: "Concurrency"
