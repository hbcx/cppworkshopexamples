title: "Inheritance and virtual functions"
description: "Runtime polymorphism in C++: how a derived class extends a base, and how virtual functions let a call through a base pointer or reference reach the derived override chosen at run time. Covers public is-a inheritance and constructor delegation, virtual dispatch, the override and final specifiers, abstract base classes with pure virtual functions, why a base used polymorphically needs a virtual destructor, processing a heterogeneous collection through base references, the difference between static and dynamic dispatch, covariant return types for clone-style functions, calling the base version from an override, and the rest of the inheritance forms -- private and protected inheritance, multiple inheritance of interfaces, and virtual inheritance for the diamond -- alongside the traps: a missing virtual destructor, slicing a derived object into a base value, calling a virtual from a constructor, a signature typo that silently fails to override, inheriting for reuse instead of is-a, a derived name that hides base overloads, a non-virtual diamond with a duplicated base, and private inheritance where composition would be clearer. Inherit to say is-a and to be called through the base; reach for composition when you only want reuse."
sort_order: 136
category: "Language & object model"
