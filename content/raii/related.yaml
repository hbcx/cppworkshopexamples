- slug: "unique-ptr"
  note: "The standard-library RAII you reach for first: unique_ptr is a ready-made move-only owner for heap memory, and with a custom deleter for any C handle -- go there instead of writing your own guard for the common cases."
- slug: "move-semantics"
  note: "The move-only ownership and rule of five a resource-owning RAII type is built from -- go there for move constructors, transferring a handle with std::exchange, and why copying a resource owner is disabled."
- slug: "shared-ptr"
  note: "RAII for a resource with more than one owner: reference-counted cleanup that releases when the last owner goes away -- go there when single ownership does not fit."
- slug: "pimpl"
  note: "A sibling idiom that leans on RAII: the unique_ptr-to-Impl member is an owning handle and the rule-of-five plumbing is the same -- go there for the compile-firewall use of an owning pointer."
- slug: "rule-of-0-3-5"
  note: "The special-member decision RAII drives: owning a resource forces you to write three or five special members, while rule of zero is what you get by letting RAII members own it for you -- go there for how many of the five to declare and why they travel as a set."
- slug: "thread"
  note: "RAII applied to a thread: std::jthread joins itself in its destructor, turning the forgot-to-join crash into a non-issue the same way an owning handle turns a leak into a non-issue -- go there for launching threads and why jthread is the RAII way to own one."
- slug: "exceptions"
  note: "Why RAII exists: a thrown exception unwinds the stack and runs your destructors, so a resource wrapped in one is released on the error path with no cleanup code. Go there for throwing, catching, and stack unwinding."
