title: "Anti-pattern: hand-rolling lazy init with a raw pointer"
standard: "C++11"
difficulty: 3
summary: "The pre-C++11 singleton -- a static raw pointer, a null check, and new -- is a data race under threads and a leak whose destructor never runs; since C++11 a function-local static gives lazy, thread-safe construction and proper destruction for free."
notes: "The old way to write a lazy singleton was a static pointer initialised to null, a check, and a new on first use: if (!p) p = new T; return *p. It has two defects. It is a data race: two threads can both observe the null pointer and both run new, so the check-then-act is not atomic -- the classic fix was double-checked locking with a mutex and, done wrong (which was common), it was still broken because the write of the pointer and the writes inside the constructor could be reordered. And it leaks: nothing ever deletes the object, so its destructor never runs -- fine for memory the OS reclaims, not fine when the destructor must flush a file or release a handle. Since C++11 all of that machinery is obsolete: the initialization of a function-local static is guaranteed to happen once and to be thread-safe, and the object is destroyed at program exit. So the whole hand-rolled apparatus -- pointer, null check, mutex, double-checked locking -- collapses to static T inst; return inst;. This example runs the two singletons single-threaded and shows the leak directly: the raw-pointer version never prints its destructor line while the Meyers version does. The data race is described in the code, not executed, because a race is undefined behaviour and must not be run. Reach for a hand-rolled pointer only when you deliberately need a different lifetime (e.g. an immortal singleton that must outlive other statics); for the default case the function-local static is strictly better."
run: true
