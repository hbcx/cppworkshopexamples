- problem: "A network service that handles thousands of connections, where each connection spends most of its time waiting on a socket read, a write, or a timer. Doing this with one OS thread per connection burns memory and context-switch time on threads that are almost always blocked."
  why: "An awaiter suspends the coroutine and registers its handle with the event loop, so a waiting connection holds only its small frame, not a thread and its stack. When the socket is readable the loop resumes the handle. The code still reads top to bottom like blocking I/O -- the co_await points are the only difference -- but thousands of them run on a handful of threads."
  signal: "A thread-per-connection server, or a state machine that hand-encodes where each connection is in its read/parse/write cycle across callbacks, when the logic would be one straight-line function if it could just wait in the middle."

- problem: "An existing async API reports completion through a callback -- a database driver, an HTTP client, a platform timer -- and using it forces the rest of the flow into the callback, so a sequence of three dependent calls becomes three nested callbacks with error handling copied into each."
  why: "Wrapping the callback-based operation as an awaitable moves the continuation into the coroutine: await_suspend registers the callback, and the callback resumes the handle. The three calls become three co_awaits in one function with ordinary control flow and one place for errors, instead of a pyramid of nested lambdas each capturing the last."
  signal: "Nested completion callbacks (a call whose callback makes the next call whose callback makes the next), or a chain of .then() continuations that only exist to sequence async steps that depend on each other."

- problem: "A cooperative scheduler or task graph that runs many coroutines on a few threads and constantly hands control from one to another -- a finished task resumes its awaiter, a producer wakes its consumer. Done naively this recursion grows the stack until it overflows."
  why: "Returning a coroutine_handle from await_suspend is symmetric transfer: the runtime resumes the next coroutine as a tail call, so an unbounded chain of hand-offs runs in constant stack space. It is the mechanism that makes a coroutine scheduler safe to run for a long time, which resuming inside await_suspend is not."
  signal: "A scheduler or task type that calls handle.resume() from inside await_suspend or from a completion callback, especially where tasks routinely wake each other -- the stack depth then tracks the hand-off chain."

- problem: "A producer that must not outrun its consumer -- reading a huge file to feed a bounded queue, or accepting work faster than downstream can process it -- where without a brake the queue grows without limit and memory blows up."
  why: "An awaiter can suspend the producer until a slot frees up: await_ready checks for capacity, and when there is none the handle is parked and resumed later by whatever drains the queue. The producer expresses backpressure as a plain co_await in its loop, rather than a manual sleep-and-poll or an unbounded buffer that pretends the pressure is not there."
  signal: "A producer loop with an ever-growing buffer, or a sleep/retry poll waiting for a resource to free up, where the real intent is to pause the producer until the consumer catches up."
