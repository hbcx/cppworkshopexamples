title: "Coroutines: co_await and awaitables"
description: "The consumer half of C++20 coroutines: what a co_await expression actually does. Where the generator section built the producer side around co_yield, this one opens the suspension machinery -- the awaiter protocol await_ready / await_suspend / await_resume, what each hook decides, and the three things await_suspend can return (void to park, bool to keep going, a coroutine_handle to transfer control). Covers a never-suspending awaiter, a suspending one driven by hand, co_await producing a value, the await_suspend return types including symmetric transfer, initial_suspend and final_suspend as awaiters that set eager vs lazy start, and operator co_await and await_transform as the customization points -- alongside the traps that compile cleanly and then hang or corrupt memory: resuming the next coroutine inside await_suspend instead of transferring (stack growth), suspending with nobody left to resume (a leaked, stranded frame), and an awaiter that keeps a reference to a temporary across the suspend point."
sort_order: 167
