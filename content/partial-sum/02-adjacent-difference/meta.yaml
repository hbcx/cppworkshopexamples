title: "adjacent_difference: gaps between elements"
standard: "C++11"
difficulty: 1
summary: "std::adjacent_difference writes the difference between each element and the one before it. The first output is a copy of the first input, then each following output is in[i] - in[i-1]. The output has the same length as the input, not one fewer."
notes: "adjacent_difference(first, last, out) reports how much each element changed from the previous one: out[i] = in[i] - in[i-1] for i >= 1. The detail that trips people up is the FIRST element: out[0] is a straight copy of in[0], not a difference and not zero, and the output has n elements -- the SAME count as the input, not n-1 (misreading this is an anti-pattern). The reason out[0] is the original is precisely so the operation is INVERTIBLE: keeping the first value plus all the deltas is enough to reconstruct the whole sequence with partial_sum, which is why the two are exact inverses (a later example). From the prefix sums 1 3 6 10 15 it recovers 1 2 3 4 5. Its everyday uses are computing changes -- velocity from positions, day-over-day deltas, the gaps between sorted timestamps -- and DELTA ENCODING for compression: slowly changing or sorted data becomes a first value followed by small differences that pack tightly. Like partial_sum it lives in <numeric>, can write in place, needs a sized output or a back_inserter, and takes an optional binary operation to define 'difference' differently. To use only the true differences and ignore the copied first element, start reading from out.begin() + 1."
