title: "partial_sum / adjacent_difference"
description: "Cumulative and difference passes over a range, from <numeric>. std::partial_sum writes running (prefix) sums, std::adjacent_difference writes the difference of each element and the one before it, and the two are exact inverses -- delta-encode with one, reconstruct with the other. Covers prefix sums, adjacent differences, a custom operation for running max or product, the C++17 inclusive_scan and exclusive_scan, their transform_inclusive_scan / transform_exclusive_scan variants that fuse a per-element map into the scan (running sums of squares, byte offsets from record sizes), and the encode/decode round trip -- alongside the anti-patterns: using partial_sum where accumulate would give just the total, recomputing a range sum per query instead of a prefix-sum array, overflowing the element type the running sum accumulates in, and misreading adjacent_difference's first element, which is the original value, not a difference."
sort_order: 29
category: "Algorithms"
