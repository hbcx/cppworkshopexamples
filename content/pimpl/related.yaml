- slug: "bridge"
  note: "The pattern this idiom is a special case of: pimpl is a degenerate Bridge whose implementation side has exactly one member, using the same unique_ptr-to-hidden-Impl structure for a compile-time goal instead of runtime variation -- go there for the full two-hierarchy version and where the idea comes from."
- slug: "move-semantics"
  note: "The special-member rules pimpl leans on: a pimpl class is a textbook rule-of-five type -- move-only unless you add a deep copy, every special member declared in the header and defined where Impl is complete -- go there for move constructors, the rule of five, and why moves must be out-of-line here."
- slug: "unique-ptr"
  note: "The tool pimpl is built on: the implementation is owned by a unique_ptr<Impl>, and its incomplete-type rules are exactly what force the out-of-line destructor -- go there for unique_ptr ownership, custom deleters, and make_unique."
- slug: "crtp"
  note: "The sibling idiom with the opposite goal: pimpl hides the implementation behind a pointer to cut compile coupling, where CRTP pulls it into the header to inline it -- go there for static polymorphism, mixins, and per-type state."
- slug: "raii"
  note: "The idiom the unique_ptr-to-Impl member relies on: acquire in the constructor, release in the destructor -- go there for scope guards, move-only ownership, and cleanup on every exit path, the general form of what pimpl's owning pointer does."
- slug: "type-erasure"
  note: "The same hiding move applied to behaviour instead of data: type erasure hides a concrete type behind one value that dispatches at run time, using the same unique_ptr-to-hidden-object structure -- go there for the Concept/Model wrapper, std::function, and value semantics via clone()."
- slug: "rule-of-0-3-5"
  note: "The special-member rules a pimpl class must follow, on their own: how many of the five to declare and why declaring one changes the others -- go there for rule of zero, three and five before applying them to the out-of-line pimpl members."
