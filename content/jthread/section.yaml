title: "std::jthread and stop_token"
description: "Cooperative cancellation, C++20's answer to stopping a thread cleanly. A std::jthread joins itself in its destructor and carries a std::stop_token, so long-running work can be ASKED to stop and bow out at a safe point -- there is no forced kill in C++, cancellation is always cooperative. Covers the jthread that hands its callable a stop_token and auto-cancels on destruction, requesting a stop early, passing a stop_token into ordinary functions as a standalone cancellation handle, reacting to a stop with a std::stop_callback, one std::stop_source cancelling many workers at once, and an interruptible condition_variable_any wait that wakes on cancel -- alongside the anti-patterns of getting it wrong: a callable that ignores its stop_token, detaching a jthread, expecting request_stop to forcibly kill the thread, and waiting on a plain condition_variable that a stop cannot wake. Examples run under ThreadSanitizer on Linux/CI."
sort_order: 103
category: "Concurrency"
