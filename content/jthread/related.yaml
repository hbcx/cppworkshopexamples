# Related chapters -- cross-links shown at the bottom of the section page.
- slug: "thread"
  note: "The plain thread jthread is built on: std::jthread IS a std::thread plus auto-join and a stop_token, so the launching, argument passing, and move rules are the same -- go there for those basics and the forgot-to-join / dangling anti-patterns that jthread's destructor is designed to remove."
- slug: "condition-variable"
  note: "Where the interruptible wait comes from: the graceful-shutdown example there hand-rolls a stopping flag in the predicate, which is exactly what condition_variable_any plus a stop_token folds away -- go there for the producer/consumer queue and the wait/notify protocol this section makes cancellable."
- slug: "future"
  note: "The other way to get a result or a signal across threads without polling: a std::future carries one value (or exception) and blocks until it is ready, while a stop_token carries cancellation the other direction -- go there for async, promise, and packaged_task, and combine the two when a cancellable job also has to return something."
- slug: "atomic"
  note: "What a stop_token is underneath and when to use one directly: cancellation is a latching atomic flag with a callback list, so for a plain one-way boolean signal a std::atomic<bool> (or its wait/notify) is lighter -- go there for atomics, and reach for stop_token when you want the standard cancellation protocol, callbacks, and jthread integration."
