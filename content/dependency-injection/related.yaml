- slug: "singleton"
  note: "The pattern DI is the standard answer to: a global singleton hides a dependency and defeats testing, where injection makes the same collaborator explicit and substitutable -- go there for the trap this technique exists to replace."
- slug: "abstract-factory"
  note: "Where the concrete implementations DI injects usually come from: a factory builds the product, the composition root injects it -- the two compose, factory decides which, injection delivers it."
- slug: "object-pool"
  note: "A shared resource is a classic injected dependency: a pool is built once at the composition root and injected into every consumer as one shared instance instead of each fetching its own."
- slug: "adapter"
  note: "What is often injected: an adapter wrapping a third-party or legacy type presents your domain interface, and it is constructed at the composition root and injected as that interface -- the two patterns compose."
- slug: "decorator"
  note: "A decorator is a dependency you inject: wrap a service in a caching or logging decorator at the composition root and inject it behind its interface, adding a cross-cutting concern without the consumers or the implementation changing."
- slug: "facade"
  note: "A facade interface is a natural injection boundary: inject a facade so a whole subsystem is swappable and fakeable behind one dependency, and the composition root chooses which implementation the consumers receive."
- slug: "proxy"
  note: "A proxy is a dependency you inject: build a lazy, access-controlled, or remote stand-in at the composition root and inject it behind the subject's interface, so consumers get the guarded or deferred object without knowing it is a proxy."
