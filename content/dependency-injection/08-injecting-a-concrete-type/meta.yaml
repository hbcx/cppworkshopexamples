title: "Anti-pattern: injecting a concrete type instead of an interface"
standard: "C++11"
difficulty: 3
summary: "The dependency is injected -- but as the concrete class, so the seam is only skin deep: you can pass a different instance of that class, but not a different kind, and a test cannot substitute a fake because there is no interface to implement."
notes: "It is possible to do injection and still get none of its benefit. If the consumer takes its dependency as the concrete PostgresDb rather than a Database interface, the object is handed in from outside -- which looks like DI -- but the type still nails the consumer to one implementation. You can pass another PostgresDb, but you cannot pass an in-memory fake, an adapter for a different engine, or a decorator that adds caching, because none of them ARE a PostgresDb. The benefit of injection (substitutability, testability, decoupling) comes from depending on an ABSTRACTION; injecting a concrete type gives up all three while paying the ceremony. The tell is a constructor parameter whose type is a concrete service class rather than an interface. The fix is to introduce the interface the consumer really needs, depend on that, and let the concrete type be the caller's choice. This example contrasts a report that takes PostgresDb directly -- untestable without a real database -- with one that takes a Database interface, then runs the same report against a fake in a test and a Postgres adapter in production, with no change to the report. Depend on what you use, not on who provides it."
run: true
