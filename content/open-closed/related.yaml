- slug: "strategy"
  note: "Open-Closed done at runtime IS Strategy: injecting the varying behaviour is how you extend a context without editing it -- go there for its object, std::function, and compile-time policy forms."
- slug: "factory-method"
  note: "The other half of staying closed: OCP lets a new type slot in, and Factory Method is how the code that creates it avoids naming the concrete class, so adding a type does not reopen the creation site either."
- slug: "visitor"
  note: "The trade-off OCP makes you choose: a class hierarchy is open to new types but closed to new operations, and Visitor flips it -- open to new operations, closed to new types (the expression problem) -- go there to see which axis you keep open."
- slug: "single-responsibility"
  note: "The sibling SOLID principle: SRP puts each reason to change in its own class, OCP adds the next change without editing what is there -- together they push behaviour toward small, swappable parts."
- slug: "liskov-substitution"
  note: "The principle that keeps your new subtypes safe: OCP adds behaviour by adding a subclass, and Liskov is the rule that the subclass must behave like its base -- go there for what makes an extension substitutable rather than a landmine."
- slug: "dependency-inversion"
  note: "What points the policy at an abstraction so a new implementation can slot in: OCP is the open extension seam, and Dependency Inversion is the direction-of-dependency rule that makes it possible -- go there for depending on abstractions and who owns the port."
