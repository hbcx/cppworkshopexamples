# Related chapters -- cross-links shown at the bottom of the section page.
- slug: "ranges"
  note: "Where the C++20 forms come from: std::ranges::all_of takes the whole range and a projection instead of an iterator pair, and the same view pipelines feed these quantifiers -- go there for range algorithms, views, and projections."
- slug: "lambdas"
  note: "What you pass as the predicate: nearly every all_of/any_of/none_of call takes a lambda, often capturing a threshold or limit to test against -- go there for captures, generic lambdas, and how a closure holds the values the predicate needs."
- slug: "vectors"
  note: "The container these usually run over: a std::vector is the typical range you quantify across -- go there for how it stores elements, and the size() these checks are often compared against."
- slug: "find-find-if"
  note: "When you need WHICH element, not just whether one exists: any_of gives a yes-or-no, find_if gives an iterator to the first match so you can read, change, or erase it -- go there for locating and acting on an element."
- slug: "count-count-if"
  note: "When you need HOW MANY, not just whether one exists: any_of stops at the first match, count_if visits every element to total them -- go there for tallies, thresholds, and why count greater than zero should be any_of."
