title: "Anti-pattern: a monotonic resource for long-lived churn"
standard: "C++17"
difficulty: 3
summary: "A monotonic_buffer_resource never reclaims on deallocate, so a long-running loop that keeps allocating and freeing exhausts the buffer even though only one block is ever live at a time."
notes: "monotonic is built for allocate-a-lot-then-throw-it-all-away, not for steady insert and erase. Its deallocate does nothing, so repeated allocate then free walks the cursor to the end and never comes back -- the buffer runs out despite the live size staying tiny. When memory is freed and reused over a long life, a pool resource is the right choice: it puts freed blocks back for reuse. The example runs the same churn loop on both, showing the monotonic one exhaust and the pool one finish."
run: true
