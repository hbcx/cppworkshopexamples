# Related chapters -- cross-links shown at the bottom of the section page.
# Each entry: the slug of another section + a one-line note on why to go there.
- slug: "concepts"
  note: "The foundation ranges is built on: the range, view and borrowed_range concepts constrain every algorithm and adaptor, and the clear errors come from them -- go there for named requirements, requires-expressions, and how the constraints are written."
- slug: "iterator"
  note: "What ranges generalises: the iterator pattern and its input/forward/bidirectional/random-access categories are exactly what the range concepts classify, now with a sentinel end that need not match the iterator -- go there for the traversal model underneath."
- slug: "vectors"
  note: "The container most pipelines start from and materialise back into: a std::vector is a contiguous range that feeds a view chain and holds the result when you copy a view out -- go there for the container's own growth, capacity and iterator rules."
- slug: "ranges-cpp23"
  note: "What the next standard added on top of these views: ranges::to to materialise a pipeline in one step without a loop, zip and enumerate, the chunk / slide / stride windowing family, cartesian_product, repeat, and the fold reductions -- go there for the C++23 additions."
- slug: "all-any-none-of"
  note: "The quantifier algorithms in their range form: std::ranges::all_of / any_of / none_of take a whole range and a projection, so you can ask every, any, or no over a view or a container member -- go there for the yes-or-no checks that pair with these views."
- slug: "transform"
  note: "The eager map behind views::transform: the transform algorithm writes mapped results to a container now, where the view maps lazily on demand -- go there for the algorithm form, the binary two-range map, and when eager beats lazy."
- slug: "min-max-element"
  note: "A range reduction with a projection: ranges::max_element and ranges::minmax rank a whole range by a member and return the extreme -- go there for the smallest and largest, the value-returning ranges::max, and the tie rules."
