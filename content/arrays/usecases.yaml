# Real-world use cases for this section -- see .claude/skills/cpp-chapter (SKILL.md,
# "Real-world use cases"). Values are single-line and quoted, no inner quotes.
- problem: "Firmware on a device with no heap, or code under a safety standard such as MISRA that forbids dynamic allocation outright. Buffers are fixed at build time, must live in a known section of memory, and the code still has to pass a bounds-checkable review."
  why: "std::array is the C array with none of the heap: the storage is inside the object, so it costs nothing a raw array does not, but it carries its length in the type, so size() cannot go stale and the array cannot decay to a bare pointer at a function boundary. std::vector is the alternative that is ruled out here -- it allocates -- and the raw C array is the alternative that loses the length the first time the buffer is passed anywhere."
  signal: "A raw buffer plus a separate length constant or macro, a function taking (T* buf, size_t len) where the caller must not get len wrong, or sizeof(buf)/sizeof(buf[0]) computed anywhere other than the scope that declared the buffer."

- problem: "A protocol or format defines fields whose width is fixed forever: a MAC address, an IPv4 address, an AES key, a SHA-256 digest. The code passes them around, stores them as map keys, compares them, and returns them from functions."
  why: "Making the width part of the type means a 6-byte address cannot be assigned from a 4-byte one, and std::array gives back the value semantics a C array never had -- it copies, assigns, compares and returns by value like any other object. A vector would put a fixed 32-byte digest on the heap and add a runtime length that is, by construction, always the same number."
  signal: "A struct wrapping a raw fixed-width buffer only to make it copyable or returnable, memcmp used to compare two such buffers, or a std::vector whose size is set once from a compile-time constant and never changes."

- problem: "A hot path needs a lookup table that never changes: a CRC table, a gamma or sine table, a state-transition table, a mapping from an enum to its name. The values are derivable, but deriving them at every startup costs time and drags in static-initialization order questions."
  why: "A constexpr std::array is computed by the compiler and lands in read-only data, so there is no startup cost, no initialization order to reason about, and the contents can be asserted at compile time with static_assert. Building the same table into a vector at startup moves the work to runtime and turns a compile-time error into a program that starts up wrong."
  signal: "A static std::vector or a global container filled by an init() function or a static initializer, or a table built once in main and then only read."

- problem: "A function called millions of times per second needs a small scratch buffer -- a 4x4 transform, a per-call coordinate set, a fixed-size ring of recent samples. The size is known and small, and the profile shows time going into the allocator rather than the work."
  why: "std::array puts the whole thing on the stack, so the cost is zero and the data is right next to everything else the function is touching. A local std::vector is one allocation and one deallocation on every call, which for a small fixed buffer is more expensive than the computation it holds."
  signal: "A std::vector declared as a local inside a hot function and sized from a constant, or a vector member reused across calls with a reserve() in the constructor to avoid the allocation the type forced on you."
