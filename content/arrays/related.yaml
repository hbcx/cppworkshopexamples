# Related chapters -- cross-links shown at the bottom of the section page.
# Each entry: the slug of another section + a one-line note on why to go there.
- slug: "span"
  note: "The view that pairs with a fixed array: a std::span<T, N> borrows a std::array<T, N> with the size known at compile time on both sides, so a function can read or write the array's elements with no copy -- go there for the non-owning window over contiguous data."
- slug: "vectors"
  note: "The dynamic sibling: reach for it the moment the element count is not fixed at compile time."
- slug: "move-semantics"
  note: "Why moving a std::array is not a steal: with no heap buffer to hand over, a move has to copy every element."
- slug: "tuple"
  note: "The heterogeneous fixed-size bundle: when the elements are of different types, reach for tuple and its get/apply interface."
- slug: "constexpr-consteval"
  note: "Where a std::array earns its keep at compile time: it is the literal type that holds the result of a constexpr computation, since a std::vector cannot survive constant evaluation -- go there for compile-time tables, constexpr functions, and consteval."
