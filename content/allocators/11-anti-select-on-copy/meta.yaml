title: "Anti-pattern: assuming a copy gets its own allocator"
standard: "C++11"
difficulty: 3
summary: "When you copy a container, select_on_container_copy_construction chooses the copy's allocator, and its default returns a copy of the original -- so a stateful allocator, and its arena, is shared, not duplicated."
notes: "People expect a copied container to be fully independent, but the default select_on_container_copy_construction just copies the source allocator, so a copied vector points at the same arena as the original. That is fine for a shared pool and a bug if each container was meant to own its arena. To give the copy a fresh allocator, define select_on_container_copy_construction on the allocator to return a new one. The example shows the default sharing the arena id across the copy."
run: true
sanitizers: []
