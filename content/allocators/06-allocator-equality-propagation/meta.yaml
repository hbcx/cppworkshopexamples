title: "Equality and the propagation traits"
standard: "C++11"
difficulty: 3
summary: "operator== decides whether one allocator can free another's memory, and the propagate_on_container_* traits decide whether the allocator travels with the container on copy, move and swap."
notes: "These two things drive the trickiest allocator behaviour. operator== must mean can free each other's memory: if two allocators compare unequal, a container cannot just steal the other's buffer on a move or swap. propagate_on_container_swap, _copy_assignment and _move_assignment (all false by default) say whether the allocator itself is carried along with the elements. Setting propagate_on_container_swap to true_type makes swapping two containers also swap their allocators, so the operation is always valid. The example prints the trait values and swaps two vectors to show it working."
run: true
