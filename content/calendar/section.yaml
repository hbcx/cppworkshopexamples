title: "The chrono calendar and time zones"
description: "The C++20 civil calendar in <chrono>: real dates and time zones as type-safe values instead of struct tm and strftime. Covers the calendar types (year, month, day) and building a year_month_day with the / operator, sys_days as the serial-day view where day arithmetic and date differences happen, calendrical month and year arithmetic and its end-of-month overflow, the weekday of a date and the nth-weekday-of-a-month helpers, the last day of a month and leap years, formatting dates with std::format and parsing them with chrono::parse, and time zones through zoned_time -- alongside the traps: using a date without checking ok(), confusing month arithmetic with day arithmetic, carrying over struct tm's 0-based month and 1900 year, mixing a UTC sys_time with a local_time, hardcoding a zone offset instead of letting daylight saving apply, taking the UTC date as today, and mixing the two weekday numbering conventions."
sort_order: 115
category: "Time"
