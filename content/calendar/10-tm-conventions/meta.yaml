title: "Anti-pattern: carrying over struct tm conventions"
standard: "C++20"
difficulty: 3
summary: "struct tm counts months from 0 and years from 1900; chrono is natural (January is month 1, the year is the real year), so feeding tm numbers into chrono types gives dates off by a month or by centuries."
notes: "Anyone who has used C's struct tm carries two quirks in muscle memory: tm_mon is 0-based (January is 0, December is 11) and tm_year is the year minus 1900. The chrono calendar deliberately drops both -- January is month{1}, and year{2026} is the actual year 2026 -- which is more readable but exactly the trap for someone converting old code, because the tm numbers compile fine as chrono values and produce a wrong date with no warning: tm_mon 7 becomes July instead of August, and tm_year 126 becomes the year 126 AD. The fix is to convert the conventions explicitly at the boundary -- month{tm.tm_mon + 1} and year{tm.tm_year + 1900} -- and, better, to stop round-tripping through tm at all once you are in chrono. The example builds a tm for August 2026 the C way, shows the wrong date you get by using its fields directly, and then the correct chrono values and the explicit conversion."
run: true
sanitizers: []
