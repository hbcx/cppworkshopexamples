title: "Safe access: value_or, value() and the wrong-side trap"
standard: "C++23"
difficulty: 2
summary: "value_or returns a fallback on the error side, value() throws bad_expected_access carrying the error, and *, -> and error() are unchecked -- reading the wrong side is undefined behaviour."
notes: "expected has two unchecked accessors and two checked paths, and the difference is what happens on the wrong side. value_or(fallback) returns the value if present and the fallback otherwise -- the tidy collapse when you do not need the error. value() returns the value but THROWS std::bad_expected_access<E> if it holds an error, and, unlike optional's throw, the exception carries the error object via its own .error(), so nothing is lost when you convert to the throwing style at a boundary. operator*, operator-> and error() are all UNCHECKED: * / -> read the value and are undefined behaviour on the error side, while error() reads the error and is undefined behaviour on the value side -- the mistake unique to expected is reaching for the wrong one of the two. So guard with if (r) before *, and check !r before error(); use value_or for a default, and value() when you want a hard throw carrying the reason. This example shows value_or on each side, value() throwing with its error attached, and notes the two undefined wrong-side reads without running them."
run: true
