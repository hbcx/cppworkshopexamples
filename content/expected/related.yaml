# Related chapters -- cross-links shown at the bottom of the section page.
- slug: "optional"
  note: "The no-error sibling: when a miss has no reason worth reporting, drop E and use optional<T> for plain present-or-absent."
- slug: "variant"
  note: "The general sum type underneath: expected picks a value or error side; variant holds one of any fixed set of named alternatives, dispatched with visit."
- slug: "interpreter"
  note: "A place expected earns its keep: an interpreter that evaluates external expressions can return expected<value, error> so an unknown variable or a division by zero is an unignorable result rather than a silent default -- go there for the invalid-input problem this type solves."
