title: "A read-write buffer"
standard: "C++11"
difficulty: 2
summary: "std::stringstream can be both written to and read from, so it works as an in-memory buffer: stream values in, then extract them back out in order."
notes: "std::stringstream combines input and output over one string buffer, so you can write values into it and later read them back -- an in-memory scratch buffer. The get and put positions are independent: writing appends, and reading starts at the beginning, so a value streamed in comes back out. Its whole content is available at any time as a std::string via .str(). This is handy for staging data you will consume in a moment, or for tests that write with << and check with >>. When you want to reuse the same object for a fresh batch, reset it (see the reuse example) rather than constructing a new one. This example writes three numbers and reads them back."
