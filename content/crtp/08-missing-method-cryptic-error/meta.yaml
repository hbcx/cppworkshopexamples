title: "Anti-pattern: a missing required method and its cryptic error"
standard: "C++11"
difficulty: 3
summary: "A CRTP base's required interface is implicit -- it is whatever the base happens to call on the derived type -- so forgetting a method surfaces as a template error deep inside the base, not a clear you forgot draw(). Documenting the required methods and adding a static_assert or a checked helper turns it into a readable message."
notes: "A CRTP base depends on the derived type providing certain methods, but unlike a virtual interface that requirement is nowhere declared -- it is implicit in whatever the base calls through the static_cast. So when a derived type forgets one, the compiler does not say the derived class is missing a method; it fails at the point INSIDE the base template where the missing call is made, often with a long message about no matching member function that points at the base, not at the class that actually forgot something. On a real codebase with nested templates that error can be pages long and land far from the mistake. The bad Shape here relies on the derived type having draw(), and a Circle that omits it fails to compile inside render() with exactly that kind of unhelpful diagnostic (so the omission is shown as a comment, not compiled). The problem is not that the check is missing -- the code is type-safe, and the method really is required -- but that the failure is expressed badly. The fix is to make the required interface explicit and to fail with a message that names the real problem. Documenting the contract in a comment is the minimum; better, a static_assert in the base that checks for the expected operation, or a small trait, reports something like Derived must provide draw() at the base, close to a readable cause. In C++20 a concept states the requirement directly and gives the cleanest error, but even in C++11 a static_assert with is-detected-style traits, or simply a well-named required-method helper the base calls, turns a wall of template noise into one clear line. The lesson: CRTP's required interface is a real contract even though the language does not force you to write it down, so write it down -- for the next person and for the error message. The sign: a CRTP base whose expected derived methods are documented nowhere, and a compile error buried in the base template whenever a derived type is incomplete."
run: true
