- slug: "template-method"
  note: "The pattern CRTP most often implements: a fixed skeleton in the base calling steps a subclass supplies, but resolved at compile time instead of through virtual dispatch -- go there for the runtime Template Method and exactly when the compile-time CRTP form is worth it."
- slug: "strategy"
  note: "The other end of the same axis: Strategy injects a varying behaviour as a runtime object, CRTP and its policy cousin bind it at compile time -- go there for the object and std::function forms, and the trade-off against this one."
- slug: "prototype"
  note: "A concrete CRTP mixin in use: a clone() helper written once in the CRTP base gives every derived type a correctly-typed copy without repeating the boilerplate -- go there for that pattern and its polymorphic clone."
- slug: "pimpl"
  note: "The sibling idiom with the opposite goal: pimpl hides the implementation behind a pointer to cut compile coupling, where CRTP pulls the implementation into the header to inline it -- go there for the compile-firewall idiom and its costs."
- slug: "type-erasure"
  note: "The run-time counterpart with the opposite trade-off: type erasure picks the implementation at run time behind one non-template value type, where CRTP picks it at compile time with no vtable -- go there when the types are not known until run time and must share one type and one container."
- slug: "tag-dispatch"
  note: "The other compile-time dispatch technique: tag dispatch selects an overload from a type trait or category, where CRTP selects an implementation by the derived type -- go there for choosing a function by a compile-time property rather than by inheritance."
- slug: "nvi"
  note: "The run-time hook CRTP replaces at compile time: NVI wraps a private VIRTUAL step in a non-virtual base method, where CRTP inlines the derived step with no vtable -- go there for the run-time customization point and the base-owns-the-call structure both idioms share."
- slug: "concepts"
  note: "How to constrain the templates CRTP is built from: a concept states what the derived type must provide, so a CRTP base can require its interface and reject a wrong parameter with a clear message -- go there for concepts, requires-expressions, and constrained templates."
- slug: "template-basics"
  note: "The foundation CRTP is a pattern of: a class template whose parameter is its own derived type -- go there for function and class templates, specialization, and the deduction and dependent-name rules every template idiom rests on."
