title: "Per-type static state with a counter"
standard: "C++11"
difficulty: 3
summary: "Because Base<Derived> is a distinct type per derived class, a static member in a CRTP base exists once PER derived type. ObjectCounter<T> uses that to give every type its own live-instance count -- Widgets and Gadgets counted separately -- from one reusable base."
notes: "This example shows a property of CRTP that has no equivalent in plain inheritance: each instantiation of the base is a separate type, so a static data member of the base is separate per derived type. ObjectCounter<T> keeps a static count that it increments in its constructor and decrements in its destructor, and any class that inherits ObjectCounter<Self> gets its own independent counter. Widget and Gadget both derive from it, and creating and destroying them tracks two separate live-instance counts -- Widget::alive() and Gadget::alive() never interfere -- even though the counting logic is written exactly once. Contrast a non-template base with a static member: there would be ONE count shared across every subclass, so Widgets and Gadgets would add to the same total, which is usually not what per-type bookkeeping wants. CRTP gives per-type static state for free precisely because Base<Widget> and Base<Gadget> are different types that therefore have different statics. The same mechanism powers per-type registries (each type registers itself once), per-type ids, and per-type caches or pools. Two details matter in practice. The static member still needs a single definition in one translation unit -- here a header-only inline-friendly pattern is avoided by keeping it in this single file -- and the counter must decrement in the destructor to stay accurate, so the base's destructor does the work and derived types need not remember to. Note also that this base has no virtual destructor and is not meant to be deleted through a base pointer; CRTP bases are typically used by value or as private/protected building blocks, not as polymorphic bases, which fits the no-common-base nature of the idiom. The takeaway: when you need state or behaviour that is once PER TYPE rather than once overall, a CRTP base is the natural tool, because the type system already gives each derived type its own copy."
