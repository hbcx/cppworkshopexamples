title: "Anti-pattern: code bloat from one base copy per type"
standard: "C++11"
difficulty: 3
summary: "Every CRTP instantiation is a fresh copy of the base's code, so a big base mixed into fifty types compiles fifty times over -- larger binary, slower builds, all in the header. Where the calls are not hot, a single virtual base is smaller and simpler. Use CRTP for speed on hot paths, not by default."
notes: "CRTP buys its speed by instantiating the base separately for every derived type: Base<A> and Base<B> are distinct types, so all the base's member functions are generated once per derived class rather than shared. For a small base that is nothing, but for a base with many or large methods mixed into many types, the same code is stamped out over and over -- the classic template code bloat -- which grows the binary, lengthens compile and link times, and, because templates live in headers, puts the whole implementation in the header where every include recompiles it. A virtual base has the opposite profile: one copy of each method exists, shared through the vtable by all subclasses, so the code size is constant no matter how many derived types there are, and the implementation can live in a .cpp. This example sketches both a CRTP Serializer mixin duplicated across several record types and the single virtual Serializer they could share, to make the difference in shape clear (it does not try to measure binary size, which is toolchain-specific). The judgement is the same speed-versus-size trade CRTP always presents, read from the size side: CRTP is worth the duplication when the calls are hot enough that removing the vtable indirection and enabling inlining matters, and not worth it when the methods are cold, large, or spread across many types, where one shared virtual implementation is smaller and simpler and the indirection costs nothing you can measure. Defaulting every polymorphic base to CRTP for performance you never profiled is the design-level version of premature optimisation. The rule of thumb: reach for CRTP on measured hot paths and small mixins; prefer a virtual base for cold, heavy, or widely-mixed behaviour where code size and build time matter more than a saved indirection. The sign: a large CRTP base inherited by many types with no hot-path reason, inflating build times and binary size for dispatch that was never a bottleneck."
run: true
