title: "Anti-pattern: calling into the derived part from the base constructor"
standard: "C++11"
difficulty: 3
summary: "A CRTP base that calls self().configure() in its own constructor reaches into the derived object before the derived members exist, reading uninitialized fields -- undefined behaviour. Bases run before derived, in CRTP as everywhere. The fix is to trigger the derived call after construction, through an explicit init or a factory."
notes: "Construction order is the same under CRTP as under any inheritance: the base subobject is fully constructed before the derived class's own members and constructor body run. CRTP does not change that, but it makes it easy to forget, because the static_cast in the base can reach the derived type's methods syntactically at any point -- including inside the base constructor, where doing so is a mistake. Here the base's constructor calls static_cast<Derived*>(this)->configure(), and configure() reads a derived data member. At the moment the base constructor runs, that member has not been constructed yet, so configure() reads an uninitialized field: undefined behaviour, which may print garbage, use an indeterminate value, or crash, and differs across builds. This is the CRTP form of the classic call-a-virtual-from-a-constructor bug -- same root cause, that the object is not yet fully formed -- except there is no virtual dispatch to soften it: the call goes straight to the derived method operating on not-yet-live members. Because it is real undefined behaviour, this example does not run the broken version; the bad base is described and only the fixed design is exercised. The fix is to keep the base constructor from touching the derived part and to perform any derived-dependent setup AFTER the whole object exists -- either an explicit init() the caller invokes once the object is built, or a factory function that constructs the object and then calls the setup step, which is what the good side does. The general rule: a constructor, base or derived, must not call down into a part of the object that is not yet constructed, and CRTP's compile-time reach into the derived type does not exempt it. The sign: a CRTP base constructor that calls self() or static_casts to Derived and invokes a method on it -- the derived members it touches are not alive yet."
run: true
sanitizers: []
