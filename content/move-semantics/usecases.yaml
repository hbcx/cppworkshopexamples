# Real-world use cases for this section -- see .claude/skills/cpp-chapter (SKILL.md,
# "Real-world use cases"). Values are single-line and quoted, no inner quotes.
- problem: "A vector holds objects that own something expensive -- a decoded image, a parsed message, a buffer, a string of any real length -- and it grows as records are loaded. The load is far slower than it should be, and the profile blames the copy constructor of a type nobody is copying."
  why: "vector may only move its elements while reallocating if the move cannot throw, because otherwise it could not put the original back if one move failed halfway. A move constructor that is not marked noexcept therefore makes the container fall back to copying every element on every growth -- silently, with no warning and no error, and one keyword is the whole difference."
  signal: "A move constructor or move assignment without noexcept on a type stored in a vector, a class with a user-declared destructor and hand-written copy operations but no move ones at all, or a member that is not itself nothrow-movable dragging the whole class down."

- problem: "A function produces a large result and hands it back: a parser returning a document, a decoder returning a frame, a query layer returning a result set, a builder returning a finished buffer. Before C++11 the usual answer was to pass the destination in as an out-parameter, and a lot of code still does."
  why: "Returning by value now transfers the buffer rather than duplicating it, so the natural signature is also the fast one -- and it is the only one where the result cannot be forgotten, left half-filled, or reused from a previous call. The out-parameter alternative buys nothing today and costs the type its const, its initialization guarantee and its ability to be used in an expression."
  signal: "A function returning void or a status code and taking a std::vector& or std::string& to fill, or a caller declaring an empty container one line before the call only to pass it in."

- problem: "Ownership of a resource has to move somewhere else and can only exist in one place: a socket or file handle handed to the thread that will serve it, a connection moved into a pool, a unique_ptr placed into a container of what a subsystem now owns."
  why: "A move-only type makes the transfer the only thing the code can express -- after the move the source is empty by construction, so two owners closing the same handle is not a bug that can be written. The alternatives each give something up: shared_ptr adds an atomic refcount and, worse, an answer of everyone to the question of who closes this, while a raw pointer moves that answer into a comment."
  signal: "A shared_ptr whose reference count never legitimately exceeds one, a raw handle or pointer passed to another thread or a container with a comment about who owns it now, or a copy constructor left public on a type wrapping a handle."

- problem: "A task, request or message is handed across a boundary -- pushed onto a work queue, sent to a worker thread, forwarded to the next pipeline stage -- and it carries a payload of a size that matters. Each handoff duplicated the payload, so a message that crosses three stages was copied three times."
  why: "Pushing with std::move, or constructing in place with emplace, transfers the payload into the queue instead of duplicating it -- and it also says in the code that the sender is done with it, which is exactly the intent at a handoff. Passing by const reference and letting the container copy is the alternative, and it pays for a full copy at every stage of a pipeline that never wanted a second copy in the first place."
  signal: "push_back or push of a named local that is never read again afterwards, a container element passed by const& into a function that immediately stores it, or a payload that goes through several stages by value."

- problem: "A constructor or setter takes a parameter it is going to store. Callers pass both lvalues that must survive and temporaries that should not be copied, and the class has several such parameters."
  why: "Taking the parameter by value and moving it into the member handles both callers with one function: a temporary is moved in, an lvalue is copied once, exactly as it would have been either way. Writing a const& and an && overload instead is faster by one move but needs two functions per parameter, which is where a class with three of them ends up with eight constructors that all do the same thing."
  signal: "A pair of overloads differing only in const& versus && with identical bodies, a constructor taking const std::string& and copying it into a member, or a class whose constructor count grows as a power of two with its parameter count."
