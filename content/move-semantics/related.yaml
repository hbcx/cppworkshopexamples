# Related chapters -- cross-links shown at the bottom of the section page.
# Each entry: the slug of another section + a one-line note on why to go there.
- slug: "value-categories"
  note: "The language model underneath these mechanics: what makes an expression an lvalue or an rvalue, how references bind, and why std::move is just a cast. Go there to understand WHY the move constructor is chosen only for temporaries."
- slug: "vectors"
  note: "Where moves pay off most: a vector reallocation moves its elements instead of copying them, but only when the move constructor is noexcept."
- slug: "lists"
  note: "The container that never relocates its elements: splice relinks nodes in place, and a std::list can even hold types that are not movable at all."
- slug: "unique-ptr"
  note: "The payoff type: std::unique_ptr is the move-only resource owner these rules were built for, and it makes a class correct with zero hand-written special members (the rule of zero)."
- slug: "shared-ptr"
  note: "A type where copy versus move is visible at runtime: copying a shared_ptr is an atomic reference-count bump, while moving it is a cheap pointer steal with no count touched."
- slug: "strings"
  note: "The move type made concrete: a std::string move hands over its heap buffer, the small-string optimization decides when there is a buffer at all, and moved-from strings appear throughout."
- slug: "raii"
  note: "Why resource-owning types are move-only: the rule of five here exists to make RAII types transfer ownership safely instead of copying a handle twice -- go there for the resource-management idiom these move operations serve."
- slug: "rule-of-0-3-5"
  note: "The decision layer above these mechanics: how many of the five special members you must actually write -- zero when members self-manage, three for a raw resource, five to add cheap moves -- go there for the rule that says when to declare the moves this section explains."
- slug: "decltype-declval"
  note: "Where the lvalue, xvalue and prvalue categories are read at compile time: decltype's rules turn on value category and declval yields an rvalue reference -- go there for type extraction, function traits, and decltype(auto), built on the categories this section defines."
- slug: "variadic-templates"
  note: "Perfect forwarding generalised to any number of arguments: a forwarding-reference pack plus std::forward passes a whole argument list through in its original value category -- go there for parameter packs, expansion, and fold expressions."
- slug: "lambdas"
  note: "Where these rules meet closures: init-capture moves a value into a lambda ([p = std::move(ptr)]), and capturing a heavy or move-only object leans on the same move mechanics -- go there for captures, generic and template lambdas, and how a closure stores what it holds."
- slug: "swap-ranges"
  note: "The exchange these moves make cheap: std::swap moves three times instead of copying, a noexcept swap pairs with a noexcept move, and copy-and-swap builds assignment on both -- go there for swap, iter_swap, and a custom swap."
