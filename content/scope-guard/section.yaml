title: "Scope guards and finally"
description: "A small, hand-rolled RAII helper that runs a cleanup action when a scope ends -- on a normal exit, an early return, or an exception -- so the release lives next to the acquire instead of being repeated on every path out. Covers a minimal scope guard, a reusable move-only finally factory, dismissing a guard to commit a transaction, the scope_success and scope_fail variants that fire only on a normal exit or only on an exception (via std::uncaught_exceptions), guarding a C resource that has no RAII wrapper, and moving a guard to transfer the cleanup responsibility out of a function -- alongside the traps: a cleanup that throws (terminate during unwinding), an unnamed guard temporary that fires immediately instead of at scope exit, and a lambda that captures the resource by value too early and cleans up the wrong thing. It is the generalization of RAII for one-off cleanups where writing a dedicated resource class would be overkill."
sort_order: 180
