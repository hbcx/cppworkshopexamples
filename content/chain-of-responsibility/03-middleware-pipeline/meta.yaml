title: "The middleware pipeline (the onion model)"
standard: "C++11"
difficulty: 2
summary: "The other flavour of the pattern: every middleware runs and wraps the next, doing work before and after it calls next(), so control flows inward to a core handler and back out -- the onion model of web frameworks -- and a middleware short-circuits simply by not calling next(), which is how auth rejects a request before it reaches the core."
notes: "Chain of Responsibility has two distinct shapes, and mixing up them causes confusion, so this example draws the second one clearly. The pure chain (earlier examples) is exclusive: handlers are tried until ONE processes the request, and traversal stops there. The pipeline is inclusive: EVERY handler runs, each wrapping the next, so a request passes through all the layers unless one deliberately stops it. This is the middleware model every web framework uses -- Express, ASP.NET, Rack, Django -- and its defining feature is that a middleware surrounds the rest of the chain rather than merely preceding it: it does work, calls next() to run everything inside it, and then does more work as control returns. That is the onion: control flows inward through logging then auth to the core, and back outward through auth then logging, so the log middleware's begin and end bracket everything, which the output shows. Two capabilities fall out of this structure and are why the pipeline form is so widely used. First, before-and-after work in one place: timing, logging, opening and closing a transaction, setting and clearing a context -- a middleware wraps the entire downstream in a try/finally-like bracket without the core knowing, the same wrapping the Template Method NVI idiom and the Decorator pattern achieve by other means. Second, short-circuiting: a middleware that does NOT call next() stops the request from going deeper, which is exactly how auth returns 403 before the core runs and how a cache middleware returns a hit without touching the database. The implementation is a small recursion: run(i) invokes middleware i with a next() that is bound to run(i+1), and the base case calls the core; because next() is called synchronously, the request reference stays alive across the nested calls. A few real-world notes. The order matters and is outer-to-inner: logging outside auth means denied requests are still logged, which is usually what you want; swap them and denials go unlogged. Middlewares can also modify a (non-const) request or a shared response object as it threads through, which is how they add headers or annotate context. And a middleware must call next() at most once per request in this simple model; calling it twice would run the rest of the chain twice. The sign that you want the pipeline rather than the pure chain: cross-cutting concerns -- auth, logging, compression, rate-limiting -- that should wrap a request uniformly, as opposed to a set of mutually exclusive handlers only one of which should act."
