title: "Anti-pattern: one fat handler doing every step"
standard: "C++11"
difficulty: 3
summary: "A chain's value is that each handler has one responsibility and neither knows nor does the next handler's job, so steps can be reordered, reused, tested and inserted independently; a fat handler that crams validate, enrich and save into one method is a chain of one -- impossible to recombine, and every change reopens the same class."
notes: "Chain of Responsibility, and its pipeline cousin, are decomposition patterns: their benefit is not merely that a request flows through handlers, but that each handler is a small, focused, independent unit. A fat handler discards exactly that. FatHandler here does validation, enrichment and persistence in one method, and while it produces the right output, it has none of the properties the pattern exists to provide. You cannot reorder the steps without editing the method; you cannot reuse the validation in a different flow without dragging enrichment and saving along; you cannot test the enrichment in isolation; and you cannot insert a new step (logging, authorization) without reopening and re-reasoning about the whole method. It is a chain of one, and every future change concentrates on the same class -- the opposite of the open/closed extensibility the pattern is chosen for. The good version splits the work into a Validate, an Enrich and a Save handler, each doing one thing and passing the request along, chained in order. Now the steps are independent: reorder them by relinking, reuse Validate in another chain, unit-test Enrich with a single RequestData, and insert an Authorize step between two others by linking it in -- none of which touches the existing handlers. That is single-responsibility applied to a chain, and it is why the pattern decomposes a process into handlers rather than housing the process in one big procedure. The name of this anti-pattern also covers a related coupling smell worth flagging: a handler that reaches into other handlers -- inspecting the whole chain, calling a specific downstream handler by name instead of via next_, or deciding global routing -- which re-introduces the coupling the chain was meant to remove. A handler should know only two things: whether IT handles the request, and that there is a next_ to forward to; anything more (who the other handlers are, what they do, where it sits in the chain) breaks the decoupling and makes handlers non-reorderable and non-reusable again. The judgment: a handler that is more than a screenful, does several unrelated things, or would need other handlers present to be tested, is fat and wants splitting. The tell: a single handle() method containing multiple distinct processing stages, or a handler that references sibling handlers directly rather than only its own successor."
run: true
