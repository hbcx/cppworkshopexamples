title: "Anti-pattern: a request that falls off the end unhandled"
standard: "C++11"
difficulty: 3
summary: "If no handler accepts a request and the chain has no terminal, the request reaches the end and vanishes -- the last next_ is null, the loop ends, nothing happened, and the sender gets no error, so it assumes success. Make the end of the chain a decision: a terminal branch or catch-all handler that reports the miss."
notes: "A chain has an end, and what happens there is a design decision that is easy to leave unmade. HandlerBad forwards a request it cannot accept to next_, and when next_ is null it simply returns -- the request is neither handled nor reported, it is dropped. The danger is not that dropping is always wrong (sometimes ignoring an unmatched request is correct) but that it is SILENT: the sender called handle() and got no exception, no false return, no log, so it cannot tell the difference between handled and lost. Silent drops are among the hardest bugs to diagnose because there is nothing to find -- no crash, no error, just an action that should have happened and did not, discovered much later and far from the chain. The bad output makes it concrete: a code-9 ticket produces no line at all, which in a real system is a support request that disappeared. The fix is to treat the end of the chain as a real case. HandlerGood's terminal branch reports the miss when next_ is null, turning a silent drop into a visible outcome; equally good is a dedicated default handler placed last that accepts everything and does something sensible (route to a dead-letter queue, log a warning, return an error to the caller). Which you choose depends on the domain -- a logging chain might legitimately swallow a below-threshold message, while an approval chain must never lose a request -- but the choice should be explicit, not the accidental result of an if that had no else. This connects to a broader principle for any dispatch mechanism: always define the not-found case. It is the same discipline as checking a map lookup against end() (the Iterator chapter), providing a default label in a State machine's switch, or a default strategy rather than an empty std::function -- the unmatched input is a case, and leaving it to fall through is how it becomes a silent failure. A stronger version, when the language and design allow, is to make 'handled' observable in the type: have handle() return a bool (was it handled) or the sender assert on it, so an unhandled request is a value the caller must confront rather than an invisible non-event. The tell: a chain traversal whose final else is missing or empty, so a request matching no handler produces no output, no error, and no record."
run: true
