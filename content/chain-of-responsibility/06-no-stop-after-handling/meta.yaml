title: "Anti-pattern: no short-circuit after handling"
standard: "C++11"
difficulty: 3
summary: "In the pure chain exactly one handler should process a request and traversal should stop; a handler that processes but forwards anyway lets every downstream handler that also matches process it too, so with overlapping predicates one event is handled several times -- a severity-9 event acted on by the critical, warning and info handlers all at once."
notes: "The pure Chain of Responsibility has an exclusivity contract: the first handler that accepts the request processes it, and the traversal stops. That stop is not automatic -- it is a return the handler must execute -- and omitting it silently converts the exclusive chain into an inclusive one where every matching handler runs. LoggerBad shows the mistake: it emits when it accepts, but then unconditionally forwards to next_, so a severity-9 event, which satisfies critical (>=8), warning (>=5) and the catch-all info handler alike, is paged AND logged as a warning AND logged as info -- three actions for one event. Whether this is a bug depends entirely on the intended flavour, which is exactly why it is dangerous: the code looks reasonable, and if the predicates never overlapped it would even work, hiding the missing return until the day two handlers both match. The fix is one token -- return after handling -- as LoggerGood does, restoring the property that the highest-priority matching handler acts and no other. This anti-pattern is the mirror of the previous one: there a request that should have been handled once was handled zero times (fell off the end); here a request that should be handled once is handled many times. Both come from getting the traversal's control flow wrong, and both are invisible in a casual test. The deeper point is to be deliberate about which flavour you are building. If you want exactly one handler, every handler must stop after acting (return, or the else-if structure that makes forwarding and handling mutually exclusive). If you genuinely want every matching handler to run -- collecting all validation errors, notifying every interested listener -- then you are building the inclusive pipeline or an Observer-style broadcast, and you should say so explicitly rather than reach it by forgetting a return, because a reader cannot tell an intentional fall-through from a bug. Note the contrast with the middleware pipeline example, where every handler running IS the design: there each middleware calls next() on purpose and the wrapping is the point; here forwarding after handling is accidental and the double-processing is unwanted. The tell: a handler that performs its action and then reaches a forward-to-next statement on the same path, so an accepting handler does not terminate the traversal."
run: true
