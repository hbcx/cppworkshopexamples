title: "A std::function chain of handlers"
standard: "C++11"
difficulty: 2
summary: "When a handler is just a test plus an action, a class hierarchy is overkill: store the chain as a vector of std::function<bool(Request&)> -- each returns true if it handled the request -- and dispatch by trying each in turn until one claims it, with lambdas standing in for the handler classes."
notes: "The classic Chain of Responsibility uses a handler interface and one class per handler, which is the right weight when handlers carry state or a rich interface, but heavy when a handler is merely a predicate and a small action. The std::function form collapses that: the chain is a std::vector<std::function<bool(const Event&)>>, each element a callable that returns true if it handled the event and false to decline, and dispatch is a loop that tries each until one returns true. No Handler base class, no per-handler type, and the handlers can be lambdas that capture whatever context they need -- the same simplification the Strategy and Command chapters make with std::function, applied to a chain. This form makes the pattern's structure especially visible. The order of the vector IS the order of the chain, so priority is just position -- the critical handler is first because it should get first refusal -- which is also why a misordered vector is this chapter's fragile-ordering anti-pattern. The bool return is the handled/not-handled signal that drives the traversal, and getting it wrong (returning true when you did not act, or forgetting to return at all) breaks the chain, which the missing-short-circuit anti-pattern covers. And the terminal is explicit: the last lambda is a catch-all that always returns true, so the loop's after-the-loop 'unhandled' branch is reached only if you forgot the catch-all -- making the end-of-chain decision a visible line rather than an accident. The trade-offs against the class form are the usual composition-versus-inheritance ones. The function chain is less code, trivially reorderable and buildable at runtime (push handlers into the vector from config), and handlers compose with the whole language of lambdas; the class form earns its keep when a handler needs member state, a name and place in a hierarchy, or several methods beyond the one call. A note on the signature: passing the request by reference (here const, but non-const when handlers mutate or annotate it) lets handlers share and modify a single request object as it flows, which is common in real pipelines. The tell that this form fits: handlers that are each a couple of lines of 'if it matches, do X and stop', where a class per handler would be more boilerplate than logic."
