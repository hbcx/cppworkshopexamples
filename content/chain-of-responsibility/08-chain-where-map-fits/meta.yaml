title: "Anti-pattern: a chain where a lookup table fits"
standard: "C++11"
difficulty: 3
summary: "Chain of Responsibility earns its indirection when handlers have ranges, priorities or overlapping conditions; when every handler just checks the request against one exact key, the chain collapses into a linear scan of equality tests -- O(n) per request, selection logic scattered -- and what you have is keyed dispatch, which a hash map does in O(1) in one place."
notes: "Every pattern has a boundary where it stops paying for itself, and Chain of Responsibility's is exact-key selection. The pattern's value comes from handlers that decide dynamically -- an approver that checks a range, a middleware that inspects context, a handler whose acceptance depends on runtime state -- where the chain expresses 'ask each in turn whether it applies'. When instead each handler's test is nothing more than request == some-constant, the asking-in-turn is a linear scan of equality comparisons: the chain is doing a dictionary lookup the slow way. The costs are concrete. It is O(n) in the number of handlers per request, where a hash map is O(1); the routing is scattered across n handler bodies instead of visible in one table, so understanding what commands exist means reading every handler; and adding a command means writing another handler and inserting it in the right place rather than adding one row. The good version makes the intent explicit: an unordered_map from key to action is the data structure keyed dispatch actually calls for, constant-time, centralized, and trivially extensible. This is the counterpart to the enum-and-switch anti-patterns elsewhere in the design-pattern chapters, seen from the other side: there, a switch was used where polymorphism (Strategy, State, Command) belonged; here, a polymorphic chain is used where a plain lookup belongs. Both errors come from not matching the mechanism to the shape of the decision -- open-ended runtime conditions want polymorphism, a fixed set of exact keys wants a table. The judgment is to read what the handlers actually test. If they test ranges, combinations, priorities, or mutable state, or if more than one might apply and order matters, keep the chain -- that is genuine chain-of-responsibility. If they each test one constant key and are mutually exclusive, replace it with a map (or a switch for a small fixed enum). A middle case exists -- a handful of handlers with cheap distinct predicates -- where a short chain is perfectly fine and a map would be over-engineering; the anti-pattern is the LONG chain of exact-match string comparisons that grows one branch per key. The sign: a chain (or a long if-else-if) where every handler's condition is an equality test against a distinct constant, and no handler's decision depends on anything but that key."
