title: "Anti-pattern: fragile handler ordering"
standard: "C++11"
difficulty: 3
summary: "In a first-match chain a general handler placed before a specific one swallows the requests the specific handler was meant to take, because the general handler accepts everything and the traversal never reaches the specific one; the chain still handles every request, just with the wrong handler -- order from most specific to most general, catch-all last."
notes: "A first-match chain makes order semantically significant: the position of a handler is its priority, so the arrangement of the chain is part of its correctness, not a cosmetic detail. This anti-pattern is what happens when that is forgotten. A catch-all handler that accepts everything is placed before a specific handler, so when a /admin request arrives the catch-all claims it first and the traversal stops -- the admin handler, sitting later in the chain, is never reached. The sneaky part is that nothing looks broken: every request is handled, no error occurs, the output is believable. It is only handled by the WRONG handler, a correctness bug with no symptom until someone notices admin requests are getting generic treatment. Reordering the chain -- specific first, catch-all last -- fixes it with no change to any handler, which is The sign that the bug was in the ordering, not the logic. The rule is general: in a first-match chain, handlers must be ordered from most specific to most general, and a catch-all belongs at the very end, precisely because it accepts everything and would shadow anything after it. This is the same shadowing hazard as an over-broad case before a narrow one, an exception catch(...) before a specific catch, or a wildcard route before an exact route -- ordering hazards all sharing one shape: a broad matcher placed ahead of a narrow one it subsumes. The deeper discomfort is that correctness resting on manual ordering is fragile: someone appends a handler in the wrong place, or sorts the list for tidiness, and the behaviour changes silently. Where that fragility matters, reduce reliance on order -- make predicates disjoint so at most one matches (then order cannot change the outcome), assign explicit priorities the chain sorts by rather than trusting insertion order, or, when selection is really by an exact key, use a lookup table instead of an ordered scan (the next anti-pattern). The honest note: ordered fall-through is a legitimate and common design -- routing tables, cascading style rules, and pattern matches all rely on it -- so the goal is not to avoid ordering but to make it deliberate and visible, and to keep the general cases behind the specific ones. The sign: a chain or first-match list where a broad or catch-all handler precedes a narrower one, so the narrow handler is unreachable for the inputs both would accept."
run: true
