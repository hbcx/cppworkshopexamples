title: "Anti-pattern: a dangling next_ link"
standard: "C++11"
difficulty: 3
summary: "Handlers are usually linked by raw pointers, which own nothing, so a handler destroyed while an earlier handler's next_ still points at it leaves that link dangling -- following it is use-after-free. Make the chain own its handlers with unique_ptr, so a link can never outlive its target and destroying the head tears down the chain in order."
notes: "The convenience of building a chain from raw next_ pointers (as the basics and event-bubbling examples do, safely, because their handlers all outlive the chain) hides a lifetime obligation: a raw pointer owns nothing, so the chain's correctness depends entirely on every handler outliving every link that points to it, and nothing in the code enforces that. When it fails -- a handler is a local in a scope that ends, a handler is deleted while still linked, handlers are destroyed in an order that frees a successor before its predecessor -- an earlier handler's next_ becomes a dangling pointer, and the next request that reaches it follows the link into freed memory: use-after-free, undefined behaviour. Like most lifetime bugs it often appears to work, because the freed storage is briefly intact, which is why the broken case here is described in a comment and not run: undefined behaviour must not go through the compile gate, where it could crash on one compiler and pass on another. The fix is to make ownership explicit and match the chain's structure: have each handler OWN its successor through a unique_ptr next_, so the lifetime of the rest of the chain is tied to the handler that heads it. Now a link cannot outlive its target -- the target is owned by the link -- and destroying the head destroys the whole chain in order, each handler freeing the one after it. Building such a chain is done tail-first (construct the last handler, then hand it to the one before via setNext(std::move(...))), because ownership flows from head toward tail. This choice has a bonus the accidental-cycle example noted: single-ownership via unique_ptr makes cycles structurally impossible, since a handler cannot own one of its ancestors. The alternative ownership models each fit some situations: shared_ptr next_ when handlers are genuinely shared between chains (at the cost of a reference count and the risk of cycles that then need weak_ptr), or a container that owns all handlers with the chain holding non-owning links into it (fine as long as the container outlives the chain). What you must not do is leave ownership unstated and hope the handlers happen to live long enough, which is the raw-pointer chain's default failure mode. The sign: a handler linked into a chain with a raw pointer while its lifetime is shorter than, or unrelated to, the handler that points at it -- a local, a temporary, or an object destroyed out of order."
run: true
