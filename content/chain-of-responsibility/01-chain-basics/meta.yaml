title: "Chain of Responsibility basics: pass until handled"
standard: "C++11"
difficulty: 1
summary: "Each handler either processes the request or forwards it to the next, so the sender hands the request to the head of the chain without knowing which handler will act on it; an expense approval escalates by amount through team lead, manager and director, with a terminal branch reporting anything that falls off the end."
notes: "Chain of Responsibility decouples the sender of a request from its receiver by giving more than one object a chance to handle it: the request travels along a chain, and each handler decides whether to process it or pass it on. The sender holds only the head of the chain and knows nothing about who ultimately handles the request, which is the decoupling the pattern buys -- main here calls lead.handle(...) and never mentions Manager or Director. The mechanic is a linked list of handlers plus one rule per handler: if I can handle this, do it; otherwise forward to my successor. The base Approver encodes that rule once in handle(), and each concrete approver supplies only its own canApprove and approve, so adding a new tier (a VP between manager and director) is a new class inserted into the chain, with no edit to the others or to the sender -- the open/closed benefit the pattern shares with Strategy and State. Three design points this first example fixes and the rest of the chapter builds on. First, the chain has a terminal: when a handler has no successor and cannot handle the request, the base reports it rather than silently dropping it -- what happens at the end of the chain is a decision, not an accident, and forgetting it is this chapter's first anti-pattern. Second, this is the PURE form of the pattern: exactly one handler processes the request and the traversal stops there (the else-if structure means a handler that approves never forwards), as opposed to the pipeline form where every handler runs, which a later example shows. Third, the handlers here are non-owning links between stack objects that all outlive the chain; who owns the handlers and how long they live is a real question the dangling-next anti-pattern addresses. The classic shape uses inheritance and virtual dispatch, which reads clearly and suits handlers with real state; the next example shows the lighter std::function form for when a handler is just a small predicate-and-action. The sign that a problem wants this pattern: a request that several candidates might handle depending on runtime conditions, where you would otherwise write a growing if-else-if in the sender that couples it to every possible handler."
run: true
