title: "Event bubbling: the chain is a parent hierarchy"
standard: "C++11"
difficulty: 3
summary: "A very common Chain of Responsibility hides in GUI toolkits: an event is delivered to the widget it happened on, and if that widget does not handle it, it bubbles up to the parent, then the grandparent, until one consumes it or it reaches the top -- the chain's next link is the parent pointer, and consuming an event stops the propagation."
notes: "This example shows that the chain's links do not have to be a purpose-built list -- they can be a structure you already have, here the parent pointers of a widget tree. An event is dispatched to the widget where it occurred, and each widget either handles it (consuming it and stopping) or lets it bubble up to its parent, exactly the Chain of Responsibility rule with the parent relationship as the successor link. This is how DOM events, Qt, and most UI frameworks route input: a click lands on a button, and if the button has no handler for it, the event rises to the panel, then the window, so different levels can own different events -- the button owns click, the panel owns menu, the window owns close -- without any level knowing what the others do. The pattern's decoupling is what makes this scalable: a widget handles the events it cares about and is blissfully ignorant of both its children's handling and its ancestors', so you can reparent widgets or insert a container in the middle and the routing still works. Two mechanics are worth calling out because they generalise beyond GUIs. Consuming an event -- returning true here, often called stopPropagation or accept() in real toolkits -- is the short-circuit that ends the bubble; without it the event keeps rising, which is the correct default for an unhandled event and the wrong behaviour for one already dealt with, so whether a handler consumes is a real decision. And reaching the top unhandled is the terminal case again: the root has no parent, so the dispatch reports the event as unhandled rather than losing it, the same end-of-chain discipline the basics example insisted on. Real frameworks add nuances this stays clear of -- a capture phase that runs top-down before the bubble runs bottom-up, and a distinction between the target and the current node -- but the core is this bubble. Note the parent links are non-owning: a child points at its parent, which outlives it, and the tree's ownership runs the other way (a parent owns its children), so the successor pointers never dangle as long as the tree is intact. The sign that an existing hierarchy is really a Chain of Responsibility: a request that should be tried at the most specific level and escalate toward the most general -- a node, then its container, then the root -- until something takes responsibility."
