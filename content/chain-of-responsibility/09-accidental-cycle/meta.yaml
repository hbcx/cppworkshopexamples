title: "Anti-pattern: an accidental cycle in the chain"
standard: "C++11"
difficulty: 3
summary: "A chain is a linked list, and wiring it by hand makes it easy to point a handler's next_ back at an earlier one, forming a cycle; a request no handler accepts then loops forever, because the traversal never reaches a null next_. A well-formed chain ends in a null successor -- the cycle is the bug, and a hop limit only makes it visible."
notes: "Because a Chain of Responsibility is a hand-linked list, it inherits every hazard of hand-linked lists, and the sharpest is the accidental cycle. Wiring next_ pointers manually -- especially with a fluent setNext or in configuration-driven setup -- makes it easy to link the last handler back to an earlier one, or to link a handler to itself, so the chain has no end. As long as some handler accepts every request the loop is never entered fully, which is exactly why the bug hides: it surfaces only for a request that no handler accepts, when the traversal keeps following next_ around the loop and never reaches the null that would stop it. That is an infinite loop, and depending on the traversal it is either a hang (an iterative walk) or a stack overflow crash (a recursive handle() calling next_->handle()). The example cannot actually run the infinite version under the compile gate, so it carries a hop limit that aborts after a bounded number of steps and reports a suspected cycle -- but that limit is a DIAGNOSTIC, not the fix. A correct chain simply does not contain a cycle: it terminates in a null next_, as the good half shows once the back-link is removed. The real defenses are structural. Prefer construction that makes cycles hard or impossible: build the chain so ownership runs one direction (each handler owns its successor via unique_ptr, as the dangling-next example does, which makes a cycle a compile-or-logic impossibility because a handler cannot own an ancestor), or build it from a validated list rather than by poking pointers. When a chain is assembled dynamically from external configuration, validate it -- walk it once at setup with a visited set and reject a cycle loudly at construction, when it is cheap to find, rather than discovering it as a production hang. And keep a hop or depth ceiling on the traversal in systems where the chain is not statically known, so a mis-wired chain fails fast and observably instead of hanging. The tell: next_ pointers assigned so that following them can return to an already-visited handler -- a handler linked to itself, a last handler linked back to the head, or two handlers linked to each other -- with no null terminator on the cycle."
