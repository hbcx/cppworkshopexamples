- slug: "accumulate-reduce"
  note: "Where the arithmetic objects become reduce operations: accumulate, reduce, inner_product and transform_reduce take std::plus/multiplies as the combining op -- go there for folding a range and the init-type and associativity traps."
- slug: "priority-queue"
  note: "The container that reads a comparator backwards: std::greater as its Compare gives a MIN-heap, the direction surprise this section warns about -- go there for heaps, top-k, and choosing the comparator."
- slug: "maps"
  note: "Where a transparent comparator pays off: an ordered map keyed by std::string uses std::less as its Compare, and std::less<> enables const char*/string_view lookup with no temporary key -- go there for ordered maps, comparators, and lookup."
- slug: "invoke-bind-mem-fn"
  note: "The tools that call and adapt any callable, including these objects: std::invoke calls one uniformly and std::bind composes one (the over-composition this section warns against) -- go there for invoke, bind, and mem_fn."
