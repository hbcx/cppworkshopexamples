title: "Standard function objects"
description: "The ready-made callable types in <functional> that wrap a single operator: the arithmetic family (plus, minus, multiplies, divides, modulus, negate), the comparisons (less, greater, equal_to and the rest), the logical operators (logical_and/or/not) and the bitwise ones (bit_and/or/xor). Because each is a named, stateless, default-constructible TYPE, it drops straight into an algorithm or a container's template argument where a lambda's unique type would not. Covers calling and passing them, arithmetic objects as named reduce operations with accumulate/transform/inner_product, comparison objects as the Compare argument of set/map/priority_queue, the C++14 transparent (void) specializations that deduce their argument types and enable heterogeneous lookup, and the logical and bitwise families -- alongside the traps: a non-transparent comparator building a temporary key on every lookup, reading a comparator's direction from its name (the priority_queue min-heap surprise), and gluing function objects together with bind instead of writing a lambda. For the comparator's role inside a specific container see that container's chapter; this section is about the function objects themselves."
sort_order: 160
