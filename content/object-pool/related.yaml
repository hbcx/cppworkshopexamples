- slug: "prototype"
  note: "The clone-based way to dodge expensive construction: Prototype copies an already-configured object, where a pool reuses a live one and takes it back afterward -- duplicate vs recycle."
- slug: "singleton"
  note: "A pool is almost always exposed as one shared service, so it inherits the singleton's global-access and lifetime questions; go there for how a single shared instance is created and controlled."
- slug: "factory-method"
  note: "The other side of asking for an object instead of newing it yourself: a factory method decides which object to make, where a pool decides which existing one to lend -- creation vs reuse behind the same acquire-style call."
- slug: "dependency-injection"
  note: "How a pool reaches its consumers: build it once at the composition root and inject the one instance into every consumer, instead of each reaching for it through a global -- go there for wiring a shared resource in."
- slug: "flyweight"
  note: "The sharing cousin: where an Object Pool recycles mutable objects one owner at a time, Flyweight shares immutable objects concurrently across many owners -- go there when duplication, not creation, is the cost you are fighting."
- slug: "atomic"
  note: "What the shared-pool-without-a-lock anti-pattern actually needs: a pool handed out across threads must guard its free-list with an atomic or a lock, or the checkout races -- go there for atomic operations, compare_exchange, and the memory ordering behind safe sharing."
- slug: "operator-new-delete"
  note: "The language hook a pool plugs into: a class operator new/delete lets `new T` draw from your free-list, and placement new builds objects in the slab you reserved. Go there for the allocation functions this pattern is built on."
- slug: "uninitialized-memory"
  note: "How a pool builds and tears down objects in the raw slots it hands out: construct on checkout with placement new or the uninitialized_* algorithms, destroy on return with destroy_at. Go there for the construction and teardown half of the slots a pool reserves."
