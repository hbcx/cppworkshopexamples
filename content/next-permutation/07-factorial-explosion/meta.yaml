title: "Anti-pattern: brute-forcing a large set"
standard: "C++11"
difficulty: 2
summary: "The number of permutations of n elements is n!, which grows explosively: 10! is millions, 13! is billions, 15! is over a trillion. Enumerating all permutations with next_permutation is only feasible for a handful of elements; brute-forcing a real problem this way does not scale, and a smarter method is needed."
notes: "next_permutation makes exhaustive search over orderings trivial to write, which is a trap for larger inputs, because the number of orderings is n! and factorial growth is brutal: 5! is 120, 10! is about 3.6 million, 13! is over 6 billion, 15! is over 1.3 trillion, and 20! exceeds 2.4e18. So a loop that is instant for 8 elements would run for years at 20, no matter how fast each step is -- the algorithm is fine, the SIZE of the answer is the problem. Reaching for next_permutation to brute-force something like the shortest route through 15 cities (the travelling salesman problem) means asking to visit 15! arrangements, which is hopeless. The lesson is to bound the input: exhaustive permutation is a legitimate tool ONLY for tiny n (roughly 10 or fewer), for a genuinely small search, a test that tries every input order, or a puzzle with few pieces. Beyond that, the problem needs a method that does not look at every ordering -- dynamic programming (Held-Karp for TSP), branch and bound that prunes whole subtrees, a greedy or approximation heuristic, or exploiting structure specific to the problem. The sign to watch for: a next_permutation enumeration whose element count is not provably small, or that is fed a size determined at runtime by user or production data."
