# Related chapters -- cross-links shown at the bottom of the section page.
- slug: "atomic"
  note: "The primitive threads use to share data safely: the moment two threads touch the same value and one writes, you need synchronization, and an atomic is the lock-free way to do it -- go there for atomic counters, compare_exchange, the wait/notify this section uses for its detach handshake, and the memory ordering behind it all."
- slug: "mutex"
  note: "The other way threads share data safely, for state bigger than one word: a mutex guards a whole critical section so a multi-field update stays consistent -- go there for lock_guard and unique_lock, the thread-safe class, scoped_lock against deadlock, and shared_mutex for many readers."
- slug: "condition-variable"
  note: "How one thread waits for another to produce work instead of busy-polling: a condition variable puts a thread to sleep until shared state is ready -- go there for the producer/consumer queue and the clean worker shutdown that a raw std::thread otherwise has to hand-roll."
- slug: "future"
  note: "The easier way to get a RESULT back from a thread: where std::thread cannot return a value and makes you join by hand, std::async runs a function and hands you a future that carries the return value, the exception, and the synchronization -- go there for async, promise, packaged_task, and shared_future, and use raw std::thread when you need to own the thread itself."
- slug: "execution-policies"
  note: "The higher-level way to get parallelism without managing threads by hand: pass a parallel policy to a standard algorithm and the library runs it across a thread pool for you -- go there when your parallel work is really a sort, a transform, or a reduce, rather than something that needs raw std::thread."
- slug: "jthread"
  note: "The C++20 upgrade of everything here: std::jthread joins itself in its destructor (killing the forgot-to-join crash) and carries a stop_token for cooperative cancellation -- go there for auto-join, request_stop, stop_source/stop_callback, and interruptible waits, and treat raw std::thread as the manual version."
- slug: "latch-barrier"
  note: "Higher-level ways to make threads wait for each other: a std::latch waits for N tasks to finish (when you cannot join them), and a std::barrier synchronizes a fixed group across repeated phases -- go there when join is not the right fit, and come back here for the launching and joining they sit on top of."
- slug: "raii"
  note: "The ownership idea std::jthread is built on: a destructor that cleans up automatically is exactly what turns the forgot-to-join crash into a non-issue -- go there for RAII in general, then see why jthread is just RAII applied to a thread."
