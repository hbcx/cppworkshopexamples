title: "Type conversions and casts"
description: "How one type turns into another in C++, from the conversions the compiler does for you to the four named casts you write by hand. Covers implicit conversions (standard and user-defined), static_cast for numeric and hierarchy conversions, dynamic_cast for a checked downcast in a polymorphic hierarchy, const_cast for adding or removing const, reinterpret_cast for low-level bit reinterpretation, the C-style cast and what it really expands to, controlling implicit conversions with explicit, and C++20 std::bit_cast for safe type punning -- alongside the traps: an unchecked static_cast downcast to the wrong type, a const_cast that writes to a truly const object, reinterpret_cast that breaks strict aliasing, a C-style cast that silently becomes a reinterpret_cast, an unchecked dynamic_cast result, and a cast written only to silence a warning that hid a real bug. Prefer the named casts, keep each conversion visible and intentional, and let the compiler check what it can."
sort_order: 137
category: "Language & object model"
