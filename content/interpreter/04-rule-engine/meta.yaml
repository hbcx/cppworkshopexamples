title: "A rule engine over records"
standard: "C++11"
difficulty: 3
summary: "Interpreter as it earns its keep: a small language of business rules over data. The sentences are boolean predicates built from field comparisons (age > 17) combined with And/Or/Not, the Context is a Record whose fields the comparisons look up, and a rule is built once and run over many records -- so eligibility, targeting, and filtering logic live as data-driven trees instead of scattered if-chains."
notes: "The earlier examples were arithmetic and boolean toys; this is the shape Interpreter takes in real systems, and the reason to reach for it. The problem it solves is business rules that must be expressed, changed, and evaluated as DATA rather than baked into code: who is eligible for an offer, which users see a feature, which records pass a filter, when an alert fires. Encoding such rules as a small predicate language -- field comparisons combined with and/or/not -- lets a rule be a value (a tree) that can be built from configuration, stored, sent over the wire, and run over every record, instead of a hard-coded if-chain that only a developer can change and only a redeploy can update. Here the grammar's terminals are comparisons (Greater, Equals) that look a field up in the Record context, its non-terminals are And and Or, and the rule age > 17 AND (vip == 1 OR priority > 5) is one tree evaluated over three records to yield three answers. Swap the rule for one read from a config file and the same engine serves a different policy with no code change -- that data-driven flexibility is the whole payoff. This example also makes vivid a decision the Visitor chapter foreshadowed: interpret/eval lives as a method ON each rule class, which is exactly right BECAUSE evaluation is the one operation this grammar exists for. The moment you need a SECOND operation over the same rules -- render a rule back to human-readable text for an audit log, validate that every referenced field exists, estimate a rule's selectivity for query planning, or simplify a rule algebraically -- you face the choice Visitor formalises: add another virtual method to every rule class (fine for one or two), or pull the operations out into visitors over the rule grammar (better once they multiply). A rule engine that grows an admin UI, a validator, and an explainer is a textbook case for layering Visitor on top of an Interpreter grammar, and the two patterns compose cleanly because the rule tree is already a Composite. Practical notes for a real engine, several of which the anti-patterns expand. Parse the rule text once into a tree and reuse the tree across records rather than re-parsing per record; pass the record as a context rather than reading globals so the engine is reentrant and rules can be evaluated in parallel; decide deliberately what a missing field or a type mismatch means (default versus error) instead of silently defaulting; and keep the grammar small -- a rule DSL that starts sprouting functions, arithmetic, and precedence is drifting toward a real language that a parser generator or an existing expression library will handle better than hand-rolled classes. The tell that a rule engine wants Interpreter: conditions that change more often than the code, that non-developers or config should control, and that must run over many items -- currently a growing thicket of hard-coded if statements."
