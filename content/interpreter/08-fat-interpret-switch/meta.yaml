title: "Anti-pattern: a fat interpret() switching on a node tag"
standard: "C++11"
difficulty: 3
summary: "The tree can be built without the pattern -- a single Node struct with a kind tag, interpreted by one function that switches on it. It works but is the enum-and-switch design the pattern replaces: adding a kind edits the switch, a second operation duplicates the whole switch, and a forgotten case falls through a silent default. A class per rule with a virtual interpret puts each kind's logic in one place."
notes: "Interpreter is, at heart, the application of polymorphism to a grammar: one class per rule, each interpreting itself. This anti-pattern does the same job with a tagged union and a switch instead, and it is worth showing because it is a genuinely tempting shortcut -- the switch version is compact and needs no class hierarchy. The bad Node here carries a kind enum and the fields every kind might use, and interpretBad switches on the kind to combine them. It produces the right answer, so what is wrong is not correctness but the same set of costs the enum-and-switch anti-patterns across the design-pattern chapters share. Adding a node kind (a Sub, a Div) means adding an enumerator and a case, editing a function that already handles every other kind, and hoping the compiler warns about the missing case -- which, with a default arm present as here, it will not, so a forgotten kind falls through to a silent 0. Adding a second OPERATION is worse: pretty-printing the tree, optimising it, or type-checking it each needs its own function with its own copy of the same switch over the same kinds, so the kind list is duplicated across every operation and they drift out of sync. And the fields are untyped and loosely coupled -- value is meaningless for an Add, l and r are null for a Num -- so the struct invites the exact confusion (reading l on a Num) the type system would otherwise prevent. The class-per-rule version fixes all of this the way the pattern intends. Each kind is a class holding exactly the data it needs (Number has a value, Add has two children), each implements interpret for itself so a kind's logic lives in one place, and because interpret is a pure virtual, a new kind is a new class the compiler forces to implement it -- no switch to forget. A second operation is then either another virtual method (fine for one or two) or, once operations multiply, a Visitor over the grammar -- which is exactly the extensibility the switch cannot offer, since a Visitor plugs into a class hierarchy, not a tag. The honest nuance mirrors the other enum-switch anti-patterns: for a tiny, truly fixed grammar with a single operation that will never grow, a tagged struct and a switch are simpler and fine, and the modern std::variant + std::visit form is the type-safe way to write exactly that (a closed set, exhaustiveness checked) without the loose fields or the silent default. The anti-pattern is the hand-rolled kind enum with untyped fields and a switch that must be edited for every new kind and duplicated for every new operation. The sign: an AST or expression represented as a struct with a type tag and a union of fields, interpreted by a function that switches on the tag -- especially once a second such switch appears for a second operation."
run: true
