title: "The Context: variables looked up at interpret time"
standard: "C++11"
difficulty: 2
summary: "A language is useful once its sentences refer to inputs: the Context holds the bindings (named variables), interpret() takes it, and a Variable terminal looks its value up at evaluation time -- so the same expression tree can be interpreted against different contexts for different answers, building the rule once and evaluating it against many inputs."
notes: "The basics example had constant leaves, so a tree evaluated to a fixed answer -- correct but inert. The Context is what turns the grammar into a real interpreter: it is the third role of the pattern (alongside the abstract expression and the concrete expressions), holding whatever global information interpretation needs, most often the bindings of the variables a sentence may reference. Adding it changes two things. interpret now takes a const Context&, threaded down the recursion so every node sees the same inputs, and a new terminal appears -- Variable -- whose interpret does not return a stored value but LOOKS ONE UP in the context by name. That indirection is the whole point: a Variable is a placeholder resolved at evaluation time, so the expression (x OR y) AND NOT z is a rule about variables, not a fixed truth value. The payoff is reuse, shown directly here: the rule tree is built once and interpreted against two different contexts, giving true for one set of bindings and false for another, with no rebuilding of the tree. This is the shape every real use of Interpreter takes -- a filter compiled once and run over every row, a formula parsed once and recomputed as inputs change, a targeting rule evaluated per user -- and it is why the Context is passed as a parameter rather than baked into the nodes: the nodes are the immutable program, the context is the changing input, and separating them lets one program run on many inputs. Two design notes. The context is passed by const reference here because interpretation only READS the bindings; interpreters that also produce side effects or accumulate results (a language with assignment, or a visitor-style collector) take a mutable context, but keeping it const when you can makes the interpretation obviously input-only and safe to run concurrently on the same tree with different contexts. And passing the context explicitly, rather than reading globals, is what keeps the interpreter reentrant -- two evaluations with different contexts do not interfere -- which the global-state anti-pattern shows going wrong. This example keeps the missing-variable case simple (an unknown name defaults to false); real interpreters must decide whether a missing binding is a default or an error, which the invalid-input anti-pattern takes up. The sign that you want a context: a grammar whose leaves stand for inputs that change between evaluations, so the same parsed expression must be run against many different sets of values."
