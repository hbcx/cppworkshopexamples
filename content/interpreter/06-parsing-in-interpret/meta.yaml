title: "Anti-pattern: parsing fused into interpretation"
standard: "C++11"
difficulty: 3
summary: "The pattern separates the grammar's representation and interpretation from how a sentence is parsed; fusing them -- a single pass that scans text and computes an answer, leaving no tree -- works for one evaluation but gives up reuse, a second operation over the structure, and inspection. Parse to a tree first, which can then be interpreted and printed."
notes: "The Gang of Four are careful to scope Interpreter to the grammar's representation and its interpretation, explicitly leaving parsing as a separate concern, and this anti-pattern collapses that separation. evalBad scans the expression and computes the result in the same loop -- it accumulates as it reads -- so when it returns, all that exists is a number; the structure of the expression was never built and is gone. For a single throwaway evaluation that is fine, and if that is genuinely all you need, this fused pass is even simpler than the pattern. But it gives up everything a tree gives you, and those things are usually why you adopted Interpreter in the first place. A parsed tree is a reusable artifact: it can be interpreted many times over different contexts (parse once, run per record), printed or serialised back to text, walked by a Visitor to add a second operation (type-check, optimise, explain), transformed by a simplifier, or cached and stored. The good version here demonstrates the smallest slice of that payoff -- because it parses to a tree, the SAME tree is both interpreted (to 14) and pretty-printed (to ((3 + 4) * 2)) -- which the fused evalBad cannot do at all, because it has no structure to print. That gap generalises: any second thing you ever want to do with an expression is impossible once parsing and evaluating are one pass, so the fusion quietly caps the design at exactly one operation performed exactly once. The fix is the two-phase discipline the parsing example established: a parse function that consumes text and RETURNS a tree, and interpretation (and any other operation) that consumes the tree. Keeping them separate is not extra ceremony; it is what makes the expression a value you can pass around, reuse, and operate on in more than one way. This anti-pattern is the root that two others grow from: re-parsing on every evaluation is what you are forced into when there is no tree to keep, and mixing parsing INTO the grammar classes (a node whose interpret re-tokenises a string) is the same fusion pushed inside the objects. The honest exception, again, is the one-shot case: a script run once, a config value read at startup and never again -- there, building a tree you will use once is arguably over-engineering, and a direct parse-and-evaluate is reasonable. The anti-pattern is fusing them when the expression will be evaluated more than once, needs more than one operation, or should be inspectable. The sign: a function that takes expression text and returns the answer with no tree in between, or grammar objects whose interpret method does its own scanning and tokenising."
run: true
