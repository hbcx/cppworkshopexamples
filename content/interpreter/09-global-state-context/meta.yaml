title: "Anti-pattern: global state instead of a Context"
standard: "C++11"
difficulty: 3
summary: "The Context makes interpretation a pure function of tree and inputs: pass the bindings in, and the same tree evaluates independently against any inputs. Put the bindings in a global and interpretation depends on hidden mutable state -- two evaluations that should be independent share it, so one that forgets to set a variable reads another's leftover value, and the interpreter cannot run from two places at once."
notes: "The Context is not decoration; it is what makes an interpreter well-behaved, and replacing it with globals reintroduces every problem shared mutable state causes. When bindings are passed as a Context, interpret is effectively a pure function of the tree and that context: the same tree evaluated with c1 and with c2 gives two answers that cannot interfere, because nothing is shared between the two calls. VarBad instead reads a global map, so its result depends on whatever the global happens to hold at the moment of the call, and the example shows the consequence: a first evaluation sets x to 10 and reads 10, then a second, logically independent evaluation that should see x as 5 forgets to set it (the code updated a different variable) and silently reads the stale 10 left by the first. Nothing errors; the answer is just wrong, and the bug is the classic one of hidden shared state -- action at a distance, where a value set in one place leaks into an unrelated evaluation elsewhere. Three concrete failures follow from the global, all avoided by the Context. First, reentrancy: two evaluations cannot be running at once (a rule evaluated while evaluating another, a recursive interpreter, an interpreter called from a callback) because they would clobber each other's bindings; a Context is local to each evaluation, so nesting is fine. Second, thread safety: the global is a shared mutable object, so evaluating rules on multiple threads is an immediate data race, while a per-evaluation Context passed by const reference lets the same tree be interpreted concurrently against different contexts with no synchronisation. Third, testability and clarity: an interpreter that reads globals must have those globals set up just so before each test and reset after, and its dependencies are invisible in its signature, where interpret(const Context&) states exactly what it needs and isolates each call. The fix is simply to pass the Context, as the good half does -- gx.eval(c1) and gx.eval(c2) are independent by construction. This is the same lesson the Strategy chapter's mutable-shared-strategy and the general rule against global mutable state teach, specialised to interpreters: the tree is the shared immutable program, the context is the per-run input, and mixing the input into a global couples runs that should be independent. The honest exception is a genuinely process-wide, read-mostly constant (a global configuration the language treats as ambient), which can live outside the context -- but variable bindings that differ per evaluation are exactly what must be passed, not shared. The sign: grammar nodes that read a global (or a singleton, or a static) for their inputs, an interpret with no context parameter, or tests that must set global variables before evaluating."
run: true
