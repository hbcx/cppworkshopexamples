title: "Anti-pattern: Interpreter for a single fixed expression"
standard: "C++11"
difficulty: 3
summary: "Interpreter earns its machinery when a language is evaluated at runtime with inputs that vary; building the grammar-class apparatus to compute one fixed, hard-coded expression is ceremony -- there is no language, no input, no runtime variation, so the tree computes a constant the expression would state directly. If the formula is fixed and known at compile time, just write it."
notes: "Interpreter is a heavyweight pattern -- an expression base class, a class per grammar rule, tree construction, and virtual dispatch through the whole structure -- and it earns that weight from a specific payoff: a language whose sentences come from OUTSIDE the code (user input, configuration, a rule editor) and are evaluated at runtime, often against varying inputs. Strip that away and nothing is left to justify the machinery. The bad version here builds an Add over two Numbers to compute 2 + 3, which is a fixed expression fully known at compile time: there is no language (the expression is hard-coded, not parsed from anything), no input (no context, no variables), and no runtime variation (it computes the same 5 every run). So the tree is an elaborate way to write a constant the compiler would fold to 5 anyway, and the good version -- int result = 2 + 3 -- says exactly the same thing in one line the reader instantly understands. This is the YAGNI judgment the Strategy, Mediator, and Visitor chapters each make about their own patterns: build the indirection when the variation that needs it exists, not on speculation. The specific tell for Interpreter is the absence of the three things that make it worthwhile. If the expression is hard-coded rather than parsed, there is no language to interpret -- just write the expression. If there are no variables or context, there is no input to vary -- the result is a constant. If it is evaluated once with fixed operands, there is no reuse to amortise the tree over. When all three are absent, as here, the pattern is pure overhead. The boundary, as always, is about genuine anticipation versus speculation. If you have one hard-coded formula today but the product roadmap says users will soon supply their own formulas, building the interpreter early is defensible because retrofitting it touches the call sites. But we might let users configure this someday is the speculative generality to resist; the refactor from a hard-coded computation to a parsed, interpreted one is a real piece of work you should do WHEN the requirement to accept external expressions actually arrives, and not before. Reach for Interpreter when the expressions are data -- entered, configured, or transmitted -- and evaluated at runtime; for a fixed calculation the language already computes, use the language. The tell: a grammar-class tree constructed in code from literals to compute a value that is fixed at compile time, with no parsing, no context, and no reuse -- an interpreter with nothing to interpret but itself."
run: true
