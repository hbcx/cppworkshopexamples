title: "Anti-pattern: no handling of invalid input"
standard: "C++11"
difficulty: 3
summary: "An interpreter runs on external input, so it must decide what an invalid sentence does: an unknown variable, a division by zero, a malformed expression. Silently defaulting produces a wrong answer with no error, and a real undefined operation like integer division by zero is undefined behaviour. Detect the error and report it -- here the context records errors, the bad path ignores that signal, the good path checks it."
notes: "The reason to use Interpreter is that the sentences come from outside -- a user's rule, a config file's formula, a request's filter -- and external input is, by definition, sometimes invalid. An interpreter that assumes well-formed input has simply pushed the failure somewhere less visible. Two kinds of invalidity matter, and both appear here. The first is a defined-but-wrong default: an unknown variable that reads as 0, a missing field that reads as empty, a bad token that parses to nothing. These do not crash; they produce a believable answer built on a value the user never supplied, so a typo in a variable name yields a silently wrong result -- the expression a + z returns 5 because z, unbound, was treated as 0, and nothing signals that z was never defined. The second is genuine undefined behaviour: integer division by zero in C++ is UB (it may trap, crash, or do something arbitrary), so a Div that computes a / b without checking b is not merely wrong on bad input, it is unsafe -- which is why this example checks the divisor and describes the unchecked version in a comment rather than running it, per the rule against executing UB. The fix is to treat invalidity as a first-class outcome the interpreter reports rather than an edge it ignores. Here the Context carries an error slot: get records unknown variable when a name is missing, Div records division by zero when the divisor is zero, and the caller checks ctx.ok() after interpreting. The crucial point is that recording the error is not enough -- the BAD path shows the interpreter dutifully setting the error and the caller ignoring it, using the defaulted result anyway, which is just as wrong as not recording it. Handling invalid input means both detecting it AND forcing the caller to confront it. There are cleaner mechanisms than an error slot for real code, and which to use is a design choice: interpret can return an outcome type (an expected<int, Error> or a variant of value-or-error) so the error is in the return type and cannot be ignored without a compiler nudge; it can throw an exception for exceptional inputs; or a separate validation pass over the tree can reject unknown variables and type errors once, before evaluation, so interpret runs only on trees already known to be sound (which also pairs well with parsing once and reusing the tree). The error-slot-on-the-context shown here is the simplest to demonstrate but the weakest, precisely because it is ignorable -- the anti-pattern's own trap. Validation also belongs partly at parse time: a malformed expression (unbalanced parentheses, a bad token, too few operands) should be caught when the text is parsed and turned into a parse error, not discovered mid-interpretation. The sign: an interpreter that reads variables, indexes fields, or performs partial operations (division, array access, conversions) without deciding what an absent binding, an out-of-range value, or a zero divisor does -- silently defaulting, or performing the operation regardless, on input it does not control."
