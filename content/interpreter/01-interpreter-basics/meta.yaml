title: "Interpreter basics: one class per grammar rule"
standard: "C++11"
difficulty: 1
summary: "A tiny language of boolean expressions where each grammar rule is a class -- Constant is a terminal leaf, And/Or/Not are non-terminals combining sub-expressions -- and a sentence is a tree of these objects that interpret() on the root recursively evaluates; the operation lives on the grammar classes, each node interpreting itself."
notes: "Interpreter is for a specific and narrow situation: you have a small, stable language -- a boolean rule, an arithmetic formula, a search filter, a glob pattern -- that you need to evaluate at runtime, and you want a direct representation of its grammar in code. The pattern's move is to map each rule of the grammar to a class. Rules come in two kinds, and the class hierarchy mirrors them: TERMINAL expressions are the leaves that stand on their own (Constant here, and Variable in the next example), and NON-TERMINAL expressions are the rules that combine other expressions (And, Or, Not). A sentence in the language -- an actual boolean formula -- is then an object tree assembled from these classes, and evaluating it is calling interpret() on the root, which recurses into its children. That recursion is the whole engine: And::interpret asks its two operands to interpret themselves and combines the results, Not::interpret negates its child, Constant::interpret just returns its value, and the tree bottoms out at the leaves. Two structural facts place Interpreter among the patterns you have already seen. The expression tree IS a Composite -- terminals are leaves, non-terminals are composites holding child expressions, all behind one BoolExpr interface -- so Interpreter is essentially Composite with an interpret operation, and it shares Composite's uniform treatment of leaves and branches and its unique_ptr ownership of children. And putting interpret() as a virtual method ON each grammar class is the opposite arrangement from Visitor, which would pull the operation OUT into a visitor: interpret-as-method is right when interpretation is the ONE operation the grammar exists for, while a Visitor is better when you need several operations (interpret, pretty-print, optimize, type-check) over the same grammar -- a trade-off the two chapters share and the notes here flag for the rule engine later. This first version has no inputs -- the leaves are literal constants -- so it evaluates to a fixed answer; the next example adds the Context that lets terminals stand for variables looked up at interpret time, which is what makes the language actually useful. The honest boundary, developed in the anti-patterns: Interpreter fits SMALL grammars, because every rule is a class and a real language's grammar becomes an unmanageable pile of them, at which point a parser generator or an existing expression library is the right tool. The tell that Interpreter fits: a small domain language you control, evaluated repeatedly at runtime, whose grammar is stable and simple enough that a class per rule is a handful of classes, not hundreds."
run: true
