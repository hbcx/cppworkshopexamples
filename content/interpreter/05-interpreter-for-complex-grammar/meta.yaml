title: "Anti-pattern: Interpreter for a grammar that outgrows it"
standard: "C++11"
difficulty: 3
summary: "Interpreter fits small grammars, and this already shows the strain: basic arithmetic with precedence and parentheses needs a node class per operator plus a hand-written recursive-descent parser of three mutually-recursive functions -- and each feature added multiplies both. Past a small grammar, reach for a parser generator or an expression library rather than growing this by hand."
notes: "Interpreter's own authors, the Gang of Four, list this as its principal limitation: the pattern works when the grammar is simple, and becomes unwieldy as the grammar grows, because every rule is at least one class and the parser that builds the tree grows in step. This example is deliberately at the edge of comfortable -- plain integer arithmetic with the four operators, correct precedence, and parentheses -- and it already costs five node classes and a recursive-descent parser of three mutually-recursive functions (parseExpr for +/-, parseTerm for */, parseFactor for numbers and parentheses), where the function structure exists precisely to encode precedence. That is a lot of machinery for what a person would call 'a calculator', and the trouble is how it scales. Add unary minus and parseFactor must handle a leading '-'. Add exponentiation and you need another precedence level (another parse function) that is right-associative, breaking the left-associative loop the others use. Add comparison and logical operators and you add more precedence levels and node classes. Add function calls, variables, string literals, or statements and you are writing a real programming language by hand -- more node classes, a real lexer, error recovery, and a parser whose complexity has left 'a handful of functions' far behind. At that point the hand-rolled Interpreter is not saving you work; it is a bespoke, under-tested parser and evaluator that a mature tool would generate correctly. The fix is to match the tool to the grammar's size. For a genuinely small, stable language -- a boolean rule, a glob pattern, a filter DSL of a dozen productions -- Interpreter is ideal and the earlier examples show it at its best. For anything larger, use a parser generator (ANTLR, yacc/bison, or a PEG library) that takes a grammar specification and produces the parser, or an existing expression-evaluation library, and keep hand-written recursive descent only for grammars small enough to hold in your head. The signal to switch is concrete: you find yourself adding precedence levels, wrestling with associativity, writing a lexer, or your node-class count climbing past a dozen and still growing. The honest nuance is that recursive descent by hand is a fine and common technique for small-to-medium grammars, and this example is not saying never write a parser -- it is saying that Interpreter-the-pattern is for SMALL languages, and using it as the architecture for a large one means the grammar's growth turns directly into an ever-expanding pile of classes and parser code. The tell: an Interpreter whose node hierarchy and parser keep growing with each language feature, precedence and associativity handled by hand, heading toward the size where a grammar file and a generator would be less code and more correct."
run: true
sanitizers: []
