title: "Parsing text into the tree"
standard: "C++11"
difficulty: 2
summary: "The grammar classes are the representation; getting a sentence into it is parsing, a separate step. A reverse-Polish expression is parsed into an Expr tree with a stack -- operands push a Number, operators pop two sub-trees and push a combined node -- and the built tree interprets itself; keeping parse and interpret as two phases is what lets the tree be reused, printed, or optimised."
notes: "The Gang of Four are explicit that Interpreter defines the grammar's REPRESENTATION and its interpretation, but NOT how a sentence gets parsed into that representation -- parsing is a separate concern, and this example shows the boundary. The representation is the Expr tree from before; the new part is a parser that turns text into one. Postfix (reverse-Polish) notation is used because it parses with a trivial stack algorithm and no precedence handling: scan left to right, push a Number for each operand, and on each operator pop the two sub-trees it applies to and push a new Add/Sub/Mul node holding them. When the scan finishes, the single tree left on the stack is the parsed expression, and interpreting it is exactly the recursive interpret() from the earlier examples. The important discipline is that these are TWO PHASES: parseRPN builds a tree and returns it, and interpret walks that tree -- the parser does not compute the answer as it scans. That separation is not ceremony; it is what makes the tree a reusable artifact. Because the tree exists as a value independent of the parse, it can be interpreted many times (over different contexts, as the next examples do), printed or serialised, walked by a Visitor for a second operation, or transformed by an optimiser -- none of which is possible if parsing and evaluating are fused into one pass that leaves nothing behind. Fusing them is this chapter's mixing anti-pattern, and re-running the parse on every evaluation instead of caching the tree is the re-parsing one; both come from not respecting this boundary. A few honest notes on the parsing itself. This parser assumes well-formed input -- it pops without checking the stack has two operands and calls std::stoi without catching a bad token -- which is fine for illustrating the phase separation but is exactly what the invalid-input anti-pattern warns against for real use; a production parser validates and reports errors. Postfix sidesteps operator precedence and parentheses entirely, which is why it is a good teaching parser; infix input needs a real parser (recursive descent, or the shunting-yard algorithm to convert to postfix first), and that added complexity is part of why hand-rolled Interpreter stops scaling for larger grammars, the outgrows-the-pattern anti-pattern. The tree still owns its children through unique_ptr, so returning it by value (via move) transfers the whole structure and it frees when the caller drops it. The tell that you have the phases right: a parse function that returns a tree (or an error), and an interpret step that takes a tree and a context -- never a single function that reads text and returns an answer with no tree in between."
