title: "Anti-pattern: re-parsing on every evaluation"
standard: "C++11"
difficulty: 3
summary: "The point of turning text into a tree is that the tree is reusable: parse once, interpret many. Re-parsing the source on each evaluation pays the parse cost per record instead of once, a real avoidable slowdown over a large dataset -- a parse counter makes it visible, with the bad loop parsing the rule 1000 times and the good loop parsing once and interpreting the cached tree."
notes: "Interpreter's efficiency case rests on a separation the previous anti-patterns insisted on: parsing produces a tree, and the tree is the thing you evaluate. Once you have the tree, evaluating it is cheap -- a walk over already-built objects -- while parsing is comparatively expensive: tokenising the string, validating it, allocating the nodes. So the tree is worth caching, and the natural usage is parse once and interpret the same tree against every input. This anti-pattern reparses the source text inside the evaluation loop, so the expensive step runs per record instead of once. The parse counter makes the waste concrete: the bad loop calls parse a thousand times to evaluate a thousand records, the good loop calls it once and reuses the tree, and both produce the identical result -- the only difference is a thousand redundant parses. On a real workload the cost is not a counter but latency and CPU: a rule engine that reparses its rule for every row, a formula that retokenises for every recalculation, a filter that rebuilds its tree per request, all doing hidden work proportional to the data rather than to the number of distinct expressions. The fix is to lift the parse out of the loop -- parse the expression once, hold the resulting tree, and interpret it as many times as needed -- which is exactly the shape the context example used when it built a rule once and evaluated it against several contexts. In a service this means compiling rules or formulas at load time (or on first use) into trees kept in memory, and interpreting those trees on the hot path; the parse happens when the rule text changes, not when data arrives. Two adjacent optimisations follow the same logic once the tree is cached: because the tree is a stable value, you can also pre-validate it once (catching errors at compile time rather than per evaluation) and even transform it once (constant-folding, simplification) so every subsequent interpretation is faster. This anti-pattern is the performance counterpart of the parsing-fused-into-interpretation one: there the tree never existed, so reuse was impossible; here the tree exists but is thrown away and rebuilt, so reuse is merely forgotten. The honest exception is when the expression genuinely changes every time (each record carries its own one-off rule), in which case there is nothing to cache -- but that is rare; usually a small set of expressions is evaluated over a large set of inputs, which is precisely when caching the parsed tree pays. The tell: a parse (or compile, or tokenise) call inside a loop or a per-request handler, over expression text that does not change between iterations, when the parsed result could be built once and reused."
run: true
