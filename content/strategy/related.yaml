- slug: "bridge"
  note: "The two-dimension relative, same shape: Strategy swaps one interchangeable algorithm, where Bridge separates a whole abstraction hierarchy from an implementation hierarchy -- go there when two axes vary at once, not one behaviour."
- slug: "dependency-injection"
  note: "Injecting a behaviour is Strategy: when the dependency handed to an object is an algorithm -- a comparator, a pricing rule, a backoff policy -- that is this pattern, wired at the composition root; go there for the general injection mechanics."
- slug: "unique-ptr"
  note: "A strategy baked into a type: std::unique_ptr's second template parameter is a Deleter -- a compile-time strategy for how the pointer frees its object -- the policy form of Strategy applied to cleanup."
- slug: "observer"
  note: "The broadcast sibling: where Strategy injects one algorithm a context calls, Observer notifies many listeners of an event -- go there for one-to-many notification and the C++ lifetime problem it raises."
- slug: "command"
  note: "The packaged-request sibling: where Strategy injects one algorithm to call now, Command packages a whole request as an object to store, queue, log, or undo later -- go there for undo/redo, job queues, and macros."
- slug: "state"
  note: "The structural twin with the opposite intent: State has the identical context-delegates-to-an-interface shape, but the object transitions its OWN state instead of the client picking a fixed one -- go there when the behaviour should advance with the object's status, which this chapter's it-is-really-State anti-pattern points straight at."
- slug: "template-method"
  note: "The inheritance counterpart: Template Method varies a step by overriding it in a subclass at compile time, where Strategy injects the step as an object -- go there for the fixed-skeleton form, the NVI idiom, and exactly when composition here beats that inheritance."
- slug: "open-closed"
  note: "The principle Strategy serves: injecting the varying algorithm is how you extend a context's behaviour without editing it -- go there for open-for-extension stated as a rule, with the registry and compile-time-policy forms alongside this one."
- slug: "type-erasure"
  note: "The idiom under a std::function strategy: storing a Strategy as a std::function is type erasure -- go there for the general Concept/Model wrapper, value semantics via clone(), and non-intrusive dispatch through free functions."
