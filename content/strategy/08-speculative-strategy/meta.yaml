title: "Anti-pattern: a strategy for a single algorithm"
standard: "C++11"
difficulty: 3
summary: "Introducing a Strategy interface for one algorithm that has no second variant and none in prospect is speculative generality: the interface, the concrete strategy, and the pointer indirection all pay for an interchangeability that never happens, where a plain method would do."
notes: "Strategy earns its indirection by making algorithms interchangeable. Remove the interchangeability -- there is one algorithm and no credible second -- and what remains is cost with no benefit. InvoiceBad wraps a single flat-tax rule in a TaxStrategy interface, a FlatTax class, and a unique_ptr, so every invoice pays an allocation and every tax call a virtual dispatch to enable a swap that will never be made; InvoiceGood does the identical job as a method, with no interface, no heap, and less code to read. This is YAGNI aimed at Strategy: do not build the family-of-algorithms machinery for a family of one. The deeper reason to wait is not just the runtime cost but the design quality -- an interface extracted from a single example is a guess about what the second case will need, and guesses about future variation are usually wrong; extracting it once a real second rule exists lets the two concrete cases shape an abstraction that actually fits both, and that refactor (pull the method into a strategy, add the second) is small and safe. The judgment is honest rather than absolute: if a second algorithm is genuinely imminent -- a second tax regime shipping next month, a plugin point the product requires -- building the seam now is reasonable. The anti-pattern is the interface-with-one-implementation that has sat unchanged for a year, indirection paid for a variation that never came. The tell: a Strategy interface with exactly one concrete strategy and no second on the roadmap, injected through a pointer where a direct call would serve."
run: true
