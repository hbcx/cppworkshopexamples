title: "Compile-time Strategy: policy-based design"
standard: "C++11"
difficulty: 3
summary: "When the strategy is fixed per type rather than chosen at runtime, make it a template parameter -- a policy: the operation is resolved at compile time, so there is no virtual call and no type erasure, the compiler can inline it, and each configured type is its own zero-overhead specialisation."
notes: "The object and std::function forms both decide the strategy at runtime, and both pay for it -- a virtual dispatch or a type-erased indirect call the compiler usually cannot see through. When the strategy does not need to change at runtime, a template parameter removes that cost entirely. Here the pricing algorithm is a policy type supplying priceFor as a static function, and Checkout is a template over it, so Checkout<MemberPolicy> resolves the call at compile time; the compiler inlines priceFor and the abstraction disappears in the generated code. This is policy-based design, and the standard library uses it constantly: std::map's Compare, std::unordered_map's Hash, std::unique_ptr's Deleter, and every allocator are policies baked into the type, chosen for exactly this zero-overhead reason. The trade-offs are the mirror image of the runtime forms and decide when to use which. Policies win on speed -- no indirection, full inlining, and the choice is checked at compile time so an invalid configuration is a compile error, not a runtime one. They lose on flexibility: the strategy is fixed when the type is instantiated, so you cannot swap it on a live object or choose it from a config value read at startup, and Checkout<RegularPolicy> and Checkout<MemberPolicy> are different types that do not share a variable or a container slot without extra work. The rule of thumb across the three forms: reach for the compile-time policy on hot paths and library-grade abstractions where the strategy is known statically; reach for std::function or the object interface when the strategy is selected at runtime, configured, or must be stored uniformly. Same pattern, three costs -- pick by whether the choice happens at compile time or run time."
