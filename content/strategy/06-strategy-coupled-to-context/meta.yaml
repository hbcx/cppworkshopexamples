title: "Anti-pattern: a strategy coupled to the whole context"
standard: "C++11"
difficulty: 3
summary: "When the strategy method takes the entire context and reaches into its internals, the two are no longer independent: the strategy breaks when the context changes, cannot be reused elsewhere, and cannot be tested without constructing a full context -- passing only the data the algorithm needs restores the separation."
notes: "The point of Strategy is that the algorithm and the context vary independently, and that only holds if the interface between them is narrow. Hand the strategy the whole context -- cost(const Order&) -- and the boundary collapses: the strategy now depends on Order's structure, so it recompiles and can break when an unrelated Order field changes, it cannot be reused with any context that is not an Order, and a unit test for the shipping rule has to build a complete Order with a weight, a distance, and a customer just to exercise a calculation that needs one number. The strategy has been coupled to the context it was supposed to be decoupled from. The fix is to pass only what the algorithm actually consumes: cost(int weight, int distance) knows nothing of Order, so it works with any caller, tests with two ints, and is immune to changes in the context's shape. This is the Interface Segregation Principle applied to the strategy's parameters -- depend on the data, not the container. There is a real tension to judge: a strategy that needs many fields leads to a long parameter list, which tempts you back toward passing the whole object. The answer is usually that such a strategy is either doing too much (split it) or that the several fields it needs form a genuine concept that deserves its own small value type -- a ShipmentDimensions passed by value, say -- not the entire context. Passing a broad READ-ONLY interface the context implements is a middle ground when the algorithm truly needs many accessors. The tell: a strategy whose operation takes the context type by reference and calls several of its getters, especially when a test would have to build the whole context to run it."
run: true
sanitizers: []
