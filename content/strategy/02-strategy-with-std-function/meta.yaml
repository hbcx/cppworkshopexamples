title: "Strategy as a std::function"
standard: "C++11"
difficulty: 2
summary: "In modern C++ a strategy is often just a callable: the context stores a std::function and delegates to it, so a lambda, a free function, or a functor plug in with no interface and no class per algorithm -- the same pattern with a fraction of the boilerplate, and lambdas can capture per-strategy state inline."
notes: "The classic form needs a class for every algorithm and a shared abstract base; std::function collapses that. Here Checkout stores a std::function<int(int)> and delegates to it, so a strategy is any callable with the right signature -- a free function (regularPrice), a lambda (the 10% member rule), or a lambda that captures state (the 50 coupon closed over a local). No PricingStrategy interface, no RegularPricing class, and the closure carries its own data, which in the object form would have to be a member set through a constructor. This is the Strategy most C++ codebases actually use, and it is the right default when the strategies are small and chosen at runtime: it is the least code, it composes with the whole language of lambdas and std::bind, and it stays runtime-swappable. The trade-off against the object form is minor but real. std::function is type-erased, so calling it is an indirect call the compiler usually cannot inline, and a large capture can force a heap allocation inside the std::function; for a strategy invoked in a tight inner loop that overhead can matter, which is where the compile-time policy form (the fourth example) wins by resolving the call statically. The object form still earns its place when a strategy is large, needs its own rich interface with several methods, or benefits from a name and a place in a class hierarchy. A footgun to know now: a default-constructed or moved-from std::function is empty, and calling it throws std::bad_function_call -- the subject of a later anti-pattern, and the reason this context takes the strategy in its constructor rather than defaulting it."
