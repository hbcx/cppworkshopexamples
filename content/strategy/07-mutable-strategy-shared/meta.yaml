title: "Anti-pattern: a mutable strategy shared across contexts"
standard: "C++11"
difficulty: 3
summary: "A strategy that carries mutable per-use state and is shared by several contexts leaks state between them: because they hold one instance, one context's calls change what the others see -- so a shared strategy must be stateless, and anything that must persist belongs in the context."
notes: "Strategies are commonly shared -- one pricing rule, one comparator, one policy object referenced by many contexts -- which is efficient precisely because a strategy usually has no state of its own. Give it mutable state and that sharing turns into cross-talk. AccumulatingStrategyBad keeps a running sum, and two contexts hold the same instance, so a.run(10) leaves the sum at 10 and b.run(10) returns 20: b's result depends on a's earlier call, though the two contexts were meant to be independent. Nothing crashes; the numbers are just entangled, which is the hard kind of bug to trace because it only appears when the same strategy object happens to be shared. The fix is to keep strategies stateless: StatelessStrategy computes purely from its argument, so any number of contexts can share one instance and each gets its own correct answer. State that legitimately must persist -- an accumulator, a cache, a counter -- belongs in the context that owns the sequence of calls, not in the algorithm that is shared across contexts. When a strategy genuinely needs its own configuration (a discount percentage, a seed), that configuration should be immutable, set once at construction and never written afterward, so the object stays safe to share -- the same intrinsic-state discipline the Flyweight chapter's shared objects require. And if a strategy truly must hold per-context mutable state, then it is not shareable and each context needs its own instance, which is a design choice to make deliberately, not stumble into. The sign: a strategy class with a non-const method that writes a data member, held by more than one context at once."
run: true
