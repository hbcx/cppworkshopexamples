title: "Anti-pattern: a strategy that transitions itself (it is State)"
standard: "C++11"
difficulty: 3
summary: "A strategy the client selects but whose operation reassigns the context's strategy is not Strategy but State in disguise: the client's choice does not stay put, each step is coupled to the next, and the interchangeability Strategy promises is a fiction -- behaviour that advances with the object's own status belongs to the State pattern."
notes: "Strategy and State are structurally identical -- a context that delegates to an interface -- so they are told apart only by intent, and using one where the other belongs produces a design that fights itself. The signature of the mistake is here: the client picks a step (placedStep), but running it reassigns the context to shippedStep, so the choice the client made silently advances, and every step must know the next one to hand off to. That breaks Strategy's contract in two ways at once -- a Strategy is chosen by the client and stays chosen (it is interchangeable, not self-replacing), and strategies are independent of each other (here each is coupled to its successor). What is actually being modelled is a lifecycle: the object's behaviour depends on and changes with its own status, which is exactly State. The fix is to model it as State -- the Order owns its status privately, advances it internally on process(), and never exposes a set-the-behaviour knob to the client, who just drives the object and lets it progress. The distinction from the enum-and-switch anti-pattern is worth stating, since this fix uses a flag: there, an enum stood in for a client's fixed CHOICE among interchangeable algorithms and should have been Strategy; here, the flag is genuine internal STATE with intended self-transitions and correctly stays inside the object. How you implement the State -- a boolean for two states, or state objects that each handle their own transition for many -- is a scaling detail; the pattern point is that transitions are internal, not a strategy the client selects. The sign: a strategy whose operation calls the context's setStrategy (or reassigns the context's strategy pointer), so the client's selection does not persist across a call."
run: true
