title: "Anti-pattern: an enum and a switch instead of a strategy"
standard: "C++11"
difficulty: 3
summary: "Selecting behaviour with an enum mode and a switch inside the context is the exact design Strategy replaces: every new algorithm edits the switch (and every method that switches on the mode), the class that should be stable changes on each addition, and a forgotten case falls silently through."
notes: "This is Strategy seen from the wrong side, and the most common shape it is meant to fix. CheckoutBad carries a Mode enum and a switch on it; the code works, and for two or three modes it looks perfectly reasonable, which is why it spreads. The costs arrive with growth. Adding a pricing rule means editing the switch -- and if the mode is used in more than one method (compute the total here, format the receipt there, log the discount elsewhere), each of those switches must be found and extended in lockstep, so the class most likely to have a bug is the one everyone keeps reopening. That is the open/closed principle violated: the context is not closed to modification, because every new behaviour modifies it. And the default arm is a quiet trap -- a mode added to the enum but forgotten in the switch compiles and falls through to whatever the default returns, a wrong answer with no error (some compilers warn on a switch over an enum with a missing case, but only without a default, and code like this usually has one). The fix is the pattern: make each algorithm a strategy behind a common interface and have the context delegate, so a new rule is a new class the context never sees, the switch disappears, and adding behaviour is adding code rather than editing it. The honest caveat: for a tiny, truly fixed set of cases that will never grow, an enum and a switch are simpler and fine -- Strategy earns its indirection when the set of algorithms is open or changes. The tell: a class with a type or mode enum and one or more switches on it that must all be edited together whenever a case is added."
run: true
sanitizers: []
