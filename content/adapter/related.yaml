- slug: "queues"
  note: "The standard library's own adapters: std::stack and std::queue are container adapters -- the same idea applied to a container, presenting a small interface over an underlying one you can choose."
- slug: "dependency-injection"
  note: "How an adapter reaches the rest of the app: build it at the composition root and inject it as the Target interface, so consumers depend on the interface and never see the adaptee."
- slug: "abstract-factory"
  note: "When several backends are each adapted to one Target, a factory picks and builds the right adapter, so the client selects a backend by name and receives it already wrapped."
- slug: "decorator"
  note: "The sibling wrapper that keeps the interface: where Adapter changes an object's interface to fit a client, Decorator preserves it and stacks added behaviour -- reach for it when the interface is already right and you only need to add responsibilities."
- slug: "facade"
  note: "The subsystem-scale wrapper: where Adapter fits one class to an interface, Facade puts one simplified front over many classes -- reach for it when the problem is a tangle of classes to coordinate, not a single mismatched one."
- slug: "proxy"
  note: "The same-interface wrapper: a Proxy keeps the subject's interface (unlike Adapter, which changes it) and controls access to it -- lazy loading, permission checks, remote stubs -- go there when the interface is right and it is access you need to govern."
