title: "Anti-pattern: treating a lossy adapter as reversible"
standard: "C++11"
difficulty: 3
summary: "When the two sides are not isomorphic -- the target has fewer cases or less precision than the source -- a two-way adapter cannot round-trip; mapping out and back silently downgrades data, here collapsing a four-level severity to the vendor's two and losing Critical."
notes: "An adapter translates, and translation is only reversible when the two representations carry the same information. Assume a two-way adapter is lossless and you get silent data loss the moment the target is smaller than the source: fewer enum cases, lower numeric precision, a coarser unit. This example maps a four-level Severity (Low, Medium, High, Critical) onto a vendor protocol that has only Normal and Alert. The forward map is fine for sending, but it collapses High and Critical into the single Alert; mapping back cannot tell them apart, so a Critical that round-trips through the vendor level returns as High -- a real severity downgrade that no code flagged. The lesson is not that lossy adapters are wrong (you often must send to a coarser system), it is that the mapping is not a bijection and must not be modelled as one. The fixes: adapt only in the direction the boundary needs (domain to vendor for sending) and never reconstruct the domain value from the vendor value; if you must recover it, keep the original Severity alongside the vendor level rather than inferring it back. The tell is a fromX(toX(value)) that is assumed to equal value, or a decode path that invents detail the encoded form does not contain."
run: true
sanitizers: []
