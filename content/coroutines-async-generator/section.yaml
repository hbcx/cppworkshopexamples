title: "Coroutines: async streams"
description: "The synthesis of the whole category: a stream that both produces with co_yield and waits with co_await, so pulling the next element is itself an asynchronous step. Built on the awaitable task and the virtual-time event loop from the earlier sections, the async_generator<T> here ping-pongs control between producer and consumer by symmetric transfer and parks on the loop whenever the producer awaits -- fully deterministic, no real threads. Covers the async generator type and its consumer loop, awaiting real work between elements while other tasks keep running, exceptions crossing the next() boundary, transforming one async stream into another, stopping early without over-producing, and collecting a stream into a container -- alongside the traps: blocking the single-threaded loop instead of awaiting, trying to consume a stream without co_await as if it were an ordinary range, and yielding references into a source that has already died."
sort_order: 171
