title: "std::ref and reference_wrapper"
description: "std::reference_wrapper, a copyable, assignable object that stands in for a reference, and the std::ref / std::cref helpers that make one. It solves the two things a raw reference cannot do: be stored in a container, and be carried through an interface that copies its arguments. Covers building one and reading/writing the referent, holding references in a std::vector, passing a reference through a copying API (make_tuple/make_pair and, by the same rule, std::thread, std::async and std::bind), std::cref for a no-copy const view, a reference_wrapper used as a callable to pass a stateful functor by reference, and the reseat-versus-assign-through distinction of its operator= -- alongside the traps: a wrapper left dangling when its referent moves or dies, assigning to a wrapper when you meant to write through it, wrapping a temporary, and a shallow copy of a container of wrappers. For where std::ref meets std::bind and std::thread see those chapters; this section is about reference_wrapper itself."
sort_order: 159
