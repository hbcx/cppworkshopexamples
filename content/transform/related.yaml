# Related chapters -- cross-links shown at the bottom of the section page.
- slug: "ranges"
  note: "The lazy counterpart: views::transform maps on demand inside a pipeline with no output container, where the algorithm writes results eagerly -- go there for views, the pipe operator, and when a lazy map beats an eager one."
- slug: "sort"
  note: "Where a transform often feeds a sort: precompute a key per element (the decorate step) so the comparator does not recompute it every call -- go there for sorting, comparators, and stable_sort."
- slug: "count-count-if"
  note: "The sibling that reduces instead of maps: count totals matches over a range where transform produces a new value per element -- go there for tallies, thresholds, and progress counts."
- slug: "accumulate-reduce"
  note: "The reduce that pairs with this map: transform_reduce fuses a transform and a fold, and accumulate folds a range to one value -- go there for sums, dot products, and folding into a summary."
- slug: "copy-copy-if"
  note: "The plain copy without the mapping: copy writes elements unchanged and copy_if selects a subset, where transform changes each one -- go there for filtering into a container, printing through an ostream_iterator, and the overlap rules copy shares."
- slug: "for-each"
  note: "The general per-element apply transform is often mistaken for: for_each runs a side effect on each element and returns nothing, where transform produces one output per input -- go there for the plain visit and why a captured push_back should be a transform."
- slug: "fill-generate"
  note: "The write-only siblings that read no input: fill sets a constant and generate calls a nullary function per element, where transform maps an existing value -- go there for initializing and building ranges from nothing."
- slug: "partial-sum"
  note: "The cumulative cousin: transform maps each element independently, where partial_sum carries a running total across them and adjacent_difference reports the steps between -- go there for prefix sums and delta encoding."
