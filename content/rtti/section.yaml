title: "Run-time type information (RTTI)"
description: "Asking about a type while the program runs. The typeid operator yields a const std::type_info& describing a type or the dynamic type of a polymorphic object; type_info compares, orders, and hashes types, and std::type_index wraps it into a value you can use as a map key. Covers the basics and why name() is for debugging only, how typeid reports the most-derived type through a polymorphic base, comparing and hashing types at run time, a type-to-handler registry keyed by std::type_index, querying the type stored in a std::any before casting it out, and the edge cases where typeid strips cv and references and throws std::bad_typeid on a null polymorphic dereference -- alongside the traps: treating name() as portable or stable, expecting the dynamic type from a non-polymorphic base, and using a typeid type-switch where a virtual function belongs. RTTI complements dynamic_cast, which is covered with the other casts."
sort_order: 179
category: "Language & object model"
