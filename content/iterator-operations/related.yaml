- slug: "iterator-adapters"
  note: "The adapters these operations move: back_inserter, the stream iterators, reverse_iterator and move_iterator all satisfy an iterator category, and next/advance/distance work on them by that category -- go there for the adapters themselves."
- slug: "tag-dispatch"
  note: "How advance and distance get their O(1)-or-O(n) implementation: they dispatch at compile time on the iterator's category tag, the textbook use of the technique -- go there for tag dispatch and the iterator_tags hierarchy."
- slug: "iterator"
  note: "Where iterator categories come from: the protocol and the input/forward/bidirectional/random-access hierarchy that decides which of these operations are available and how fast -- go there for categories, traits, and writing your own iterator."
- slug: "lists"
  note: "The container where these operations are O(n): a std::list has bidirectional iterators, so advance/next/distance step node by node -- go there for the node-based container whose category is the trade-off against a vector's."
- slug: "non-member-range-access"
  note: "Where the iterators these operations move come from: std::begin/std::end (and size/data) hand you the range endpoints uniformly for containers and raw arrays -- go there for the free range-access functions and the generic code they enable."
- slug: "forward-list"
  note: "The container that makes the category cost concrete: std::forward_list has forward iterators only, so it has no size() and std::distance on it is O(n) -- go there for the singly-linked list whose missing count these operations must compute."
