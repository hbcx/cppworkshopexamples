title: "Anti-pattern: re-entrant notification"
standard: "C++11"
difficulty: 3
summary: "When an observer reacts to a notification by changing the subject again, the second change starts a nested notification while the first is still running -- a re-entrant cascade that, without a natural stop, recurses until the stack overflows, and even when bounded interleaves half-applied changes; a re-entrancy guard merges the change instead."
notes: "Observer's broadcast assumes each notification runs to completion, but observers are free to write back to the subject, and when a handler calls setValue during a notify, the subject starts a new notify inside the old one. SubjectBad shows the shape: each observer, seeing a value below three, sets the next, so setValue calls a handler that calls setValue -- nested calls that only stop here because the observer imposes a bound. Remove that bound (an observer that always reacts, or two observers that ping-pong the value between them) and the recursion is unbounded and overflows the stack, which is why this example keeps an artificial limit rather than running the real hazard. Even bounded, re-entrancy is trouble: the call stack deepens with each change, and observers can be notified of a newer value before the notification of an older one has finished, so they see an out-of-order, half-applied sequence of states. The fix is a re-entrancy guard. SubjectGood records the target value and, if a notification is already in progress, returns after recording rather than notifying again; the loop already running notices the pending value changed and applies it, so a change from an observer is merged into the in-flight broadcast and the stack stays flat regardless of how observers react. The output reaches the same final value, but by iteration, not recursion. This merging also gives cleaner semantics -- observers see each distinct value once, in order -- and is why real frameworks batch or defer: UI toolkits merge a burst of model changes into one layout pass, and reactive systems use a scheduler to apply pending updates outside the current notification. The sign: an observer callback that writes to the subject it is observing, over a subject whose notify has no guard against being entered again."
run: true
