title: "Anti-pattern: modifying the observer list during notification"
standard: "C++11"
difficulty: 3
summary: "If an observer subscribes or unsubscribes while a notification is in progress, it mutates the container the subject is iterating -- skipping or double-calling observers with index iteration, and invalidating iterators (undefined behaviour) with a range-for -- so the broadcast must iterate a snapshot or defer the change."
notes: "A notification loop walks the observer list, and observers are exactly the code most likely to react by changing that list -- unsubscribing themselves once handled, or adding a new observer in response. Doing so mid-loop mutates the container being iterated, and the failure depends on how the loop is written. Iterating by index, as SubjectBad does, is defined but wrong: when handler A erases element 0, everything shifts down, the loop's next index lands past the shifted B, and B is silently skipped -- the run shows only A. Iterating with a range-for or cached iterators is worse: erase invalidates them, and continuing to use them is undefined behaviour that can crash or corrupt. Both are the same underlying mistake -- structural modification of a collection during traversal -- that the containers chapters flag for std::vector and std::map in their own right. The fix is to decouple the traversal from the live list. SubjectGood copies the handlers into a snapshot and iterates that, so removals and additions during the broadcast take effect on the NEXT notify and the current one visits exactly the set that was registered when it began -- both A and B run. The snapshot has a cost (a copy of the handler list per notification) and a semantic choice baked in: an observer added during a broadcast is not called until the next one, which is usually the behaviour you want. The alternative that avoids the copy is to DEFER mutations: while notifying, record subscribe/unsubscribe requests in a pending list and apply them after the loop, or mark entries dead and prune them at the end. A stable-reference container (a std::list, or a map of ids as the tokens example uses) also helps, since erasing one element does not invalidate iterators to the others. The tell: a subscribe or unsubscribe reachable from inside an observer's notification callback, over a subject that iterates its live list directly."
run: true
