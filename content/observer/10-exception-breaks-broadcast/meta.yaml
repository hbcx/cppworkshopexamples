title: "Anti-pattern: an exception abandons the broadcast"
standard: "C++11"
difficulty: 3
summary: "A notify loop that calls observers without isolating them lets one observer's exception propagate out and abandon every observer after it -- a half-delivered broadcast where one misbehaving listener silences the rest and can leave the subject inconsistent; catching around each call contains the failure."
notes: "A broadcast is supposed to reach every observer, but a bare notify loop couples them all to each other's failures: the moment one observer throws, the exception unwinds out of the loop and the observers queued behind it are never called. SubjectBad shows it -- A runs, the second observer throws, and C never fires; the broadcast is half delivered, and if the observers were applying related updates the system is now in a partially-notified state that is hard to reason about. Worse, the culprit is order-dependent and often data-dependent, so the same code delivers to everyone until one input makes one observer throw, and then silently drops the tail. The fix is to isolate observers from one another: wrap each call in its own try/catch so a throwing observer is contained and every other observer is still notified, as SubjectGood does -- A runs, the thrower is caught and reported, and C still fires. The important half of the fix is what you do in the catch: report the failure (log it, collect it, surface it after the loop) rather than swallow it silently, because an observer that fails every time behind a silent catch is its own hidden bug. There are design choices to make deliberately here: whether a failing observer should be retried, removed, or left subscribed; whether notify should still report an aggregate error to its caller after finishing the broadcast; and whether observers should be contractually noexcept so the question does not arise. What is not a real choice is the bare loop, which lets any observer veto the delivery to all the others. The tell: a notify or emit that invokes observer callbacks in a loop with no try/catch, where any observer can throw."
run: true
