title: "The logic_error children"
standard: "C++11"
difficulty: 2
summary: "logic_error has specific children -- invalid_argument, domain_error, length_error, out_of_range -- each naming a precise kind of precondition bug the library also throws."
notes: "Reaching for the most specific type documents the failure and lets a handler catch just that case. invalid_argument means a value is not allowed; domain_error means input outside a function's mathematical domain; length_error means an object was asked to exceed its maximum size; out_of_range means an index or key outside the valid range. The standard library throws these itself -- std::vector::at and std::string::at throw out_of_range, std::stoi throws invalid_argument, a too-long std::string throws length_error -- so catching the right one handles both your throws and the library's. All four derive from logic_error, so a single catch of the base still groups them."
