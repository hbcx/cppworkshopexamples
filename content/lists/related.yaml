# Related chapters -- cross-links shown at the bottom of the section page.
# Each entry: the slug of another section + a one-line note on why to go there.
- slug: "vectors"
  note: "The default contiguous container, and the honest benchmark of the list O(1)-insertion promise against it."
- slug: "move-semantics"
  note: "Why list is special for moves: splice transfers whole nodes without touching the elements, and it can hold non-movable types."
- slug: "queues"
  note: "std::list seen from the other side: one of the containers the FIFO adaptors can be built on."
- slug: "iterator"
  note: "Why a list's iterators are bidirectional, not random-access, and stay valid across other elements' insert and erase: the Iterator pattern chapter builds a linked-list iterator by hand and explains the category trade-off against a vector's."
- slug: "sort"
  note: "Why a list has its own member sort: std::sort needs random-access iterators a list cannot give, so list::sort relinks nodes instead -- go there for the sort algorithm, comparators, and stable_sort."
- slug: "remove-erase"
  note: "The same reason a list has its own member remove: std::remove compacts by moving element values, which defeats a list's stable nodes, so list::remove unlinks them instead -- go there for the erase-remove idiom and why the member wins on a list."
- slug: "rotate-reverse"
  note: "And the same reason a list has its own member reverse: std::reverse swaps values where list::reverse relinks nodes, and forward_list cannot use std::reverse at all -- go there for reversing, rotating, and moving a block."
- slug: "deque"
  note: "The both-ends container that keeps random access: std::deque also inserts at the front in O(1) and keeps references valid, but indexes in O(1) where a list cannot -- go there when you want front operations and indexing but not per-node splicing."
