title: "Anti-pattern: release() does not free"
standard: "C++11"
difficulty: 3
summary: "release() hands back the raw pointer and gives up ownership without deleting, so a bare p.release() leaks; reset() is the call that destroys the object."
notes: "release() and reset() are easy to confuse and do opposite things. release() returns the raw pointer and detaches the unique_ptr WITHOUT deleting -- it means take ownership away from me. If you ignore the returned pointer, nothing frees the object and it leaks. Only use release() when you are handing the raw pointer to something else that will own it (another unique_ptr, or a C API that takes ownership). reset() is the one that deletes the managed object now. The rule of thumb: release() gives ownership away and returns the pointer; reset() destroys."
run: true
