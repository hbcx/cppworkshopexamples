# Related chapters -- cross-links shown at the bottom of the section page.
# Each entry: the slug of another section + a one-line note on why to go there.
- slug: "move-semantics"
  note: "The mechanism underneath: unique_ptr is the classic move-only type, and every ownership transfer here is exactly the move that section builds."
- slug: "vectors"
  note: "Where owning pointers get collected: a vector of unique_ptr holds polymorphic or non-copyable objects by base pointer, each still deleted automatically."
- slug: "shared-ptr"
  note: "When one owner is not enough: shared_ptr adds a reference count so several owners can share an object, with weak_ptr to break the cycles that creates -- at the cost of an atomic count."
- slug: "composite"
  note: "A tree that owns itself: a Composite node owns its children through unique_ptr, so the whole part-whole hierarchy frees in one step -- go there for a real use of recursive unique_ptr ownership."
- slug: "bridge"
  note: "A real use of move-only ownership: the pimpl idiom (a compile-firewall Bridge) holds its implementation in a unique_ptr, which is why its destructor and moves must be declared in the header but defined where the impl is complete."
- slug: "strategy"
  note: "The Deleter is a Strategy: unique_ptr's second template parameter is a compile-time strategy for how the object is freed -- see Strategy for the pattern in general, in its object, std::function, and policy forms."
- slug: "observer"
  note: "A move-only RAII handle in the wild: an Observer subscription token unsubscribes in its destructor and is move-only for the same reason unique_ptr is -- one owner of the registration."
- slug: "command"
  note: "Owning polymorphic objects in a container: an undo/redo history is a vector of unique_ptr<Command>, each command freed automatically once it can no longer be undone -- go there for that use."
- slug: "pimpl"
  note: "The classic use of unique_ptr as a class member: the pimpl idiom hides a type behind unique_ptr<Impl>, whose incomplete-type rules are exactly what force a hand-written out-of-line destructor -- go there for the compile-firewall idiom and its special-member recipe."
- slug: "raii"
  note: "The general idiom unique_ptr is one instance of: acquire in a constructor, release in a destructor, for any resource -- not just heap memory -- go there for scope guards, writing your own move-only owner, and cleanup on every exit path."
