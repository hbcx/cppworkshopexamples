# Related chapters -- cross-links shown at the bottom of the section page.
# Each entry: the slug of another section + a one-line note on why to go there.
- slug: "unordered-containers"
  note: "Drop the ordering for O(1) average membership: std::unordered_set, for when you never ask for ranges or sorted output."
- slug: "maps"
  note: "Attach a value to each key: the same balanced tree and node stability, as a key-to-value container."
- slug: "unique"
  note: "The other way to get distinct values: sort+unique deduplicates a vector in place and leaves it sorted, cheaper than a set for a one-shot batch -- go there for deduplicating a range and when a vector beats a set."
- slug: "binary-search"
  note: "The hand-rolled sorted-vector alternative: binary_search and lower_bound give O(log n) lookup on a sorted vector, the read-mostly stand-in for a set -- go there for searching sorted ranges and why std::lower_bound on a set is O(n)."
- slug: "merge-set-operations"
  note: "Set math on sorted ranges: set_union, set_intersection and set_difference compute the relations between two sets in O(n+m), and a set's own sorted iterators feed them directly -- go there for combining sorted ranges."
- slug: "priority-queue"
  note: "The heap that gives up reachability for speed: a std::priority_queue pops the extreme in O(log n) but cannot find or reprioritise a middle element, which a std::set of (priority, id) can -- go there for the always-take-the-top structure, and come back here when you must change or remove a queued item."
- slug: "flat-containers"
  note: "The C++23 sorted-vector version of a set: std::flat_set keeps the same ordered, unique interface but stores elements contiguously, trading O(log n) insert and stable iterators for cache-friendly lookup -- go there when the set is built once and mostly read."
