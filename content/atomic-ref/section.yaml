title: "std::atomic_ref"
description: "The C++20 way to apply atomic operations to an object you did not declare atomic. A std::atomic_ref<T> is a non-owning atomic view of an existing plain object -- an int, an array element, a struct field -- so you can make concurrent updates to it indivisible without changing its type to std::atomic. That matters when the type must stay plain: an array handed to an int*-taking API, a field in a trivially copyable struct, or data from a header you do not control. Covers atomic operations on a plain int, a lock-free parallel reduction into shared array elements, an atomic view of a struct field, a compare-exchange loop on a plain value, the alignment and lock-free constants, and publishing data through a plain flag with release/acquire -- alongside the anti-patterns of getting it wrong: mixing atomic_ref access with plain access to the same object, an atomic_ref left dangling by a moved or freed referent, an under-aligned referent, building a read-modify-write from a separate load and store, and using atomic_ref where you own the type and std::atomic would be simpler. Concurrency examples run under ThreadSanitizer on Linux/CI."
sort_order: 107
category: "Concurrency"
