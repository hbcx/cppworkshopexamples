# Related chapters -- cross-links shown at the bottom of the section page.
- slug: "execution-policies"
  note: "Where the rules here bite at scale: a callable under std::execution::par runs on many threads, so a shared counter must be atomic (or a reduction) exactly as in this chapter -- go there for the parallel algorithms and their data-race and synchronization hazards."
- slug: "object-pool"
  note: "A place these primitives are needed: a pool handed out across threads must guard its free-list -- an atomic or a lock -- and the shared-pool-without-a-lock anti-pattern there is the concrete failure -- go there for pooling, RAII handles, and the thread-safety gap."
- slug: "flyweight"
  note: "Another shared-state case: the flyweight factory's intern table is read and written from several threads, and its thread-unsafe-factory anti-pattern is a race an atomic or a lock fixes -- go there for interning, intrinsic vs extrinsic state, and the unsynchronized-cache trap."
- slug: "thread"
  note: "Where the threads that share these atomics come from: how you start, join, and detach a std::thread, and the anti-patterns of doing it wrong -- go there for launching work, and come back here for how those threads share data without racing."
- slug: "mutex"
  note: "What to use when an atomic is not enough: a single word fits an atomic, but an invariant across several variables needs a lock, which serializes a whole critical section -- go there for mutexes, RAII lock owners, deadlock avoidance, and reader/writer locks."
- slug: "condition-variable"
  note: "The classic, pre-C++20 way to wait for a condition, and the general one: where atomic wait/notify handles a single word, a condition variable waits on a mutex-guarded predicate over arbitrary state -- go there for the producer/consumer queue, notify_all gates, and timed waits."
- slug: "future"
  note: "When the handoff needs to carry a VALUE, not just flip a flag: atomic wait/notify signals that a word changed, but a std::future delivers a result (or an exception) from one thread to another and does the synchronization for you -- go there for async, promise, packaged_task, and shared_future."
