title: "Reading and splitting: getline over a stream"
standard: "C++11"
difficulty: 2
summary: "std::getline reads up to a delimiter and, run against an istringstream, is the standard way to split a string into lines or fields without a hand-written scanner."
notes: "std::getline(stream, out, delim) reads characters into out until it hits delim (default a newline, which it consumes but does not store) or end of input, and returns the stream so it tests true while a read succeeded -- that is why while (std::getline(in, line)) is the canonical line loop. Point it at a std::istringstream wrapping a string and the same call splits that string: getline(iss, field, ',') pulls off comma-separated fields one at a time. This beats slicing by hand with find/substr for anything with more than one delimiter, and beats operator>> when fields can be empty or contain spaces, because >> skips whitespace and stops at it while getline does not. Two edges: a trailing delimiter yields a final empty field only if there are characters after it, and getline leaves the delimiter out, so you never have to trim it. For whitespace-separated tokens where empties do not matter, iss >> token in a loop is simpler; reach for getline when the separator is fixed and empty fields are meaningful (CSV, key:value config, PATH-style lists)."
run: true
