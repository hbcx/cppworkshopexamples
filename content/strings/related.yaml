# Related chapters -- cross-links shown at the bottom of the section page.
# Each entry: the slug of another section + a one-line note on why to go there.
- slug: "string-view"
  note: "The non-owning way to look at the same characters: pass and slice text with no copy and no allocation when a function only reads it -- go there for borrowing text, and for the dangling traps that borrowing brings."
- slug: "regex"
  note: "When the text has a shape, not just content: pattern matching, extracting fields with capture groups, and find-and-replace -- go there when find and substr are re-deriving a format by hand."
- slug: "format"
  note: "The modern way to BUILD strings: std::format composes text from values with a type-safe, compile-checked format string -- go there instead of a + and to_string chain or a stream of << inserters."
- slug: "charconv"
  note: "The fast, non-allocating number conversions: std::to_chars and std::from_chars replace std::to_string and std::stoi on hot paths -- go there when the per-call std::string allocation and the locale lookup cost too much, or when the code must not throw."
- slug: "filesystem-paths"
  note: "Where a std::string becomes a pathname: a std::filesystem::path is built from a string and handed back as one, but knows about separators, extensions and portability that raw string work gets wrong -- go there before you split a path with find and substr."
- slug: "move-semantics"
  note: "std::string is the textbook move type: moving one hands over its heap buffer in O(1) while a copy allocates, and it is the object most of those examples use to show moved-from state."
- slug: "vectors"
  note: "std::string is a container of char with the same size/capacity/reserve growth model, so the reallocation, reserve and erase-remove lessons transfer straight across."
- slug: "unordered-containers"
  note: "std::string is the default hash-map key: lookup cost scales with its length because the whole string is hashed and then compared, which the hashing tradeoffs there make concrete."
- slug: "mismatch-equal"
  note: "The algorithms behind string comparison: std::string's < and compare() are lexicographical_compare over its characters, and equal/mismatch are how you test text for equality or find a common prefix -- go there for comparing two ranges, case-insensitive predicates, and dictionary order."
- slug: "subsequence-search"
  note: "The algorithms behind substring search: std::string::find is std::search over characters, and finding the last separator or the first of a set of delimiters are find_end and find_first_of on text -- go there for pattern search, runs, and any-of-a-set scanning."
