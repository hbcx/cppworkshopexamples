title: "std::invoke, bind and mem_fn"
description: "The callable-adaptation utilities in <functional>: std::invoke, the one rule that calls anything callable -- a function, a lambda, a functor, a pointer-to-member -- uniformly, which is what generic code needs; std::mem_fn, which turns a pointer-to-member into a functor for algorithms; std::bind, the pre-lambda partial-application tool with its _1/_2 placeholders; and std::bind_front, the modern C++20 replacement. Covers invoke over every callable form and the object-argument forms for member pointers, mem_fn projections, bind partial application, placeholder reordering, binding members and references, binding a named instantiation of a function template so the type is never repeated, and bind_front -- alongside the traps: bind where a lambda is clearer, bind copying its bound arguments, its silently dropped call arguments, and nested bind. For std::function itself see that chapter; for std::ref and reference_wrapper see its own."
sort_order: 158
category: "Function objects & utilities"
