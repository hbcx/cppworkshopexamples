# Related chapters -- cross-links shown at the bottom of the section page.
- slug: "standard-exceptions"
  note: "The concrete types to throw: logic_error versus runtime_error and their children, which one to pick, and how to derive your own. Go there once you know the mechanics here and need to choose a type."
- slug: "expected"
  note: "The value-based alternative: std::expected returns the error in the type system instead of throwing, which suits expected, high-volume failures where the cost and non-local jump of an exception are unwanted. Go there to decide throw versus return."
- slug: "optional"
  note: "The right return type when absence is a normal outcome rather than an error -- the fix in this section's control-flow anti-pattern. Go there for representing a missing value without throwing."
- slug: "raii"
  note: "Why stack unwinding matters: RAII wrappers release their resource in a destructor, so an exception leaves a function without leaking. Go there for the idiom that makes the error path clean up itself."
- slug: "exception-propagation"
  note: "The advanced layer over this one: capturing an exception as a value with std::exception_ptr, moving it across a thread, nesting causes with throw_with_nested, and the terminate handler. Go there once the basic throw/catch model here is solid."
