title: "Reusable operators via an opt-in trait"
standard: "C++20"
difficulty: 2
summary: "Write the bitwise operators once as constrained templates, enabled only for enums that opt in through a trait, so each new flag enum turns them on with a single line instead of copying the operators."
notes: "Hand-writing operator|, operator& and the rest for every flag enum is repetitive and easy to get wrong. The scalable form is a trait -- enable_bitmask_operators<E> -- that defaults to false, plus the operators defined once as templates constrained on that trait. A flag enum opts in with one specialization set to true. This version uses a C++20 concept, BitmaskEnum, in place of the older enable_if: the constraint reads at the point of use and gives a clear constraints-not-satisfied error, where enable_if removes the operator from the overload set and reports a less direct failure. Two benefits fall out for free: an enum that did not opt in never accidentally gains bitwise operators, and because each operator is one template E op E, mixing two DIFFERENT flag enums is a type error rather than a silent int."
run: true
sanitizers: []
