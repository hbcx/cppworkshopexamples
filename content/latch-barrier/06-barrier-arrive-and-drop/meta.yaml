title: "arrive_and_drop: leaving the group"
standard: "C++20"
difficulty: 3
summary: "barrier::arrive_and_drop() lets a thread leave the group for good. It arrives at the current phase (releasing the others) and permanently lowers the expected count for every future phase by one. This handles work that shrinks over rounds: a thread whose share is done bows out, and the remaining threads still synchronize with the smaller count, without rebuilding the barrier."
notes: "A std::barrier is created for a fixed group size, but real phased work does not always keep every thread busy to the end -- a partition empties, a branch of a search is pruned, a worker's region converges early. arrive_and_drop() is the clean way to shrink the group: the calling thread arrives at the current phase, so the phase can complete and the others are released, and it also decrements the expected count for all SUBSEQUENT phases by one, then returns. From that point the barrier expects one fewer arrival, so the remaining threads still meet correctly without anyone rebuilding or resizing anything. Here worker 2 participates in phase 1 and then drops; phase 2 completes with just workers 0 and 1, and the count reflects that. The alternative without it is ugly -- either keep dropped threads spinning through arrive_and_wait doing nothing, or tear down and recreate the barrier with a new size between phases. Contrast plain arrive(), which counts for the current phase but returns a token and keeps you in the group, with arrive_and_drop(), which counts AND removes you. This runs under ThreadSanitizer on Linux/CI, which confirms the shrinking-group synchronization is race-free."
run: true
sanitizers: [thread]
