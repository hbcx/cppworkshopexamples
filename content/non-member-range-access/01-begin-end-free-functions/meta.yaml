title: "std::begin and std::end: one spelling for containers and arrays"
standard: "C++11"
difficulty: 1
summary: "std::begin and std::end return the first and one-past-last iterator of any range, forwarding to the member begin/end for containers and returning plain pointers for a raw C array -- so one loop walks both."
notes: "A raw array has no member .begin(); std::begin(arr) returns arr and std::end(arr) returns arr + N, deduced from the array type. That is why generic code prefers the free functions."
run: true
