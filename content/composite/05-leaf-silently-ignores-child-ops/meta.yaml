title: "Anti-pattern: a leaf that silently ignores child operations"
standard: "C++14"
difficulty: 3
summary: "The middle path between transparency and safety, and the wrong one: putting add() on the Component but letting a leaf implement it as a silent no-op means adding a child to a leaf compiles, runs, and reports nothing -- the child is dropped and the caller never learns the operation was meaningless."
notes: "The transparency-versus-safety example framed the real choice: put child management on the Component and reject it visibly on a leaf, or keep it off the Component so misuse cannot compile. This anti-pattern is the tempting third option that is worse than both -- a transparent interface where the leaf's add() quietly does nothing. It compiles like the transparent design and it never throws like the safe one, so it looks like the best of both, but it has the safety of neither: a caller adds a child to a leaf, gets no error, and walks away believing the tree contains it. Here BadFile::add is an empty body, so adding to it changes nothing and says nothing; the leaf count stays 1 and the dropped child is simply gone. Bugs like this surface far from their cause -- later, when the missing node is noticed -- which is the worst place to debug. The fix is to make the impossible operation observable: GoodFile::add returns false so the caller can branch on it, or it throws so the mistake stops the program at the point it happened; either way the failure is reported rather than swallowed. Better still, if the codebase can carry it, is the safe design where a leaf has no add() and the mistake cannot be written at all. The rule: a leaf may refuse a child operation, but it must never pretend to have performed it. The tell: a Component with add()/remove() whose leaf override is an empty body or a bare return that neither stores the child nor signals refusal."
run: true
sanitizers: []
