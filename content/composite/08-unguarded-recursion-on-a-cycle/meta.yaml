title: "Anti-pattern: unguarded recursion on a cyclic structure"
standard: "C++11"
difficulty: 3
summary: "A recursive Composite operation assumes the structure is a true tree; run it on a structure with a cycle -- a back-edge followed as a child, a graph mislabelled a tree -- and it recurses forever and overflows the stack, so any traversal that can meet a cycle needs a visited set."
notes: "Composite's recursive operations are written for a tree: finite, acyclic, every node reached once. That assumption is usually safe because unique_ptr children make a cycle impossible -- ownership only flows downward. It breaks the moment the structure is not a pure tree: a node keeps a raw or shared back-pointer to its parent and some traversal follows it as if it were a child, or the same object is a genuine graph (a scene graph with instancing, a dependency graph, a document with cross-references). Then a naive recursion -- count each node plus its children -- follows a to b to a to b without end, recursing until the stack overflows, which is undefined behaviour, not a catchable error. This example does not run that version (UB is nondeterministic and would crash the build); it is shown in a comment, and only the guarded version executes. The fix is to remember what has already been visited: countGood inserts each node into an unordered_set and returns early when it sees one again, so a cycle terminates and every node is counted exactly once -- here two distinct nodes despite the a-b-a loop. The visited set is keyed by identity (the node address), not value, because two different nodes can compare equal. Two further notes: even without cycles, a legitimately very deep tree (a long linked chain modelled as a Composite) can overflow the stack, and the same fix does not help -- there an explicit stack and an iterative walk replace the recursion. And if the structure should be a tree but a cycle got in, the visited set hides a real bug; detecting and rejecting the cycle may be better than silently tolerating it. The sign: a recursive traversal over a structure whose links are raw or shared pointers that can form a loop, with no visited set."
run: true
sanitizers: []
