title: "Anti-pattern: type-checking the tree instead of polymorphism"
standard: "C++14"
difficulty: 3
summary: "Walking a Composite with dynamic_cast or a type tag to decide what to do at each node throws away the uniform interface that is the whole point: every operation repeats the type switch, every new node type must be added to every such function, and an unhandled type falls silently through."
notes: "Composite exists so that a client can treat every node the same way -- call one virtual operation and let each node implement it. The moment traversal code asks what KIND of node it is holding, that benefit is gone. sumBad here lives outside the nodes and dynamic_casts each one: if it is a Leaf do this, if it is a Branch do that. It works, and for two node types it looks harmless, which is why it spreads. The costs compound. Every operation that walks the tree -- sum, print, validate, serialise -- repeats the same cascade of casts, so the traversal logic is duplicated and the node-type knowledge is spread across the codebase. Every new node type must be found and added to all of them, and the compiler will not remind you: the fall-through at the bottom (return 0) means an unhandled type is silently ignored rather than flagged, so a forgotten arm is a quiet wrong answer. And dynamic_cast has a runtime cost paid on every node of every walk. The fix is the pattern itself: put the operation on the Component as a virtual function, so each node sums itself and traversal is one polymorphic call with no cast and no switch; adding GNeg is a new class implementing sum(), and no existing function changes or can break. dynamic_cast is not always wrong -- it is the right tool at a genuine boundary, such as recovering a concrete type from an external API -- but reaching for it to drive behaviour over your own type hierarchy is a virtual function you did not write. The sign: a function that dynamic_casts (or switches on a type enum) to choose behaviour while recursing through a structure you control."
run: true
sanitizers: []
