title: "Anti-pattern: a parent back-pointer that leaks the tree"
standard: "C++11"
difficulty: 3
summary: "Giving each node a shared_ptr to its children and a shared_ptr back to its parent forms an ownership cycle: the two references keep each other's count above zero, so the nodes are never freed -- a leak a unique_ptr tree cannot have, fixed by making the back-pointer a weak_ptr."
notes: "A Composite tree has a natural ownership shape: each node owns its children, and destroying the root destroys everything below it. Express that with unique_ptr children and there is no way to leak -- ownership flows one way, down the tree. The leak appears when a node also needs to point back at its parent (to walk upward, to bubble an event) and that back-pointer is made a shared_ptr. Now parent owns child and child owns parent: a reference cycle, and shared_ptr is reference-counted, not garbage-collected, so a cycle is exactly what it cannot reclaim. When the external handles drop, each node's count is still 1 because the other node holds it, and both live forever. The live-node counter here makes it visible: the weak-parent tree returns to zero live nodes when its scope ends, while the cyclic tree leaves two nodes alive after its scope -- leaked. The fix is to decide which direction OWNS: the parent owns the child (shared_ptr or unique_ptr downward), and the child's back-pointer is a weak_ptr, which observes the parent without keeping it alive, so the cycle is broken and lock() gives safe temporary access when needed. This is the general rule for any back-reference or observer link in a shared_ptr graph -- owning edges one way, weak_ptr the other. Shared ownership of a child by two parents is the same trap wearing a different shape: if a node genuinely belongs to two composites, shared_ptr is right, but then no strong cycle may close through it. The sign: a node type whose parent or back link is a shared_ptr rather than a weak_ptr, or a make_shared graph where strong pointers form a loop."
run: true
sanitizers: []
