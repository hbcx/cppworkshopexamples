- slug: "decorator"
  note: "The single-child relative: a Decorator is structurally a Composite with exactly one child, wrapping one component to add behaviour rather than branching into a tree -- read it for the one-child wrapper beside this many-child hierarchy."
- slug: "unique-ptr"
  note: "How a Composite owns its tree: each node owns its children through unique_ptr, so the whole tree frees in one step with no manual cleanup -- go there for the single-owner model and rule of zero this relies on."
- slug: "weak-ptr"
  note: "For parent back-pointers and shared leaves: when a node must point back at its parent, a weak_ptr avoids the ownership cycle that a strong back-pointer would leak -- see this chapter's cycle anti-pattern, then weak_ptr for the mechanics."
- slug: "visitor"
  note: "How to run operations over the tree without bloating the nodes: a Visitor packages each operation (render, evaluate, validate) as its own class and walks the composite, so new operations do not edit every node type -- go there for double dispatch over a part-whole structure."
- slug: "interpreter"
  note: "A Composite with a purpose: an expression tree for a small language IS a composite of terminal and non-terminal nodes, and Interpreter adds an interpret operation that evaluates it against a context -- go there for grammars, parsing text into the tree, and rule engines."
