title: "Anti-pattern: the god facade that fronts everything"
standard: "C++11"
difficulty: 3
summary: "A facade that unifies every subsystem in the application becomes coupled to all of them: any subsystem change can force an edit to it, every client that needs one operation depends transitively on all of them, and it only ever grows because nothing marks where it should stop."
notes: "Facade is meant to simplify ONE subsystem. Point it at the whole application and it turns into the god object the pattern was supposed to prevent. AppFacade here fronts billing, mail, and reporting, so it is coupled to all three: a change to any one can ripple into this class, a client that only wants to charge a card still compiles against a type that depends on the mailer and the report engine, and there is no boundary telling a future author to stop adding methods -- so it accretes until it is the entire system behind one class. The tell is a facade whose methods have nothing to do with each other, or whose name is as vague as the scope it covers (AppFacade, SystemManager, ServiceHelper). The fix is to give each cohesive area its own facade -- BillingFacade, NotificationFacade -- each fronting one subsystem and depending on nothing else, so a client depends only on the area it uses and a change stays local. This is the single-responsibility principle applied to facades: a facade should have one subsystem to simplify and one reason to change. A large system then has several small facades, not one enormous one, and it is fine for a higher layer to sit in front of those focused facades -- layered facades compose, but each layer's facade still fronts a coherent subsystem rather than everything below it."
