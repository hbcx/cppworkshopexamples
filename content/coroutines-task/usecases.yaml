- problem: "A request handler in an async service that must do several dependent steps -- authenticate, then load a record from the database, then render a response -- each of which waits on I/O. The framework wants one thing it can await per request and get back either a result or an error."
  why: "A task is that single awaitable unit: the handler co_awaits each step in order and co_returns the response, and the framework co_awaits the handler. The dependent steps read as straight-line code with normal locals, and a failure in any step surfaces at its co_await as an exception -- no callback nesting and no status code threaded through every stage."
  signal: "A handler written as chained callbacks or .then() continuations only to sequence async steps that depend on each other, or one that returns a future it immediately blocks on, when the steps are inherently sequential."

- problem: "Composing async operations into bigger ones -- a function that awaits two sub-operations and combines their results, built on top of other such functions -- where errors must not get lost between layers and each layer should read like ordinary code."
  why: "Because a task is itself awaitable, tasks nest: a task awaits sub-tasks and is awaited in turn, and an exception thrown deep in the tree propagates up through each co_await to whoever can handle it, exactly like a normal call stack. This is structured concurrency -- the async call graph mirrors the function call graph -- which a soup of callbacks cannot give you."
  signal: "Async helpers that each take a completion callback and manually forward both success and error to the next, or error-prone code that has to remember to check and propagate a failure at every async hop."

- problem: "An expensive async computation that may or may not be needed depending on later decisions -- a fallback fetch, an optional enrichment step -- where paying for it unconditionally wastes work, and cancelling an already-started operation is hard."
  why: "A lazy task does nothing until awaited, so building the task is free and only awaiting it runs the work. Deciding not to await it -- because a cache hit made it unnecessary, or an earlier step failed -- cancels it for free, with no started I/O to unwind. An eager model (like std::async) has already begun the work before you can decide."
  signal: "Eagerly launched async work whose result is sometimes discarded, or a flag that guards whether to use an operation that was nonetheless already kicked off."

- problem: "The top of the program, or a test, needs the value out of an async task, but main() and test functions are not coroutines and cannot co_await. Something has to run the async world to completion and return a plain value."
  why: "sync_wait is that boundary: it drives a top-level task until it finishes and returns the value (rethrowing any failure), so the async code stays async everywhere except the one explicit blocking point. In tests it lets a plain test body call an async function and assert on the result, without turning every test into a coroutine."
  signal: "A test that cannot call the async code under test because it has no way to await it, or a main() that reaches into an async subsystem and needs one blocking call to get its result out."
