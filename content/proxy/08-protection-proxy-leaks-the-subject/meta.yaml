title: "Anti-pattern: a protection proxy that leaks the subject"
standard: "C++11"
difficulty: 3
summary: "A protection proxy is only as strong as its weakest way to the subject; if it also hands out the real object through a getter or unwrap method, any caller reaches past the guard and the access control is decorative."
notes: "A protection proxy works by being the ONLY handle a client has to the subject, so every operation is forced through its checks. Give the client any other way to the real object and the guard is bypassed. LeakyProxy here refuses withdraw() for an unauthorized caller -- and then exposes unwrap(), which returns the raw RealAccount; the same caller takes it and withdraws directly, and the denial that just fired means nothing. The output shows it: denied, then immediately withdrew, on the same unauthorized proxy. This is not a subtle bug in the checking logic -- the checks are correct -- it is a hole in the boundary, and boundaries fail at their weakest point, not their average one. The fix is a rule, not a smarter check: a protection proxy must never expose the subject. No getter that returns it, no method that returns a reference or pointer to it, no leaking it through a callback parameter or an out-argument, and care that it is not copied out through a field. TightProxy holds the RealAccount privately and offers only the guarded operations, so there is no path around the guard. This extends to the whole capability: if a client needs a narrower ability (read but not write), give it a proxy that offers exactly that, rather than the full subject plus a promise not to misuse it. The tell: a proxy whose job is to restrict access but which has a public accessor -- unwrap, get, raw, inner, real -- returning the very object it is supposed to guard."
run: true
sanitizers: []
