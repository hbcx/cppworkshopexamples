title: "Anti-pattern: a remote proxy that hides latency and failure"
standard: "C++11"
difficulty: 3
summary: "Giving a remote proxy the exact interface of a local object -- a plain return value, no error channel -- hides that the call now crosses a network: it can be slow and it can fail, and a signature with nowhere to report failure forces the proxy to lose errors, returning a value the caller cannot distinguish from a real one."
notes: "A remote proxy makes a distributed call look like a method call, and that transparency is genuinely useful -- but taken literally it is the classic leaky abstraction the Fallacies of Distributed Computing warn about: the network is not reliable, latency is not zero, and a remote call can fail in ways a local one cannot. TransparentStub here mirrors the local Prices interface exactly, so priceOf returns a bare int; when the remote endpoint fails, there is nowhere in that signature to say so, and the proxy returns 0 -- indistinguishable from a real price of 0. The caller has no way to know the difference, and a lost error becomes a wrong decision downstream. The output makes the ambiguity concrete: DOWN returns 0 with no signal, and only the honest version reveals it was a failure. The fix is to stop pretending remote is local at the interface: HonestStub returns a Quote with an ok flag, so failure is part of the type and the caller cannot forget it. A production remote proxy goes further -- surfacing timeouts, exposing a way to retry or set a deadline, and documenting that latency is real -- precisely because the whole risk is that the seam looks free. This does not mean abandoning the pattern; the remote proxy is still the right structure for giving distributed code a clean local seam. It means the proxy's interface must be honest about being remote: a result or expected type, an error code, or a documented exception, never a local-shaped signature that can only succeed. The sign: a remote or RPC proxy whose interface is identical to a local one, with no error, status, or timeout in sight."
run: true
sanitizers: []
