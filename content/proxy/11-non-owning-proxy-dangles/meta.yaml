title: "Anti-pattern: a non-owning proxy that dangles"
standard: "C++14"
difficulty: 3
summary: "A proxy forwards to its subject on every call, so it must keep the subject alive; holding it by reference pushes that responsibility onto some outside owner, and a proxy built over a local or returned from a factory ends up referencing a subject that is already gone."
notes: "A proxy stands in for its subject and forwards to it, which means the subject has to outlive every use of the proxy. Hold it by reference and you have quietly delegated that lifetime guarantee to whoever owns the real object -- and proxies, like the virtual and remote kinds in this chapter, are typically built in a factory or a composition root from locals and temporaries, exactly where a returned reference-holding proxy dangles. RefProxy works in main only because the RealSensor it points at is a local that outlives it in the same scope; move that construction into a factory (the commented makeBad) and the returned proxy references a sensor destroyed when the factory returned -- undefined behaviour, which is why that path is described in a comment rather than run. The fix mirrors the owning adapter and the owning decorator: OwningProxy holds its subject through std::unique_ptr, so the proxy is the subject's owner and the pair stays valid for as long as the proxy does, letting makeGood build and return it. Reference-holding proxies are not always wrong -- when the subject provably outlives the proxy (a member proxying another member, a short-lived local wrapper) they avoid an allocation -- but they must not escape that scope, and a protection proxy in particular usually wants to own or share-own the subject so a client cannot outlive the guard. The default for anything built by a factory, stored past the current statement, or handed to another owner is to own the subject, not reference it. The tell: a proxy with a T& or T* member constructed from a local or temporary whose lifetime is shorter than the proxy's."
run: true
