title: "Anti-pattern: std::lower_bound on a set"
standard: "C++11"
difficulty: 2
summary: "std::lower_bound works on a std::set because it is sorted, but a set's iterators are only bidirectional, so the binary search cannot jump to the middle in O(1) and instead steps node by node -- O(n) overall. The set's MEMBER lower_bound and find walk the tree in O(log n)."
notes: "A binary search needs to reach the middle of the range in constant time to halve it, which requires RANDOM-ACCESS iterators. A std::set (and std::map, std::list) provides only bidirectional iterators: you can step one element forward or back, but not jump k positions in O(1). So std::lower_bound on a set still does O(log n) COMPARISONS, but each 'jump to the middle' is actually a walk of up to n/2 single steps, making the whole call O(n) -- the very linear cost you used a tree to avoid. The container already solves this: a set's MEMBER functions -- s.lower_bound(x), s.upper_bound(x), s.equal_range(x), s.find(x), s.count(x) -- descend the balanced tree directly in true O(log n), using the structure the free algorithm cannot see through the iterators. So on any node-based ordered container, use the member, never the std:: algorithm of the same name. This is the same lesson as std::find on a set, std::sort on a list, and std::remove on a list: the member exists precisely because the generic algorithm's iterator-only view cannot exploit the container's shape. The sign to watch for: std::lower_bound, std::upper_bound, std::binary_search or std::find called on a std::set, std::map, or std::list, where the member of the same name is the O(log n) tool."
run: true
