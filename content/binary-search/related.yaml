# Related chapters -- cross-links shown at the bottom of the section page.
- slug: "sort"
  note: "The prerequisite for every search here: a binary search is correct only on a range sorted by the same comparator, so sort establishes the order these algorithms exploit -- go there for ordering, comparators, and stable_sort."
- slug: "find-find-if"
  note: "The linear search these replace when the range is sorted: find is O(n) on any range, where binary_search and lower_bound are O(log n) on a sorted one -- go there for locating an element without a sort, and when a scan beats sorting first."
- slug: "sets"
  note: "The container that keeps itself sorted and searches in O(log n) with its own member lower_bound and find, the right choice over a hand-sorted vector when the collection changes often -- go there for the tree-based ordered set."
- slug: "maps"
  note: "The keyed lookup that does this natively: a std::map stores sorted key-value pairs and its member find, lower_bound and equal_range give O(log n) access without a parallel sorted vector -- go there for associative lookup by key."
- slug: "merge-set-operations"
  note: "The other sorted-range family: where binary_search queries one sorted range, merge and set_union/intersection combine two in O(n+m) -- go there for combining sorted ranges by union, intersection, and difference."
- slug: "numeric-helpers"
  note: "How to compute the middle index safely: std::midpoint bisects an interval without the (low + high) / 2 overflow that has bitten binary search for decades -- go there for midpoint, gcd, and lcm."
