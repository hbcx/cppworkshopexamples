title: "Storage duration and static initialization"
description: "How long objects live and when they are initialized -- the part of the object model behind global state, singletons, and a family of classic bugs. Covers the function-local static (initialized once, on first use, and thread-safe since C++11), the Meyers singleton built on it, non-local statics that are zero-initialized and then dynamically initialized before main, constinit to force compile-time initialization and dodge the ordering problem, thread_local for one instance per thread, and static data members including the C++17 inline static -- alongside the traps: the static initialization order fiasco (a global read before its dependency in another unit is constructed), a static local that quietly makes a function non-reentrant, and the destruction-order version where a static's destructor touches another static that is already gone. The order fiascoes are shown deterministically inside a single translation unit, where the order is defined, so the bug is reproducible and not undefined behaviour."
sort_order: 174
category: "Language & object model"
