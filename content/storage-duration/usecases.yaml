- problem: "A single shared resource that is expensive to build and must exist at most once -- a logger, a configuration object, a connection pool, a cache -- created on demand and reachable from anywhere, including from many threads."
  why: "A Meyers singleton (a function returning a reference to a local static) builds it lazily on first use, and the C++11 thread-safe-init rule means concurrent first calls cannot construct it twice, all without a lock around construction. A plain global object instead pays its construction cost at startup and is exposed to the initialization order fiasco; a hand-rolled double-checked lock is easy to get subtly wrong."
  signal: "A global object accessed through a bare extern, a get-or-create-with-a-lock pattern around a pointer, or a getInstance that hand-writes double-checked locking."

- problem: "Per-thread scratch or context that each thread uses on its own -- a reusable buffer, a random-number engine, the current request or transaction, a small per-thread cache -- where sharing one instance across threads would force locking on every access."
  why: "A thread_local gives each thread its own instance with no synchronization, since nothing is shared. That turns a contended, mutex-guarded resource into a private one, removing the lock entirely on the hot path. Passing the context explicitly through every call is the alternative, and it clutters every signature in the call chain."
  signal: "A mutex protecting a buffer or engine that is only ever used by one thread at a time, or a context object threaded as a parameter through a deep call stack solely so each thread can find its own."

- problem: "Global tables or configuration that can be computed at compile time -- a lookup table, a set of tuning constants, a parsed-once schema -- where a runtime constructor at startup would add cost and, worse, an ordering dependency on other globals."
  why: "constinit (or plain constant initialization) forces the value to be ready at compile time, so there is no dynamic initializer to run, no startup cost, and nothing that can be read before it is set -- it is outside the initialization order fiasco entirely. A dynamically initialized global carries both a startup cost and the risk of being used before its constructor runs."
  signal: "A global built by a constructor or factory call at startup whose inputs are all compile-time constants, or a global that another global's initializer already reads."

- problem: "Class-wide bookkeeping shared by all instances of a type -- a live-instance count, a monotonic id generator, a registry of created objects -- that belongs to the class rather than to any one object."
  why: "A static data member is that one shared variable, and C++17 inline static lets it live entirely in the header with no separate definition, so a header-only class can carry it cleanly. Putting the state in a free global next to the class instead scatters ownership and breaks the encapsulation the member gives you."
  signal: "A namespace-scope counter or container sitting beside a class and manipulated only by that class's constructors and destructors, or a static member still needing an out-of-line definition in a .cpp that inline static would remove."
