title: "Memento basics: save and restore state"
standard: "C++11"
difficulty: 1
summary: "Three roles: the originator whose state we snapshot, the memento that carries that state opaquely, and the caretaker that holds the memento and later hands it back to restore -- without looking inside it; a text editor types, snapshots, types more, then rolls back to the snapshot."
notes: "Memento answers a specific need: capture an object's state now so you can put the object back into that state later -- undo, rollback, a checkpoint -- without exposing how the state is stored. It does this with three roles that are worth naming precisely, because keeping them distinct is what makes the pattern work. The ORIGINATOR is the object being snapshotted; it is the only thing that knows how to produce a snapshot of its own state (save) and how to reinstate one (restore). The MEMENTO is the snapshot itself, and crucially it is opaque: it carries the state but reveals it to no one but the originator. The CARETAKER is whoever holds mementos on the originator's behalf -- an undo stack, a savepoint list -- and its defining property is that it treats mementos as sealed boxes: it can store, order, and hand them back, but it cannot read or change what is inside. In this minimal version main plays the caretaker, keeping one Memento and later returning it to restore(). The C++ shape that enforces the opacity is already here and is the heart of the next example: TextEditor::Memento has a private constructor and a private content_ member, and TextEditor is a friend, so only TextEditor can create a memento or read its contents. The caretaker can hold a TextEditor::Memento (copy it, put it in a container) but cannot construct one, cannot read content_, and cannot forge one -- the type is a handle whose insides are sealed to everyone but the originator. That is what distinguishes Memento from just handing out a copy of the state via a public getter: the state is preserved for restoration without being published, so the caretaker cannot come to depend on the originator's internal representation. Everything else in this chapter builds on this base: making the opacity explicit with a caretaker class, stacking mementos for undo and redo, shrinking them to deltas, and the ways a snapshot goes wrong (leaking its state, aliasing the live object instead of copying it, missing a field). The sign that a problem wants Memento: you need to restore an object to a previous state -- undo, cancel, retry, load -- and you want the saved state to travel and be stored without the rest of the code learning how that state is laid out."
