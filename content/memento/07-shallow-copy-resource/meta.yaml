title: "Anti-pattern: a shallow snapshot of an owned resource"
standard: "C++11"
difficulty: 3
summary: "When the state owns a heap resource the memento must copy the data, not just the handle; a memento that copies a shared_ptr to the buffer shares it with the originator, so an in-place edit after saving mutates the snapshot too and restore hands back the modified data. The fix is a deep copy at save time."
notes: "This is the aliasing bug's twin, arising through resource ownership rather than a raw reference, and it is common precisely because the shallow version looks safe -- it copies something. CanvasBad's state is a shared_ptr to a vector, and its memento dutifully copies the shared_ptr. But copying a shared_ptr copies the HANDLE, not the buffer: the memento and the canvas now co-own the same vector, so when the canvas does an in-place push after saving, it mutates the very buffer the memento is pointing at, and the snapshot silently changes underneath it. Restore then reinstates that shared buffer, which already contains the post-save edit, so the rollback fails -- the bad sum comes back 3 instead of the saved 1. The fix is a DEEP copy: CanvasGood's memento holds its own std::vector, copied from the canvas at save time, so the snapshot is independent of every later edit and restore brings back exactly the captured data. The general rule is that a memento must own its captured state by value, and for state that owns a resource, that means copying the resource's contents, not sharing a pointer to it. This is the deep-versus-shallow copy distinction that recurs whenever an object owns heap data: a shallow copy duplicates the pointer and leaves two owners of one buffer; a deep copy duplicates the buffer so each owner is independent. Memento needs deep copies because its entire purpose is isolation in time -- the snapshot must not move when the original does. Two related hazards worth naming. If the shared resource were instead a unique_ptr, the memento could not even copy the handle (unique_ptr is move-only), which would surface the problem as a compile error rather than a silent bug -- one reason value or unique ownership is safer than shared here. And raw owning pointers make it worse: a shallow memento copying a raw pointer shares the buffer AND risks a double-free or a dangling pointer when either owner frees it, turning the silent rollback failure into undefined behaviour. The performance tension is real -- deep-copying a large resource per snapshot is exactly the cost the delta example avoids -- but the answer is to capture less (a delta), never to capture a shared reference to the live resource. The sign: a memento that stores a shared_ptr, a raw pointer, or any handle to a mutable resource the originator keeps editing, rather than an owned deep copy of that resource's contents."
run: true
