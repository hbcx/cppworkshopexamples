title: "Anti-pattern: restoring into the wrong originator"
standard: "C++11"
difficulty: 3
summary: "A memento belongs to the object it was taken from; when mementos are type-erased into a shared snapshot type so a generic history can hold them, that belonging is lost and a snapshot from one originator can be applied to another, restoring state that means nothing there and silently corrupting it. The type system is the strongest defence; when you must type-erase, tag and check."
notes: "A memento is meaningful only for the originator that produced it -- its contents are that object's state, laid out the way that object understands. Apply it to a different object and you are pouring one thing's state into another, which at best is nonsense and at worst is silent corruption. In the well-formed examples throughout this chapter, that mistake is impossible by construction: each originator has its own nested Memento type, so TextEditor::Memento and Document::Memento are different types, and the compiler simply refuses to pass one where the other is expected -- the belonging is enforced statically and for free. This anti-pattern arises when that type distinction is thrown away. A generic undo system that wants to hold snapshots from many kinds of originator in one history is tempted to type-erase them into a common Snapshot type (here a plain struct, elsewhere a base class, a std::any, or a byte buffer), and once the snapshots share a type, nothing stops ThingBad's restore from accepting a Snapshot that came from a different originator. The bad output shows it: thing 2 restores thing 1's snapshot and takes on state 100, a value from an unrelated object, with no error. The defences form a hierarchy. Best is to keep the type tie: give each originator its own memento type so cross-application cannot compile, which costs nothing and catches the error at build time -- prefer this whenever the set of originators is known. When you genuinely must erase the type (a heterogeneous history, snapshots persisted to disk and reloaded, a plugin system), the fallback is to carry the identity in the data and check it: tag each snapshot with its originator's id (or type id) at save, and have restore reject a snapshot whose tag does not match, as ThingGood does -- turning a silent corruption into a loud, handled rejection. The check should fail safely (refuse and leave the originator untouched, as here) or throw, never proceed. This is the same lesson the Iterator chapter's mismatched-iterators and the general principle of not mixing tokens from different sources teach: an opaque handle must be usable only with the thing it came from, and if the type system can express that, let it; if not, enforce it at runtime. The tell: a shared or type-erased snapshot type restored by an originator that does not verify the snapshot was taken from it -- especially a generic history holding snapshots from multiple originators with no per-snapshot identity."
run: true
sanitizers: []
