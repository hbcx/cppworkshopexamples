title: "Anti-pattern: a mutable memento"
standard: "C++11"
difficulty: 3
summary: "A snapshot should be immutable once taken -- it records a value at a moment, and nothing should change that record afterward; a mutable memento lets a stored snapshot be edited after capture, so a stray write corrupts a value the undo history depends on and a later restore reinstates the corrupted value. Seal the captured state after construction."
notes: "This is the leaky-memento problem's other half. The leaky-memento anti-pattern was about READ access -- exposing the originator's private state through the snapshot. This one is about WRITE access -- letting the snapshot's captured value be changed after it was taken. A memento is a record of a value at a point in time, and the entire undo/redo mechanism trusts that record to be stable: if a stored memento can be mutated, then something -- a bug that reuses the object, a careless edit, aliasing through a shared handle -- can silently rewrite history, and the next restore faithfully reinstates whatever the memento now says, which is no longer what was captured. SettingsBad shows it: its Memento has a public, assignable volume, so after saving 50 a stray snapBad.volume = 999 corrupts the stored snapshot, and restore dutifully sets the volume to 999, a value that was never the real state at save time. The fix is immutability by construction: SettingsGood's memento holds its value privately, initialised once in the constructor, with only the originator a friend and no setter anywhere, so a stored memento's contents cannot be altered by anyone -- snapGood.volume_ = 999 does not compile. The captured value is fixed the moment save() runs and stays fixed until restore reads it. Note how the same opacity that solves the leaky-memento (read) problem also solves this (write) one: a nested class with private state and a friend originator gives no read access AND no write access to outsiders, so a single idiom delivers both encapsulation and immutability. That is why the well-formed mementos throughout this chapter are built that way. Where a language or design does expose the memento's fields (a public struct, a serialization format), immutability has to be added deliberately -- const members, no setters, defensive copies on the way in and out -- because the default of a plain struct is mutable. A subtler form of this bug is a memento that shares a mutable resource (the shallow-copy anti-pattern): even if the memento's own fields are const, a std::shared_ptr to a mutable buffer means the buffer can still be changed, mutating the snapshot's contents without touching the memento object -- so immutability must reach through to the captured resource, which again argues for an owned deep copy. The sign: a memento with public or otherwise writable state, or one holding a handle to mutable data, such that a stored snapshot's value can differ at restore time from what it was at save time."
