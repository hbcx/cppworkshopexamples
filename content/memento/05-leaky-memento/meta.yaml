title: "Anti-pattern: a leaky memento"
standard: "C++11"
difficulty: 3
summary: "Memento's purpose is to save state without publishing it; a memento with public fields throws that away, so anyone holding a snapshot can read the originator's private state and, worse, tamper with it before restoring -- injecting a value the originator would never produce and bypassing its invariants. The fix is the opaque memento, state private to the originator."
notes: "This is Memento's defining failure, because the pattern is not really about saving state -- copying a value is trivial -- it is about saving state WITHOUT exposing it, and a leaky memento keeps the saving while discarding the without. AccountBad's Memento is a struct with a public balance, so the snapshot is a window into the account's private representation: any caretaker or passing code can read the balance the account meant to keep private, and can WRITE it, setting it to -999 before calling restore. That second failure is the serious one. The account has an invariant (whatever keeps a balance valid), and it enforces that invariant on every path that changes balance_ -- except restore, which trusts the memento. A tamperable memento turns restore into a hole straight through the invariant: hand back a memento with a value the account would never have produced, and the account is now in an impossible state, with no method having authorized it. This is the same class of bug as the State chapter's leaking-state-to-client and the Iterator chapter's exposed internals -- an encapsulation the object worked to maintain, defeated through a side door -- here the side door is the object's own snapshot mechanism. The fix is the opaque memento the earlier examples built: AccountGood::Memento keeps balance_ private and declares only AccountGood a friend, so the memento can be held, copied, and stored by anyone, but read or constructed by no one but the account. safe.balance_ = -999 does not compile, restore can only receive a memento the account itself produced, and the invariant holds because the only states restore can reinstate are states the account actually reached. The general principle: a snapshot handed to untrusted holders must be opaque and immutable to them, or it is not a snapshot but a public copy of your internals with a restore hook attached. The friend-nested-class idiom is how C++ expresses this; other languages use package-private access or an inner interface, but the requirement is the same -- wide access for the originator, none for anyone else. The sign: a memento (or savepoint, or snapshot) type with public data members or public getters/setters that expose the originator's fields, especially when restore assigns those fields back without re-checking the originator's invariants."
run: true
