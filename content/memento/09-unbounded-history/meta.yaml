title: "Anti-pattern: an unbounded memento history"
standard: "C++11"
difficulty: 3
summary: "A caretaker that keeps every snapshot forever grows without limit; for full snapshots of real state that is a memory leak in slow motion -- a long session accumulates a copy of the document per edit, and the undo history can dwarf the document. Bound the history to the last N snapshots, or store deltas."
notes: "Memento's simplicity hides a cost that only shows up at scale: every snapshot is retained state, and a caretaker that never discards them grows without bound. UnboundedHistory keeps a snapshot per save, so after a thousand edits it holds a thousand copies -- and because each snapshot is a full copy of the state, a large document turns this into serious memory: the undo history alone can exceed the size of the thing being edited, and a long-running session degrades until it exhausts memory. It is not a leak in the C++ sense (nothing is lost or double-freed; the memory is reachable and correctly owned), but it is unbounded growth driven by normal use, which behaves like one. The fix is to bound what the caretaker keeps. BoundedHistory holds a deque and drops the oldest snapshot once the count exceeds a cap, so memory is capped at N snapshots regardless of session length -- the classic undo-depth limit that real editors expose as 'keep the last 100 operations'. The trade is explicit and reasonable: you give up the ability to undo arbitrarily far back in exchange for predictable memory, and the deque makes both ends cheap (push newest at the back, drop oldest at the front). This anti-pattern connects to two others in the chapter as points on one axis of snapshot cost. The delta example attacks the per-snapshot size (store the change, not the whole state), and this one attacks the number of snapshots retained (keep only recent ones); a real system often uses both -- deltas between periodic full checkpoints, with a bounded window of history -- so that neither the size nor the count of retained state can grow without limit. Two refinements worth knowing. A bound by COUNT is simplest, but a bound by total MEMORY is sometimes better when snapshot sizes vary, dropping oldest until under a byte budget. And coalescing helps: many editors group rapid small edits (each keystroke) into one undo entry, so the history counts user-meaningful steps rather than raw mutations, which both bounds growth and makes undo behave as users expect. The judgment: unbounded history is fine when the state is tiny or sessions are short, and a liability when either the state is large or the session is long -- which is most real editing. The tell: a caretaker that only ever pushes snapshots (a vector or list that grows on save with no eviction), holding full copies of non-trivial state, with no cap on depth or memory."
