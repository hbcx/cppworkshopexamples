title: "Anti-pattern: a snapshot that aliases live state"
standard: "C++11"
difficulty: 3
summary: "A memento must copy the state it captures; if it stores a reference or pointer to the originator's live field instead, it is not a snapshot but a live view -- by restore time it hands back the current value, not the saved one, so the rollback is a no-op. Copy the value into the memento at save time."
notes: "A memento's one job is to freeze a value as it was at a moment in time, and that requires a COPY. This anti-pattern stores a reference or pointer to the originator's live member instead, which looks like it captures the state but actually captures a live view of it. EditorBad's Memento holds a const std::string* aimed at text_, so save() records the address of the field, not its contents; between save and restore the editor appends to text_, and because the memento points at that same field, restore reads the current, mutated text and assigns it back to itself -- a no-op. The output makes it stark: after saving at Hello and typing more, the bad restore leaves Hello, world, because the snapshot was never a snapshot. The fix is to copy at save time: EditorGood's memento holds its own std::string, initialised from text_ when save() runs, so it is immune to later changes and restore reinstates the value that was captured. This is fundamentally about value versus reference semantics, and it is an easy mistake to make in the name of efficiency -- storing a pointer avoids a copy, and for a large state that copy is exactly what you wanted to avoid, which is precisely why the delta example exists: the right way to avoid the copy is to capture a smaller value, not to capture a reference to the live one. A reference into the originator is never a valid memento, for two reasons: it does not preserve the value (the bug here), and it dangles the moment the originator is destroyed or, for a vector-backed field, reallocates -- turning a silent no-op into undefined behaviour. The same trap appears with shared handles: a memento that copies a std::shared_ptr to a mutable buffer shares the buffer rather than snapshotting it, so in-place edits to the buffer corrupt the saved state -- the shallow-copy anti-pattern next door, the same failure through a smart pointer. The rule: a memento owns its captured state by value (a copy, a moved-in value, or a deep copy of any resource it holds), and never merely refers to the originator's living data. The sign: a memento whose members are pointers or references into the originator, or whose save() stores an address or a shared handle to mutable state rather than a copy of the value."
run: true
