title: "Undo and redo with two memento stacks"
standard: "C++11"
difficulty: 2
summary: "The caretaker keeps two stacks -- undo for states to go back to, redo for states to go forward to; before each edit it snapshots the current state onto undo and clears redo, undo saves the current state onto redo then restores undo's top, and redo mirrors it. This is the state-snapshot cousin of the Command chapter's undo."
notes: "Undo on its own is one stack; undo with redo is the standard two-stack construction, and getting the interaction right is the substance of this example. The undo stack holds past states you can return to; the redo stack holds states you undid and can re-apply. Three rules govern them. Before an edit, snapshot the current state onto the undo stack -- that is the state undo will bring you back to -- and clear the redo stack, because making a new edit after undoing branches the history and the old forward path is no longer reachable (this redo-clearing is the exact same rule the Command chapter's undo/redo example enforces, and forgetting it is a bug there too). Undo pushes the current state onto redo (so you can come forward again), then pops and restores the top of undo. Redo is the mirror: push current onto undo, pop and restore the top of redo. The trace shows the invariant holding -- type a, b, c to reach abc, undo twice to a, redo once to ab -- with each stack acting as the other's history. This is Memento's take on undo, and it is worth contrasting with Command's, since the chapters solve the same problem two ways. Command stores REVERSIBLE OPERATIONS: each command knows how to do and undo itself, so undo runs the inverse. Memento stores STATE SNAPSHOTS: undo simply reinstates a whole past state, and no operation needs an inverse. The trade-off is memory versus complexity. Memento is trivial to implement correctly (snapshot, restore) and handles operations that have no easy inverse, but it stores a full copy of the state per step, which is wasteful for large state -- the motivation for the delta example next. Command stores only the small operation and its inverse, so it is memory-cheap, but every operation must be made reversible, which is real work and sometimes impossible. Many real editors combine them: commands for the operations, with occasional full mementos as checkpoints to bound how far an undo has to replay. A caretaker note: because the mementos are opaque, History manages the whole undo/redo machine without knowing anything about the editor's text -- the same decoupling the previous example established, now doing real work. The sign that Memento-based undo fits over Command-based: the state is small or snapshot-friendly, or the operations are hard to invert, so saving whole states is simpler than making every action reversible."
