title: "Anti-pattern: an incomplete snapshot"
standard: "C++11"
difficulty: 3
summary: "A memento must capture all the state needed to restore the originator; save some fields and forget others and restore reinstates the saved ones while leaving the rest at their current values -- a partial rollback that silently mixes old and new state. A shape that saves position but not colour comes back with the old position and the new colour."
notes: "A memento is a promise: restore(save()) returns the originator to exactly where it was. That promise holds only if the snapshot captures ALL the state that restore is responsible for resetting, and this anti-pattern breaks it by capturing a subset. ShapeBad's memento saves x_ and y_ but not color_, so after moving and recolouring, restore rolls the position back and leaves the colour at its current value -- the shape comes back to (10,10) but blue, a state that is neither where it was nor where it is, a silent blend of old and new. The bug is quiet because the restored fields ARE correct, so a test that only checks position passes, and the missed field surfaces only when someone notices the colour did not revert. The fix is simply to capture every field that restore mutates: ShapeGood's memento carries x_, y_ AND color_, and restore resets all three, so the promise holds. What makes this anti-pattern worth its own example is that it is a maintenance trap more than a design mistake. The first version of a class often has one or two fields, the memento captures them, and everything works. Then someone adds a field -- the colour, a rotation, a selection -- updates the constructor and the methods, and forgets that the memento and its restore also need the new field, because those live off to the side and the compiler does not complain (the memento still compiles, restore still compiles, they just quietly do less than they should). So the snapshot silently rots as the class grows. Defences against that drift: keep the memento's field list adjacent to the originator's state so the omission is visible in review; better, have the originator capture its state by constructing the memento from ALL its members in one place, so adding a member forces a decision; best where feasible, snapshot the whole state as one value (a state struct the originator holds and copies wholesale), so there is nothing to keep in sync -- save copies the struct, restore assigns it, and a new field is automatically included. The judgment call is what 'all the state' means: transient or derived fields (a cache, a computed total) may be deliberately excluded and recomputed after restore, which is fine as long as it is a decision, not an oversight -- document what a memento captures and what it rebuilds. The tell: a memento whose field list is a subset of the originator's mutable state, especially a class that has gained fields since the memento was written, where restore leaves the newer fields untouched."
