title: "Incremental mementos: store the delta, not the whole state"
standard: "C++11"
difficulty: 3
summary: "A full snapshot copies the entire state on every save, wasteful when the state is large and each change touches little of it; an incremental memento records just what changed -- here one cell's index and old value -- so undo reverts that cell, turning a per-edit cost of copying the whole grid into copying one cell."
notes: "The straightforward Memento stores a complete copy of the state per save, and for small state that is exactly right -- simple and obviously correct. It stops being right when the state is large and each change is small: editing one cell of a thousand-cell grid should not cost a thousand-cell copy, yet a full snapshot pays that on every edit, so a long undo history of a big document can dwarf the document itself in memory. The incremental memento fixes this by storing the DIFFERENCE rather than the whole state. Here Grid::set returns a Delta that captures only the index and the previous value of the one cell it changes, and Grid::undo reverts exactly that cell -- so each entry in the undo history is a couple of integers instead of a full grid, and undoing walks the deltas in reverse to unwind the changes one at a time. The trace confirms the state comes back precisely: two cells changed and restored to zero, with the history holding three tiny deltas. This is the same memory-versus-simplicity trade the undo/redo example drew between Memento and Command, now available WITHIN Memento: a full snapshot is the simplest thing that works, a delta is the memory-efficient thing that takes more care. The care is real and worth stating. Deltas must be undone in strict reverse order, because each assumes the state that the later ones left -- apply them out of order and you restore wrong values. A delta captures only what a specific operation changed, so every operation that mutates state must produce a correct delta, and an operation that changes several things must capture all of them (the incomplete-snapshot anti-pattern, at the granularity of a delta). And a delta is only an undo step, not a random-access snapshot: to jump to an arbitrary past state you replay deltas from a known point, which is why real systems checkpoint with occasional full snapshots and keep deltas between them -- bounding both memory and replay cost. The pattern's opacity still holds: Delta's fields are private to Grid, so the caretaker (the history vector) stores deltas as opaque tokens and never interprets them. The rule of thumb: reach for full snapshots when the state is small or copying it is cheap, and for deltas when the state is large and changes are localized -- and combine them (periodic snapshots plus deltas) when both memory and the ability to seek matter. The tell that deltas are worth the complexity: full snapshots of a large state taken frequently, where each change actually touches only a small, well-identified part of it."
