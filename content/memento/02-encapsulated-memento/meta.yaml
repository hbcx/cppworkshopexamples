title: "An opaque memento the caretaker cannot read"
standard: "C++11"
difficulty: 2
summary: "Memento's real value is saving state WITHOUT exposing it: the caretaker (a History stack) stores and hands back the document's mementos but cannot read or modify their contents, because the memento's state is private to Document, which alone is a friend -- so the history coordinates undo without ever learning how a document stores its text."
notes: "This example isolates the property that distinguishes Memento from merely copying state around: the snapshot is opaque to everyone but the originator. History is a real caretaker -- it keeps a stack of mementos, pushes a new one on backup, and pops and restores on undo -- yet it is completely blind to what a memento contains. It can hold a Document::Memento, copy it into a vector, and give it back, but Document::Memento's text_ is private and its constructor is private, with only Document declared a friend, so History has no way to read the saved text, no way to modify it, and no way to fabricate a memento of its own. The commented line makes it concrete: stack_.back().text_ does not compile. Why this matters is the key point of the pattern. If the snapshot exposed its state (a public getter, a public field), the caretaker -- and anything else that touches a memento -- could come to depend on the originator's internal representation, read it, tamper with it, or construct a fake one, and the encapsulation the originator worked to establish would leak out through the back door of its own undo system. By sealing the memento, the originator can offer save/restore to the whole application while keeping its representation entirely private: History knows nothing about how a Document stores text, so a Document could switch from a std::string to a rope or a piece-table with zero change to History. The friend-nested-class idiom is the standard C++ way to express this dual interface -- a WIDE interface to the originator (which needs to read and write the memento's guts) and a NARROW interface to everyone else (who may only hold it) -- because C++ has no built-in notion of the pattern's two access levels, and friendship grants exactly the asymmetric access the pattern requires. Two practical notes. The memento is still copyable and movable (its implicitly-declared copy and move constructors are public), which is what lets History store it by value; friendship restricts the private MEMBERS, not the ability to copy the handle. And a caretaker should treat mementos as immutable sealed values -- store them, order them, discard them, but never assume anything about their contents -- which the opacity here enforces structurally. The leaky version, where the memento's state is public and the whole benefit is lost, is this chapter's first anti-pattern. The sign that encapsulation is being respected: the caretaker's code mentions the memento type only as an opaque token and never accesses a field or method that reveals the saved state."
run: true
