# Real-world use cases for this section -- see .claude/skills/cpp-chapter (SKILL.md,
# "Real-world use cases"). Values are single-line and quoted, no inner quotes.
- problem: "An order book keeps resting orders aggregated by price. The two questions asked constantly are what is the best price right now, and what sits within a band around it -- and prices appear and disappear as orders arrive and fill."
  why: "The container being sorted by key is the feature, not a side effect: the best price is begin(), and a band is lower_bound to upper_bound, both without looking at a single level outside the answer. An unordered_map answers a single exact price faster and answers neither of these at all -- finding the best price in one means scanning every level, on every update."
  signal: "An unordered_map or a hash table followed by a min_element, a sort, or a full scan to find the smallest or largest key, or any lookup keyed by a value where nearest, next or between is asked as often as equal to."

- problem: "A store of events, samples or audit records keyed by timestamp, where the read pattern is a window: everything between two instants, the last entry before a given time, the next event due. New records keep arriving while the windows are being queried."
  why: "lower_bound and upper_bound turn the window into two O(log n) probes and a walk over exactly the matching entries, and inserting a new record does not disturb any of it. A sorted vector answers the same query and is faster to scan, but here the inserts are interleaved with the reads, and each one shifts the tail and invalidates every iterator the readers are holding."
  signal: "A container of timestamped records scanned front to back with an if that skips everything outside a range, or a sorted vector that is re-sorted or insert-shifted whenever a record arrives."

- problem: "The program writes something a human or another tool will read: a config file, a manifest, a report, a serialized document, or the output a test compares against an expected file. The content is assembled in a container and then written out."
  why: "std::map iterates in key order, so the same data produces byte-identical output on every run, every machine and every standard library -- which is what makes diffs meaningful, caches keyed on the output hash correct, and builds reproducible. unordered_map gives an order that depends on the hash, the insertion history and the implementation, so the output shuffles between runs and the test that compares it is flaky for reasons that look like nothing."
  signal: "An unordered_map whose contents are iterated to produce output, followed by a sort into a temporary vector to make it stable -- or worse, not followed by one, in a test that fails now and then."

- problem: "A long-lived index of entities -- sessions, connections, open documents -- where handlers hold a reference or pointer to a value and keep using it while other entries are being inserted and erased around them."
  why: "std::map allocates each entry in its own node, so inserting or erasing anything else leaves every existing reference, pointer and iterator valid, and C++17 node handles let an entry be moved between maps or re-keyed without the value ever being copied. A sorted vector of pairs, the usual faster alternative, invalidates all of it on the first insert that grows or shifts it."
  signal: "A sorted vector of pairs whose elements are addressed by stored pointers or indices, or a map replaced by a flat container in a profile-driven change without checking who was holding a reference into it."
