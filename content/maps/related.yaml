# Related chapters -- cross-links shown at the bottom of the section page.
# Each entry: the slug of another section + a one-line note on why to go there.
- slug: "unordered-containers"
  note: "Drop the ordering and you get the hash-table version: O(1) average lookup instead of O(log n), at the cost of any defined iteration order."
- slug: "associative-containers"
  note: "The head-to-head benchmark of std::map vs std::unordered_map vs a sorted vector, and why the asymptotically slower container is often the faster one."
- slug: "sets"
  note: "The keys-only counterpart: the same ordering and node stability, without a mapped value attached to each key."
- slug: "find-find-if"
  note: "The linear-search algorithm and why it is the wrong tool here: std::find scans a map in O(n) and ignores the tree, where the member find is O(log n) -- go there for find/find_if over sequences and the member-find-versus-std-find comparison."
- slug: "binary-search"
  note: "The same O(log n) lookup on a sorted vector instead of a tree: binary_search, lower_bound and equal_range give a map's access pattern over contiguous storage, the read-mostly alternative to a map -- go there for searching sorted ranges."
