title: "Coroutines: std::generator (C++23)"
description: "The standard library's ready-made generator, the capstone to the hand-rolled one this category opened with. std::generator<T> from <generator> is the coroutine type C++20 left you to write yourself: one declaration replaces the whole promise_type and iterator, and it comes with the parts that are fiddly to get right by hand -- reference element types that avoid copies, recursive yielding with co_yield elements_of so a tree walk composes without per-level cost, and clean composition with the ranges views because a generator is an input_range. Covers the drop-in basics, arbitrary and reference element types, recursive generators with elements_of, piping through filter and take, and infinite lazy sequences -- alongside the traps that survive the upgrade: yielding a reference into a source that has already died, hand-forwarding nested generators instead of using elements_of, and re-traversing a single-pass generator. Requires clang to be built with -fsized-deallocation (g++ has it on by default), which is why the examples set it in extra_flags."
sort_order: 170
category: "Coroutines"
