title: "Filesystem paths"
description: "The std::filesystem::path type from C++17: a portable value that holds a pathname and takes it apart or builds it back up by TEXT alone, without ever touching the disk. Covers what a path is and why generic_string() is the portable spelling, decomposition into filename/stem/extension/parent and the root parts, joining paths with the non-member operator/ and the append-versus-concat difference, iterating a path's components and rebuilding it, editing parts with replace_extension/replace_filename/remove_filename, purely lexical cleanup with lexically_normal and lexically_relative, and cross-platform concerns around separators, Unicode and comparison -- alongside the traps: gluing paths with string concatenation, joining a rooted path that discards the left side, wrong assumptions about extension() and stem(), comparing path text to decide two paths are the same file, hardcoding a separator, and losing non-ASCII names through the narrow string()."
sort_order: 116
category: "Files & I/O"
