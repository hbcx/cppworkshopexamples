# Related chapters -- cross-links shown at the bottom of the section page.
- slug: "accumulate-reduce"
  note: "Why reduce exists next to accumulate: reduce may combine elements in any order, which is exactly what lets par split a fold across threads -- so the associativity rules there are the precondition for parallel reduction here -- go there for reduce, transform_reduce, and the init-type and associativity traps."
- slug: "sort"
  note: "The algorithm that parallelizes most cleanly: std::sort takes a policy and produces the same order however the work is split, so a large sort gets multi-core for one extra argument -- go there for ordering, comparators, and stable_sort."
- slug: "for-each"
  note: "The per-element apply you most often parallelize: for_each with par runs the callable across threads, which is where the data-race and no-synchronization rules bite hardest -- go there for the plain visit and why a captured accumulator becomes a race under par."
- slug: "atomic"
  note: "The primitive that fixes the shared-state hazard here: when a par callable must touch shared data, an atomic (or a reduction) makes it race-free, and the memory-order rules explain the visibility par relies on -- go there for atomic counters, compare_exchange, and memory ordering."
- slug: "thread"
  note: "The manual level below these policies: when your parallel work is not a standard algorithm, you drop to std::thread and manage the workers, joins, and pool yourself -- go there for launching threads by hand and the pitfalls (oversubscription, forgetting to join) the policies hide from you."
