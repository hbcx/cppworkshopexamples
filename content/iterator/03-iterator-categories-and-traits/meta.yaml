title: "Iterator categories and traits"
standard: "C++11"
difficulty: 2
summary: "An iterator's category is a promise about which operations it supports, and algorithms dispatch on it: a forward iterator has ++ only, so std::distance counts step by step (O(n)); a random-access iterator adds it + n, it - it and it[n], so std::distance is one subtraction (O(1)) and std::sort applies -- the same algorithm, a faster path, chosen by the category tag."
notes: "The iterator_category typedef is not documentation; it is a dispatch key the algorithm library reads to pick an implementation, and understanding it explains why some algorithms are fast on some iterators and unavailable on others. The categories form a hierarchy of increasing capability: input and output (single-pass read or write), forward (multi-pass, ++ only -- a linked list), bidirectional (adds --, a std::list or std::map), and random-access (adds it + n, it - it, indexing and ordering -- a vector or an array). Each level is a superset of the previous, so an algorithm written for a weaker category also accepts a stronger one. std::distance is the clearest illustration: given a forward iterator it can only count by incrementing until the ends meet, which is O(n); given a random-access iterator it computes end - begin in one subtraction, O(1). The library selects between these at compile time by inspecting iterator_category through std::iterator_traits -- no runtime cost, just a tag-dispatched overload. Numbers here wraps a contiguous buffer and declares its iterator random_access_iterator_tag, backing that claim with the full operator set: +, - (both the jump and the iterator difference), +=, -=, [], and the ordering comparisons, alongside * and ++/--. Because the claim is honest, three things follow that a forward iterator cannot offer -- std::distance is O(1), std::advance moves by a single += rather than n increments, and std::sort compiles at all, since sorting fundamentally needs to jump and compare positions and is therefore defined only for random-access iterators. Try std::sort on the linked list from the previous example and it fails to compile, which is the category system doing its job: refusing an operation the iterator cannot support, rather than silently misbehaving. The five member typedefs (category, value_type, difference_type, pointer, reference) are how a hand-written iterator publishes all this; before C++17 std::iterator was a helper base that provided them, but it is deprecated, so declaring the typedefs directly is the current practice. The rule when writing an iterator: claim the WEAKEST category that fits what you can actually support correctly and efficiently, because the category is a promise algorithms trust -- claiming more than you deliver is the subject of this chapter's lying-category anti-pattern."
