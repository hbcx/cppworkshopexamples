title: "Anti-pattern: exposing internals instead of iterators"
standard: "C++11"
difficulty: 3
summary: "The Iterator pattern lets callers traverse a container without knowing how it stores its elements. Expose the raw storage instead -- a data pointer and a size, or indexing tied to contiguous layout -- and every caller couples to that representation, so it can never change; offering begin()/end() keeps callers oblivious to the layout, which stays free to evolve."
notes: "This is the Iterator pattern seen by its absence: the failure to provide one, and what that costs. The whole reason the GoF pattern exists is to decouple traversal from representation, so a container can expose a way to walk its elements without revealing whether they live in an array, a linked list, a tree, or a computation. StackBad throws that away by handing out its internals -- a data() pointer and a size() -- which forces every caller into the same shape: a for-i loop indexing s.data()[i], which only works because the storage is a contiguous array indexed from zero. That coupling is invisible until you try to change the representation. The day StackBad should become a linked list, or a deque of blocks, or grow beyond its fixed buffer, every caller that indexed into data() breaks, because they encoded the layout into their loops. The representation was supposed to be an implementation detail and instead became part of the public contract. StackGood fixes it by exposing begin() and end() and nothing else. The iterator here happens to be a raw pointer, because the storage is an array -- but the caller does not know that and cannot depend on it; sumGood just writes a range-based for and would work unchanged if the two lines defining begin()/end() switched to returning a linked-list iterator. The layout is now genuinely private, free to change, and the caller is coupled only to the abstract idea 'this is iterable'. Two broader points. First, this is the encapsulation argument for iterators, distinct from their convenience: even when indexing is possible, exposing iterators rather than storage is what keeps the representation changeable, and it is why standard containers expose begin()/end() (and the free std::begin/std::end) rather than a buffer pointer. Second, offering iterators immediately buys the entire algorithm library and range-based for for free, so the abstraction that protects your representation also makes the type more capable, not less. This does not forbid indexing where it is genuinely part of the abstraction -- a matrix or a fixed vector may legitimately offer operator[] -- but that is a deliberate interface decision, not a leak of storage a caller then has to reverse-engineer. The sign: a container that exposes a raw data()/buffer pointer plus a size for callers to loop over, or forces index-based access, where a begin()/end() pair would let callers traverse without touching the representation."
