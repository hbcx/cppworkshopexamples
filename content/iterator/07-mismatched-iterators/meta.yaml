title: "Anti-pattern: mixing iterators from different ranges"
standard: "C++11"
difficulty: 3
summary: "An iterator pair only points to a range when both iterators come from the same container and in the right order. Pairing one container's begin() with another's end(), or putting end() before begin(), yields something that is not a range: the loop walks off into unrelated memory or never terminates -- undefined behaviour the compiler cannot catch, because the types match."
notes: "The half-open range [first, last) carries an unstated precondition that is easy to violate: last must be reachable from first by repeated increment, within one container. That holds automatically when you write v.begin(), v.end(), which is why the convention is safe in normal use -- but nothing in the type system enforces it, because a.begin() and b.end() have the same type for two vectors a and b, so any mismatch compiles cleanly and fails only at runtime. Three shapes of the mistake are shown. Iterators from different containers: std::find(a.begin(), b.end(), x) asks the algorithm to advance from a's start until it reaches b's end, which it never will, so the loop runs off the end of a into whatever lies beyond -- undefined behaviour. Hand-written loops with the same defect, for (it = a.begin(); it != b.end(); ++it), have the identical problem. And reversed bounds, std::find(a.end(), a.begin(), x), where last precedes first, so the range is not traversable at all. All three are undefined behaviour, which is why they are described in comments and only the correct same-container calls run: UB can behave differently across compilers and must never go through the compile gate. The deeper lesson is that an iterator carries no back-pointer to its container and no bounds -- it is typically just a wrapped pointer or node address -- so it cannot validate that a partner iterator belongs to the same sequence; comparing iterators from different containers is explicitly undefined, not merely unspecified. The defenses are conventions, not compiler checks: always take begin() and end() from the same expression, prefer range-based for and whole-container algorithm calls that make it structurally impossible to mismatch the ends, and when passing iterator pairs across function boundaries treat them as an inseparable unit from one container. A debug standard library (the _GLIBCXX_DEBUG mode, or sanitizer builds) will catch many of these at runtime, which is a good reason to run tests under them. The sign: a begin() and an end() in the same algorithm call or loop condition that name different container variables, or an algorithm call whose first argument is an end()/rbegin() paired with a mismatched second."
