title: "A lazy generator range: traversal without storage"
standard: "C++11"
difficulty: 3
summary: "An iterator need not walk stored elements -- it can compute them. FibUpTo yields the Fibonacci numbers below a limit one at a time, the iterator holding only the two running values and producing the next on ++, so an unbounded sequence is consumed as a finite range with nothing materialised: traversal fully decoupled from storage."
notes: "The basics example hinted that an iterator is a cursor whose source is its own business; this example takes that to its conclusion by removing the container entirely. FibUpTo has no elements -- its iterator holds two unsigned values, operator* returns the current one, and operator++ folds them forward to the next Fibonacci number -- so the sequence 0,1,1,2,3,5,8,... exists only transiently, one value at a time, as the loop runs. A range-based for walks it exactly as it would walk a vector, which is the payoff: because the iterator protocol says nothing about where values come from, a computed sequence and a stored one are interchangeable to every consumer, including the standard algorithms. This laziness is not a toy. It is how you iterate things that are expensive or impossible to materialise: the lines of a multi-gigabyte file, the pages of a paginated API fetched on demand, an infinite mathematical sequence truncated by the consumer, a random stream. You produce each element only when asked and never hold more than the current position's state, so memory stays constant regardless of how much is traversed. The end() of such a range is worth studying, because it is not a stored past-the-end position -- there is no storage -- but a CONDITION. Here the iterator carries a done_ flag that ++ sets once the computed value reaches the limit, and operator!= compares only that flag, so a live iterator differs from end() until it marks itself done. That sentinel shape -- end is 'the generator says it is finished', not 'the pointer reached the last slot' -- is exactly what C++20 formalised by letting the end sentinel be a different type from the iterator; before that, the flag-in-the-iterator trick shown here is the common way to express it. Two honest caveats. This iterator is effectively input/forward and single-purpose: comparing two live generators is meaningless (the != only makes sense against end()), which is why it is written for the end-comparison a for-range loop actually performs, not as a general-purpose comparable iterator. And a generator that computes on ++ must keep operator* cheap and side-effect-free (just return the stored current value), doing the work in ++ where the traversal expects it, so that reading the same position twice does not recompute or advance. The tell that a generator range fits: you are about to build and return a whole container just so a caller can loop over it once, when the values could be produced on demand instead."
