title: "Anti-pattern: dereferencing end()"
standard: "C++11"
difficulty: 3
summary: "Searching algorithms report 'not found' by returning the end iterator, which points one past the last element -- a position, not a value. Dereferencing it is undefined behaviour, so a find result must be compared against end() before it is dereferenced; skipping the check reads past the container and often prints plausible garbage."
notes: "The half-open range [begin, end) is the convention every C++ iterator interface is built on, and its defining property is that end() does not point at an element -- it is the position one past the last, a boundary marker. Every searching algorithm exploits this to signal failure: std::find, std::find_if, std::search, and the associative containers' own find() all return end() to mean 'not here', because end() is the one iterator value guaranteed not to denote an element. That makes checking the result against end() mandatory, not optional: dereferencing end() reads memory that is not part of the sequence, which is undefined behaviour. The reason this bug is dangerous rather than merely wrong is that it usually does not crash. The past-the-end address is frequently readable, so *end() yields whatever bytes happen to be there -- a plausible number, an empty-looking string -- and the program continues with silent garbage until that value reaches somewhere it matters, often far from the missing check. That is why the unchecked dereference is shown only in a comment here and never executed: undefined behaviour can differ between g++ and clang++ and must not run under the compile gate. The fix is a one-line habit: after any search, branch on it != end() and dereference only in the found branch, as the runnable code does for both the present and absent values. Two adjacent points make this a discipline rather than a single rule. First, the same applies to a container's own lookups -- map::find returns end() on a missing key, which is exactly why map::at (throwing) or a checked find is safer than assuming the key exists. Second, begin() == end() is the canonical empty-range test, so an algorithm that returns begin() unconditionally, or code that dereferences *v.begin() without checking the container is non-empty, is the same mistake in a different disguise. The tell: the result of find (or find_if, or a container find) dereferenced -- *it, it->member -- on any path that has not first confirmed it != end()."
