title: "Anti-pattern: mutating a container while iterating it"
standard: "C++11"
difficulty: 3
summary: "Erasing from a container during a loop invalidates iterators and indices: an index loop that erases skips the element shifted into the freed slot (defined but wrong), and the iterator form where erase invalidates the iterator makes the next ++it undefined behaviour -- use erase's return value, the valid iterator to the element after the removed one."
notes: "Iterator invalidation is the single most common iterator bug in C++, and removal during traversal is where it bites hardest. The trouble is that erase changes the container out from under the cursor that is walking it, and neither an index nor an iterator automatically accounts for the shift. The index version is defined behaviour but silently wrong: erasing v[i] from a vector shifts every later element down one, so the element that was at i+1 is now at i, but the loop's ++i moves past it -- the shifted element is never examined, and evens survive, as the bad output shows. The iterator version is worse: for a vector, erase invalidates every iterator at or after the erased position, so the it the loop holds is dangling the instant erase returns, and the subsequent ++it is undefined behaviour -- it may appear to work, corrupt data, or crash depending on the build. That case is described in a comment and not run, because undefined behaviour must not go through the compile gate, where it could differ between compilers or trip the output check. The fix rests on a fact worth memorising: the erase members return the iterator to the element that followed the removed one, precisely so a loop can continue safely. So the correct loop advances by assignment on removal (it = v.erase(it)) and by ++it only when it keeps the element, never both, which visits every element exactly once and leaves the right result. For the specific task of removing everything matching a predicate, the idiomatic form is the erase-remove idiom -- v.erase(std::remove_if(first, last, pred), last) -- which does it in one pass and one allocation-free shuffle (covered in the std::vector chapter). The invalidation rules differ by container and are worth knowing: vector invalidates from the erased point onward (and everything on reallocating growth); deque broadly invalidates; but node-based containers (list, map, set) invalidate only the erased element's own iterator, so erasing during a list traversal needs the same return-value discipline but does not disturb the other iterators. The sign: any loop that calls erase, insert, push_back or resize on the container it is currently walking, without reseating its iterator from the mutating call's return value."
run: true
