title: "Anti-pattern: an iterator that outlives its container"
standard: "C++11"
difficulty: 3
summary: "An iterator is a non-owning reference into a container and is valid only while that container lives. Taking an iterator from a temporary (a function returning a container by value) or from a local that then goes out of scope leaves it dangling into destroyed storage -- keep the container in a named variable for as long as its iterators are used."
notes: "Iterators do not own the elements they traverse; they reference into a container that owns them, exactly like a raw pointer or a reference, and they inherit the same lifetime rule -- they must not outlive what they point into. The trap is that this is invisible in the type: an iterator from a temporary looks and compiles identically to one from a long-lived variable. The headline case is a function that returns a container by value: auto it = makeNumbers().begin() takes an iterator into a temporary vector that is destroyed at the end of that full expression (the semicolon), so it dangles before the next line runs, and dereferencing it is use-after-free. The same shape appears whenever the container's scope is shorter than the iterator's: saving begin() or &v[0] from a block-local container and using it after the block, or storing an iterator as a member that outlives the container it referred to. None of these are caught by the compiler, and like most use-after-free they often appear to work -- the freed memory is usually still intact for a moment -- which is why the dangling cases here are described in comments and never run: undefined behaviour must not go through the compile gate, and a build that happened to print the old value would be teaching the wrong lesson. The fix is to give the container a name whose lifetime covers all use of its iterators: std::vector<int> nums = makeNumbers(); moves the returned value into a variable that outlives the iterator, and everything downstream is safe. One important non-bug to distinguish, because it looks similar: range-based for over a temporary -- for (int x : makeNumbers()) -- IS safe, because the language binds the temporary to a hidden variable whose lifetime spans the whole loop; the danger is specifically extracting and keeping an iterator (or reference, or pointer) that outlives the full expression the temporary was created in. The broader discipline: treat an iterator like a borrowed reference, never return one into a local, never store one longer-lived than its container, and when an interface must hand out a view into data, make the ownership and lifetime explicit. The sign: begin()/end() (or & of an element) called directly on a function result, a temporary, or a soon-to-expire local, with the resulting iterator used after that object's lifetime ends."
run: true
