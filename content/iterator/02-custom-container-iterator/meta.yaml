title: "A custom container: iterator and const_iterator"
standard: "C++11"
difficulty: 2
summary: "Give a real container -- here a singly linked list -- iterators with the standard member typedefs and operators, and it works with range-based for and the standard algorithms (std::find, std::distance) unchanged, because those speak only iterator; a const_iterator lets const objects be traversed read-only."
notes: "This is the Iterator pattern doing its GoF job on a real structure: IntList is a singly linked list, and callers walk it -- with range-based for, with std::find, with std::distance -- without ever touching a Node, so the representation stays private and could change to a different structure with no change to any caller. Two things lift this above the minimal range example. First, the iterators declare the five member typedefs the standard library reads through std::iterator_traits: iterator_category, value_type, difference_type, pointer, and reference. The minimal iterator got away without them because a range-based for loop asks only for *, ++ and !=; but algorithms that need to reason about the iterator do consult the traits -- std::distance returns a difference_type and dispatches on iterator_category, so it will not compile against an iterator that lacks them. Declaring them is what turns a type that merely loops into a full-fledged iterator the whole library accepts, and the next example shows the category typedef actually changing which algorithm strategy runs. Second, the list provides both a mutable iterator and a const_iterator, selected by whether begin()/end() are called on a non-const or const list. The const_iterator yields const int& so a read-only traversal cannot accidentally write, and it is what a const IntList& exposes; the mutable iterator yields int& so range-for by reference (for int& v : list) and mutating algorithms can write through it, as the scaling loop does. Providing both is standard container practice and the reason const-correctness flows through generic code. A few production details this stays clear of but that real iterators handle: post-increment is provided here (it++ returning the old value) because some algorithms use it, but operator-> is omitted since the element is an int with no members; a genuinely reusable list would template on the element type and share the two iterators through one template parameterised on constness rather than duplicating them; and the container is made non-copyable to keep the focus on iteration rather than on deep-copying nodes. The forward_iterator_tag is the honest category for a linked list: you can traverse forward repeatedly, but not backward and not by jumps, which is exactly what the next example contrasts against a random-access iterator."
