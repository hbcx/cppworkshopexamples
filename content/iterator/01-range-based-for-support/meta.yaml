title: "Iterator basics: supporting range-based for"
standard: "C++11"
difficulty: 1
summary: "A type becomes iterable the moment it offers begin() and end() returning an object that supports *it, ++it and it != end -- that is all a range-based for loop needs. The iterator holds only the current position, which need not be a pointer into memory: here it holds an integer and computes the sequence."
notes: "The Iterator pattern's job is to let you traverse something without knowing how it is stored, and C++ takes that further than most languages: an iterator is not a class you inherit from but a PROTOCOL a type satisfies, and satisfying it wires your type into the language's range-based for loop and into the entire standard algorithm library. The protocol a for-range loop requires is tiny -- given begin() and end(), it needs *it to read the current element, ++it to advance, and it != end to test for completion -- so the minimal iterator here defines exactly those three operations and nothing else. The loop for (int x : IntRange(2,7)) is pure syntactic sugar for calling begin() and end() once and then repeating *it, ++it, and the inequality test, which the second loop shows spelled out by hand; the two are identical. What makes this example more than a formality is that IntRange stores no elements at all. Its iterator holds a single int, operator* returns that int, and operator++ increments it, so the sequence 2,3,4,5,6 is computed on the fly rather than read from an array. This is the first hint of an idea the lazy-generator example develops: an iterator is a CURSOR, an abstraction over position and how to advance, and where it gets its value -- an array slot, a linked-list node, a computation, a network socket -- is its own business the consumer never sees. That decoupling is the whole point of the pattern, and it is why the same for loop and the same algorithms work over a vector, a custom tree, and a computed range without change. A few honest notes for real iterators, developed in the following examples: production iterators also declare category typedefs so the algorithm library can reason about them, provide == as well as !=, offer a const_iterator for read-only traversal, and often a post-increment it++ -- all of which this minimal version omits to keep the mechanic visible. The tell that a type wants this: any class holding a collection whose users would otherwise have to reach into its internals to walk it, when a begin()/end() pair would let them use range-for and std::find instead."
