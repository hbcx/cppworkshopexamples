title: "Anti-pattern: a filtering iterator that skips priming"
standard: "C++11"
difficulty: 3
summary: "A filtering iterator maintains an invariant -- it always points at an element passing the predicate -- but the classic bug establishes that invariant in ++ and forgets it in the constructor, so the first element yielded may be one that should have been filtered out; the fix is to prime the iterator on construction with the same skip logic ++ uses."
notes: "Writing an iterator means writing a small state machine, and its correctness is an invariant that must hold at every observable point -- including the very first. A filtering iterator's invariant is 'p_ points at a valid (predicate-passing) element, or at end'. The bug here is subtle because the ++ logic is right: operator++ advances one step and then skips any disallowed elements, so from the second element onward the invariant holds. What is missing is that begin() must ALSO establish the invariant, by skipping to the first valid element before the iterator is ever dereferenced. The buggy beginBad() constructs the iterator pointing at the raw first slot without that initial skip, so if the leading element fails the predicate -- the odd 1 here -- it is yielded anyway, and the range emits 1 2 4 instead of 2 4. The invariant held everywhere except at construction, which is exactly the kind of gap that passes a casual test (a collection that happens to start with a valid element hides it entirely) and fails on the input that starts with a filtered one. The fix is to run the same skipOdd() in the constructor that ++ runs, so the iterator is primed to a valid position from the start; the good begin() does this and yields 2 4. The general lesson is that an iterator's invariant is a whole-lifecycle contract: whatever property holds after ++ must be established by the constructor, restored by ++, and respected by ==/!= and *. This is why writing a correct non-trivial iterator is harder than it looks, and why a few disciplines pay off -- define the invariant explicitly, funnel the work that maintains it through one helper called from both the constructor and ++ (as here), and test the boundaries that expose gaps: an empty range, a range whose first element must be skipped, a range whose last element must be skipped, and a range where every element is filtered out. Other members hide their own versions of this trap -- a post-increment that returns the new position instead of the old, an operator!= that compares the wrong field, an operator* that returns a dangling reference to a value computed on the fly -- all cases of an operation not honouring the contract the rest of the iterator assumes. The sign: a custom iterator whose ++ contains skip or normalise logic that its constructor (and therefore begin()) does not also perform, so the first element can violate the invariant every other step maintains."
