title: "Anti-pattern: lying about the iterator category"
standard: "C++11"
difficulty: 3
summary: "The iterator_category typedef is a promise the algorithm library dispatches on: declare random_access and std::advance uses a single it += n instead of looping ++ n times. If the operations do not actually honour the claimed category -- here a += that steps only once -- the fast path lands on the wrong element, silently, and an honest weaker tag would have worked."
notes: "An iterator's category is a contract, not a label: it tells the algorithm library which operations the iterator supports AND with what semantics, and the library changes its implementation based on it, at compile time, with no runtime check that the promise is kept. That makes over-claiming a category a particularly quiet bug, because the code compiles (the required operators are present) and only misbehaves when an algorithm takes the fast path the tag advertised. std::advance is the clean demonstration: for a forward iterator it can only loop ++ n times, but for a random-access iterator it does a single it += n, trusting that += moves n positions. BadIter declares random_access_iterator_tag and provides a += whose body is a stub that steps only once, ignoring n -- so std::advance(bad, 3) performs one += that advances a single slot, and the iterator lands on 20 instead of the intended 40. The operator is where the bug lives, but it only matters because the category promised that operator would do the random-access thing; the tag turned a local mistake into a wrong result the whole library propagates. The telling detail is the comment's counterfactual: had the same iterator been tagged an honest forward_iterator_tag (supporting only ++), std::advance would have looped ++ three times and landed correctly. Claiming LESS than you support is always safe -- algorithms fall back to weaker operations -- while claiming MORE is the error, because the library will exercise capabilities you have not actually delivered. Beyond correctness, the category is also a complexity promise: tagging a linked-list iterator random-access so that end - begin compiles does not make the subtraction O(1), and any algorithm that assumes random-access iterators are cheap to jump will silently become quadratic or worse. The rule from the categories example, stated as a prohibition here: declare the WEAKEST category your iterator genuinely and efficiently supports, and make every operation the tag implies both present and correct -- if you cannot deliver O(1) jumps and valid it + n semantics, you are not random-access, whatever the typedef says. The tell: an iterator_category stronger than the iterator's real capabilities -- random-access on a node-based structure, bidirectional with a broken or missing --, or any category whose required operators are stubbed, approximate, or wrong."
