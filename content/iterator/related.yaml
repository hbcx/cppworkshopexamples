- slug: "vectors"
  note: "Where iterator invalidation bites hardest: a vector's random-access iterators are invalidated by reallocating growth and by erase, and the erase-remove idiom is the idiomatic fix this chapter's mutate-while-iterating anti-pattern points at -- go there for the container behind those rules."
- slug: "lists"
  note: "The real version of this chapter's hand-written linked list: std::list is node-based, so its iterators are bidirectional (not random-access) and stay valid across insert and erase of other elements -- go there for the container whose iterator category is the trade-off against a vector's."
- slug: "associative-containers"
  note: "Where find() returning end() is the everyday case: map and set lookups report a miss with the end iterator, the exact check this chapter's dereferencing-end anti-pattern is about -- go there for the ordered containers and the benchmark of their bidirectional iteration."
- slug: "tag-dispatch"
  note: "How generic code uses the iterator categories this chapter defines: std::advance and std::distance dispatch on input, forward, bidirectional and random-access tags to pick an O(1) or O(n) path -- go there for the compile-time technique that turns those categories into a fast implementation."
- slug: "ranges"
  note: "The modern generalisation of iterators: ranges wraps a begin and a sentinel into one object, keeps the same traversal categories, and adds lazy composable views over them -- go there for range algorithms, views, and the pipe operator."
- slug: "operator-overloading"
  note: "The operators a custom iterator is made of, done properly: prefix versus postfix ++, * and ->, and symmetric ==. Go there for the return categories and member-versus-free rules the iterator idiom depends on."
- slug: "iterator-adapters"
  note: "The standard adapters built on this protocol: back_inserter, ostream/istream_iterator, reverse_iterator and move_iterator wrap a container, stream or iterator instead of writing one from scratch -- go there for the ready-made adapters and their traps."
- slug: "non-member-range-access"
  note: "The free functions that reach the begin()/end() this chapter builds: std::begin/std::end also work on raw arrays and on ADL-only ranges, which is how generic code stays container-agnostic -- go there for the range-access functions and the customization-point idiom."
- slug: "coroutines-generator"
  note: "An iterator you do not hand-write: a C++20 coroutine generator turns a function with co_yield into a single-pass input range, the compiler generating the iterator for you -- go there for coroutines and the promise protocol behind a generated sequence."
