title: "Anti-pattern: ignoring a [[nodiscard]] result"
standard: "C++20"
difficulty: 2
summary: "Calling a [[nodiscard]] function and dropping the result is the mistake the attribute exists to catch: a call made for a side effect it does not have. std::vector::empty() tests emptiness, it does not clear -- writing v.empty(); as a statement does nothing."
notes: "The classic is empty() typed where clear() was meant: it compiles as a plain expression statement and silently does nothing, and [[nodiscard]] turns that into a compile-time warning (an error under -Werror). The same guard protects async results, error codes, and allocation results. The fix depends on the intent: call the function that actually has the side effect, or use the value you asked for. If you genuinely want to discard a nodiscard result, cast it to void so the intent is explicit. The broken statement is shown in a comment because it would fail the build -- which is the attribute doing its job."
run: true
sanitizers: []
