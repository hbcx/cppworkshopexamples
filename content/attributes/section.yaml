title: "Attributes"
description: "The standard [[...]] attributes: portable annotations that tell the compiler how a name is meant to be used, so it can warn you when you break the contract or lay out code better. Covers [[nodiscard]] for return values that must not be ignored, [[maybe_unused]] for names used only in some builds, [[deprecated]] for guiding migration with compiler messages, [[fallthrough]] for a switch case that falls through on purpose, [[likely]] and [[unlikely]] as branch hints, [[assume]] to hand the optimizer an invariant it cannot prove, and [[no_unique_address]] to let an empty member take no space -- alongside the traps: ignoring a [[nodiscard]] result (the mistake the attribute is there to catch), an [[assume]] whose condition can be false (undefined behaviour), and silencing a real warning with [[maybe_unused]]. Because the build treats warnings as errors, the misuses that only warn are described in comments and the correct form is what runs."
sort_order: 173
category: "Language & object model"
