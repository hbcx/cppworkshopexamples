# Related chapters -- cross-links shown at the bottom of the section page.
- slug: "calendar"
  note: "The civil calendar and time zones built on these clocks: real dates (year_month_day, weekdays, last-day-of-month), date arithmetic, formatting and parsing, and zoned_time -- go there when you need actual calendar dates and zones rather than the durations and raw time_points here."
- slug: "strong-types"
  note: "The general idea std::chrono::duration is one instance of: wrap a value in a distinct type so the compiler keeps units apart -- go there for the same technique applied to ids, money and hand-rolled units, and why explicit conversions keep it safe."
- slug: "format"
  note: "How to turn a duration or time point into text: std::format understands chrono types with specifiers like %Y-%m-%d and %H:%M:%S -- go there for building the formatted timestamps and durations you print."
- slug: "filesystem-operations"
  note: "Where a clock other than system_clock shows up in practice: a file's last_write_time is a time_point on file_clock, and comparing or differencing two of them is ordinary chrono -- go there for reading and setting file times, and for why crossing file_clock and system_clock needs a conversion."
