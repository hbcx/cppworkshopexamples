# Related chapters -- cross-links shown at the bottom of the section page.
- slug: "mutex"
  note: "The lock a condition variable is always paired with: wait releases and re-acquires a mutex, and the shared state it checks must be changed under that same mutex -- go there for lock_guard and unique_lock, the RAII owners you hand to wait, and why the state change must be locked."
- slug: "thread"
  note: "Where the waiters and notifiers run: the producer, the consumers, and the worker whose shutdown this section models are all std::threads -- go there for launching and joining them, and the ownership and join rules the graceful-shutdown example relies on."
- slug: "atomic"
  note: "The lighter alternative when the condition is a single word: C++20 gives std::atomic its own wait/notify, so a one-flag handoff needs no mutex at all -- go there for atomic wait/notify and compare_exchange, and use a condition variable when the wait involves a mutex-guarded predicate or a queue."
- slug: "future"
  note: "The one-shot version of waiting for another thread: where a condition variable handles a repeated wait-notify handoff, a std::future waits for a single value produced once and carries it (or its exception) back to you -- go there for async, promise, and packaged_task, and use a condition variable when the signal repeats or many waiters share a mutex-guarded predicate."
- slug: "jthread"
  note: "The built-in way to make the graceful-shutdown wait here interruptible: condition_variable_any plus a stop_token wakes a blocked worker on cancellation, folding away the hand-rolled stopping flag this section's shutdown example needs -- go there for jthread, stop_token, and the interruptible wait."
- slug: "latch-barrier"
  note: "The ready-made shortcuts for the two most common waits you would otherwise build here by hand: a std::latch is this section's counter-plus-wait folded into one object for a one-shot countdown, and a std::barrier is the reusable phase version -- go there when the wait is a fixed arrival count rather than an arbitrary predicate."
- slug: "semaphore"
  note: "The lighter primitive when the wait is really just counting permits, not testing a predicate: a std::counting_semaphore blocks until a permit is free and needs no mutex, where a condition variable waits on arbitrary mutex-guarded state -- go there for capping concurrency, cross-thread signals, and bounded buffers."
