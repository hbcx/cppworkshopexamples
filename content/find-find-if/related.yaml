# Related chapters -- cross-links shown at the bottom of the section page.
- slug: "all-any-none-of"
  note: "When you only need yes or no, not the position: any_of answers is there one without handing back an iterator, and find_if != end() is really any_of in disguise -- go there for the quantifier algorithms and when a bool is all you want."
- slug: "ranges"
  note: "Where the C++20 forms come from: std::ranges::find takes the whole range and a projection so you can search by a member, and views can be searched directly -- go there for range algorithms, views, and projections."
- slug: "maps"
  note: "The right tool when lookups are frequent or the container is large: std::map keeps keys sorted and its member find is O(log n), where std::find over any range is a linear O(n) scan -- go there for keyed lookup and the member find that beats a linear search."
- slug: "lambdas"
  note: "What find_if takes as its predicate: a lambda that tests one element, often capturing the value or field you are searching for -- go there for captures and how a closure holds what the predicate compares against."
- slug: "count-count-if"
  note: "When you need HOW MANY match, not just the first: find_if returns one position and stops, count_if visits everything and totals the matches -- go there for tallies, thresholds, and progress counts."
- slug: "sort"
  note: "The faster search a sort unlocks: once a range is sorted, binary_search and lower_bound find in O(log n) instead of find's linear scan -- go there to order a range first, with comparators and stable_sort."
- slug: "remove-erase"
  note: "What to do once you have found the element: member erase(it) deletes the one find returned and hands back the next iterator, and remove_if deletes every match by condition -- go there for deleting elements in place."
- slug: "for-each"
  note: "The visit-everything algorithm that cannot stop: for_each always runs to the end, where find_if short-circuits at the first match -- go there for applying a side effect to each element, and why a search should not be a for_each with a flag."
- slug: "binary-search"
  note: "The O(log n) search for a sorted range: binary_search and lower_bound replace find's linear scan once the data is sorted, giving position, count, and insertion point -- go there for searching sorted data and when sorting first pays off."
- slug: "mismatch-equal"
  note: "The two-range version of the same walk: where find_if scans one range for a match, mismatch scans two together for the first place they differ, and both must check the returned iterator against end before reading it -- go there for equal, mismatch, and lexicographical ordering."
